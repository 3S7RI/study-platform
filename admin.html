<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - رحلة دراسية</title>
    <script>
        // التحقق الصارم من جلسة الأدمن لفتح الصفحة فوراً بدون مشاكل
        const isAdminLoggedIn = sessionStorage.getItem('isAdminLoggedIn');
        const adminEmail = sessionStorage.getItem('adminEmail');

        if (isAdminLoggedIn !== 'true' || !adminEmail) {
            alert('يجب تسجيل الدخول كأدمن أولاً!');
            window.location.href = 'login.html';
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; color: #333; min-height: 100vh; padding: 20px; }
        
        .admin-header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .admin-header h1 { font-size: 1.5rem; }
        .admin-header button { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .admin-header button:hover { background: #c0392b; }

        .section-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .section-card h2 { color: #1e3c72; margin-bottom: 15px; font-size: 1.2rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 10px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: right; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; font-size: 0.95rem; }
        th { background-color: #f8f9fa; color: #333; }
        
        .btn-block { background-color: #e67e22; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-block:hover { background-color: #d35400; }
        .btn-delete { background-color: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 5px; }
        .btn-delete:hover { background-color: #c0392b; }
        .btn-approve { background-color: #27ae60; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-approve:hover { background-color: #219653; }

        .loading-text { text-align: center; color: #666; padding: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="admin-header">
        <div>
            <h1>⚡ لوحة تحكم المنصة</h1>
            <p id="adminWelcomeText" style="font-size: 0.9rem; margin-top: 5px; opacity: 0.9;"></p>
        </div>
        <button id="logoutAdminBtn">تسجيل الخروج 🚪</button>
    </div>

    <div class="section-card">
        <h2>👥 إدارة الطلاب المسجلين</h2>
        <div id="studentsTableContainer">
            <p class="loading-text">جاري تحميل بيانات الطلاب من السحابة...</p>
        </div>
    </div>

    <div class="section-card">
        <h2>🛠️ طلبات انضمام المشرفين والأدمنز</h2>
        <div id="adminRequestsContainer">
            <p class="loading-text">جاري التحقق من الطلبات المعلقة...</p>
        </div>
    </div>

    <script>
        const BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';

        const cloudHeaders = {
            'X-Master-Key': API_KEY,
            'X-Access-Key': API_KEY,
            'Content-Type': 'application/json'
        };

        // عرض إيميل الأدمن الحالي في الهيدر
        document.getElementById('adminWelcomeText').textContent = `مسجل بصفة: ${adminEmail} (${sessionStorage.getItem('adminRole') || 'مدير'})`;

        // زر تسجيل الخروج للأدمن
        document.getElementById('logoutAdminBtn').addEventListener('click', function() {
            sessionStorage.clear();
            window.location.href = 'login.html';
        });

        // دالة جلب وعرض البيانات في لوحة التحكم
        async function fetchAdminData() {
            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: cloudHeaders
                });
                let result = await response.json();
                let record = result.record || {};

                renderStudents(record.users || [], record);
                renderAdminRequests(record.adminRequests || [], record);

            } catch (error) {
                console.error(error);
                alert('حدث خطأ أثناء الاتصال بالسحابة لجلب بيانات لوحة التحكم!');
            }
        }

        // عرض جدول الطلاب
        function renderStudents(students, fullRecord) {
            const container = document.getElementById('studentsTableContainer');
            if (students.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#777;">لا يوجد طلاب مسجلين حتى الآن.</p>';
                return;
            }

            let html = `<table>
                <thead>
                    <tr>
                        <th>الكود</th>
                        <th>الاسم الكامل</th>
                        <th>البريد الإلكتروني</th>
                        <th>هاتف الطالب</th>
                        <th>الحالة</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody>`;

            students.forEach((st, index) => {
                let isBlocked = st.status === 'blocked';
                html += `<tr>
                    <td>${st.studentId || '---'}</td>
                    <td>${st.fullName || '---'}</td>
                    <td>${st.email || '---'}</td>
                    <td>${st.studentPhone || '---'}</td>
                    <td><span style="color: ${isBlocked ? 'red' : 'green'}; font-weight:bold;">${isBlocked ? 'محظور 🚫' : 'نشط ✅'}</span></td>
                    <td>
                        <button class="btn-block" onclick="toggleBlockStudent('${st.email}')">${isBlocked ? 'إلغاء الحظر' : 'حظر'}</button>
                        <button class="btn-delete" onclick="deleteStudent('${st.email}')">حذف</button>
                    </td>
                </tr>`;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // عرض طلبات المشرفين المعلقة
        function renderAdminRequests(requests, fullRecord) {
            const container = document.getElementById('adminRequestsContainer');
            let pendingReqs = requests.filter(req => req.status === 'pending');

            if (pendingReqs.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#777;">لا توجد طلبات انضمام جديدة.</p>';
                return;
            }

            let html = `<table>
                <thead>
                    <tr>
                        <th>البريد الإلكتروني</th>
                        <th>تاريخ الطلب</th>
                        <th>الإجراء</th>
                    </tr>
                </thead>
                <tbody>`;

            pendingReqs.forEach((req, index) => {
                html += `<tr>
                    <td>${req.email}</td>
                    <td>${req.requestedAt || '---'}</td>
                    <td>
                        <button class="btn-approve" onclick="approveAdmin('${req.email}')">موافقة وقبول كأدمن</button>
                    </td>
                </tr>`;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // دالة حظر أو إلغاء حظر طالب
        window.toggleBlockStudent = async function(email) {
            let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: cloudHeaders });
            let result = await response.json();
            let record = result.record || {};

            let student = record.users.find(st => st.email.toLowerCase() === email.toLowerCase());
            if (student) {
                student.status = student.status === 'blocked' ? 'active' : 'blocked';
                
                let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: cloudHeaders,
                    body: JSON.stringify(record)
                });

                if (updateRes.ok) {
                    alert('تم تحديث حالة المستخدم بنجاح!');
                    fetchAdminData();
                }
            }
        };

        // دالة حذف طالب
        window.deleteStudent = async function(email) {
            if (!confirm('هل أنت متأكد من حذف هذا الطالب نهائياً؟')) return;

            let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: cloudHeaders });
            let result = await response.json();
            let record = result.record || {};

            record.users = record.users.filter(st => st.email.toLowerCase() !== email.toLowerCase());

            let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: cloudHeaders,
                body: JSON.stringify(record)
            });

            if (updateRes.ok) {
                alert('تم حذف الطالب بنجاح!');
                fetchAdminData();
            }
        };

        // دالة الموافقة على طلب أدمن جديد
        window.approveAdmin = async function(email) {
            let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: cloudHeaders });
            let result = await response.json();
            let record = result.record || {};

            // إضافة للإدارة
            if (!record.admins) record.admins = {};
            record.admins[email] = {
                name: email.split('@')[0],
                email: email,
                role: 'sub',
                badge: 'مشرف فرعي',
                profileImage: ''
            };

            // تحديث حالة الطلب
            let req = record.adminRequests.find(r => r.email === email);
            if (req) req.status = 'approved';

            let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: cloudHeaders,
                body: JSON.stringify(record)
            });

            if (updateRes.ok) {
                alert('تمت الموافقة على الأدمن بنجاح وإضافته لصلاحيات المشرفين!');
                fetchAdminData();
            }
        };

        // جلب البيانات عند تحميل الصفحة
        fetchAdminData();
    </script>
</body>
</html>
