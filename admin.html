<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن - رحلة دراسية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; color: #333; padding: 15px; }
        
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; background: #1e3c72; color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 10px; }
        header h1 { font-size: 1.2rem; }
        
        .header-btns { display: flex; gap: 10px; align-items: center; }
        .btn-profile { background: #2980b9; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; text-decoration: none; display: inline-block; }
        .btn-profile:hover { background: #2471a3; }
        
        .btn-exit { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .btn-exit:hover { background: #c0392b; }

        /* كروت الإحصائيات */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; border-right: 5px solid #2a5298; }
        .stat-card h3 { color: #666; font-size: 0.85rem; margin-bottom: 5px; }
        .stat-card p { color: #1e3c72; font-size: 1.5rem; font-weight: bold; }

        /* جدول الطلاب */
        .table-container { background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); padding: 15px; overflow-x: auto; }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .table-header h2 { color: #1e3c72; font-size: 1.1rem; }
        
        .actions-bar { display: flex; gap: 10px; flex-wrap: wrap; }
        
        /* زر إضافة طالب جديد المميز */
        .btn-add-student { background: linear-gradient(135deg, #27ae60, #219653); color: white; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.85rem; box-shadow: 0 3px 8px rgba(39, 174, 96, 0.3); transition: 0.3s; }
        .btn-add-student:hover { transform: translateY(-1px); box-shadow: 0 5px 12px rgba(39, 174, 96, 0.4); }

        .btn-refresh { background: linear-gradient(135deg, #2980b9, #2471a3); color: white; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.85rem; box-shadow: 0 3px 8px rgba(41, 128, 185, 0.3); transition: 0.3s; }
        .btn-refresh:hover { transform: translateY(-1px); box-shadow: 0 5px 12px rgba(41, 128, 185, 0.4); }

        table { width: 100%; border-collapse: collapse; text-align: right; min-width: 650px; }
        th, td { padding: 10px 8px; border-bottom: 1px solid #eee; font-size: 0.85rem; white-space: nowrap; }
        th { background: #f8f9fa; color: #333; font-weight: bold; }
        tr:hover { background: #f9f9f9; }

        .btn-delete-user { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: bold; transition: background 0.2s; }
        .btn-delete-user:hover { background: #c0392b; }

        .loading { text-align: center; padding: 30px; color: #666; font-size: 0.95rem; }

        /* نافذة منبثقة (Modal) لإضافة طالب جديد */
        #addStudentModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 2000; padding: 15px; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .modal-content h3 { color: #1e3c72; margin-bottom: 15px; font-size: 1.2rem; text-align: center; }
        .modal-input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; outline: none; }
        .modal-btns { display: flex; gap: 10px; margin-top: 10px; }
        .modal-btns button { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
        .btn-save { background: #27ae60; color: white; }
        .btn-cancel { background: #95a5a6; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⚡ لوحة تحكم رحلة دراسية</h1>
            <div class="header-btns">
                <a href="admin-profile.html" class="btn-profile">👤 البروفايل</a>
                <button class="btn-exit" id="logoutAdminBtn">خروج</button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي الطلاب المسجلين</h3>
                <p id="totalStudentsCount">0</p>
            </div>
            <div class="stat-card" style="border-right-color: #27ae60;">
                <h3>حالة السحابة</h3>
                <p style="color: #27ae60; font-size: 1.1rem; margin-top: 5px;">متصلة 🟢</p>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h2>📋 قائمة الطلاب المسجلين</h2>
                <div class="actions-bar">
                    <button class="btn-add-student" id="openAddModalBtn">➕ إضافة طالب جديد</button>
                    <button class="btn-refresh" id="refreshDataBtn">تحديث 🔄</button>
                </div>
            </div>
            
            <div id="tableWrapper">
                <div class="loading">جاري جلب البيانات من السحابة...</div>
            </div>
        </div>
    </div>

    <!-- نافذة إضافة طالب جديد -->
    <div id="addStudentModal">
        <div class="modal-content">
            <h3>➕ إضافة طالب جديد يدوياً</h3>
            <input type="text" id="newFullName" class="modal-input" placeholder="اسم الطالب الرباعي">
            <input type="email" id="newEmail" class="modal-input" placeholder="البريد الإلكتروني">
            <input type="password" id="newPassword" class="modal-input" placeholder="كلمة المرور">
            <input type="text" id="newStudentPhone" class="modal-input" placeholder="رقم هاتف الطالب">
            <input type="text" id="newParentPhone" class="modal-input" placeholder="رقم هاتف ولي الأمر">
            
            <div class="modal-btns">
                <button type="button" class="btn-save" id="saveNewStudentBtn">حفظ وإضافة</button>
                <button type="button" class="btn-cancel" id="closeAddModalBtn">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';
        
        if (sessionStorage.getItem('isAdminLoggedIn') !== 'true') {
            alert('غير مصرح لك بالدخول!');
            window.location.href = 'login.html';
        } else {
            fetchCloudData();
        }

        document.getElementById('logoutAdminBtn').addEventListener('click', function() {
            sessionStorage.removeItem('isAdminLoggedIn');
            window.location.href = 'login.html';
        });

        document.getElementById('refreshDataBtn').addEventListener('click', fetchCloudData);

        // فتح وغلق نافذة إضافة الطالب
        const modal = document.getElementById('addStudentModal');
        document.getElementById('openAddModalBtn').onclick = () => modal.style.display = 'flex';
        document.getElementById('closeAddModalBtn').onclick = () => modal.style.display = 'none';

        async function fetchCloudData() {
            const tableWrapper = document.getElementById('tableWrapper');
            tableWrapper.innerHTML = '<div class="loading">جاري جلب البيانات من السحابة...</div>';

            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                let result = await response.json();
                let users = result.record.users || [];

                document.getElementById('totalStudentsCount').textContent = users.length;

                if (users.length === 0) {
                    tableWrapper.innerHTML = '<p style="text-align: center; padding: 20px; color: #777; font-size: 0.9rem;">لا يوجد طلاب مسجلين حتى الآن.</p>';
                    return;
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>الكود</th>
                                <th>اسم الطالب</th>
                                <th>البريد الإلكتروني</th>
                                <th>هاتف الطالب</th>
                                <th>هاتف ولي الأمر</th>
                                <th>الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                users.forEach(student => {
                    html += `
                        <tr>
                            <td><b>${student.studentId || 'STU-0000'}</b></td>
                            <td>${student.fullName || '-'}</td>
                            <td>${student.email || '-'}</td>
                            <td>${student.studentPhone || '-'}</td>
                            <td>${student.parentPhone || '-'}</td>
                            <td>
                                <button class="btn-delete-user" onclick="deleteStudent('${student.email}')">حذف 🗑️</button>
                            </td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                tableWrapper.innerHTML = html;

            } catch (error) {
                console.error('خطأ:', error);
                tableWrapper.innerHTML = '<p style="text-align: center; padding: 20px; color: #e74c3c; font-size: 0.9rem;">فشل الاتصال بالسحابة.</p>';
            }
        }

        // حفظ الطالب الجديد في السحابة
        document.getElementById('saveNewStudentBtn').onclick = async function() {
            const fullName = document.getElementById('newFullName').value.trim();
            const email = document.getElementById('newEmail').value.trim();
            const password = document.getElementById('newPassword').value.trim();
            const studentPhone = document.getElementById('newStudentPhone').value.trim();
            const parentPhone = document.getElementById('newParentPhone').value.trim();

            if (!fullName || !email || !password) {
                alert('من فضلك املأ الحقول الأساسية (الاسم، البريد، كلمة المرور)!');
                return;
            }

            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                let result = await response.json();
                let users = result.record.users || [];

                // فحص عدم تكرار الإيميل
                if (users.some(st => st.email === email)) {
                    alert('هذا البريد الإلكتروني مسجل مسبقاً!');
                    return;
                }

                const newStudentId = 'STU-' + Math.floor(1000 + Math.random() * 9000);
                users.push({ studentId: newStudentId, fullName, email, password, studentPhone, parentPhone });

                let updateResponse = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify({ users })
                });

                if (updateResponse.ok) {
                    alert('تم إضافة الطالب بنجاح للسحابة! ✅');
                    modal.style.display = 'none';
                    // تفريغ الحقول
                    document.getElementById('newFullName').value = '';
                    document.getElementById('newEmail').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('newStudentPhone').value = '';
                    document.getElementById('newParentPhone').value = '';
                    fetchCloudData();
                } else {
                    alert('حدث خطأ أثناء الحفظ.');
                }
            } catch (err) {
                console.error(err);
                alert('فشل الاتصال بالسحابة أثناء الإضافة.');
            }
        };

        // حذف طالب
        window.deleteStudent = async function(email) {
            if (!confirm(`هل أنت متأكد من حذف الحساب (${email})؟`)) return;

            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                let result = await response.json();
                let users = result.record.users || [];
                let updatedUsers = users.filter(st => st.email !== email);

                let updateResponse = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify({ users: updatedUsers })
                });

                if (updateResponse.ok) {
                    alert('تم الحذف بنجاح! ✅');
                    fetchCloudData();
                } else {
                    alert('خطأ أثناء الحذف.');
                }
            } catch (error) {
                alert('خطأ في الاتصال.');
            }
        };
    </script>
</body>
</html>
