<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم المركزية - رحلة دراسية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; color: #333; padding: 15px; }
        
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; background: #1e3c72; color: white; padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 10px; }
        header h1 { font-size: 1.2rem; }
        
        .header-btns { display: flex; gap: 10px; align-items: center; }
        .btn-profile { background: #2980b9; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; text-decoration: none; }
        .btn-exit { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; border-right: 5px solid #2a5298; }
        .stat-card h3 { color: #666; font-size: 0.85rem; margin-bottom: 5px; }
        .stat-card p { color: #1e3c72; font-size: 1.5rem; font-weight: bold; }

        .section-box { background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); padding: 15px; margin-bottom: 20px; overflow-x: auto; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .section-header h2 { color: #1e3c72; font-size: 1.1rem; }

        .btn-approve { background: #27ae60; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; font-weight: bold; }
        .btn-master { background: #8e44ad; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; font-weight: bold; }
        .btn-block { background: #e67e22; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; font-weight: bold; }
        .btn-danger { background: #e74c3c; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; border: none; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; text-align: right; min-width: 700px; }
        th, td { padding: 10px 8px; border-bottom: 1px solid #eee; font-size: 0.85rem; white-space: nowrap; }
        th { background: #f8f9fa; color: #333; font-weight: bold; }
        tr:hover { background: #f9f9f9; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 id="headerTitle">⚡ لوحة التحكم المركزية</h1>
            <div class="header-btns">
                <a href="admin-profile.html" class="btn-profile">👤 بروفايل الأدمن</a>
                <button class="btn-exit" id="logoutAdminBtn">خروج</button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي الطلاب المسجلين</h3>
                <p id="totalStudentsCount">0</p>
            </div>
            <div class="stat-card" style="border-right-color: #8e44ad;" id="adminsCountCard">
                <h3>طاقم الأدمنز والمشرفين</h3>
                <p id="totalAdminsCount" style="color: #8e44ad;">0</p>
            </div>
        </div>

        <!-- 1. قسم طلبات الإشراف المعلقة (للمطور فقط) -->
        <div class="section-box" id="requestsSection" style="display: none; border: 2px solid #f39c12;">
            <div class="section-header">
                <h2 style="color: #d35400;">📩 طلبات الانضمام كـ أدمن (المعلقة)</h2>
            </div>
            <div id="requestsTableWrapper">
                <div style="text-align: center; padding: 10px; color: #666;">لا يوجد طلبات جديدة.</div>
            </div>
        </div>

        <!-- 2. قسم إدارة الأدمنز والمشرفين (للمطور فقط) -->
        <div class="section-box" id="masterAdminSection" style="display: none; border: 2px dashed #2980b9;">
            <div class="section-header">
                <h2>🛡️ إدارة المشرفين والصلاحيات (التحكم الكامل)</h2>
            </div>
            <div id="adminsTableWrapper">
                <div style="text-align: center; padding: 15px; color: #666;">جاري التحميل...</div>
            </div>
        </div>

        <!-- 3. جدول بيانات الطلاب -->
        <div class="section-box">
            <div class="section-header">
                <h2>📋 قائمة الطلاب المسجلين في المنصة</h2>
            </div>
            <div id="tableWrapper">
                <div style="text-align: center; padding: 20px; color: #666;">جاري جلب بيانات الطلاب...</div>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';
        
        const role = sessionStorage.getItem('adminRole');
        if (sessionStorage.getItem('isAdminLoggedIn') !== 'true') {
            alert('غير مصرح لك بالدخول!');
            window.location.href = 'login.html';
        }

        if (role === 'master') {
            document.getElementById('masterAdminSection').style.display = 'block';
            document.getElementById('requestsSection').style.display = 'block';
            document.getElementById('headerTitle').textContent = '⚡ لوحة المطور الأساسي (المتحكم الكامل)';
            fetchCloudAllData();
        } else {
            document.getElementById('adminsCountCard').style.display = 'none';
            fetchStudentsOnly();
        }

        document.getElementById('logoutAdminBtn').addEventListener('click', function() {
            sessionStorage.clear();
            window.location.href = 'login.html';
        });

        // جلب كل البيانات للمطور الأساسي
        async function fetchCloudAllData() {
            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                let result = await response.json();
                let rec = result.record;

                renderRequests(rec.adminRequests || []);
                renderAdmins(rec.admins || []);
                renderStudents(rec.users || []);
            } catch (err) {
                console.error(err);
            }
        }

        // عرض طلبات الأدمن المعلقة
        function renderRequests(requests) {
            const wrapper = document.getElementById('requestsTableWrapper');
            if (requests.length === 0) {
                wrapper.innerHTML = '<p style="text-align: center; color: #777; padding: 10px;">لا توجد طلبات إشراف جديدة حالياً.</p>';
                return;
            }
            let html = `<table><thead><tr><th>البريد الإلكتروني</th><th>تاريخ الطلب</th><th>القرارات والتحكم</th></tr></thead><tbody>`;
            requests.forEach(req => {
                html += `<tr>
                    <td><b>${req.email}</b></td>
                    <td>${req.requestedAt || '-'}</td>
                    <td>
                        <button class="btn-approve" onclick="approveAdminReq('${req.email}', 'sub')">قبول كـ أدمن عادي 🛡️</button>
                        <button class="btn-master" onclick="approveAdminReq('${req.email}', 'master')">ترقية لمتحكم كامل ⚡</button>
                        <button class="btn-danger" onclick="rejectAdminReq('${req.email}')">رفض ❌</button>
                    </td>
                </tr>`;
            });
            html += `</tbody></table>`;
            wrapper.innerHTML = html;
        }

        // عرض قائمة المشرفين والأدمنز
        function renderAdmins(admins) {
            const wrapper = document.getElementById('adminsTableWrapper');
            document.getElementById('totalAdminsCount').textContent = admins.length;

            if (admins.length === 0) {
                wrapper.innerHTML = '<p style="text-align: center; color: #777; padding: 10px;">لا يوجد مشرفين حالياً.</p>';
                return;
            }
            let html = `<table><thead><tr><th>اسم المشرف</th><th>البريد</th><th>الرتبة</th><th>الحالة</th><th>إجراءات التحكم</th></tr></thead><tbody>`;
            admins.forEach(adm => {
                let isBlocked = adm.status === 'blocked';
                let isMasterRole = adm.role === 'master';
                html += `<tr>
                    <td><b>${adm.name || 'أدمن'}</b></td>
                    <td>${adm.email}</td>
                    <td><b style="color: ${isMasterRole ? '#8e44ad' : '#2980b9'}">${isMasterRole ? 'متحكم كامل ⚡' : 'أدمن عادي 🛡️'}</b></td>
                    <td><span style="color: ${isBlocked ? 'red' : 'green'}; font-weight: bold;">${isBlocked ? 'محظور 🔴' : 'نشط 🟢'}</span></td>
                    <td>
                        <button class="btn-master" onclick="toggleAdminRole('${adm.email}')">${isMasterRole ? 'تنزيل لأدمن عادي' : 'ترقية لمتحكم كامل'}</button>
                        <button class="btn-block" onclick="toggleBlockStatus('${adm.email}', 'admin')">${isBlocked ? 'إلغاء الحظر 🔓' : 'حظر (404) 🔒'}</button>
                        <button class="btn-danger" onclick="deleteRecord('${adm.email}', 'admin')">حذف 🗑️</button>
                    </td>
                </tr>`;
            });
            html += `</tbody></table>`;
            wrapper.innerHTML = html;
        }

        // عرض الطلاب
        function renderStudents(users) {
            const wrapper = document.getElementById('tableWrapper');
            document.getElementById('totalStudentsCount').textContent = users.length;

            if (users.length === 0) {
                wrapper.innerHTML = '<p style="text-align: center; color: #777; padding: 10px;">لا يوجد طلاب.</p>';
                return;
            }
            let html = `<table><thead><tr><th>الكود</th><th>اسم الطالب</th><th>البريد</th><th>الهاتف</th><th>الحالة</th><th>الإجراءات</th></tr></thead><tbody>`;
            users.forEach(st => {
                let isBlocked = st.status === 'blocked';
                html += `<tr>
                    <td><b>${st.studentId || 'STU-0000'}</b></td>
                    <td>${st.fullName || '-'}</td>
                    <td>${st.email || '-'}</td>
                    <td>${st.studentPhone || '-'}</td>
                    <td><span style="color: ${isBlocked ? 'red' : 'green'}; font-weight: bold;">${isBlocked ? 'محظور 🔴' : 'نشط 🟢'}</span></td>
                    <td>
                        <button class="btn-block" onclick="toggleBlockStatus('${st.email}', 'user')">${isBlocked ? 'إلغاء الحظر 🔓' : 'حظر (404) 🔒'}</button>
                        <button class="btn-danger" onclick="deleteRecord('${st.email}', 'user')">حذف 🗑️</button>
                    </td>
                </tr>`;
            });
            html += `</tbody></table>`;
            wrapper.innerHTML = html;
        }

        // قبول طلب الإشراف
        window.approveAdminReq = async function(email, assignRole) {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY } });
            let data = await res.json();
            let rec = data.record;

            rec.adminRequests = (rec.adminRequests || []).filter(r => r.email !== email);
            if (!rec.admins) rec.admins = [];

            rec.admins.push({
                name: email.split('@')[0],
                email: email,
                password: '@Mohamad66xm01122161407',
                role: assignRole,
                status: 'active',
                badge: assignRole === 'master' ? 'متحكم كامل' : 'مشرف معتمد'
            });

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(rec)
            });

            alert(`تم قبول ${email} برتبة (${assignRole === 'master' ? 'متحكم كامل' : 'أدمن عادي'}) بنجاح!`);
            fetchCloudAllData();
        };

        // رفض طلب الإشراف
        window.rejectAdminReq = async function(email) {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY } });
            let data = await res.json();
            let rec = data.record;
            rec.adminRequests = (rec.adminRequests || []).filter(r => r.email !== email);

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(rec)
            });
            fetchCloudAllData();
        };

        // التبديل بين رتبة (متحكم كامل) و (أدمن عادي)
        window.toggleAdminRole = async function(email) {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY } });
            let data = await res.json();
            let rec = data.record;

            rec.admins = rec.admins.map(a => {
                if (a.email === email) {
                    a.role = a.role === 'master' ? 'sub' : 'master';
                    a.badge = a.role === 'master' ? 'متحكم كامل' : 'مشرف معتمد';
                }
                return a;
            });

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(rec)
            });
            fetchCloudAllData();
        };

        // حظر / إلغاء حظر (سواء أدمن أو طالب)
        window.toggleBlockStatus = async function(email, type) {
            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY } });
            let data = await res.json();
            let rec = data.record;

            if (type === 'admin') {
                rec.admins = rec.admins.map(a => {
                    if (a.email === email) a.status = a.status === 'blocked' ? 'active' : 'blocked';
                    return a;
                });
            } else {
                rec.users = rec.users.map(u => {
                    if (u.email === email) u.status = u.status === 'blocked' ? 'active' : 'blocked';
                    return u;
                });
            }

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(rec)
            });
            fetchCloudAllData();
        };

        // حذف نهائي
        window.deleteRecord = async function(email, type) {
            if (!confirm(`هل أنت متأكد من الحذف النهائي لـ (${email})؟`)) return;

            let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { 'X-Master-Key': API_KEY } });
            let data = await res.json();
            let rec = data.record;

            if (type === 'admin') {
                rec.admins = rec.admins.filter(a => a.email !== email);
            } else {
                rec.users = rec.users.filter(u => u.email !== email);
            }

            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                body: JSON.stringify(rec)
            });
            fetchCloudAllData();
        };
    </script>
</body>
</html>
