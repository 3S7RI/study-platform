<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - إنشاء وإدارة الحصص</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.12);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            --th-bg: rgba(255, 255, 255, 0.04);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            --th-bg: rgba(0, 0, 0, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        .header-right-side { display: flex; align-items: center; }
        .btn-home-link {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .header-center-box { display: flex; align-items: center; justify-content: center; }
        .platform-title-box { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: 700; color: var(--text-main); white-space: nowrap; }
        
        .header-left-side { display: flex; align-items: center; gap: 10px; }
        .btn-theme-toggle {
            background-color: rgba(255, 255, 255, 0.04); color: var(--text-main); border: 1px solid var(--border-color);
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
        }
        .btn-theme-toggle:hover { background-color: var(--hover-bg); border-color: var(--primary); }

        .admin-nav-bar {
            display: flex; justify-content: center; align-items: center;
            background-color: var(--bg-card); padding: 12px 16px; border-radius: 16px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); gap: 10px; flex-wrap: wrap;
        }
        .admin-tabs-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .btn-tab {
            background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--border-color);
            padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; flex: 1; min-width: 140px; text-align: center; text-decoration: none; display: inline-block;
        }
        .btn-tab.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        .section-box {
            background-color: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow);
            padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
        }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .section-header h2 { color: var(--text-main); font-size: 1.05rem; font-weight: 700; }

        .form-group { margin-top: 14px; text-align: right; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: var(--text-muted); font-weight: 600; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-color);
            background: var(--bg-main); color: var(--text-main); font-size: 0.85rem; outline: none;
        }

        .form-row-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (max-width: 768px) { .form-row-grid-2 { grid-template-columns: 1fr; } }

        .input-with-clip { display: flex; gap: 8px; align-items: center; }
        .input-with-clip input { flex: 1; }
        
        .btn-clip {
            background: rgba(99, 102, 241, 0.15); color: var(--primary); border: 1px solid var(--border-color);
            width: 42px; height: 42px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            font-size: 1.1rem; transition: all 0.2s;
        }
        .btn-clip:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .btn-save { background: var(--success); color: white; border: none; padding: 12px 16px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.9rem; margin-top: 20px; width: 100%; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-save:hover { opacity: 0.9; transform: translateY(-1px); }

        .lesson-card-item {
            background: var(--th-bg); border: 1px solid var(--border-color); padding: 14px 18px; border-radius: 12px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .btn-danger { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 0.78rem; cursor: pointer; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <header class="platform-header">
            <div class="header-right-side"><a href="admin.html" class="btn-home-link">🏠 الرئيسية</a></div>
            <div class="header-center-box"><div class="platform-title-box"><span>إدارة الحصص الدراسية</span> 📚</div></div>
            <div class="header-left-side"><button class="btn-theme-toggle" id="themeToggleBtn" title="تغيير الوضع">☀️</button></div>
        </header>

        <!-- شريط التنقل المعدل بروابط files- -->
        <nav class="admin-nav-bar">
            <div class="admin-tabs-group">
                <a href="files-lessons.html" class="btn-tab active">إنشاء الحصص 📝</a>
                <a href="files-settings.html" class="btn-tab">إعدادات الحصص ⚙️</a>
                <a href="files-stats.html" class="btn-tab">إحصائيات الحصص 📊</a>
            </div>
        </nav>

        <div class="section-box">
            <div class="section-header"><h2>إضافة ونشر حصة دراسية جديدة 🎬</h2></div>
            
            <div class="form-row-grid-2">
                <div class="form-group" style="margin-top:0;"><label>عنوان الحصة (مثال: الحصة الأولى - الباب الأول كيمياء):</label><input type="text" id="lessonTitle" placeholder="اكتب عنوان الحصة هنا..."></div>
                <div class="form-group" style="margin-top:0;"><label>المادة الدراسية:</label><input type="text" id="lessonSubject" placeholder="كيمياء / فيزياء..."></div>
            </div>

            <div class="form-row-grid-2">
                <div class="form-group"><label>الصف / الشعبة المستهدفة:</label><input type="text" id="lessonTargetGroup" placeholder="الصف الثالث الثانوي"></div>
                <div class="form-group"><label>رقم أو كود الحصة (لتسهيل الترتيب):</label><input type="number" id="lessonNumber" value="1" min="1"></div>
            </div>

            <hr style="border:0; border-top:1px solid var(--border-color); margin:20px 0;">

            <h3 style="color:var(--text-main); font-size: 0.95rem; margin-bottom: 12px;">محتويات الحصة (الترتيب: ملازم الشرح ← الفيديو ← التلخيص ← الامتحان):</h3>

            <!-- 1. ملازم الشرح مع زر المشبك -->
            <div class="form-group">
                <label>1️⃣ ملازم الشرح (رابط الملف أو رفع مباشر):</label>
                <div class="input-with-clip">
                    <input type="url" id="lessonStudyNotes" placeholder="أدخل رابط PDF الشرح أو اضغط المشبك للإرفاق...">
                    <input type="file" id="fileInputStudyNotes" class="hidden" accept=".pdf,.doc,.docx" onchange="handleFileUpload(this, 'lessonStudyNotes')">
                    <button type="button" class="btn-clip" onclick="document.getElementById('fileInputStudyNotes').click()" title="إرفاق ملف من الجهاز 📎">📎</button>
                </div>
            </div>

            <!-- 2. فيديو الشرح مع زر المشبك -->
            <div class="form-group">
                <label>2️⃣ فيديو الشرح الرئيسي (رابط يوتيوب/سيرفر أو رفع فيديو):</label>
                <div class="input-with-clip">
                    <input type="url" id="lessonVideoUrl" placeholder="أدخل رابط الفيديو أو اضغط المشبك لرفع فيديو...">
                    <input type="file" id="fileInputVideo" class="hidden" accept="video/*" onchange="handleFileUpload(this, 'lessonVideoUrl')">
                    <button type="button" class="btn-clip" onclick="document.getElementById('fileInputVideo').click()" title="إرفاق فيديو من الجهاز 📎">📎</button>
                </div>
            </div>

            <!-- 3. ملازم التلخيص مع زر المشبك -->
            <div class="form-group">
                <label>3️⃣ ملازم تلخيص الدرس (رابط PDF التلخيص أو رفع مباشر):</label>
                <div class="input-with-clip">
                    <input type="url" id="lessonSummaryNotes" placeholder="أدخل رابط ملخص الدرس أو اضغط المشبك للإرفاق...">
                    <input type="file" id="fileInputSummary" class="hidden" accept=".pdf,.doc,.docx" onchange="handleFileUpload(this, 'lessonSummaryNotes')">
                    <button type="button" class="btn-clip" onclick="document.getElementById('fileInputSummary').click()" title="إرفاق ملخص من الجهاز 📎">📎</button>
                </div>
            </div>

            <!-- 4. امتحان الحصة الخاص بها -->
            <div class="form-group">
                <label>4️⃣ امتحان الحصة الخاص بهذا الدرس (اختيار امتحان الكولكشن المستقل):</label>
                <select id="lessonExamSelect">
                    <option value="">-- اختر امتحان مخصص لهذه الحصة --</option>
                </select>
            </div>

            <button class="btn-save" onclick="publishNewLessonToCloud()">نشر الحصة دراسية بالسحابة الآن 🚀</button>
        </div>

        <div class="section-box">
            <div class="section-header"><h2>الحصص المنشورة حالياً 📚</h2></div>
            <div id="lessonsListContainer">
                <p style="text-align: center; opacity: 0.7; padding: 15px; font-size: 0.82rem;">جاري جلب الحصص...</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let globalLessonsList = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await fetchLessonExamsDropdown();
                await fetchLessonsList();
            } else {
                window.location.href = 'login.html';
            }
        });

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const bodyElement = document.body;
        const savedTheme = localStorage.getItem('platform_theme') || 'dark';
        bodyElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            let nextTheme = bodyElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            bodyElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('platform_theme', nextTheme);
            themeToggleBtn.textContent = nextTheme === 'dark' ? '☀️' : '🌙';
        });

        window.handleFileUpload = function(input, targetInputId) {
            let file = input.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(targetInputId).value = e.target.result;
                    alert(`✔ تم تجهيز الملف (${file.name}) بنجاح.`);
                };
                reader.readAsDataURL(file);
            }
        };

        async function fetchLessonExamsDropdown() {
            try {
                const querySnapshot = await getDocs(collection(db, "lessonExams"));
                const select = document.getElementById('lessonExamSelect');
                let html = '<option value="">-- اختر امتحان مخصص لهذه الحصة --</option>';
                querySnapshot.forEach((docSnap) => {
                    let ex = docSnap.data();
                    html += `<option value="${docSnap.id}">📝 ${ex.title || 'امتحان درس'}</option>`;
                });
                select.innerHTML = html;
            } catch (e) {
                console.warn("جاري إنشاء كولكشن امتحانات الحصص...");
            }
        }

        async function fetchLessonsList() {
            const container = document.getElementById('lessonsListContainer');
            try {
                const querySnapshot = await getDocs(collection(db, "lessons"));
                globalLessonsList = [];
                querySnapshot.forEach((docSnap) => {
                    globalLessonsList.push({ id: docSnap.id, ...docSnap.data() });
                });

                if (globalLessonsList.length === 0) {
                    container.innerHTML = '<p style="text-align: center; opacity: 0.7; padding: 15px; font-size: 0.82rem;">لا توجد حصص منشورة حتى الآن.</p>';
                    return;
                }

                let html = "";
                globalLessonsList.forEach((lesson) => {
                    html += `
                        <div class="lesson-card-item">
                            <div>
                                <h3 style="font-size: 0.9rem; color: var(--text-main); margin-bottom: 2px;">🎬 الحصة ${lesson.number || 1}: ${lesson.title}</h3>
                                <p style="font-size: 0.75rem; color: var(--text-muted);">المادة: ${lesson.subject || 'عام'} | الصف: ${lesson.targetGroup || 'عام'}</p>
                            </div>
                            <button class="btn-danger" onclick="deleteLesson('${lesson.id}')">حذف الحصة 🗑️</button>
                        </div>`;
                });
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = '<p style="text-align: center; color: var(--danger); padding: 15px;">حدث خطأ أثناء جلب الحصص.</p>';
            }
        };

        window.publishNewLessonToCloud = async function() {
            let title = document.getElementById('lessonTitle').value.trim();
            let subject = document.getElementById('lessonSubject').value.trim();
            let targetGroup = document.getElementById('lessonTargetGroup').value.trim();
            let number = parseInt(document.getElementById('lessonNumber').value) || 1;
            
            let studyNotes = document.getElementById('lessonStudyNotes').value.trim();
            let videoUrl = document.getElementById('lessonVideoUrl').value.trim();
            let summaryNotes = document.getElementById('lessonSummaryNotes').value.trim();
            let examId = document.getElementById('lessonExamSelect').value;

            if (!title) { alert('يرجى كتابة عنوان الحصة على الأقل!'); return; }

            let lessonDoc = {
                title, subject, targetGroup, number,
                studyNotes, videoUrl, summaryNotes, examId,
                settings: {
                    active: true,
                    smartExamLock: true,
                    antiScreenshot: true,
                    allowDownload: false,
                    maxAttempts: 10,
                    showStudyNotes: true,
                    showVideo: true,
                    showSummary: true,
                    minWatchTime: 0,
                    instantResult: true,
                    sendNotification: true
                },
                createdAt: new Date().toISOString()
            };

            try {
                await addDoc(collection(db, "lessons"), lessonDoc);
                alert('✔ تم نشر الحصة بنجاح في السحابة لجميع الطلاب وأرسل التنبيه! 🚀');
                
                document.getElementById('lessonTitle').value = '';
                document.getElementById('lessonSubject').value = '';
                document.getElementById('lessonTargetGroup').value = '';
                document.getElementById('lessonStudyNotes').value = '';
                document.getElementById('lessonVideoUrl').value = '';
                document.getElementById('lessonSummaryNotes').value = '';
                
                fetchLessonsList();
            } catch (e) {
                console.error(e);
                alert("حدث خطأ أثناء نشر الحصة في السحابة.");
            }
        };

        window.deleteLesson = async function(id) {
            if (confirm("هل أنت متأكد من حذف هذه الحصة نهائياً؟")) {
                try {
                    await deleteDoc(doc(db, "lessons", id));
                    alert("تم حذف الحصة بنجاح.");
                    fetchLessonsList();
                } catch(e) {
                    alert("خطأ أثناء الحذف.");
                }
            }
        };
    </script>
</body>
</html>
