<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - إعدادات الحصص</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.12);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            --th-bg: rgba(255, 255, 255, 0.04);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            --th-bg: rgba(0, 0, 0, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        .header-right-side { display: flex; align-items: center; }
        .btn-home-link {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .header-center-box { display: flex; align-items: center; justify-content: center; }
        .platform-title-box { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: 700; color: var(--text-main); white-space: nowrap; }
        
        .header-left-side { display: flex; align-items: center; gap: 10px; }
        .btn-theme-toggle {
            background-color: rgba(255, 255, 255, 0.04); color: var(--text-main); border: 1px solid var(--border-color);
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
        }
        .btn-theme-toggle:hover { background-color: var(--hover-bg); border-color: var(--primary); }

        .admin-nav-bar {
            display: flex; justify-content: center; align-items: center;
            background-color: var(--bg-card); padding: 12px 16px; border-radius: 16px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); gap: 10px; flex-wrap: wrap;
        }
        .admin-tabs-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .btn-tab {
            background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--border-color);
            padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; flex: 1; min-width: 140px; text-align: center; text-decoration: none; display: inline-block;
        }
        .btn-tab.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        .section-box {
            background-color: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow);
            padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
        }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .section-header h2 { color: var(--text-main); font-size: 1.05rem; font-weight: 700; }

        .form-group { margin-top: 14px; text-align: right; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: var(--text-muted); font-weight: 600; }
        .form-group select, .form-group input {
            width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-color);
            background: var(--bg-main); color: var(--text-main); font-size: 0.85rem; outline: none;
        }

        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 15px; }
        .setting-card { background: var(--th-bg); padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .setting-card label { font-size: 0.8rem; font-weight: 600; cursor: pointer; color: var(--text-main); flex: 1; }
        
        .switch { position: relative; display: inline-block; width: 38px; height: 20px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: 0.2s; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(18px); }

        .btn-save { background: var(--success); color: white; border: none; padding: 12px 16px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.9rem; margin-top: 20px; width: 100%; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-save:hover { opacity: 0.9; transform: translateY(-1px); }
        .hidden { display: none !important; }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <header class="platform-header">
            <div class="header-right-side"><a href="admin.html" class="btn-home-link">🏠 الرئيسية</a></div>
            <div class="header-center-box"><div class="platform-title-box"><span>إعدادات الحصص والأمان</span> ⚙️</div></div>
            <div class="header-left-side"><button class="btn-theme-toggle" id="themeToggleBtn" title="تغيير الوضع">☀️</button></div>
        </header>

        <nav class="admin-nav-bar">
            <div class="admin-tabs-group">
                <a href="files-lessons.html" class="btn-tab">إنشاء الحصص 📝</a>
                <a href="files-settings.html" class="btn-tab active">إعدادات الحصص ⚙️</a>
                <a href="files-stats.html" class="btn-tab">إحصائيات الحصص 📊</a>
            </div>
        </nav>

        <div class="section-box">
            <div class="section-header"><h2>اختر الحصة للتحكم في إعداداتها وصلاحياتها 🛠️</h2></div>
            <div class="form-group" style="margin-top:0;">
                <label>اختر الحصة الدراسية:</label>
                <select id="selectLessonDropdown" onchange="loadLessonSettingsToForm()">
                    <option value="">-- اختر الحصة المطلوبة --</option>
                </select>
            </div>
        </div>

        <div class="section-box hidden" id="settingsFormContainer">
            <div class="section-header"><h2>التحكم في الـ 12 إعداداً للأمان والحصص 🛡️</h2></div>
            
            <div class="settings-grid">
                <!-- 1 -->
                <div class="setting-card"><label for="set_active">حالة الحصة العامة (مفتوحة / مغلقة)</label><label class="switch"><input type="checkbox" id="set_active"><span class="slider"></span></label></div>
                <!-- 2 -->
                <div class="setting-card"><label for="set_smartExamLock">الشرط الذكي (قفل الامتحان لحين مشاهدة المحتوى)</label><label class="switch"><input type="checkbox" id="set_smartExamLock"><span class="slider"></span></label></div>
                <!-- 3 -->
                <div class="setting-card"><label for="set_antiScreenshot">حماية منع السكرين شوت وعلامة مائية 🛡️</label><label class="switch"><input type="checkbox" id="set_antiScreenshot"><span class="slider"></span></label></div>
                <!-- 4 -->
                <div class="setting-card"><label for="set_allowDownload">السماح بتحميل الملفات (مشاهدة وتحميل)</label><label class="switch"><input type="checkbox" id="set_allowDownload"><span class="slider"></span></label></div>
                <!-- 5 -->
                <div class="setting-card"><label for="set_showStudyNotes">إظهار قائمة "ملازم الشرح"</label><label class="switch"><input type="checkbox" id="set_showStudyNotes"><span class="slider"></span></label></div>
                <!-- 6 -->
                <div class="setting-card"><label for="set_showVideo">إظهار قائمة "فيديو الشرح"</label><label class="switch"><input type="checkbox" id="set_showVideo"><span class="slider"></span></label></div>
                <!-- 7 -->
                <div class="setting-card"><label for="set_showSummary">إظهار قائمة "ملازم التلخيص"</label><label class="switch"><input type="checkbox" id="set_showSummary"><span class="slider"></span></label></div>
                <!-- 8 -->
                <div class="setting-card"><label for="set_instantResult">إظهار النتيجة الفورية لامتحان الحصة للطالب</label><label class="switch"><input type="checkbox" id="set_instantResult"><span class="slider"></span></label></div>
                <!-- 9 -->
                <div class="setting-card"><label for="set_sendNotification">إرسال إشعار فوري (جرس تنبيه) عند نشر الحصة 🔔</label><label class="switch"><input type="checkbox" id="set_sendNotification"><span class="slider"></span></label></div>
                <!-- 10 -->
                <div class="setting-card"><label for="set_fullScreen">إجبار وضع ملء الشاشة لامتحان الحصة 🖥️</label><label class="switch"><input type="checkbox" id="set_fullScreen"><span class="slider"></span></label></div>
                <!-- 11 -->
                <div class="setting-card"><label for="set_antiCheat">منع مغادرة صفحة الامتحان وعمل Refresh 🚫</label><label class="switch"><input type="checkbox" id="set_antiCheat"><span class="slider"></span></label></div>
            </div>

            <!-- 12. حد المحاولات الافتراضي -->
            <div class="form-group" style="margin-top: 15px;">
                <label>الحد الأقصى لمحاولات فتح الملفات أو الفيديوهات لكل طالب:</label>
                <input type="number" id="set_maxAttempts" value="10" min="1">
            </div>

            <button class="btn-save" onclick="saveLessonSettingsToCloud()">حفظ وتحديث إعدادات الحصة بالسحابة ⚙️</button>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let globalLessonsList = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await fetchLessonsDropdown();
            } else {
                window.location.href = 'login.html';
            }
        });

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const bodyElement = document.body;
        const savedTheme = localStorage.getItem('platform_theme') || 'dark';
        bodyElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            let nextTheme = bodyElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            bodyElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('platform_theme', nextTheme);
            themeToggleBtn.textContent = nextTheme === 'dark' ? '☀️' : '🌙';
        });

        async function fetchLessonsDropdown() {
            try {
                const querySnapshot = await getDocs(collection(db, "lessons"));
                globalLessonsList = [];
                const select = document.getElementById('selectLessonDropdown');
                let html = '<option value="">-- اختر الحصة المطلوبة --</option>';
                
                querySnapshot.forEach((docSnap) => {
                    let les = docSnap.data();
                    globalLessonsList.push({ id: docSnap.id, ...les });
                    html += `<option value="${docSnap.id}">🎬 الحصة ${les.number || 1}: ${les.title || 'بدون عنوان'}</option>`;
                });
                select.innerHTML = html;
            } catch (e) {
                console.error("خطأ في جلب الحصص:", e);
            }
        }

        window.loadLessonSettingsToForm = function() {
            let lessonId = document.getElementById('selectLessonDropdown').value;
            let formContainer = document.getElementById('settingsFormContainer');
            
            if (!lessonId) {
                formContainer.classList.add('hidden');
                return;
            }

            let lesson = globalLessonsList.find(l => l.id === lessonId);
            if (!lesson) return;

            let s = lesson.settings || {};
            document.getElementById('set_active').checked = s.active !== false;
            document.getElementById('set_smartExamLock').checked = s.smartExamLock !== false;
            document.getElementById('set_antiScreenshot').checked = s.antiScreenshot !== false;
            document.getElementById('set_allowDownload').checked = !!s.allowDownload;
            document.getElementById('set_showStudyNotes').checked = s.showStudyNotes !== false;
            document.getElementById('set_showVideo').checked = s.showVideo !== false;
            document.getElementById('set_showSummary').checked = s.showSummary !== false;
            document.getElementById('set_instantResult').checked = s.instantResult !== false;
            document.getElementById('set_sendNotification').checked = s.sendNotification !== false;
            document.getElementById('set_fullScreen').checked = !!s.fullScreen;
            document.getElementById('set_antiCheat').checked = !!s.antiCheat;
            document.getElementById('set_maxAttempts').value = s.maxAttempts || 10;

            formContainer.classList.remove('hidden');
        };

        window.saveLessonSettingsToCloud = async function() {
            let lessonId = document.getElementById('selectLessonDropdown').value;
            if (!lessonId) { alert('يرجى اختيار الحصة أولاً!'); return; }

            let updatedSettings = {
                active: document.getElementById('set_active').checked,
                smartExamLock: document.getElementById('set_smartExamLock').checked,
                antiScreenshot: document.getElementById('set_antiScreenshot').checked,
                allowDownload: document.getElementById('set_allowDownload').checked,
                showStudyNotes: document.getElementById('set_showStudyNotes').checked,
                showVideo: document.getElementById('set_showVideo').checked,
                showSummary: document.getElementById('set_showSummary').checked,
                instantResult: document.getElementById('set_instantResult').checked,
                sendNotification: document.getElementById('set_sendNotification').checked,
                fullScreen: document.getElementById('set_fullScreen').checked,
                antiCheat: document.getElementById('set_antiCheat').checked,
                maxAttempts: parseInt(document.getElementById('set_maxAttempts').value) || 10
            };

            try {
                const lessonRef = doc(db, "lessons", lessonId);
                await updateDoc(lessonRef, { settings: updatedSettings });
                
                let idx = globalLessonsList.findIndex(l => l.id === lessonId);
                if (idx !== -1) globalLessonsList[idx].settings = updatedSettings;

                alert('✔ تم حفظ وتحديث إعدادات الحصة والأمان بنجاح في السحابة! 🚀');
            } catch (e) {
                console.error(e);
                alert("حدث خطأ أثناء حفظ الإعدادات.");
            }
        };
    </script>
</body>
</html>
