<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الامتحانات التفاعلية - رحلة دراسية</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --header-bg: #1e293b;
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-color: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        [data-theme="light"] {
            --bg-color: #f4f7f6;
            --header-bg: #1e3c72;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-sub: #666666;
            --border-color: #eee;
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s, border-color 0.3s; }
        
        body { 
            background: var(--bg-color); 
            color: var(--text-color); 
            padding: 15px; 
            min-height: 100vh;
        }

        .container { max-width: 850px; margin: 0 auto; }
        
        header { 
            background: var(--header-bg); 
            color: white; 
            padding: 18px 22px; 
            border-radius: 16px; 
            text-align: center; 
            margin-bottom: 25px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .timer-box { background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; }
        
        .exam-card { 
            background: var(--card-bg); 
            padding: 25px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            box-shadow: var(--shadow); 
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
        }
        .question-box { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); }
        .question-box h3 { font-size: 1.05rem; margin-bottom: 14px; color: var(--text-color); line-height: 1.6; }
        .question-img { max-width: 100%; max-height: 220px; border-radius: 10px; margin-bottom: 12px; display: block; object-fit: contain; }
        
        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-label { 
            display: flex; align-items: center; gap: 12px; padding: 12px 18px; 
            border-radius: 10px; border: 1px solid var(--border-color); cursor: pointer; 
            transition: all 0.2s; background: rgba(255,255,255,0.02); font-size: 0.95rem;
        }
        .option-label:hover { background: rgba(99, 102, 241, 0.08); border-color: var(--primary-color); }
        
        .essay-textarea { 
            width: 100%; height: 110px; padding: 12px; border-radius: 10px; 
            border: 1px solid var(--border-color); background: var(--bg-color); 
            color: var(--text-color); resize: none; font-size: 0.95rem; outline: none; 
        }
        .essay-textarea:focus { border-color: var(--primary-color); }

        .btn-submit-exam { 
            background: #10b981; color: white; border: none; padding: 14px 25px; 
            border-radius: 12px; font-weight: bold; font-size: 1.05rem; cursor: pointer; 
            width: 100%; margin-top: 15px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: background 0.2s, transform 0.1s;
        }
        .btn-submit-exam:hover { background: #059669; transform: translateY(-2px); }
        
        .correct-answer { background: rgba(16, 185, 129, 0.2) !important; border-color: #10b981 !important; font-weight: bold; color: #34d399; }
        .wrong-answer { background: rgba(239, 68, 68, 0.2) !important; border-color: #ef4444 !important; font-weight: bold; color: #f87171; }
        .explanation-box { background: rgba(2, 132, 199, 0.1); padding: 12px; border-radius: 8px; margin-top: 12px; font-size: 0.9rem; color: #38bdf8; border-right: 4px solid #0ea5e9; line-height: 1.5; }

        .result-box { 
            background: var(--card-bg); padding: 30px; border-radius: 16px; text-align: center; 
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); display: none; 
        }
        
        .exam-select-card { 
            background: var(--card-bg); padding: 22px; border-radius: 16px; margin-bottom: 18px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: var(--shadow); border: 1px solid var(--border-color); border-right: 5px solid var(--primary-color);
            flex-wrap: wrap; gap: 15px;
        }
        .exam-select-card h3 { font-size: 1.15rem; margin-bottom: 6px; color: var(--text-color); }
        .exam-select-card p { font-size: 0.9rem; color: var(--text-sub); }
        
        .start-exam-btn { 
            background: var(--primary-color); color: white; border: none; padding: 10px 22px; 
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.95rem; 
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); transition: background 0.2s, transform 0.1s;
        }
        .start-exam-btn:hover { background: var(--primary-hover); transform: translateY(-2px); }

        .theme-toggle-btn {
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2);
            color: white; border-radius: 50%; cursor: pointer; font-size: 1rem;
            display: flex; align-items: center; justify-content: center; width: 38px; height: 38px;
        }
    </style>
</head>
<body id="pageBody">

    <div class="container">
        <header>
            <div style="display: flex; align-items: center; gap: 12px;">
                <button id="themeToggleBtn" class="theme-toggle-btn" title="تغيير الوضع">☀️</button>
                <h1 id="examHeaderTitle" style="font-size: 1.15rem;">📝 قائمة الامتحانات الإلكترونية</h1>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <div class="timer-box" id="timerDisplay" style="display: none;">⏳ الوقت: --:--</div>
                <a href="main.html" style="color: white; text-decoration: none; font-size: 0.9rem; background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 8px; font-weight: bold;">الرئيسية 🏠</a>
            </div>
        </header>

        <div class="result-box" id="examResultBox">
            <h2 id="resultGradeText" style="margin-bottom: 10px; color: var(--primary-color);">لقد حصلت على الدرجة</h2>
            <p id="resultPercentageText" style="font-size: 1.3rem; font-weight: bold; margin-bottom: 15px;">النسبة: 0%</p>
            <p id="essayNote" style="color: #f59e0b; font-size: 0.9rem; margin-bottom: 20px; display: none;">⚠️ تم تسجيل إجاباتك المقالية وفي انتظار مراجعة وتصحيح الأدمن.</p>
            <button onclick="location.reload()" style="background: #0284c7; color: white; border: none; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem;">العودة لقائمة الامتحانات 📋</button>
        </div>

        <div id="examContainer">
            <div style="text-align: center; padding: 50px; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--shadow);">
                <div style="font-size: 3rem; margin-bottom: 10px;">⏳</div>
                <h3 style="color: var(--text-color); margin-bottom: 5px;">جاري التحقق من الامتحانات المتاحة...</h3>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 30px; font-size: 0.85rem; color: var(--text-sub);">
            جميع الحقوق محفوظة للمهندس/مؤسس المنصة <strong>محمد عماد محمد (عشري)</strong> © 2026 - رحلة دراسية
        </div>
    </div>

    <script>
        const BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';
        
        let allExams = [];
        let currentExam = null;
        let timerInterval = null;
        let timeLeft = 0;

        // --- نظام المظهر الافتراضي (الداكن) وتغيير الوضع ---
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const htmlTag = document.documentElement;

        const savedTheme = localStorage.getItem('examTheme') || 'dark';
        htmlTag.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', function() {
            const currentTheme = htmlTag.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                htmlTag.setAttribute('data-theme', 'light');
                localStorage.setItem('examTheme', 'light');
                themeToggleBtn.textContent = '🌙';
            } else {
                htmlTag.setAttribute('data-theme', 'dark');
                localStorage.setItem('examTheme', 'dark');
                themeToggleBtn.textContent = '☀️';
            }
        });

        async function fetchExamsList() {
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest?timestamp=` + new Date().getTime(), {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY },
                    cache: 'no-cache'
                });
                let data = await res.json();
                
                // جلب الامتحانات الأصلية فقط وتصفية أي امتحان وهمي أو غير معتمد
                allExams = (data.record.exams || []).filter(exam => exam && exam.title);

                renderExamsSelectionList(allExams);

            } catch (e) {
                console.error(e);
                const container = document.getElementById('examContainer');
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--shadow);">
                        <div style="font-size: 3rem; margin-bottom: 10px;">📭</div>
                        <h3 style="color: var(--text-color); margin-bottom: 5px;">لا توجد امتحانات متاحة حالياً</h3>
                        <p style="color: var(--text-sub); font-size: 0.9rem;">لم يتم نشر أي اختبارات أو امتحانات تفاعلية بعد. ترقبونا قريباً!</p>
                    </div>
                `;
            }
        }

        function renderExamsSelectionList(exams) {
            const container = document.getElementById('examContainer');
            
            // فلترة الامتحانات غير المغلقة وغير الفارغة
            const activeExams = (exams || []).filter(exam => !exam.isClosed);

            if (activeExams.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 50px; background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--shadow);">
                        <div style="font-size: 3.5rem; margin-bottom: 15px;">📭</div>
                        <h3 style="color: var(--text-color); font-size: 1.25rem; margin-bottom: 8px;">لم يتم نشر امتحانات بعد</h3>
                        <p style="color: var(--text-sub); font-size: 0.95rem;">ترقبوا.. سيتم نشر الامتحانات والاختبارات التفاعلية قريباً من قِبل الإدارة.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            activeExams.forEach((exam, index) => {
                let card = document.createElement('div');
                card.className = 'exam-select-card';
                card.innerHTML = `
                    <div>
                        <h3>🎯 ${exam.title}</h3>
                        <p>المدة: ${exam.durationMinutes || 15} دقائق | عدد الأسئلة: ${(exam.questions || []).length}</p>
                        ${exam.prerequisite ? `<p style="font-size:0.8rem; color:#f59e0b; margin-top:4px;">🔒 يعتمد على: ${exam.prerequisite}</p>` : ''}
                    </div>
                    <button class="start-exam-btn" onclick="startSpecificExam(${index})">دخول الامتحان 🚀</button>
                `;
                container.appendChild(card);
            });
        }

        function startSpecificExam(index) {
            currentExam = allExams[index];
            if (!currentExam) return;

            document.getElementById('examHeaderTitle').textContent = `🎯 ${currentExam.title}`;
            document.getElementById('timerDisplay').style.display = 'block';

            timeLeft = (parseInt(currentExam.durationMinutes) || 15) * 60;
            startTimer();
            renderExamQuestions(currentExam.questions);
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert('انتهى وقت الامتحان! سيتم تسليم الإجابات تلقائياً.');
                    submitExam(new Event('submit'));
                    return;
                }
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                document.getElementById('timerDisplay').textContent = `⏳ الوقت: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
                timeLeft--;
            }, 1000);
        }

        function renderExamQuestions(questions) {
            const container = document.getElementById('examContainer');
            let html = `<div class="exam-card"><form id="examForm" onsubmit="submitExam(event)">`;
            
            questions.forEach((q, qIndex) => {
                html += `<div class="question-box" id="qBox-${qIndex}">
                    <h3>س${qIndex + 1}: ${q.questionText}</h3>`;
                
                if (q.imageUrl) {
                    html += `<img src="${q.imageUrl}" class="question-img" onerror="this.style.display='none'">`;
                }

                if (q.type === 'mcq') {
                    html += `<div class="options-list">`;
                    q.options.forEach((opt, oIndex) => {
                        html += `<label class="option-label" id="label-${qIndex}-${oIndex}">
                            <input type="radio" name="question_${qIndex}" value="${oIndex}" required>
                            <span>${opt}</span>
                        </label>`;
                    });
                    html += `</div>`;
                } else if (q.type === 'tf') {
                    html += `<div class="options-list">
                        <label class="option-label" id="label-${qIndex}-true">
                            <input type="radio" name="question_${qIndex}" value="true" required> <span>صح (True)</span>
                        </label>
                        <label class="option-label" id="label-${qIndex}-false">
                            <input type="radio" name="question_${qIndex}" value="false" required> <span>خطأ (False)</span>
                        </label>
                    </div>`;
                } else if (q.type === 'essay') {
                    html += `<textarea class="essay-textarea" name="essay_${qIndex}" placeholder="اكتب إجابتك هنا بوضوح..." required></textarea>`;
                }

                html += `</div>`;
            });

            html += `<button type="submit" class="btn-submit-exam">تسليم الامتحان وعرض التصحيح الفوري 🚀</button></form></div>`;
            container.innerHTML = html;
        }

        async function submitExam(e) {
            if (e) e.preventDefault();
            if (timerInterval) clearInterval(timerInterval);

            let questions = currentExam.questions;
            let score = 0;
            let totalObjective = 0;
            let hasEssay = false;

            questions.forEach((q, qIndex) => {
                if (q.type === 'mcq' || q.type === 'tf') {
                    totalObjective++;
                    let selected = document.querySelector(`input[name="question_${qIndex}"]:checked`);
                    if (selected) {
                        let userVal = selected.value;
                        let correctVal = String(q.correctAnswer);
                        let userLbl = selected.closest('.option-label');
                        let correctLbl = document.getElementById(`label-${qIndex}-${q.correctAnswer}`);

                        if (userVal === correctVal) {
                            score++;
                            if (userLbl) userLbl.classList.add('correct-answer');
                        } else {
                            if (userLbl) userLbl.classList.add('wrong-answer');
                            if (correctLbl) correctLbl.classList.add('correct-answer');
                        }
                    }
                } else if (q.type === 'essay') {
                    hasEssay = true;
                }

                if (q.explanation) {
                    let qBox = document.getElementById(`qBox-${qIndex}`);
                    let expDiv = document.createElement('div');
                    expDiv.className = 'explanation-box';
                    expDiv.innerHTML = `<b>💡 توضيح الإجابة:</b> ${q.explanation}`;
                    qBox.appendChild(expDiv);
                }
            });

            let percentage = totalObjective > 0 ? Math.round((score / totalObjective) * 100) : 100;

            document.getElementById('resultGradeText').textContent = `النتيجة: ${score} من ${totalObjective} (أسئلة موضوعية)`;
            document.getElementById('resultPercentageText').textContent = `النسبة: ${percentage}%`;
            if (hasEssay) document.getElementById('essayNote').style.display = 'block';
            document.getElementById('examResultBox').style.display = 'block';

            document.querySelectorAll('input, textarea, button[type="submit"]').forEach(el => el.disabled = true);
            window.scrollTo({ top: 0, behavior: 'smooth' });

            saveStudentResultToCloud(score, percentage);
        }

        async function saveStudentResultToCloud(score, percentage) {
            try {
                let studentUser = JSON.parse(sessionStorage.getItem('studentUser') || sessionStorage.getItem('currentUser') || '{}');
                let studentEmail = studentUser.email || 'طالب مجهول';
                let studentName = studentUser.fullName || studentUser.name || studentEmail.split('@')[0];

                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                let data = await res.json();
                let record = data.record || {};

                if (!record.examResults) record.examResults = [];
                record.examResults.push({
                    examTitle: currentExam.title,
                    studentName: studentName,
                    studentEmail: studentEmail,
                    score: score,
                    percentage: percentage,
                    date: new Date().toLocaleDateString('ar-EG')
                });

                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY, 'Content-Type': 'application/json' },
                    body: JSON.stringify(record)
                });
            } catch (err) {
                console.error(err);
            }
        }

        fetchExamsList();
    </script>
</body>
</html>
