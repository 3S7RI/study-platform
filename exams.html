<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - الامتحانات التفاعلية</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            --th-bg: rgba(255, 255, 255, 0.03);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.05);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            --th-bg: rgba(0, 0, 0, 0.02);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; }
        
        /* الهيدر الموحد للمنصة */
        .platform-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-card);
            padding: 12px 18px;
            border-radius: 30px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-right-side { display: flex; align-items: center; gap: 10px; }
        .btn-home-link {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.85rem;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .header-center-box { display: flex; align-items: center; justify-content: center; }
        .platform-title-box { display: flex; align-items: center; gap: 6px; font-size: 1rem; font-weight: 700; color: var(--text-main); }
        
        .header-left-side { display: flex; align-items: center; gap: 10px; }
        .btn-theme-toggle {
            background-color: rgba(255, 255, 255, 0.04); color: var(--text-main); border: 1px solid var(--border-color);
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center;
        }
        .btn-theme-toggle:hover { background-color: var(--hover-bg); border-color: var(--primary); }

        .timer-box { background: var(--th-bg); border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; color: var(--primary); }
        
        .exam-card { 
            background: var(--bg-card); 
            padding: 24px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            box-shadow: var(--shadow); 
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--primary);
        }
        .question-box { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); text-align: right; }
        .question-box h3 { font-size: 1.05rem; margin-bottom: 14px; color: var(--text-main); line-height: 1.6; }
        
        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-label { 
            display: flex; align-items: center; gap: 12px; padding: 12px 18px; 
            border-radius: 10px; border: 1px solid var(--border-color); cursor: pointer; 
            transition: all 0.2s; background: var(--th-bg); font-size: 0.95rem; color: var(--text-main);
        }
        .option-label:hover { background: var(--hover-bg); border-color: var(--primary); }
        
        .btn-submit-exam { 
            background: var(--success); color: white; border: none; padding: 14px 25px; 
            border-radius: 12px; font-weight: bold; font-size: 1.05rem; cursor: pointer; 
            width: 100%; margin-top: 15px; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .btn-submit-exam:hover { opacity: 0.9; }
        
        .correct-answer { background: rgba(16, 185, 129, 0.2) !important; border-color: var(--success) !important; font-weight: bold; color: var(--success); }
        .wrong-answer { background: rgba(239, 68, 68, 0.2) !important; border-color: var(--danger) !important; font-weight: bold; color: var(--danger); }

        .result-box { 
            background: var(--bg-card); padding: 30px; border-radius: 16px; text-align: center; 
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); display: none; 
            border-top: 4px solid var(--success);
        }
        
        .exam-select-card { 
            background: var(--bg-card); padding: 22px; border-radius: 16px; margin-bottom: 18px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: var(--shadow); border: 1px solid var(--border-color); border-right: 5px solid var(--primary);
            flex-wrap: wrap; gap: 15px; text-align: right;
        }
        .exam-select-card h3 { font-size: 1.15rem; margin-bottom: 6px; color: var(--text-main); }
        .exam-select-card p { font-size: 0.9rem; color: var(--text-muted); }
        
        .start-exam-btn { 
            background: var(--primary); color: white; border: none; padding: 10px 22px; 
            border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.95rem; 
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .start-exam-btn:hover { background: var(--primary-hover); }
    </style>
</head>
<body id="pageBody">

    <div class="container">
        <!-- الهيدر الموحد المطابق للمنصة -->
        <header class="platform-header">
            <div class="header-right-side">
                <a href="main.html" class="btn-home-link">الرئيسية ↩️</a>
                <div class="timer-box" id="timerDisplay" style="display: none;">⏳ الوقت: --:--</div>
            </div>

            <div class="header-center-box">
                <div class="platform-title-box">
                    <span id="examHeaderTitle">قائمة الامتحانات</span> 📝
                </div>
            </div>

            <div class="header-left-side">
                <button class="btn-theme-toggle" id="themeToggleBtn" title="تغيير الوضع">☀️</button>
            </div>
        </header>

        <!-- صندوق النتيجة -->
        <div class="result-box" id="examResultBox">
            <h2 id="resultGradeText" style="margin-bottom: 10px; color: var(--primary);">لقد حصلت على الدرجة</h2>
            <p id="resultPercentageText" style="font-size: 1.3rem; font-weight: bold; margin-bottom: 15px;">النسبة: 0%</p>
            <button onclick="location.reload()" style="background: var(--primary); color: white; border: none; padding: 10px 24px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1rem;">العودة لقائمة الامتحانات 📋</button>
        </div>

        <!-- حاوية عرض الامتحانات والأسئلة -->
        <div id="examContainer">
            <div style="text-align: center; padding: 50px; background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--shadow);">
                <div style="font-size: 2.5rem; margin-bottom: 10px;">⏳</div>
                <h3 style="color: var(--text-main); margin-bottom: 5px;">جاري جلب الامتحانات من السحابة...</h3>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 30px; font-size: 0.85rem; color: var(--text-muted);">
            منصة رحلة دراسية التعليمية © 2026
        </div>
    </div>

    <!-- كود فايربيس والتزامن التلقائي مع لوحة الأدمن -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let activeExamData = null;
        let timerInterval = null;
        let timeLeft = 0;

        // --- نظام الثيم المظلم والفاتح الموحد ---
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const bodyElement = document.body;
        const savedTheme = localStorage.getItem('platform_theme') || 'dark';
        bodyElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            let activeTheme = bodyElement.getAttribute('data-theme');
            let nextTheme = activeTheme === 'dark' ? 'light' : 'dark';
            bodyElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('platform_theme', nextTheme);
            themeToggleBtn.textContent = nextTheme === 'dark' ? '☀️' : '🌙';
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await fetchActiveExamFromCloud();
            } else {
                window.location.href = 'login.html';
            }
        });

        async function fetchActiveExamFromCloud() {
            try {
                const docRef = doc(db, "config", "activeExam");
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    let data = docSnap.data();
                    activeExamData = data.currentExam;
                    
                    if (activeExamData && activeExamData.settings && activeExamData.settings.active === false) {
                        renderNoExamMessage("الامتحان الحالي مغلق مؤقتاً من قِبل الإدارة.");
                        return;
                    }

                    if (activeExamData && activeExamData.questions && activeExamData.questions.length > 0) {
                        renderExamSelectionCard(activeExamData);
                    } else {
                        renderNoExamMessage("لا توجد امتحانات متاحة حالياً. ترقبونا قريباً!");
                    }
                } else {
                    renderNoExamMessage("لم يتم نشر أي اختبارات أو امتحانات تفاعلية بعد.");
                }
            } catch (e) {
                console.error("خطأ في جلب الامتحان:", e);
                renderNoExamMessage("حدث خطأ في الاتصال بالسحابة لجلب الامتحان.");
            }
        }

        function renderNoExamMessage(msg) {
            const container = document.getElementById('examContainer');
            container.innerHTML = `
                <div style="text-align: center; padding: 50px; background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--shadow);">
                    <div style="font-size: 3rem; margin-bottom: 10px;">📭</div>
                    <h3 style="color: var(--text-main); margin-bottom: 5px;">${msg}</h3>
                </div>
            `;
        }

        function renderExamSelectionCard(exam) {
            const container = document.getElementById('examContainer');
            let duration = exam.settings?.duration || 30;
            
            container.innerHTML = `
                <div class="exam-select-card">
                    <div>
                        <h3>🎯 ${exam.title || 'امتحان المنصة'}</h3>
                        <p>المادة: ${exam.subject || 'عام'} | الفئة: ${exam.targetGroup || 'الطلاب'} | المدة: ${duration} دقيقة | الأسئلة: ${(exam.questions || []).length}</p>
                    </div>
                    <button class="start-exam-btn" onclick="startExam()">دخول الامتحان 🚀</button>
                </div>
            `;
        }

        window.startExam = function() {
            if (!activeExamData) return;

            document.getElementById('examHeaderTitle').textContent = activeExamData.title || 'امتحان المنصة';
            document.getElementById('timerDisplay').style.display = 'block';

            let durationMins = activeExamData.settings?.duration || 30;
            timeLeft = durationMins * 60;
            startTimer();
            renderExamQuestions(activeExamData.questions);
        };

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    alert('انتهى وقت الامتحان! سيتم تسليم الإجابات تلقائياً.');
                    submitExam(null);
                    return;
                }
                let mins = Math.floor(timeLeft / 60);
                let secs = timeLeft % 60;
                document.getElementById('timerDisplay').textContent = `⏳ الوقت: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
                timeLeft--;
            }, 1000);
        }

        function renderExamQuestions(questions) {
            const container = document.getElementById('examContainer');
            let html = `<div class="exam-card"><form id="examForm" onsubmit="submitExam(event)">`;
            
            questions.forEach((q, qIndex) => {
                let marksText = q.marks ? `(${q.marks} درجات)` : '(درجة واحدة)';
                html += `<div class="question-box" id="qBox-${qIndex}">
                    <h3>س${qIndex + 1}: ${q.text} <span style="font-size:0.8rem; background: rgba(99, 102, 241, 0.15); color: var(--primary); padding: 2px 8px; border-radius: 6px; margin-right: 6px;">${marksText}</span></h3>
                    <div class="options-list">`;
                
                q.options.forEach((opt, oIndex) => {
                    html += `<label class="option-label" id="label-${qIndex}-${oIndex}">
                        <input type="radio" name="question_${qIndex}" value="${oIndex}" required style="width: 18px; height: 18px; cursor: pointer;">
                        <span>${opt}</span>
                    </label>`;
                });
                html += `</div></div>`;
            });

            html += `<button type="submit" class="btn-submit-exam">تسليم الامتحان وعرض النتيجة الفورية 🚀</button></form></div>`;
            container.innerHTML = html;
        }

        window.submitExam = async function(e) {
            if (e) e.preventDefault();
            if (timerInterval) clearInterval(timerInterval);

            let questions = activeExamData.questions;
            let score = 0;
            let totalMarks = 0;

            questions.forEach((q, qIndex) => {
                let qMarks = parseInt(q.marks) || 1;
                totalMarks += qMarks;

                let selected = document.querySelector(`input[name="question_${qIndex}"]:checked`);
                if (selected) {
                    let userVal = parseInt(selected.value);
                    let correctVal = q.correct;
                    let userLbl = selected.closest('.option-label');
                    let correctLbl = document.getElementById(`label-${qIndex}-${q.correct}`);

                    if (userVal === correctVal) {
                        score += qMarks;
                        if (userLbl) userLbl.classList.add('correct-answer');
                    } else {
                        if (userLbl) userLbl.classList.add('wrong-answer');
                        if (correctLbl) correctLbl.classList.add('correct-answer');
                    }
                }
            });

            let percentage = totalMarks > 0 ? Math.round((score / totalMarks) * 100) : 100;

            document.getElementById('resultGradeText').textContent = `النتيجة: ${score} من ${totalMarks}`;
            document.getElementById('resultPercentageText').textContent = `النسبة المئوية: ${percentage}%`;
            document.getElementById('examResultBox').style.display = 'block';

            document.querySelectorAll('input, button[type="submit"]').forEach(el => el.disabled = true);
            window.scrollTo({ top: 0, behavior: 'smooth' });

            await saveStudentResultToCloud(score, totalMarks);
        };

        async function saveStudentResultToCloud(score, totalMarks) {
            try {
                let studentUser = JSON.parse(sessionStorage.getItem('studentUser') || sessionStorage.getItem('currentUser') || '{}');
                let studentEmail = studentUser.email || 'طالب المنصة';
                let studentName = studentUser.fullname || studentUser.name || studentEmail.split('@')[0];

                const docRef = doc(db, "config", "activeExam");
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    let data = docSnap.data();
                    if (!data.examSubmissions) data.examSubmissions = [];

                    data.examSubmissions.push({
                        studentName: studentName,
                        studentEmail: studentEmail,
                        score: score,
                        totalMarks: totalMarks,
                        date: new Date().toLocaleDateString('ar-EG', { hour: '2-digit', minute: '2-digit' })
                    });

                    await setDoc(docRef, data);
                }
            } catch (err) {
                console.error("خطأ في رفع النتيجة للسحابة:", err);
            }
        }
    </script>
</body>
</html>
