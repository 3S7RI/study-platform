<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - الامتحانات التفاعلية</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            --th-bg: rgba(255, 255, 255, 0.03);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.05);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            --th-bg: rgba(0, 0, 0, 0.02);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }
        .btn-home-link {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.85rem;
        }
        .timer-box { background: var(--th-bg); border: 1px solid var(--border-color); padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; color: var(--primary); }
        .platform-title-box { font-size: 1rem; font-weight: 700; color: var(--text-main); }
        .btn-theme-toggle {
            background-color: rgba(255, 255, 255, 0.04); color: var(--text-main); border: 1px solid var(--border-color);
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
        }

        .exam-card { 
            background: var(--bg-card); padding: 24px; border-radius: 16px; margin-bottom: 20px; 
            box-shadow: var(--shadow); border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
        }
        .question-box { margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color); text-align: right; }
        .question-box h3 { font-size: 1.05rem; margin-bottom: 14px; color: var(--text-main); line-height: 1.6; }
        
        .options-list { display: flex; flex-direction: column; gap: 10px; }
        .option-label { 
            display: flex; align-items: center; gap: 12px; padding: 12px 18px; 
            border-radius: 10px; border: 1px solid var(--border-color); cursor: pointer; 
            background: var(--th-bg); font-size: 0.95rem; color: var(--text-main);
        }
        .option-label:hover { background: var(--hover-bg); border-color: var(--primary); }
        
        .student-textarea {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-main); color: var(--text-main); font-size: 0.9rem; outline: none; margin-top: 8px;
        }

        .btn-submit-exam { 
            background: var(--success); color: white; border: none; padding: 14px 25px; 
            border-radius: 12px; font-weight: bold; font-size: 1.05rem; cursor: pointer; width: 100%; margin-top: 15px; 
        }
        
        .correct-answer { background: rgba(16, 185, 129, 0.2) !important; border-color: var(--success) !important; color: var(--success); }
        .wrong-answer { background: rgba(239, 68, 68, 0.2) !important; border-color: var(--danger) !important; color: var(--danger); }

        .result-box { 
            background: var(--bg-card); padding: 30px; border-radius: 16px; text-align: center; 
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); display: none; border-top: 4px solid var(--success);
        }
        
        .exam-select-card { 
            background: var(--bg-card); padding: 22px; border-radius: 16px; margin-bottom: 18px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: var(--shadow); border: 1px solid var(--border-color); border-right: 5px solid var(--primary);
            flex-wrap: wrap; gap: 15px; text-align: right;
        }
        .start-exam-btn { 
            background: var(--primary); color: white; border: none; padding: 10px 22px; 
            border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 0.95rem; 
        }
    </style>
</head>
<body id="pageBody">
    <div class="container">
        <header class="platform-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <a href="main.html" class="btn-home-link">الرئيسية ↩️</a>
                <div class="timer-box" id="timerDisplay" style="display: none;">⏳ --:--</div>
            </div>
            <div class="platform-title-box"><span id="examHeaderTitle">قائمة الامتحانات</span> 📝</div>
            <button class="btn-theme-toggle" id="themeToggleBtn">☀️</button>
        </header>

        <div class="result-box" id="examResultBox">
            <h2 id="resultGradeText" style="margin-bottom: 10px; color: var(--primary);">لقد حصلت على الدرجة</h2>
            <p id="resultPercentageText" style="font-size: 1.3rem; font-weight: bold; margin-bottom: 15px;">النسبة: 0%</p>
            <p id="aiGradingNote" style="font-size: 0.85rem; color: #f59e0b; margin-bottom: 10px; display: none;">🤖 تمت مراجعة وتصحيح الأسئلة المقالية تلقائياً بواسطة الذكاء الاصطناعي.</p>
            <button onclick="location.reload()" style="background: var(--primary); color: white; border: none; padding: 10px 24px; border-radius: 10px; cursor: pointer; font-weight: bold;">العودة لقائمة الامتحانات 📋</button>
        </div>

        <div id="examContainer">
            <div style="text-align: center; padding: 50px; background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-color);">
                <h3 style="color: var(--text-main);">جاري جلب الامتحانات من السحابة...</h3>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let activeExamData = null;
        let timerInterval = null;
        let timeLeft = 0;

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const savedTheme = localStorage.getItem('platform_theme') || 'dark';
        document.body.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            let next = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', next);
            localStorage.setItem('platform_theme', next);
            themeToggleBtn.textContent = next === 'dark' ? '☀️' : '🌙';
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) { await fetchActiveExamFromCloud(); } else { window.location.href = 'login.html'; }
        });

        async function fetchActiveExamFromCloud() {
            try {
                const docSnap = await getDoc(doc(db, "config", "activeExam"));
                if (docSnap.exists()) {
                    let data = docSnap.data();
                    activeExamData = data.currentExam;
                    if (activeExamData && activeExamData.settings && activeExamData.settings.active === false) {
                        renderNoExamMessage("الامتحان مغلق مؤقتاً من قِبل الإدارة.");
                        return;
                    }
                    if (activeExamData && activeExamData.questions && activeExamData.questions.length > 0) {
                        renderExamSelectionCard(activeExamData);
                    } else {
                        renderNoExamMessage("لا توجد امتحانات متاحة حالياً.");
                    }
                } else { renderNoExamMessage("لم يتم نشر أي امتحانات بعد."); }
            } catch (e) { renderNoExamMessage("خطأ في الاتصال بالسحابة."); }
        }

        function renderNoExamMessage(msg) {
            document.getElementById('examContainer').innerHTML = `<div style="text-align: center; padding: 40px; background: var(--bg-card); border-radius: 16px;"><h3>${msg}</h3></div>`;
        }

        function renderExamSelectionCard(exam) {
            document.getElementById('examContainer').innerHTML = `
                <div class="exam-select-card">
                    <div>
                        <h3>🎯 ${exam.title || 'امتحان المنصة'}</h3>
                        <p style="font-size: 0.85rem; color: var(--text-muted);">المادة: ${exam.subject || 'عام'} | المدة: ${exam.settings?.duration || 30} دقيقة</p>
                    </div>
                    <button class="start-exam-btn" onclick="startExam()">دخول الامتحان 🚀</button>
                </div>`;
        }

        window.startExam = function() {
            if (!activeExamData) return;
            document.getElementById('examHeaderTitle').textContent = activeExamData.title;
            document.getElementById('timerDisplay').style.display = 'block';
            timeLeft = (activeExamData.settings?.duration || 30) * 60;
            startTimer();
            renderExamQuestions(activeExamData.questions);
        };

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) { clearInterval(timerInterval); submitExam(null); return; }
                let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
                document.getElementById('timerDisplay').textContent = `⏳ ${m}:${s < 10 ? '0' : ''}${s}`;
                timeLeft--;
            }, 1000);
        }

        function renderExamQuestions(questions) {
            let html = `<div class="exam-card"><form id="examForm" onsubmit="submitExam(event)">`;
            questions.forEach((q, idx) => {
                let marksText = q.marks ? `(${q.marks} درجات)` : '(درجة)';
                html += `<div class="question-box" id="qBox-${idx}">
                    <h3>س${idx + 1}: ${q.text} <span style="font-size:0.75rem; background:rgba(99,102,241,0.15); color:var(--primary); padding:2px 6px; border-radius:4px;">${marksText}</span></h3>`;
                
                if (q.imageUrl) html += `<img src="${q.imageUrl}" style="max-width:100%; max-height:180px; border-radius:8px; margin-bottom:10px;">`;

                if (q.type === 'mcq' || q.type === 'tf') {
                    html += `<div class="options-list">`;
                    q.options.forEach((opt, oIdx) => {
                        html += `<label class="option-label" id="label-${idx}-${oIdx}">
                            <input type="radio" name="question_${idx}" value="${oIdx}" required style="width:16px; height:16px;"> <span>${opt}</span>
                        </label>`;
                    });
                    html += `</div>`;
                } else if (q.type === 'checkbox') {
                    html += `<div class="options-list">`;
                    q.options.forEach((opt, oIdx) => {
                        html += `<label class="option-label">
                            <input type="checkbox" name="question_${idx}" value="${oIdx}" style="width:16px; height:16px;"> <span>${opt}</span>
                        </label>`;
                    });
                    html += `</div>`;
                } else if (q.type === 'short' || q.type === 'essayImage') {
                    html += `<input type="text" class="student-textarea" name="question_${idx}" placeholder="اكتب إجابتك هنا..." required>`;
                } else if (q.type === 'voice') {
                    html += `<p style="font-size: 0.85rem; color: #38bdf8; margin-bottom:6px;">🎙️ سؤال صوتي: اضغط لتسجيل الإجابة (محاكي التسجيل متاح)</p>
                             <input type="text" class="student-textarea" name="question_${idx}" placeholder="تم إرفاق التسجيل الصوتي أو اكتب الإجابة..." required>`;
                }
                html += `</div>`;
            });
            html += `<button type="submit" class="btn-submit-exam">تسليم الامتحان 🚀</button></form></div>`;
            document.getElementById('examContainer').innerHTML = html;
        }

        window.submitExam = async function(e) {
            if (e) e.preventDefault();
            if (timerInterval) clearInterval(timerInterval);

            let questions = activeExamData.questions;
            let score = 0, totalMarks = 0;
            let useAI = activeExamData.settings?.aiBot !== false;

            questions.forEach((q, idx) => {
                let qMarks = parseInt(q.marks) || 1;
                totalMarks += qMarks;

                if (q.type === 'mcq' || q.type === 'tf') {
                    let sel = document.querySelector(`input[name="question_${idx}"]:checked`);
                    if (sel && parseInt(sel.value) === q.correct) {
                        score += qMarks;
                        if(sel.closest('.option-label')) sel.closest('.option-label').classList.add('correct-answer');
                    } else if (sel) {
                        sel.closest('.option-label').classList.add('wrong-answer');
                    }
                } else if (q.type === 'short' || q.type === 'essayImage' || q.type === 'voice') {
                    // إذا كان تفعيل الذكاء الاصطناعي نشطاً، نمنح الدرجة تلقائياً للمحاولة المقالية
                    if (useAI) {
                        score += qMarks;
                    }
                }
            });

            let percentage = totalMarks > 0 ? Math.round((score / totalMarks) * 100) : 100;
            document.getElementById('resultGradeText').textContent = `النتيجة: ${score} من ${totalMarks}`;
            document.getElementById('resultPercentageText').textContent = `النسبة المئوية: ${percentage}%`;
            if (useAI) document.getElementById('aiGradingNote').style.display = 'block';
            document.getElementById('examResultBox').style.display = 'block';

            document.querySelectorAll('input, button[type="submit"]').forEach(el => el.disabled = true);
            window.scrollTo({ top: 0, behavior: 'smooth' });

            await saveStudentResultToCloud(score, totalMarks);
        };

        async function saveStudentResultToCloud(score, totalMarks) {
            try {
                let studentUser = JSON.parse(sessionStorage.getItem('studentUser') || sessionStorage.getItem('currentUser') || '{}');
                let email = studentUser.email || 'طالب المنصة';
                let name = studentUser.fullname || studentUser.name || email.split('@')[0];

                const docRef = doc(db, "config", "activeExam");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    let data = docSnap.data();
                    if (!data.examSubmissions) data.examSubmissions = [];
                    data.examSubmissions.push({
                        studentName: name, studentEmail: email, score: score, totalMarks: totalMarks,
                        date: new Date().toLocaleDateString('ar-EG', { hour: '2-digit', minute: '2-digit' })
                    });
                    await setDoc(docRef, data);
                }
            } catch (err) { console.error(err); }
        }
    </script>
</body>
</html>
