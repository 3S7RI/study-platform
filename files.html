<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - مكتبة الحصص والشروحات</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.12);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            --th-bg: rgba(255, 255, 255, 0.04);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            --th-bg: rgba(0, 0, 0, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; user-select: none; -webkit-user-select: none; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        .header-right-side { display: flex; align-items: center; }
        .btn-home-link {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .header-center-box { display: flex; align-items: center; justify-content: center; }
        .platform-title-box { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: 700; color: var(--text-main); white-space: nowrap; }
        
        .header-left-side { display: flex; align-items: center; gap: 10px; }
        .btn-theme-toggle {
            background-color: rgba(255, 255, 255, 0.04); color: var(--text-main); border: 1px solid var(--border-color);
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
        }
        .btn-theme-toggle:hover { background-color: var(--hover-bg); border-color: var(--primary); }

        .lessons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 25px;
        }

        .lesson-card-item {
            background-color: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow);
            padding: 20px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
            display: flex; flex-direction: column; justify-content: space-between; gap: 14px; position: relative;
        }

        .lesson-card-title { font-size: 1.05rem; font-weight: bold; color: var(--text-main); }
        .lesson-card-info { font-size: 0.82rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 4px; }

        .lesson-card-btn {
            background-color: var(--primary); color: white; text-decoration: none; text-align: center;
            padding: 9px 16px; border-radius: 10px; font-weight: bold; font-size: 0.85rem; display: block;
            border: none; cursor: pointer; box-shadow: 0 3px 10px rgba(99, 102, 241, 0.3);
        }
        .lesson-card-btn:hover { background-color: var(--primary-hover); opacity: 0.9; }
    </style>
</head>
<body id="pageBody" data-theme="dark">

    <div class="container">
        <header class="platform-header">
            <div class="header-right-side"><a href="main.html" class="btn-home-link">⬅ الرئيسية</a></div>
            <div class="header-center-box"><div class="platform-title-box"><span>مكتبة الحصص والشروحات</span> 📚</div></div>
            <div class="header-left-side"><button class="btn-theme-toggle" id="themeToggleBtn" title="تغيير الوضع">☀️</button></div>
        </header>

        <div id="lessonsGridContainer" class="lessons-grid">
            <div style="text-align: center; padding: 40px; color: var(--text-muted); grid-column: 1 / -1;">جاري تحميل الحصص من السحابة...</div>
        </div>

        <div style="text-align: center; margin-top: 25px; font-size: 0.78rem; color: var(--text-muted);">
            جميع الحقوق محفوظة للمهندس/مؤسس المنصة <strong>محمد عماد محمد (عشري)</strong> © 2026 - رحلة دراسية
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const bodyElement = document.body;
        const savedTheme = localStorage.getItem('platform_theme') || 'dark';
        bodyElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            let nextTheme = bodyElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            bodyElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('platform_theme', nextTheme);
            themeToggleBtn.textContent = nextTheme === 'dark' ? '☀️' : '🌙';
        });

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                // إذا لم يكن المستخدم مسجل الدخول، يتم توجيهه لصفحة الدخول أو الاندكس
                window.location.href = "index.html";
                return;
            }
            await loadLessonsLibrary();
        });

        async function loadLessonsLibrary() {
            const container = document.getElementById('lessonsGridContainer');
            try {
                const q = query(collection(db, "lessons"), orderBy("number", "asc"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    container.innerHTML = `<p style="text-align:center; color:var(--text-muted); grid-column: 1 / -1; padding:40px;">لا توجد حصص مضافة حتى الآن.</p>`;
                    return;
                }

                let html = "";
                querySnapshot.forEach((docSnap) => {
                    let lesson = docSnap.data();
                    let lessonId = docSnap.id;
                    let title = lesson.title || 'بدون عنوان';
                    let number = lesson.number || 1;
                    let subject = lesson.subject || 'عام';
                    let targetGroup = lesson.targetGroup || 'عام';

                    html += `
                        <div class="lesson-card-item">
                            <div>
                                <div class="lesson-card-title">🎬 الحصة ${number}: ${title}</div>
                                <div class="lesson-card-info" style="margin-top: 8px;">
                                    <span>📚 المادة: ${subject}</span>
                                    <span>👥 الصف: ${targetGroup}</span>
                                </div>
                            </div>
                            <a href="files-lesson-view.html?id=${lessonId}" class="lesson-card-btn">دخول الحصة 🚀</a>
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (error) {
                console.error("خطأ في جلب الحصص:", error);
                container.innerHTML = `<p style="text-align:center; color:var(--danger); grid-column: 1 / -1; padding:40px;">حدث خطأ أثناء تحميل الحصص من السحابة.</p>`;
            }
        }
    </script>
</body>
</html>
