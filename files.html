<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - مكتبة الملازم والحصص</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.12);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            --th-bg: rgba(255, 255, 255, 0.04);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            --th-bg: rgba(0, 0, 0, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; user-select: none; -webkit-user-select: none; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        .header-right-side { display: flex; align-items: center; }
        .btn-home-link {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .header-center-box { display: flex; align-items: center; justify-content: center; }
        .platform-title-box { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: 700; color: var(--text-main); white-space: nowrap; }
        
        .header-left-side { display: flex; align-items: center; gap: 10px; }
        .btn-theme-toggle {
            background-color: rgba(255, 255, 255, 0.04); color: var(--text-main); border: 1px solid var(--border-color);
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
        }
        .btn-theme-toggle:hover { background-color: var(--hover-bg); border-color: var(--primary); }

        .page-header {
            background-color: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow);
            padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
            text-align: center;
        }
        .page-header h1 { color: var(--text-main); font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; }
        .page-header p { color: var(--text-muted); font-size: 0.85rem; }

        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .file-card {
            background: var(--bg-card); border-radius: 16px; padding: 18px; box-shadow: var(--shadow);
            display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--border-color);
            border-top: 3px solid var(--primary); position: relative; overflow: hidden;
        }

        /* تنسيق كارت الحصة المقفولة بسلاسل وعد تنازلي */
        .file-card.locked {
            border-top-color: var(--danger);
            background: rgba(239, 68, 68, 0.03);
        }

        .file-icon { font-size: 2rem; margin-bottom: 10px; }
        .file-title { font-size: 0.95rem; font-weight: bold; color: var(--text-main); margin-bottom: 6px; }
        .file-desc { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.5; }

        .file-meta {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.78rem; color: var(--text-muted); margin-bottom: 12px;
            border-top: 1px solid var(--border-color); padding-top: 8px;
        }

        .view-btn {
            background-color: var(--primary); color: white; text-decoration: none; text-align: center;
            padding: 10px; border-radius: 10px; font-weight: bold; font-size: 0.85rem; display: block;
            border: none; cursor: pointer; width: 100%; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .view-btn:hover { background-color: var(--primary-hover); opacity: 0.9; transform: translateY(-1px); }

        .view-btn.locked-btn {
            background-color: var(--border-color); color: var(--text-muted); cursor: not-allowed; box-shadow: none;
        }

        .countdown-box {
            background: var(--th-bg); border: 1px dashed var(--danger); padding: 8px; border-radius: 8px;
            text-align: center; font-size: 0.78rem; color: var(--danger); font-weight: bold; margin-bottom: 10px;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s; padding: 15px;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-card {
            background: var(--bg-card); width: 100%; max-width: 650px;
            border-radius: 16px; border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6); overflow: hidden;
            display: flex; flex-direction: column; max-height: 85vh; position: relative;
        }
        .modal-header {
            padding: 14px 18px; background: var(--bg-card); color: var(--text-main);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color); font-weight: bold; font-size: 0.95rem;
        }
        .close-modal { background: none; border: none; font-size: 1.2rem; color: var(--text-main); cursor: pointer; }
        .modal-body {
            padding: 18px; overflow-y: auto; flex: 1; text-align: right;
            font-size: 0.85rem; line-height: 1.7; color: var(--text-main); position: relative;
        }
        
        .watermark-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 1.2rem; color: rgba(255, 255, 255, 0.05); pointer-events: none; white-space: nowrap; font-weight: bold; z-index: 10;
        }
    </style>
</head>
<body id="pageBody" data-theme="dark">

    <div class="container">
        <header class="platform-header">
            <div class="header-right-side"><a href="main.html" class="btn-home-link">🏠 الرئيسية</a></div>
            <div class="header-center-box"><div class="platform-title-box"><span>مكتبة الحصص والملازم</span> 📚</div></div>
            <div class="header-left-side"><button class="btn-theme-toggle" id="themeToggleBtn" title="تغيير الوضع">☀️</button></div>
        </header>

        <div class="page-header">
            <h1>مرحباً بك في مكتبة الحصص الدراسية 📖</h1>
            <p>تصفح مذكرات الشرح وحصص الفيديو والملازم بكل أمان.</p>
        </div>

        <div id="filesGrid" class="files-grid">
            <p style="text-align: center; color: var(--text-muted); grid-column: 1 / -1; padding: 30px; font-size: 0.85rem;">جاري مزامنة وجلب الحصص من السحابة...</p>
        </div>

        <div style="text-align: center; margin-top: 25px; font-size: 0.78rem; color: var(--text-muted);">
            جميع الحقوق محفوظة للمهندس/مؤسس المنصة <strong>محمد عماد محمد (عشري)</strong> © 2026 - رحلة دراسية
        </div>
    </div>

    <!-- نافذة المعاينة مع دعم العلامة المائية والحماية -->
    <div class="modal-overlay" id="fileModal" onclick="if(event.target===this) closeFileModal()">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalFileTitle">معاينة الحصة أو الملزمة</h3>
                <button class="close-modal" onclick="closeFileModal()">✕</button>
            </div>
            <div class="modal-body" id="modalFileBody"></div>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) ومزامنة الإعدادات الحقيقية والعد التنازلي -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let globalLessonsData = [];
        let currentUserEmail = "طالب زائر";
        let countdownIntervals = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserEmail = user.email || user.displayName || "طالب معتمد";
                await fetchCloudLessonsAndSettings();
            } else {
                await fetchCloudLessonsAndSettings();
            }
        });

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const bodyElement = document.body;
        const savedTheme = localStorage.getItem('platform_theme') || 'dark';
        bodyElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            let nextTheme = bodyElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            bodyElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('platform_theme', nextTheme);
            themeToggleBtn.textContent = nextTheme === 'dark' ? '☀️' : '🌙';
        });

        async function fetchCloudLessonsAndSettings() {
            try {
                // جلب البيانات من كولكشن 'lessons' (حسب ما تم توحيده في صفحات الأدمن)
                const querySnapshot = await getDocs(collection(db, "lessons"));
                globalLessonsData = [];
                querySnapshot.forEach((docSnap) => {
                    globalLessonsData.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderLessonsList(globalLessonsData);
            } catch (err) {
                console.error("خطأ في جلب الحصص من السحابة:", err);
                document.getElementById('filesGrid').innerHTML = `<p style="text-align:center; color:var(--danger); grid-column:1/-1;">عذراً، حدث خطأ أثناء الاتصال بالسحابة.</p>`;
            }
        }

        function renderLessonsList(items) {
            const grid = document.getElementById('filesGrid');
            
            // وقف أي عداد تنازلي قديم عشان ميحصلش تداخل
            countdownIntervals.forEach(interval => clearInterval(interval));
            countdownIntervals = [];

            let activeItems = items.filter(item => {
                let s = item.settings || {};
                return s.generalActive !== false;
            });

            if (activeItems.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 30px; background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--shadow);">
                        <div style="font-size: 2.5rem; margin-bottom: 8px;">📭</div>
                        <h3 style="color: var(--text-main); margin-bottom: 4px; font-size: 0.95rem;">لا توجد حصص متاحة حالياً</h3>
                        <p style="color: var(--text-muted); font-size: 0.82rem;">ترقبوا.. سيتم نشر أحدث الحصص والملازم قريباً.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = '';
            activeItems.forEach((item) => {
                let s = item.settings || {};
                let title = item.title || 'حصة دراسية';
                let subject = item.subject || 'عام';
                let scheduledAt = item.scheduledAt; // وقت الفتح التلقائي المجدول

                let now = new Date().getTime();
                let isLocked = false;
                let targetTime = 0;

                if (scheduledAt && scheduledAt.trim() !== "") {
                    targetTime = new Date(scheduledAt).getTime();
                    if (now < targetTime) {
                        isLocked = true;
                    }
                }

                let card = document.createElement('div');
                card.className = isLocked ? 'file-card locked' : 'file-card';
                
                let cardHtml = `
                    <div>
                        <div class="file-icon">${isLocked ? '⛓️ 🔒' : '📚'}</div>
                        <div class="file-title">الحصة ${item.number || 1}: ${title}</div>
                        <div class="file-desc">${item.targetGroup || 'الصف الدراسي'} - المادة: ${subject}</div>
                    </div>
                `;

                if (isLocked) {
                    cardHtml += `
                        <div>
                            <div class="countdown-box" id="countdown-${item.id}">جاري حساب العد التنازلي...</div>
                            <button class="view-btn locked-btn">الحصة مقفولة مؤقتاً 🔒</button>
                        </div>
                    `;
                } else {
                    cardHtml += `
                        <div>
                            <div class="file-meta">
                                <span>📂 المادة: ${subject}</span>
                                <span>📖 متاح</span>
                            </div>
                            <button class="view-btn" onclick="openLessonModal('${item.id}')">دخول الحصة والمحتوى 🚀</button>
                        </div>
                    `;
                }

                card.innerHTML = cardHtml;
                grid.appendChild(card);

                // لو الحصة مقفولة، نشغل العداد التنازلي الحي بالثواني
                if (isLocked) {
                    let intervalId = setInterval(() => {
                        let currentTime = new Date().getTime();
                        let distance = targetTime - currentTime;

                        if (distance < 0) {
                            clearInterval(intervalId);
                            // أول ما الوقت يخلص، نعمل إعادة تحميل للقائمة عشان تفتح الحصة تلقائياً
                            renderLessonsList(globalLessonsData);
                            return;
                        }

                        let days = Math.floor(distance / (1000 * 60 * 60 * 24));
                        let hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                        let seconds = Math.floor((distance % (1000 * 60)) / 1000);

                        let timerElement = document.getElementById(`countdown-${item.id}`);
                        if (timerElement) {
                            timerElement.innerHTML = `⏳ تفتح خلال: ${days > 0 ? days + ' يوم ' : ''}${hours}س ${minutes}د ${seconds}ث`;
                        }
                    }, 1000);
                    countdownIntervals.push(intervalId);
                }
            });
        }

        window.openLessonModal = function(itemId) {
            const item = globalLessonsData.find(e => e.id === itemId);
            if (!item) return;

            let s = item.settings || {};

            // تطبيق حماية منع السكرين شوت وأدوات الفحص لو مفعلة
            if (s.antiScreenshot !== false) {
                document.addEventListener("keyup", (e) => {
                    if (e.key == "PrintScreen") {
                        navigator.clipboard.writeText("");
                        alert("⚠️ تنبيه أمني: التصوير (Screenshot) ممنوع داخل هذه الحصة!");
                    }
                });
            }

            let modalBodyHtml = `
                <div style="font-weight: bold; color: var(--primary); margin-bottom: 12px; font-size: 0.95rem;">📌 محتويات الحصة والإعدادات المفعلة:</div>
                <div style="margin-bottom: 15px; font-size: 0.85rem; color: var(--text-muted);">${item.title || 'تفاصيل الحصة'}</div>
            `;

            if (s.showVideo !== false && item.videoUrl) {
                modalBodyHtml += `
                    <div style="margin-bottom: 15px; background: var(--th-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
                        <div style="font-weight: bold; margin-bottom: 8px;">🎬 فيديو الشرح الأساسي:</div>
                        <div style="background: #000; padding: 15px; border-radius: 6px; color: #fff; font-size: 0.8rem; text-align: center; word-break: break-all;">
                            رابط الفيديو أو الملف: <a href="${item.videoUrl}" target="_blank" style="color: #6366f1;">مشاهدة الفيديو 🎥</a>
                        </div>
                    </div>
                `;
            }

            if (s.showNotes !== false && item.studyNotes) {
                modalBodyHtml += `
                    <div style="margin-bottom: 15px; background: var(--th-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
                        <div style="font-weight: bold; margin-bottom: 8px;">📚 ملازم الشرح وملفات الدرس:</div>
                        <a href="${item.studyNotes}" target="_blank" class="view-btn" style="display:inline-block; text-align:center; padding: 6px 12px; font-size: 0.8rem;">فتح ملزمة الشرح 📄</a>
                    </div>
                `;
            }

            if (s.showSummary !== false && item.summaryNotes) {
                modalBodyHtml += `
                    <div style="margin-bottom: 15px; background: var(--th-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
                        <div style="font-weight: bold; margin-bottom: 8px;">📑 ملخص الدرس:</div>
                        <a href="${item.summaryNotes}" target="_blank" class="view-btn" style="display:inline-block; text-align:center; padding: 6px 12px; font-size: 0.8rem; background: var(--success);">فتح التلخيص 📑</a>
                    </div>
                `;
            }

            if (item.examId) {
                modalBodyHtml += `
                    <a href="exam.html?id=${item.examId}" class="view-btn" style="text-align:center; margin-top: 15px; display:block;">بدء امتحان الحصة الآن 📝</a>
                `;
            }

            modalBodyHtml += `<div class="watermark-overlay">${currentUserEmail}</div>`;

            document.getElementById('modalFileTitle').textContent = item.title || 'تفاصيل الحصة';
            document.getElementById('modalFileBody').innerHTML = modalBodyHtml;
            document.getElementById('fileModal').classList.add('active');
        };

        window.closeFileModal = function() {
            document.getElementById('fileModal').classList.remove('active');
        };
    </script>
</body>
</html>
