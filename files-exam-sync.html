<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة ربط الامتحان</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.12);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            --th-bg: rgba(255, 255, 255, 0.04);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            --th-bg: rgba(0, 0, 0, 0.02);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        .btn-home-link {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem; cursor: pointer;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .card {
            background-color: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow);
            padding: 24px; margin-bottom: 20px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
        }

        .card-title { font-size: 1.2rem; font-weight: bold; color: var(--text-main); margin-bottom: 6px; text-align: center; }
        .card-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; text-align: center; }

        .form-group { margin-bottom: 15px; text-align: right; }
        .form-label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 0.88rem; color: var(--text-main); }
        
        .form-select {
            width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border-color);
            background: var(--bg-main); color: var(--text-main); font-size: 0.9rem; outline: none; cursor: pointer;
            appearance: none; -webkit-appearance: none; -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat; background-position: left 12px center; background-size: 16px;
        }
        .form-select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--hover-bg); }

        .btn-submit {
            background-color: var(--success); color: white; border: none; width: 100%;
            padding: 12px; border-radius: 10px; font-weight: bold; font-size: 1rem;
            cursor: pointer; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); margin-top: 10px;
        }
        .btn-submit:hover { opacity: 0.9; }

        .sync-list-container {
            display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; margin-top: 10px;
        }
        .sync-item-row {
            display: flex; justify-content: space-between; align-items: center; background: var(--bg-main);
            padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color); gap: 10px; flex-wrap: wrap;
        }
        .sync-item-info { display: flex; flex-direction: column; gap: 2px; text-align: right; flex: 1; }
        .sync-item-title { font-weight: bold; font-size: 0.88rem; color: var(--text-main); }
        .sync-item-status { font-size: 0.78rem; color: var(--text-muted); }

        .platform-toast-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 2000; padding: 15px;
        }
        .platform-toast-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
            width: 100%; max-width: 380px; border-radius: 16px; padding: 22px; text-align: center; box-shadow: var(--shadow);
        }
        .platform-toast-card h3 { font-size: 1rem; color: var(--text-main); margin-bottom: 8px; font-weight: 700; }
        .platform-toast-card p { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; white-space: pre-line; text-align: right; }
        .platform-toast-btn {
            background: var(--primary); color: white; border: none; padding: 9px 16px; border-radius: 8px;
            font-weight: bold; font-size: 0.85rem; cursor: pointer; width: 100%;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="container">
        <header class="platform-header">
            <a href="files-exam-create.html" class="btn-home-link"><svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0' aria-hidden='true'><path d='M19 12H5M12 19l-7-7 7-7'/></svg> العودة لإنشاء الامتحان</a>
            <div style="font-weight: 700; font-size: 0.95rem;">صفحة ربط الامتحان <svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0' aria-hidden='true'><path d='M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71'/><path d='M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71'/></svg></div>
            <div></div>
        </header>

        <div class="card">
            <h2 class="card-title"><svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0' aria-hidden='true'><path d='M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71'/><path d='M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71'/></svg> ربط امتحان بحصة دراسية</h2>
            <p class="card-subtitle">قم باختيار الحصة المراد تعديلها واختيار الامتحان المناسب لربطه بها.</p>
            
            <form id="syncForm" onsubmit="saveExamSync(event)">
                <div class="form-group">
                    <label class="form-label">اختر الحصة الدراسية:</label>
                    <select id="lessonSelect" class="form-select" required onchange="onLessonSelected()">
                        <option value="">جاري تحميل الحصص...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">اختر الامتحان المرتبط:</label>
                    <select id="examSelect" class="form-select" required>
                        <option value="">جاري تحميل الامتحانات...</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">حفظ ومزامنة الربط <svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0' aria-hidden='true'><path d='M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z'/><path d='M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z'/><path d='M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5'/></svg></button>
            </form>
        </div>

        <div class="card">
            <h2 class="card-title"><svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0' aria-hidden='true'><path d='M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2'/><rect x='8' y='2' width='8' height='4' rx='1'/></svg> جدول الحصص والامتحانات المرتبطة</h2>
            <p class="card-subtitle">متابعة فورية لكل حصة وما هو الامتحان المربوط بها حالياً.</p>
            <div class="sync-list-container" id="syncListContainer">
                <div style="text-align: center; color: var(--text-muted); padding: 15px;">جاري تحميل تفاصيل الربط...</div>
            </div>
        </div>
    </div>

    <div class="platform-toast-overlay" id="platformToastModal">
        <div class="platform-toast-card" onclick="event.stopPropagation()">
            <h3 id="toastTitle">تنبيه المنصة <svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0' aria-hidden='true'><path d='M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9'/><path d='M13.73 21a2 2 0 0 1-3.46 0'/></svg></h3>
            <p id="toastMessage">رسالة التنبيه هنا...</p>
            <button class="platform-toast-btn" id="toastActionBtn" onclick="closePlatformToast()">حسناً فهمت <svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0' aria-hidden='true'><path d='M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3'/></svg></button>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let lessonsMap = {};
        let examsMap = {};

        onAuthStateChanged(auth, async (user) => {
            await loadLessonsAndExams();
        });

        window.showPlatformToast = function(title, message, callback = null) {
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastMessage').textContent = message;
            const btn = document.getElementById('toastActionBtn');
            btn.onclick = function() {
                closePlatformToast();
                if (callback) callback();
            };
            document.getElementById('platformToastModal').style.display = 'flex';
        };

        window.closePlatformToast = function() {
            document.getElementById('platformToastModal').style.display = 'none';
        };

        async function loadLessonsAndExams() {
            try {
                // 1. جلب الامتحانات من كولكشن lessonExams المخصص للحصص
                const examsSnap = await getDocs(collection(db, "lessonExams"));
                examsSnap.forEach((docSnap) => {
                    examsMap[docSnap.id] = docSnap.data();
                });

                const examSelect = document.getElementById('examSelect');
                examSelect.innerHTML = '<option value="">-- اختر الامتحان المرتبط --</option>';
                for (let examId in examsMap) {
                    let ex = examsMap[examId];
                    examSelect.innerHTML += `<option value="${examId}">${ex.title || 'امتحان'} (${ex.subject || 'عام'})</option>`;
                }

                // 2. جلب الحصص وتعبئة القائمة وجدول العرض السفلي
                const lessonsSnap = await getDocs(collection(db, "lessons"));
                const lessonSelect = document.getElementById('lessonSelect');
                lessonSelect.innerHTML = '<option value="">-- اختر الحصة الدراسية --</option>';
                
                let listHtml = "";
                lessonsSnap.forEach((docSnap) => {
                    let data = docSnap.data();
                    lessonsMap[docSnap.id] = data;
                    let lessonTitle = `الحصة ${data.number || ''}: ${data.title || 'بدون عنوان'}`;
                    lessonSelect.innerHTML += `<option value="${docSnap.id}">${lessonTitle}</option>`;

                    let linkedExamTitle = "غير مرتبطة بامتحان";
                    let examBadgeColor = "var(--danger)";
                    if (data.examId && examsMap[data.examId]) {
                        linkedExamTitle = `مرتبطة بامتحان: ${examsMap[data.examId].title || 'بدون عنوان'}`;
                        examBadgeColor = "var(--success)";
                    }

                    listHtml += `
                        <div class="sync-item-row">
                            <div class="sync-item-info">
                                <span class="sync-item-title"><svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><path d="M23 7l-7 5 7 5z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg> ${lessonTitle}</span>
                                <span class="sync-item-status" style="color: ${examBadgeColor};">${linkedExamTitle}</span>
                            </div>
                        </div>
                    `;
                });

                if (!listHtml) {
                    listHtml = `<div style="text-align: center; color: var(--text-muted); padding: 15px;">لا توجد حصص مضافة حتى الآن.</div>`;
                }
                document.getElementById('syncListContainer').innerHTML = listHtml;

            } catch (e) {
                console.error(e);
                showPlatformToast("خطأ", "حدث خطأ أثناء تحميل بيانات الحصص والامتحانات من السحابة.");
            }
        }

        window.onLessonSelected = function() {
            let lessonId = document.getElementById('lessonSelect').value;
            if (!lessonId) return;

            let lessonData = lessonsMap[lessonId];
            if (lessonData && lessonData.examId) {
                document.getElementById('examSelect').value = lessonData.examId;
            } else {
                document.getElementById('examSelect').value = "";
            }
        };

        window.saveExamSync = async function(event) {
            event.preventDefault();
            let lessonId = document.getElementById('lessonSelect').value;
            let examId = document.getElementById('examSelect').value;

            if (!lessonId || !examId) {
                showPlatformToast("تنبيه", "يرجى اختيار الحصة والامتحان أولاً.");
                return;
            }

            try {
                const lessonRef = doc(db, "lessons", lessonId);
                await updateDoc(lessonRef, {
                    examId: examId
                });

                if (lessonsMap[lessonId]) {
                    lessonsMap[lessonId].examId = examId;
                }

                showPlatformToast("نجاح", "تم ربط الامتحان بالحصة بنجاح وتحديث السحابة!", () => {
                    loadLessonsAndExams();
                });
            } catch (e) {
                console.error(e);
                showPlatformToast("خطأ", "حدث خطأ أثناء حفظ الربط في السحابة.");
            }
        };
    </script>
</body>
</html>
