<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - ربط ومزامنة الامتحانات بالحصص</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.12);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            --th-bg: rgba(255, 255, 255, 0.04);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            --th-bg: rgba(0, 0, 0, 0.02);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        .btn-home-link {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem; cursor: pointer;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .card {
            background-color: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow);
            padding: 24px; margin-bottom: 20px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
        }

        .card-title { font-size: 1.2rem; font-weight: bold; color: var(--text-main); margin-bottom: 6px; text-align: center; }
        .card-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; text-align: center; }

        .form-group { margin-bottom: 15px; text-align: right; }
        .form-label { display: block; font-weight: bold; margin-bottom: 6px; font-size: 0.88rem; color: var(--text-main); }
        .form-select, .form-input {
            width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-main); color: var(--text-main); font-size: 0.9rem; outline: none;
        }
        .form-select:focus, .form-input:focus { border-color: var(--primary); }

        .btn-submit {
            background-color: var(--success); color: white; border: none; width: 100%;
            padding: 12px; border-radius: 10px; font-weight: bold; font-size: 1rem;
            cursor: pointer; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); margin-top: 10px;
        }
        .btn-submit:hover { opacity: 0.9; }

        /* نافذة التنبيهات المنبثقة */
        .platform-toast-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 2000; padding: 15px;
        }
        .platform-toast-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
            width: 100%; max-width: 380px; border-radius: 16px; padding: 22px; text-align: center; box-shadow: var(--shadow);
        }
        .platform-toast-card h3 { font-size: 1rem; color: var(--text-main); margin-bottom: 8px; font-weight: 700; }
        .platform-toast-card p { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; white-space: pre-line; text-align: right; }
        .platform-toast-btn {
            background: var(--primary); color: white; border: none; padding: 9px 16px; border-radius: 8px;
            font-weight: bold; font-size: 0.85rem; cursor: pointer; width: 100%;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="container">
        <header class="platform-header">
            <a href="files.html" class="btn-home-link">⬅ العودة للمكتبة</a>
            <div style="font-weight: 700; font-size: 0.95rem;">مزامنة وربط الامتحانات بالحصص ⚙️</div>
            <div></div>
        </header>

        <div class="card">
            <h2 class="card-title">🔗 ربط امتحان بحصة دراسية</h2>
            <p class="card-subtitle">قم باختيار الحصة المراد تعديلها واختيار الامتحان المناسب لربطه بها.</p>
            
            <form id="syncForm" onsubmit="saveExamSync(event)">
                <div class="form-group">
                    <label class="form-label">اختر الحصة الدراسية:</label>
                    <select id="lessonSelect" class="form-select" required onchange="onLessonSelected()">
                        <option value="">جاري تحميل الحصص...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">اختر الامتحان المرتبط:</label>
                    <select id="examSelect" class="form-select" required>
                        <option value="">جاري تحميل الامتحانات...</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">حفظ ومزامنة الربط 🚀</button>
            </form>
        </div>
    </div>

    <!-- نافذة التنبيهات -->
    <div class="platform-toast-overlay" id="platformToastModal">
        <div class="platform-toast-card" onclick="event.stopPropagation()">
            <h3 id="toastTitle">تنبيه المنصة 🔔</h3>
            <p id="toastMessage">رسالة التنبيه هنا...</p>
            <button class="platform-toast-btn" id="toastActionBtn" onclick="closePlatformToast()">حسناً فهمت 👍</button>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let lessonsMap = {};

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                // إذا لم يكن مسجل دخول، يمكنك توجيهه لتسجيل الدخول أو السماح بالتحكم حسب نظام صلاحياتك
            }
            await loadLessonsAndExams();
        });

        window.showPlatformToast = function(title, message, callback = null) {
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastMessage').textContent = message;
            const btn = document.getElementById('toastActionBtn');
            btn.onclick = function() {
                closePlatformToast();
                if (callback) callback();
            };
            document.getElementById('platformToastModal').style.display = 'flex';
        };

        window.closePlatformToast = function() {
            document.getElementById('platformToastModal').style.display = 'none';
        };

        async function loadLessonsAndExams() {
            try {
                // 1. جلب الحصص
                const lessonsSnap = await getDocs(collection(db, "lessons"));
                const lessonSelect = document.getElementById('lessonSelect');
                lessonSelect.innerHTML = '<option value="">-- اختر الحصة الدراسية --</option>';
                
                lessonsSnap.forEach((docSnap) => {
                    let data = docSnap.data();
                    lessonsMap[docSnap.id] = data;
                    let title = `الحصة ${data.number || ''}: ${data.title || 'بدون عنوان'}`;
                    lessonSelect.innerHTML += `<option value="${docSnap.id}">${title}</option>`;
                });

                // 2. جلب الامتحانات المتاحة
                const examsSnap = await getDocs(collection(db, "exams"));
                const examSelect = document.getElementById('examSelect');
                examSelect.innerHTML = '<option value="">-- اختر الامتحان المرتبط --</option>';

                examsSnap.forEach((docSnap) => {
                    let data = docSnap.data();
                    let title = `${data.title || 'امتحان'} (${data.subject || 'عام'})`;
                    examSelect.innerHTML += `<option value="${docSnap.id}">${title}</option>`;
                });

            } catch (e) {
                console.error(e);
                showPlatformToast("خطأ ❌", "حدث خطأ أثناء تحميل بيانات الحصص والامتحانات من السحابة.");
            }
        }

        window.onLessonSelected = function() {
            let lessonId = document.getElementById('lessonSelect').value;
            if (!lessonId) return;

            let lessonData = lessonsMap[lessonId];
            if (lessonData && lessonData.examId) {
                document.getElementById('examSelect').value = lessonData.examId;
            } else {
                document.getElementById('examSelect').value = "";
            }
        };

        window.saveExamSync = async function(event) {
            event.preventDefault();
            let lessonId = document.getElementById('lessonSelect').value;
            let examId = document.getElementById('examSelect').value;

            if (!lessonId || !examId) {
                showPlatformToast("تنبيه ⚠️", "يرجى اختيار الحصة والامتحان أولاً.");
                return;
            }

            try {
                const lessonRef = doc(db, "lessons", lessonId);
                await updateDoc(lessonRef, {
                    examId: examId
                });

                // تحديث الذاكرة المحلية المؤقتة للحصة المحددة
                if (lessonsMap[lessonId]) {
                    lessonsMap[lessonId].examId = examId;
                }

                showPlatformToast("نجاح ✅", "تم ربط الامتحان بالحصة بنجاح وتحديث السحابة!", () => {
                    // اختيار إضافي إذا أردت مسح التحديد أو البقاء
                });
            } catch (e) {
                console.error(e);
                showPlatformToast("خطأ ❌", "حدث خطأ أثناء حفظ الربط في السحابة.");
            }
        };
    </script>
</body>
</html>
