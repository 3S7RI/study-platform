<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - ربط ومزامنة امتحانات الحصص</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            --th-bg: rgba(255, 255, 255, 0.04);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.05);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            --th-bg: rgba(0, 0, 0, 0.02);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.85rem; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 12px; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 10px 16px; border-radius: 20px;
            margin-bottom: 15px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        .header-right-side { display: flex; align-items: center; }
        .btn-home-link {
            display: inline-flex; align-items: center; gap: 5px; background: rgba(255, 255, 255, 0.05);
            padding: 5px 12px; border-radius: 15px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.75rem;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .header-center-box { display: flex; align-items: center; justify-content: center; }
        .platform-title-box { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; font-weight: 700; color: var(--text-main); white-space: nowrap; }
        
        .header-left-side { display: flex; align-items: center; gap: 8px; }
        .btn-theme-toggle {
            background-color: rgba(255, 255, 255, 0.04); color: var(--text-main); border: 1px solid var(--border-color);
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; justify-content: center;
        }
        .btn-theme-toggle:hover { background-color: var(--hover-bg); border-color: var(--primary); }

        .section-box {
            background-color: var(--bg-card); border-radius: 14px; box-shadow: var(--shadow);
            padding: 20px; margin-bottom: 15px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
        }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .section-header h2 { color: var(--text-main); font-size: 1rem; font-weight: 700; }

        .form-group { margin-top: 15px; text-align: right; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 6px; color: var(--text-muted); font-weight: 600; }
        .form-group select {
            width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-main); color: var(--text-main); font-size: 0.85rem; outline: none;
        }

        .btn-save { background: var(--success); color: white; border: none; padding: 12px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; margin-top: 20px; width: 100%; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-save:hover { opacity: 0.9; }

        .exams-management-list { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .exam-manage-card {
            background: var(--th-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px 16px;
            display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
        }
        .exam-info { display: flex; flex-direction: column; gap: 3px; flex: 1; }
        .exam-actions { display: flex; gap: 8px; align-items: center; }

        .btn-select-exam { background: var(--primary); color: white; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; font-size: 0.78rem; cursor: pointer; }
        .btn-select-exam:hover { background: var(--primary-hover); }

        .btn-delete-exam { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid var(--danger); padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 0.78rem; cursor: pointer; }
        .btn-delete-exam:hover { background: var(--danger); color: white; }

        .lessons-sync-list { margin-top: 15px; display: flex; flex-direction: column; gap: 10px; }
        .sync-item-card {
            background: var(--th-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px;
            display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
        }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <header class="platform-header">
            <div class="header-right-side"><a href="files-exam-create.html" class="btn-home-link">⬅ العودة لإنشاء الامتحانات</a></div>
            <div class="header-center-box"><div class="platform-title-box"><span>مزامنة امتحانات الحصص 🔄</span></div></div>
            <div class="header-left-side"><button class="btn-theme-toggle" id="themeToggleBtn" title="تغيير الوضع">☀️</button></div>
        </header>

        <div class="section-box">
            <div class="section-header"><h2>ربط وتحديث امتحانات الحصص السحابية 📝</h2></div>
            
            <div class="form-group" style="margin-top:0;">
                <label>1. اختر الحصة المستهدفة:</label>
                <select id="syncLessonSelect">
                    <option value="">-- جاري تحميل الحصص... --</option>
                </select>
            </div>

            <div class="form-group">
                <label>2. الامتحان المحدد للربط (يمكنك اختياره بـ "اختيار" من قائمة الامتحانات أدناه أو يدوياً):</label>
                <select id="syncExamSelect">
                    <option value="">-- بدون امتحان (إلغاء الربط) --</option>
                </select>
            </div>

            <button class="btn-save" onclick="saveLessonExamSync()">حفظ وتحديث الربط في السحابة 🚀</button>
        </div>

        <!-- قسم إدارة وعرض الامتحانات المتاحة مع زري الاختيار والحذف -->
        <div class="section-box">
            <div class="section-header"><h2>قائمة الامتحانات المتاحة بالسحابة (إدارة وحذف) 📋</h2></div>
            <div id="examsManagementContainer" class="exams-management-list">
                <p style="color: var(--text-muted); text-align: center; padding: 15px;">جاري جلب الامتحانات...</p>
            </div>
        </div>

        <div class="section-box">
            <div class="section-header"><h2>حالة ربط الحصص بالامتحانات الحالية 📊</h2></div>
            <div id="syncedLessonsListContainer" class="lessons-sync-list">
                <p style="color: var(--text-muted); text-align: center; padding: 15px;">جاري جلب الحصص...</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let lessonsData = [];
        let examsData = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await loadCloudData();
            } else {
                window.location.href = 'login.html';
            }
        });

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const bodyElement = document.body;
        const savedTheme = localStorage.getItem('platform_theme') || 'dark';
        bodyElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            let nextTheme = bodyElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            bodyElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('platform_theme', nextTheme);
            themeToggleBtn.textContent = nextTheme === 'dark' ? '☀️' : '🌙';
        });

        async function loadCloudData() {
            try {
                const lessonsSnap = await getDocs(collection(db, "lessons"));
                lessonsData = [];
                lessonsSnap.forEach(d => lessonsData.push({ id: d.id, ...d.data() }));

                const examsSnap = await getDocs(collection(db, "exams"));
                examsData = [];
                examsSnap.forEach(d => examsData.push({ id: d.id, ...d.data() }));

                renderDropdowns();
                renderExamsManagementList();
                renderSyncedList();
            } catch (e) {
                console.error("خطأ في جلب البيانات:", e);
            }
        }

        function renderDropdowns() {
            const lessonSelect = document.getElementById('syncLessonSelect');
            let lHtml = '<option value="">-- اختر الحصة المستهدفة --</option>';
            lessonsData.forEach(l => {
                lHtml += `<option value="${l.id}">🎬 الحصة ${l.number || 1}: ${l.title || 'بدون عنوان'}</option>`;
            });
            lessonSelect.innerHTML = lHtml;

            const examSelect = document.getElementById('syncExamSelect');
            let eHtml = '<option value="">-- بدون امتحان (إلغاء الربط) --</option>';
            examsData.forEach(e => {
                eHtml += `<option value="${e.id}">📝 ${e.title || 'امتحان'} (${e.subject || 'عام'})</option>`;
            });
            examSelect.innerHTML = eHtml;
        }

        function renderExamsManagementList() {
            const container = document.getElementById('examsManagementContainer');
            if (examsData.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 10px;">لا توجد امتحانات مضافة حتى الآن.</p>';
                return;
            }

            let html = '';
            examsData.forEach(e => {
                let qCount = e.questions ? e.questions.length : 0;
                html += `
                    <div class="exam-manage-card">
                        <div class="exam-info">
                            <h4 style="color: var(--text-main); font-size: 0.88rem; font-weight: 700;">📝 ${e.title || 'بدون عنوان'}</h4>
                            <p style="font-size: 0.75rem; color: var(--text-muted);">المادة: ${e.subject || 'عام'} | الفئة: ${e.targetGroup || 'الكل'} | عدد الأسئلة: ${qCount} سؤال</p>
                        </div>
                        <div class="exam-actions">
                            <button class="btn-select-exam" onclick="selectExamForSync('${e.id}')">اختيار للربط 🎯</button>
                            <button class="btn-delete-exam" onclick="deleteExamFromCloud('${e.id}', '${e.title || 'امتحان'}')">حذف 🗑️</button>
                        </div>
                    </div>`;
            });
            container.innerHTML = html;
        }

        window.selectExamForSync = function(examId) {
            document.getElementById('syncExamSelect').value = examId;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            alert('✔ تم تحديد الامتحان في قائمة الربط بالأعلى بنجاح! اختر الحصة واضغط حفظ التحديث.');
        };

        window.deleteExamFromCloud = async function(examId, examTitle) {
            if (!confirm(`هل أنت متأكد من رغبتك في حذف الامتحان (${examTitle}) نهائياً من السحابة؟`)) return;

            try {
                // حذف الامتحان من كولكشن الامتحانات
                await deleteDoc(doc(db, "exams", examId));

                // فحص الحصص المرتبطة بهذا الامتحان وفصلها إن وجدت
                for (let l of lessonsData) {
                    if (l.examId === examId) {
                        const lessonRef = doc(db, "lessons", l.id);
                        await updateDoc(lessonRef, { examId: null });
                    }
                }

                alert('✔ تم حذف الامتحان وتحديث الحصص المرتبطة بنجاح!');
                await loadCloudData();
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء محاولة حذف الامتحان.');
            }
        };

        function renderSyncedList() {
            const container = document.getElementById('syncedLessonsListContainer');
            let html = '';
            lessonsData.forEach(l => {
                let examObj = examsData.find(e => e.id === l.examId);
                let examTitle = examObj ? examObj.title : 'غير مرتبط';

                html += `
                    <div class="sync-item-card">
                        <div>
                            <h4 style="color:var(--text-main); font-size:0.9rem; margin-bottom:2px;">🎬 الحصة ${l.number || 1}: ${l.title}</h4>
                            <p style="font-size:0.78rem; color:var(--text-muted);">الامتحان المرتبط: <span style="color:${examObj ? 'var(--success)' : 'var(--danger)'}; font-weight:bold;">${examTitle}</span></p>
                        </div>
                    </div>`;
            });
            container.innerHTML = html || '<p style="color:var(--text-muted); text-align:center;">لا توجد حصص مضافة.</p>';
        }

        window.saveLessonExamSync = async function() {
            let lessonId = document.getElementById('syncLessonSelect').value;
            let examId = document.getElementById('syncExamSelect').value;

            if (!lessonId) { alert('يرجى اختيار الحصة أولاً!'); return; }

            try {
                const lessonRef = doc(db, "lessons", lessonId);
                await updateDoc(lessonRef, {
                    examId: examId || null
                });
                alert('✔ تم ربط الامتحان بالحصة بنجاح في السحابة وتحديث المزامنة! 🚀');
                await loadCloudData();
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء حفظ التحديث.');
            }
        };
    </script>
</body>
</html>
