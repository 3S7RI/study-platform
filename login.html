<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - رحلة دراسية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72, #2a5298); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; user-select: none; -webkit-user-select: none; }
        
        /* طبقة الحماية السوداء لمنع التصوير والسكرين شوت */
        #securityScreenOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000000; z-index: 999999; display: none;
            justify-content: center; align-items: center; color: #ff4d4d;
            font-size: 1.5rem; font-weight: bold; text-align: center; padding: 20px;
        }

        .login-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 450px; }
        .login-container h2 { text-align: center; color: #1e3c72; margin-bottom: 20px; font-size: 1.6rem; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #333; font-weight: bold; font-size: 0.9rem; }
        .input-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; outline: none; }
        
        .show-pass-container { display: flex; align-items: center; gap: 5px; margin-bottom: 15px; font-size: 0.85rem; color: #555; }

        .btn-submit { display: block; width: 100%; padding: 12px; background-color: #2980b9; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .btn-submit:hover { background-color: #2471a3; }
        .footer-text { text-align: center; margin-top: 15px; color: #666; font-size: 0.85rem; }
        .footer-text a { color: #2980b9; text-decoration: none; font-weight: bold; }

        /* شاشة الـ 404 الوهمية للمحظورين */
        #banned404Screen { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #ffffff; color: #000; text-align: center; font-family: monospace; padding-top: 15vh; z-index: 99999; }
        #banned404Screen h1 { font-size: 5rem; color: #d32f2f; margin-bottom: 10px; }
        #banned404Screen p { font-size: 1.2rem; color: #555; }
    </style>
</head>
<body>

    <!-- شاشة الحماية السوداء لمنع التصوير والسكرين شوت -->
    <div id="securityScreenOverlay">
        ⚠️ تنبيه أمني!<br>منع تصوير الشاشة أو أخذ لقطة مفعل لحماية المنصة.
    </div>

    <!-- شاشة الـ 404 المزيفة للمستخدمين المحظورين -->
    <div id="banned404Screen">
        <h1>404</h1>
        <h2>Not Found</h2>
        <br>
        <p>The requested URL /study was not found on this server.</p>
        <p style="margin-top: 20px; font-size: 0.85rem; color: #888;">Apache/2.4.41 (Ubuntu) Server at 3s7ri.github.io Port 443</p>
    </div>

    <div class="login-container" id="loginCard">
        <h2>تسجيل الدخول لمنصتك</h2>
        <div>
            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="loginEmail" placeholder="example@gmail.com" required>
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="********" required>
            </div>
            
            <div class="show-pass-container">
                <input type="checkbox" id="showPasswordCheck">
                <label for="showPasswordCheck" style="cursor:pointer;">👁️ إظهار كلمة المرور</label>
            </div>

            <button type="button" id="loginBtn" class="btn-submit">دخول إلى المنصة</button>
        </div>
        <div class="footer-text">
            ليس لديك حساب؟ <a href="index.html">إنشاء حساب جديد</a>
        </div>
    </div>

    <script>
        const BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';

        const MASTER_ADMIN_EMAIL = 'mohamad66xm@gmail.com';
        const ADMIN_SECRET_PASS = '@Mohamad66xm01122161407';

        const cloudHeaders = {
            'X-Master-Key': API_KEY,
            'X-Access-Key': API_KEY,
            'Content-Type': 'application/json'
        };

        // --- نظام الحماية السوداء ومنع التصوير والـ ScreenShot والتسجيل ---
        const securityOverlay = document.getElementById('securityScreenOverlay');
        document.addEventListener('keydown', (e) => {
            if (e.key === 'PrintScreen' || (e.ctrlKey && e.key === 'p') || (e.metaKey && e.shiftKey)) {
                e.preventDefault();
                triggerBlackScreen();
            }
        });
        window.addEventListener('blur', () => { triggerBlackScreen(); });
        window.addEventListener('focus', () => { securityOverlay.style.display = 'none'; });
        function triggerBlackScreen() {
            securityOverlay.style.display = 'flex';
            setTimeout(() => { securityOverlay.style.display = 'none'; }, 3000);
        }
        document.addEventListener('contextmenu', e => e.preventDefault());

        document.getElementById('showPasswordCheck').addEventListener('change', function() {
            document.getElementById('loginPassword').type = this.checked ? 'text' : 'password';
        });

        function triggerBanned404() {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('banned404Screen').style.display = 'block';
        }

        document.getElementById('loginBtn').addEventListener('click', async function() {
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const pass = document.getElementById('loginPassword').value.trim();

            if (!email || !pass) {
                alert('من فضلك ادخل البريد الإلكتروني وكلمة المرور!');
                return;
            }

            const btn = document.getElementById('loginBtn');
            btn.textContent = 'جاري التحقق...';
            btn.disabled = true;

            // 1. الدخول الفوري والمباشر للمطور الأساسي
            if (email === MASTER_ADMIN_EMAIL && pass === ADMIN_SECRET_PASS) {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                sessionStorage.setItem('adminRole', 'master');
                sessionStorage.setItem('adminEmail', email);
                alert('أهلاً بك يا باشمهندس محمد (المطور الأساسي) ⚡');
                window.location.href = 'admin.html';
                return;
            }

            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: cloudHeaders
                });
                let result = await response.json();
                let record = result.record || {};
                
                let rawAdmins = record.admins;
                let adminsList = [];
                if (Array.isArray(rawAdmins)) {
                    adminsList = rawAdmins;
                } else if (rawAdmins && typeof rawAdmins === 'object') {
                    adminsList = Object.keys(rawAdmins).map(key => ({ email: key, ...rawAdmins[key] }));
                }
                
                let studentsList = Array.isArray(record.users) ? record.users : [];
                let adminRequests = Array.isArray(record.adminRequests) ? record.adminRequests : [];

                // 2. التحقق من الحظر لدى المشرفين والطلاب
                let foundAdmin = adminsList.find(adm => adm && adm.email && adm.email.toLowerCase() === email);
                let foundStudent = studentsList.find(st => st && st.email && st.email.toLowerCase() === email);

                if ((foundAdmin && foundAdmin.status === 'blocked') || (foundStudent && foundStudent.status === 'blocked')) {
                    triggerBanned404();
                    return;
                }

                // 3. التحقق من المشرفين والمسؤولين الفرعيين
                if (foundAdmin && (foundAdmin.password === pass || pass === ADMIN_SECRET_PASS)) {
                    sessionStorage.setItem('isAdminLoggedIn', 'true');
                    sessionStorage.setItem('adminRole', foundAdmin.role || 'sub');
                    sessionStorage.setItem('adminEmail', email);
                    sessionStorage.setItem('adminBadge', foundAdmin.badge || 'مشرف');
                    
                    alert(`أهلاً بك يا مشرفنا ${foundAdmin.name || 'الأدمن'}!`);
                    window.location.href = 'admin.html';
                    return;
                }

                // 4. طلب الانضمام للأدمن في حال استخدام الباسورد الخاص بالأدمن مع بريد جديد
                if (pass === ADMIN_SECRET_PASS && email !== MASTER_ADMIN_EMAIL) {
                    if (!adminRequests.some(req => req && req.email === email)) {
                        adminRequests.push({
                            email: email,
                            requestedAt: new Date().toLocaleDateString('ar-EG'),
                            status: 'pending'
                        });
                        record.adminRequests = adminRequests;

                        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                            method: 'PUT',
                            headers: cloudHeaders,
                            body: JSON.stringify(record)
                        });
                    }

                    alert('تم إرسال طلب انضمام كـ أدمن إلى المطور الأساسي! سيتم مراجعة طلبك وقبوله قريباً.');
                    btn.textContent = 'دخول إلى المنصة';
                    btn.disabled = false;
                    return;
                }

                // 5. التحقق من حسابات الطلاب
                if (foundStudent && foundStudent.password === pass) {
                    localStorage.setItem('studentUser', JSON.stringify(foundStudent));
                    localStorage.setItem('isLoggedIn', 'true');

                    alert(`أهلاً بك مجدداً يا ${foundStudent.fullName || 'طالبنا العزيز'}!`);
                    window.location.href = 'main.html';
                } else {
                    alert('البريد الإلكتروني أو كلمة المرور غير صحيحة!');
                    btn.textContent = 'دخول إلى المنصة';
                    btn.disabled = false;
                }

            } catch (error) {
                console.error(error);
                alert('حدث خطأ أثناء الاتصال بالسحابة!');
                btn.textContent = 'دخول إلى المنصة';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
