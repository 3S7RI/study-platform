    <script>
        const BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';

        // بيانات المطور الأساسي (أنت وحدك)
        const MASTER_ADMIN_EMAIL = 'mohamad66xm@gmail.com';
        const ADMIN_SECRET_PASS = '@Mohamad66xm01122161407';

        const passwordInput = document.getElementById('loginPassword');
        const showPasswordCheck = document.getElementById('showPasswordCheck');

        showPasswordCheck.addEventListener('change', function() {
            passwordInput.type = this.checked ? 'text' : 'password';
        });

        document.getElementById('loginBtn').addEventListener('click', async function() {
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const pass = document.getElementById('loginPassword').value;

            if (!email || !pass) {
                alert('من فضلك ادخل البريد الإلكتروني وكلمة المرور!');
                return;
            }

            const btn = document.getElementById('loginBtn');
            btn.textContent = 'جاري التحقق...';
            btn.disabled = true;

            // 1. التحقق الدقيق من المطور الأساسي (الإيميل والباسورد معاً)
            if (email === MASTER_ADMIN_EMAIL && pass === ADMIN_SECRET_PASS) {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                sessionStorage.setItem('adminRole', 'master');
                sessionStorage.setItem('adminEmail', email);
                alert('أهلاً بك يا باشمهندس محمد (المطور الأساسي) ⚡');
                window.location.href = 'admin.html';
                return;
            }

            // 2. الاتصال بالسحابة للتحقق من المشرفين الفرعيين أو الطلاب
            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                let data = await response.json();
                
                let adminsList = data.record.admins || [];
                let studentsList = data.record.users || [];

                // فحص المشرفين الفرعيين
                let foundAdmin = adminsList.find(adm => adm.email.toLowerCase() === email && adm.password === pass);

                if (foundAdmin) {
                    if (foundAdmin.status === 'blocked') {
                        alert('عفواً، تم إيقاف حساب الإشراف الخاص بك من قبل المطور الرئيسي!');
                        btn.textContent = 'دخول إلى المنصة';
                        btn.disabled = false;
                        return;
                    }

                    sessionStorage.setItem('isAdminLoggedIn', 'true');
                    sessionStorage.setItem('adminRole', 'sub');
                    sessionStorage.setItem('adminEmail', foundAdmin.email);
                    sessionStorage.setItem('adminBadge', foundAdmin.badge || 'مشرف معتمد');
                    
                    alert(`أهلاً بك يا مشرفنا ${foundAdmin.name}!`);
                    window.location.href = 'admin.html';
                    return;
                }

                // 3. فحص حسابات الطلاب
                let foundStudent = studentsList.find(student => student.email.toLowerCase() === email && student.password === pass);

                if (foundStudent) {
                    localStorage.setItem('studentUser', JSON.stringify(foundStudent));
                    localStorage.setItem('isLoggedIn', 'true');
                    
                    alert(`أهلاً بك مجدداً يا ${foundStudent.fullName}!`);
                    window.location.href = 'main.html';
                } else {
                    alert('البريد الإلكتروني أو كلمة المرور غير صحيحة!');
                    btn.textContent = 'دخول إلى المنصة';
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('خطأ:', error);
                alert('حدث خطأ أثناء الاتصال بالسحابة!');
                btn.textContent = 'دخول إلى المنصة';
                btn.disabled = false;
            }
        });
    </script>
