<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - تسجيل الدخول</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72, #2a5298); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 450px; }
        .login-container h2 { text-align: center; color: #1e3c72; margin-bottom: 20px; font-size: 1.6rem; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #333; font-weight: bold; font-size: 0.9rem; }
        .input-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.3s; }
        .input-group input:focus { border-color: #2a5298; }
        .btn-submit { display: block; width: 100%; padding: 12px; background-color: #2980b9; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; text-align: center; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-submit:hover { background-color: #2471a3; }
        .footer-text { text-align: center; margin-top: 15px; color: #666; font-size: 0.85rem; }
        .footer-text a { color: #2980b9; text-decoration: none; font-weight: bold; }
        .footer-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>تسجيل الدخول لمنصتك</h2>
        <div>
            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="loginEmail" placeholder="example@gmail.com" required>
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="********" required>
            </div>
            <button type="button" id="loginBtn" class="btn-submit">دخول إلى المنصة</button>
        </div>
        <div class="footer-text">
            ليس لديك حساب؟ <a href="index.html">إنشاء حساب جديد</a>
        </div>
    </div>

    <script>
        document.getElementById('loginBtn').addEventListener('click', function() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;

            if (!email || !pass) {
                alert('من فضلك ادخل البريد الإلكتروني وكلمة المرور!');
                return;
            }

            // جلب البيانات المخزنة محلياً للتأكد من صحة الدخول
            const savedUser = JSON.parse(localStorage.getItem('studentUser'));

            if (savedUser && savedUser.email === email && savedUser.password === pass) {
                localStorage.setItem('isLoggedIn', 'true');
                alert('أهلاً بك مجدداً يا بطل! تم تسجيل الدخول بنجاح.');
                window.location.href = 'main.html';
            } else {
                // لو المتصفح اتغير بس الحساب مسجل في الشيت (اختياري للتحقق السريع)
                // هنا بنتحقق من الـ localStorage كمرحلة أولى أساسية
                alert('البريد الإلكتروني أو كلمة المرور غير صحيحة، تأكد منها أو أنشئ حساباً جديداً.');
            }
        });
    </script>
</body>
</html>
