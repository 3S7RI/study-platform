<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - تسجيل الدخول</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72, #2a5298); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 450px; }
        .login-container h2 { text-align: center; color: #1e3c72; margin-bottom: 20px; font-size: 1.6rem; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #333; font-weight: bold; font-size: 0.9rem; }
        .input-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.3s; }
        .input-group input:focus { border-color: #2a5298; }
        
        .show-pass-container { display: flex; align-items: center; gap: 5px; margin-top: 5px; margin-bottom: 15px; font-size: 0.85rem; color: #555; cursor: pointer; }
        .show-pass-container input { width: auto; cursor: pointer; }

        .btn-submit { display: block; width: 100%; padding: 12px; background-color: #2980b9; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; text-align: center; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-submit:hover { background-color: #2471a3; }
        .footer-text { text-align: center; margin-top: 15px; color: #666; font-size: 0.85rem; }
        .footer-text a { color: #2980b9; text-decoration: none; font-weight: bold; }
        .footer-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>تسجيل الدخول لمنصتك</h2>
        <div>
            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="loginEmail" placeholder="example@gmail.com" required>
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="********" required>
            </div>
            
            <div class="show-pass-container">
                <input type="checkbox" id="showPasswordCheck">
                <label for="showPasswordCheck" style="display:inline; cursor:pointer; font-weight:normal;">👁️ إظهار كلمة المرور</label>
            </div>

            <button type="button" id="loginBtn" class="btn-submit">دخول إلى المنصة</button>
        </div>
        <div class="footer-text">
            ليس لديك حساب؟ <a href="index.html">إنشاء حساب جديد</a>
        </div>
    </div>

    <script>
        const BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';

        // بيانات المطور الأساسي (أنت)
        const MASTER_ADMIN_EMAIL = 'mohamad66xm@gmail.com';
        const ADMIN_SECRET_PASS = '@Mohamad66xm01122161407';

        const passwordInput = document.getElementById('loginPassword');
        const showPasswordCheck = document.getElementById('showPasswordCheck');

        showPasswordCheck.addEventListener('change', function() {
            passwordInput.type = this.checked ? 'text' : 'password';
        });

        document.getElementById('loginBtn').addEventListener('click', async function() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;

            if (!email || !pass) {
                alert('من فضلك ادخل البريد الإلكتروني وكلمة المرور!');
                return;
            }

            const btn = document.getElementById('loginBtn');
            btn.textContent = 'جاري التحقق...';
            btn.disabled = true;

            // 1. التحقق من المطور الرئيسي (أنت)
            if (pass === ADMIN_SECRET_PASS) {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                sessionStorage.setItem('adminRole', 'master'); // دور المطور الأساسي
                sessionStorage.setItem('adminEmail', email);
                alert('أهلاً بك يا باشمهندس محمد (المطور الأساسي) ⚡');
                window.location.href = 'admin.html';
                return;
            }

            // 2. الاتصال بالسحابة للتحقق من المشرفين الفرعيين (Sub-Admins) أو الطلاب
            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                let data = await response.json();
                
                let adminsList = data.record.admins || [];
                let studentsList = data.record.users || [];

                // فحص هل الباسورد والإيميل يخصوا مشرف فرعي؟
                let foundAdmin = adminsList.find(adm => adm.email === email && adm.password === pass);

                if (foundAdmin) {
                    if (foundAdmin.status === 'blocked') {
                        alert('عفواً، تم إيقاف حساب الإشراف الخاص بك من قبل المطور الرئيسي!');
                        btn.textContent = 'دخول إلى المنصة';
                        btn.disabled = false;
                        return;
                    }

                    sessionStorage.setItem('isAdminLoggedIn', 'true');
                    sessionStorage.setItem('adminRole', 'sub'); // مشرف فرعي
                    sessionStorage.setItem('adminEmail', foundAdmin.email);
                    sessionStorage.setItem('adminBadge', foundAdmin.badge || 'مشرف معتمد');
                    
                    alert(`أهلاً بك يا مشرفنا ${foundAdmin.name}! تم تسجيل الدخول لوحة التحكم.`);
                    window.location.href = 'admin.html';
                    return;
                }

                // 3. التحقق من حسابات الطلاب العادية
                let foundStudent = studentsList.find(student => student.email === email && student.password === pass);

                if (foundStudent) {
                    localStorage.setItem('studentUser', JSON.stringify(foundStudent));
                    localStorage.setItem('isLoggedIn', 'true');
                    
                    alert(`أهلاً بك مجدداً يا ${foundStudent.fullName}!`);
                    window.location.href = 'main.html';
                } else {
                    alert('البريد الإلكتروني أو كلمة المرور غير صحيحة!');
                    btn.textContent = 'دخول إلى المنصة';
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('خطأ:', error);
                alert('حدث خطأ أثناء الاتصال بالسحابة!');
                btn.textContent = 'دخول إلى المنصة';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
