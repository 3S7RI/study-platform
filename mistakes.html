<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أخطائي | رحلة دراسية</title>
    <script src="plans.js"></script>
    <script src="session.js"></script>
    <script src="levels.js"></script>
    <script>PS.guard({vip:true});</script>
    <style>
        :root {
            --bg-main: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8;
            --border-color: #334155; --primary: #6366f1; --success: #10b981; --danger: #ef4444; --gold: #fbbf24;
            --th-bg: rgba(255,255,255,0.04); --shadow: 0 8px 20px rgba(0,0,0,0.18);
        }
        [data-theme="light"] {
            --bg-main: #f1f5f9; --bg-card: #ffffff; --text-main: #1e293b; --text-muted: #64748b;
            --border-color: #e2e8f0; --primary: #4f46e5; --success: #059669; --danger: #dc2626; --gold: #d97706; --th-bg: rgba(0,0,0,0.03); --shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 12px; font-size: 0.9rem; }
        .wrap { max-width: 760px; margin: 0 auto; }
        .top { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 8px 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
        .top a { text-decoration: none; color: var(--text-main); background: var(--th-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 6px 14px; font-weight: 700; font-size: 0.8rem; }
        .top b { color: var(--danger); font-size: 0.95rem; }
        .hero { background: var(--bg-card); border: 1px solid var(--border-color); border-top: 4px solid var(--danger); border-radius: 20px; padding: 18px 16px; text-align: center; box-shadow: var(--shadow); margin-bottom: 14px; }
        .hero h1 { font-size: 1.3rem; font-weight: 900; }
        .hero p { color: var(--text-muted); font-size: 0.8rem; margin-top: 4px; line-height: 1.7; }
        .sum { display: flex; justify-content: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .sum div { background: var(--th-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 8px 18px; }
        .sum b { display: block; font-size: 1.25rem; font-weight: 900; color: var(--danger); }
        .sum small { color: var(--text-muted); font-size: 0.7rem; font-weight: 700; }
        .tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .tab { border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); border-radius: 20px; padding: 6px 16px; font-weight: 800; font-size: 0.78rem; cursor: pointer; }
        .tab.on { background: var(--primary); border-color: var(--primary); color: #fff; }
        .grp { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 18px; padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow); }
        .grp-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .grp-h h2 { font-size: 1rem; font-weight: 800; }
        .chip { background: rgba(239,68,68,.12); color: var(--danger); border-radius: 20px; padding: 3px 12px; font-size: 0.72rem; font-weight: 800; }
        .chip.g { background: var(--th-bg); color: var(--text-muted); font-weight: 700; }
        .q { border: 1px solid var(--border-color); border-radius: 14px; padding: 12px; margin-bottom: 10px; background: var(--th-bg); }
        .q-t { font-weight: 800; line-height: 1.8; margin-bottom: 8px; white-space: pre-wrap; }
        .q img { max-width: 100%; max-height: 220px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 8px; display: block; }
        .ans { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; margin-top: 6px; font-size: 0.84rem; line-height: 1.7; }
        .ans small { font-weight: 800; white-space: nowrap; }
        .ans.bad { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.5); color: var(--danger); }
        .ans.good { background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.5); color: var(--success); }
        .ans span { color: var(--text-main); font-weight: 700; }
        .empty { text-align: center; padding: 30px 10px; color: var(--text-muted); font-size: 0.86rem; line-height: 2; }
        .note { background: rgba(251,191,36,.1); border: 1px solid rgba(251,191,36,.4); color: var(--gold); border-radius: 12px; padding: 10px 12px; font-size: 0.76rem; line-height: 1.8; margin-bottom: 12px; }
    </style>
    <link rel="stylesheet" href="mobile.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="pwa.js" defer></script>
</head>
<body>
<div class="wrap">
    <div class="top"><a href="main.html">&rarr; الرئيسية</a><b>أخطائي</b></div>
    <section class="hero">
        <h1>أخطائي</h1>
        <p>كل سؤال جاوبته غلط في امتحانات الحصص والامتحانات الشاملة، مع إجابتك والإجابة الصح عشان تراجعها.</p>
        <div class="sum" id="sum"></div>
    </section>
    <div class="tabs" id="tabs"></div>
    <div id="content"><div class="empty">جاري التحميل...</div></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const app = initializeApp({
        apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
        authDomain: "study-trip-1.firebaseapp.com",
        projectId: "study-trip-1",
        storageBucket: "study-trip-1.firebasestorage.app",
        messagingSenderId: "632096690853",
        appId: "1:632096690853:web:f9622d14de73a761dcf34c"
    });
    const db = getFirestore(app);
    document.body.setAttribute('data-theme', localStorage.getItem('platform_theme') || 'dark');

    const $ = (id) => document.getElementById(id);
    const esc = PS.esc;
    const nf = (n) => Number(n || 0).toLocaleString('ar-EG');
    const sid = String(PS.studentId() || '');
    const email = String(PS.email() || '').toLowerCase().trim();

    let groups = [];      // [{kind:'lesson'|'exam', title, sub, score, max, items:[{text,img,marks,mine,right}], legacy}]
    let tab = 'all';
    let legacyCount = 0;

    async function load() {
        try {
            const [resSnap, lessonsSnap, examsSnap] = await Promise.all([
                getDocs(query(collection(db, 'studentExamResults'), where('userId', '==', sid))),
                getDocs(collection(db, 'lessons')),
                getDocs(collection(db, 'exams'))
            ]);
            const lessons = {}; lessonsSnap.forEach(d => { lessons[d.id] = d.data(); });

            resSnap.forEach(d => {
                const r = d.data();
                const l = lessons[r.lessonId] || {};
                const title = (l.number ? 'الحصة ' + l.number + (l.title ? ': ' + l.title : '') : (r.examTitle || 'امتحان حصة'));
                if (!Array.isArray(r.mistakes)) { legacyCount++; return; }
                if (!r.mistakes.length) return;
                groups.push({
                    kind: 'lesson', title, sub: 'امتحان حصة', score: r.score, max: r.maxScore, at: Date.parse(r.mistakesAt || r.submittedAt) || 0,
                    items: r.mistakes.map(m => ({
                        text: m.text, img: m.imageUrl, marks: m.marks,
                        mine: (m.selected >= 0 && m.options) ? m.options[m.selected] : null,
                        right: m.options ? m.options[m.correct] : ''
                    }))
                });
            });

            examsSnap.forEach(d => {
                const ex = d.data();
                const sub = (ex.examSubmissions || []).find(s => String(s.studentEmail || '').toLowerCase().trim() === email && s.isInitialOpen !== true && s.answers && Object.keys(s.answers).length);
                if (!sub) return;
                const items = [];
                (ex.questions || []).forEach((q, idx) => {
                    const t = q.type || 'mcq';
                    if (t !== 'mcq' && t !== 'tf') return;
                    const opts = q.options || (t === 'tf' ? ['صح', 'خطأ'] : []);
                    const right = opts[q.correct];
                    if (right === undefined) return;
                    const given = sub.answers[idx];
                    if (String(given) === String(right)) return;
                    items.push({ text: q.text, img: q.imageUrl, marks: parseInt(q.marks) || 1, mine: (given === undefined || given === 'لم يُجب') ? null : given, right });
                });
                if (items.length) groups.push({ kind: 'exam', title: ex.title || 'امتحان شامل', sub: 'امتحان شامل', score: sub.score, max: sub.totalMarks, at: 0, items });
            });

            groups.sort((a, b) => b.at - a.at);
            render();
        } catch (e) {
            console.warn(e);
            $('content').innerHTML = '<div class="empty">تعذر تحميل أخطائك دلوقتي، جرّب بعد شوية.</div>';
        }
    }

    function render() {
        const total = groups.reduce((n, g) => n + g.items.length, 0);
        $('sum').innerHTML = '<div><b>' + nf(total) + '</b><small>سؤال غلط</small></div><div><b>' + nf(groups.length) + '</b><small>امتحان فيه أخطاء</small></div>';
        const tabs = [['all', 'الكل'], ['lesson', 'امتحانات الحصص'], ['exam', 'الامتحانات الشاملة']];
        $('tabs').innerHTML = tabs.map(t => '<button class="tab' + (tab === t[0] ? ' on' : '') + '" data-t="' + t[0] + '">' + t[1] + '</button>').join('');
        const list = groups.filter(g => tab === 'all' || g.kind === tab);
        let html = '';
        if (legacyCount && tab !== 'exam') html += '<div class="note">فيه ' + nf(legacyCount) + ' امتحان حصة اتحل قبل تفعيل الصفحة دي، تفاصيل أخطائه مش محفوظة. لو أعدت حله هتظهر أخطاؤه هنا.</div>';
        if (!list.length) {
            html += '<div class="empty">' + (total || legacyCount ? 'مفيش أخطاء في القسم ده.' : 'مفيش أخطاء لحد دلوقتي، ممتاز! 🎉<br>أي سؤال هتغلط فيه هيظهر هنا.') + '</div>';
        } else {
            html += list.map(g => '<div class="grp"><div class="grp-h"><h2>' + esc(g.title) + '</h2><span><span class="chip g">' + esc(g.sub) + (g.max ? ' · ' + nf(g.score) + '/' + nf(g.max) : '') + '</span> <span class="chip">' + nf(g.items.length) + ' غلط</span></span></div>' +
                g.items.map((it, i) => {
                    const img = PS.safeUrl(it.img);
                    return '<div class="q"><div class="q-t">' + (i + 1) + '. ' + esc(it.text) + '</div>' + (img ? '<img src="' + img + '" alt="صورة السؤال">' : '') +
                        '<div class="ans bad"><small>إجابتك:</small><span>' + (it.mine === null ? 'مجاوبتش على السؤال ده' : esc(it.mine)) + '</span></div>' +
                        '<div class="ans good"><small>الإجابة الصح:</small><span>' + esc(it.right) + '</span></div></div>';
                }).join('') + '</div>').join('');
        }
        $('content').innerHTML = html;
    }

    $('tabs').addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (!b) return; tab = b.dataset.t; render(); });
    load();
</script>
</body>
</html>
