<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التحكم والطوارئ</title>
<script src="session.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#f8fafc;--mut:#94a3b8;--bd:#334155;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--cy:#22d3ee;--th:rgba(255,255,255,.04)}
[data-theme=light]{--bg:#f1f5f9;--card:#fff;--tx:#1e293b;--mut:#64748b;--bd:#e2e8f0;--th:rgba(0,0,0,.03)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif;font-size:.86rem}
body{background:var(--bg);color:var(--tx);padding:12px;min-height:100vh}
.wrap{max-width:900px;margin:0 auto}
.hd{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:9px 16px;border-radius:14px;margin-bottom:14px;border:1px solid var(--bd)}
.hd a{text-decoration:none;color:var(--tx);background:var(--th);padding:6px 12px;border-radius:10px;border:1px solid var(--bd);font-weight:700}
.hd b{color:var(--cy)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.card h3{color:var(--cy);margin-bottom:10px;font-size:.95rem}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:.78rem}
input[type=text],textarea{width:100%;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--th);color:var(--tx)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--bd);border-radius:12px;background:var(--th)}
.btn{border:none;border-radius:10px;padding:8px 16px;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(135deg,#22d3ee,#0891b2)}
.btn.red{background:linear-gradient(135deg,#ef4444,#b91c1c)}
.btn.sm{padding:4px 10px;font-size:.74rem}
.sw{position:relative;width:48px;height:26px;flex-shrink:0}.sw input{opacity:0;width:0;height:0}
.sl{position:absolute;inset:0;background:#475569;border-radius:26px;cursor:pointer;transition:.2s}
.sl:before{content:'';position:absolute;width:20px;height:20px;right:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+.sl{background:var(--bad)}.sw input:checked+.sl:before{transform:translateX(-22px)}
.item{padding:9px 11px;border:1px solid var(--bd);border-radius:10px;margin-bottom:7px;line-height:1.7;background:var(--th)}
.item small{color:var(--mut);display:block;font-size:.72rem}
.item.done{opacity:.55}
.empty{text-align:center;padding:14px;color:var(--mut)}
#msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:9px 18px;border-radius:12px;border:1px solid var(--bd);display:none;z-index:99}
</style>
</head>
<body data-theme="dark">
<div class="wrap">
<div class="hd"><a href="admin.html">&larr; لوحة الأدمن</a><b>التحكم والطوارئ</b><span></span></div>

<div class="card"><h3>وضع الصيانة</h3>
<div class="row"><div><b>قفل المنصة على الطلاب</b><small style="display:block;color:var(--mut);margin-top:2px">الطلاب هيشوفوا شاشة صيانة. الأدمن بيدخل عادي.</small></div>
<label class="sw" style="margin:0"><input type="checkbox" id="maint"><span class="sl"></span></label></div>
<label>رسالة الصيانة (اختياري)</label><input type="text" id="maintMsg" maxlength="200" placeholder="بنعمل تحديثات سريعة وهنرجع الساعة ...">
<div style="margin-top:12px"><button class="btn red" onclick="saveMaint()">حفظ وضع الصيانة</button></div></div>

<div class="card"><h3>إعلان في الصفحة الرئيسية</h3>
<label>نص الإعلان (سيبه فاضي لإخفائه)</label><textarea id="ann" rows="2" maxlength="250" placeholder="مثال: امتحان الحصة الجاية يوم الخميس"></textarea>
<div style="margin-top:12px"><button class="btn" onclick="saveAnn()">نشر الإعلان</button></div>
<p style="color:var(--mut);font-size:.72rem;margin-top:8px">التغييرات بتوصل للطلاب خلال 5 دقايق.</p></div>

<div class="card"><h3>بلاغات الطلاب</h3><div id="reports"><div class="empty">جاري التحميل...</div></div></div>
<div class="card"><h3>سجل عمليات الأدمن</h3><div id="logs"><div class="empty">جاري التحميل...</div></div></div>
</div>
<div id="msg"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { logAdminAction } from "./admin-service.js";
const app=initializeApp({apiKey:"AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",authDomain:"study-trip-1.firebaseapp.com",projectId:"study-trip-1",storageBucket:"study-trip-1.firebasestorage.app",messagingSenderId:"632096690853",appId:"1:632096690853:web:f9622d14de73a761dcf34c"});
const auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.body.setAttribute('data-theme',localStorage.getItem('platform_theme')||'dark');
const fmt=t=>{try{return new Date(t).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'});}catch(e){return t||'';}};
let who='admin';
function toast(m){const e=$('msg');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2500);}

async function loadCfg(){
  try{const d=await getDoc(doc(db,'config','site'));const c=d.exists()?d.data():{};
    $('maint').checked=c.maintenance===true;$('maintMsg').value=c.maintenanceMsg||'';$('ann').value=c.announcement||'';
  }catch(e){toast('تعذر قراءة الإعدادات (راجع قواعد Firestore)');}
}
window.saveMaint=async function(){
  const on=$('maint').checked;
  if(on&&!confirm('هتقفل المنصة على كل الطلاب. متأكد؟'))return;
  try{await setDoc(doc(db,'config','site'),{maintenance:on,maintenanceMsg:$('maintMsg').value.trim().slice(0,200),updatedAt:new Date().toISOString()},{merge:true});
    logAdminAction(db,who,on?'maintenance_on':'maintenance_off','config/site','');toast(on?'المنصة مقفولة دلوقتي':'المنصة شغّالة');
  }catch(e){toast('فشل الحفظ');}
};
window.saveAnn=async function(){
  const t=$('ann').value.trim().slice(0,250);
  try{await setDoc(doc(db,'config','site'),{announcement:t,announcementId:String(Date.now()),updatedAt:new Date().toISOString()},{merge:true});
    logAdminAction(db,who,'announcement',t?'نشر':'إخفاء',t.slice(0,100));toast(t?'تم نشر الإعلان':'تم إخفاء الإعلان');
  }catch(e){toast('فشل الحفظ');}
};
async function loadReports(){
  try{const s=await getDocs(query(collection(db,'problemReports'),orderBy('t','desc'),limit(30)));
    if(s.empty){$('reports').innerHTML='<div class="empty">مفيش بلاغات</div>';return;}
    $('reports').innerHTML=s.docs.map(d=>{const x=d.data();return `<div class="item ${x.status==='done'?'done':''}"><b>${esc(x.text)}</b><small>${esc(x.name||'')} • ${esc(x.studentId||'')} • ${esc(x.page||'')} • ${fmt(x.t)}</small>${x.status==='done'?'':`<button class="btn sm" onclick="doneReport('${d.id}')">تم الحل</button>`}</div>`;}).join('');
  }catch(e){$('reports').innerHTML='<div class="empty">تعذر تحميل البلاغات (راجع القواعد)</div>';}
}
window.doneReport=async function(id){try{await updateDoc(doc(db,'problemReports',id),{status:'done'});loadReports();}catch(e){toast('فشل التحديث');}};
async function loadLogs(){
  try{const s=await getDocs(query(collection(db,'adminLogs'),orderBy('t','desc'),limit(30)));
    if(s.empty){$('logs').innerHTML='<div class="empty">مفيش عمليات لسه</div>';return;}
    $('logs').innerHTML=s.docs.map(d=>{const x=d.data();return `<div class="item"><b>${esc(x.action)}</b> — ${esc(x.target)}<small>${esc(x.actor)} • ${fmt(x.t)} ${x.details?'• '+esc(x.details):''}</small></div>`;}).join('');
  }catch(e){$('logs').innerHTML='<div class="empty">تعذر تحميل السجل (راجع القواعد)</div>';}
}
if(!PS.isAdminSession()){location.replace('admin-index.html');}
onAuthStateChanged(auth,u=>{if(!u){location.href='login.html';return;}who=u.email||'admin';loadCfg();loadReports();loadLogs();});
</script>
</body>
</html>
