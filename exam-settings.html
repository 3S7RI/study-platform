<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - إعدادات الامتحانات</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.12);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            --th-bg: rgba(255, 255, 255, 0.04);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            --th-bg: rgba(0, 0, 0, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        .header-right-side { display: flex; align-items: center; }
        .btn-home-link {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .header-center-box { display: flex; align-items: center; justify-content: center; }
        .platform-title-box { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: 700; color: var(--text-main); white-space: nowrap; }
        
        .header-left-side { display: flex; align-items: center; gap: 10px; }
        .btn-theme-toggle {
            background-color: rgba(255, 255, 255, 0.04); color: var(--text-main); border: 1px solid var(--border-color);
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
        }
        .btn-theme-toggle:hover { background-color: var(--hover-bg); border-color: var(--primary); }

        .admin-nav-bar {
            display: flex; justify-content: center; align-items: center;
            background-color: var(--bg-card); padding: 12px 16px; border-radius: 16px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); gap: 10px; flex-wrap: wrap;
        }
        .admin-tabs-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .btn-tab {
            background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--border-color);
            padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; flex: 1; min-width: 120px; text-align: center; text-decoration: none; display: inline-block;
        }
        .btn-tab.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        .section-box {
            background-color: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow);
            padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
            position: relative; overflow: visible !important;
        }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .section-header h2 { color: var(--text-main); font-size: 1.05rem; font-weight: 700; }

        .custom-select-wrapper { position: relative; width: 100%; z-index: 9999; }
        .custom-select-display {
            background: linear-gradient(135deg, var(--bg-main), var(--th-bg)); 
            border: 2px solid var(--border-color); color: var(--text-main);
            padding: 14px 18px; border-radius: 14px; font-size: 0.92rem; font-weight: 700; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow);
            transition: all 0.25s ease;
        }
        .custom-select-display:hover { border-color: var(--primary); background: var(--hover-bg); transform: translateY(-1px); }
        
        .custom-options-container {
            position: absolute; top: calc(100% + 8px); left: 0; width: 100%; background: var(--bg-card);
            border: 2px solid var(--primary); border-radius: 14px; box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            z-index: 10000; display: none; max-height: 320px; overflow-y: auto; padding: 10px;
        }
        .custom-options-container.open { display: block; animation: fadeInDropdown 0.2s ease; }
        
        @keyframes fadeInDropdown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .custom-option {
            padding: 12px 16px; border-radius: 12px; cursor: pointer; font-size: 0.88rem; color: var(--text-main);
            display: flex; align-items: center; gap: 12px; margin-bottom: 8px; 
            border: 1px solid var(--border-color); background: var(--th-bg);
            transition: all 0.2s ease;
        }
        .custom-option:last-child { margin-bottom: 0; }
        .custom-option:hover { background: var(--hover-bg); color: var(--primary); border-color: var(--primary); transform: translateX(-3px); }

        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .setting-card { background: var(--th-bg); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .setting-card label { font-size: 0.8rem; font-weight: 500; cursor: pointer; color: var(--text-main); }
        
        .switch { position: relative; display: inline-block; width: 38px; height: 20px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; border-radius: 50%; transition: 0.2s; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(18px); }

        .form-group { margin-top: 12px; text-align: right; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: var(--text-muted); font-weight: 600; }
        
        .form-group input, .form-group textarea {
            width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-main); color: var(--text-main); font-size: 0.82rem; outline: none;
        }

        .custom-file-upload-box {
            display: flex; align-items: center; justify-content: space-between;
            background: var(--bg-main); border: 2px dashed var(--success); border-radius: 12px;
            padding: 12px 16px; cursor: pointer; transition: all 0.2s ease; margin-top: 8px; gap: 10px;
        }
        .custom-file-upload-box:hover { background: var(--hover-bg); border-color: var(--primary); }
        .file-upload-text { font-size: 0.82rem; color: var(--text-muted); font-weight: 600; display: flex; align-items: center; gap: 8px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .form-row-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        @media (max-width: 768px) { .form-row-grid-3 { grid-template-columns: 1fr; } }

        .btn-save { background: var(--success); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.82rem; margin-top: 15px; width: 100%; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-save:hover { opacity: 0.9; transform: translateY(-1px); }
        .hidden { display: none !important; }
    </style>
</head>

        function loadExamsFromCacheInstant() {
            let cached = sessionStorage.getItem('cachedExamsListForSettings');
            if (cached) {
                try {
                    globalExamsList = JSON.parse(cached);
                    renderCustomDropdown(globalExamsList);
                } catch(e) {}
            }
        }
        loadExamsFromCacheInstant();

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await fetchExamsDropdownFast();
            } else {
                window.location.href = 'login.html';
            }
        });

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const bodyElement = document.body;
        const savedTheme = localStorage.getItem('platform_theme') || 'dark';
        bodyElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            let nextTheme = bodyElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            bodyElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('platform_theme', nextTheme);
            themeToggleBtn.textContent = nextTheme === 'dark' ? '☀️' : '🌙';
        });

        async function fetchExamsDropdownFast() {
            try {
                const querySnapshot = await getDocs(collection(db, "exams"));
                globalExamsList = [];
                querySnapshot.forEach((docSnap) => {
                    globalExamsList.push({ id: docSnap.id, ...docSnap.data() });
                });
                
                sessionStorage.setItem('cachedExamsListForSettings', JSON.stringify(globalExamsList));
                renderCustomDropdown(globalExamsList);
            } catch (err) {
                console.error("خطأ في جلب الامتحانات:", err);
            }
        }

        function renderCustomDropdown(exams) {
            const container = document.getElementById('customOptionsContainer');
            if (exams.length === 0) {
                container.innerHTML = `<div class="custom-option" style="justify-content:center;">لا توجد امتحانات متاحة حالياً</div>`;
                return;
            }

            let html = "";
            exams.forEach((exam) => {
                let examTitle = exam.title || 'امتحان بدون عنوان';
                let subject = exam.subject || 'عام';
                html += `<div class="custom-option" onclick="selectExamOption('${exam.id}', '📝 ${examTitle} (${subject})')">
                    <span style="font-size:1.2rem;">📝</span>
                    <div style="display:flex; flex-direction:column; gap:2px; flex:1;">
                        <span style="font-weight:700; color:var(--text-main);">${examTitle}</span>
                        <span style="font-size:0.75rem; color:var(--text-muted);">المادة: ${subject}</span>
                    </div>
                    <span style="font-size:0.8rem; background:var(--primary); color:white; padding:4px 10px; border-radius:6px; font-weight: bold;">تعديل ⚙️</span>
                </div>`;
            });
            container.innerHTML = html;
        }

        window.toggleCustomSelectDropdown = function() {
            const container = document.getElementById('customOptionsContainer');
            container.classList.toggle('open');
        };

        window.selectExamOption = function(examId, displayText) {
            document.getElementById('selectedExamIdHidden').value = examId;
            document.getElementById('selectedExamTitleDisplay').textContent = displayText;
            document.getElementById('customOptionsContainer').classList.remove('open');
            loadSelectedExamSettings(examId);
        };

        window.addEventListener('click', function(e) {
            const wrapper = document.getElementById('customExamSelectWrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                document.getElementById('customOptionsContainer').classList.remove('open');
            }
        });

        window.loadSelectedExamSettings = function(selectedId) {
            if (!selectedId) return;

            let exam = globalExamsList.find(e => e.id === selectedId);
            if (!exam) return;

            let s = exam.settings || {};
            document.getElementById('settingPasswordLock').checked = !!s.password;
            document.getElementById('settingPassword').value = s.password || '';
            togglePasswordInput();

            document.getElementById('settingAIBot').checked = s.aiBot !== false;
            document.getElementById('settingTimer').checked = s.timer !== false;
            document.getElementById('settingShuffle').checked = !!s.shuffle;
            document.getElementById('settingInstantResult').checked = s.instantResult !== false;
            document.getElementById('settingFullScreen').checked = !!s.fullScreen;
            document.getElementById('settingAntiCheat').checked = !!s.antiCheat;
            document.getElementById('settingFullMarkCongrats').checked = s.fullMarkCongrats !== false;

            let hasCert = s.hasCertificate === true;
            document.getElementById('settingHasCertificate').checked = hasCert;
            document.getElementById('settingCertImageUrl').value = s.certImageUrl || '';
            toggleCertUploadBox(hasCert);
            if (hasCert && s.certImageUrl) {
                document.getElementById('certFileNameDisplay').innerHTML = `<span style="color:var(--success);">✔ تم رفع وتجهيز قالب الشهادة مسبقاً</span>`;
                document.getElementById('certUploadStatus').textContent = '✔ قالب الشهادة محفوظ ومفعل لهذا الامتحان';
            } else {
                document.getElementById('certFileNameDisplay').innerHTML = `<span style="font-size: 1.1rem;">🖼️</span> اضغط هنا لاختيار وتصفح صورة الشهادة الفاضية...`;
                document.getElementById('certUploadStatus').textContent = '';
            }

            let welcomeToggle = s.welcomeToggle !== false;
            document.getElementById('settingWelcomeToggle').checked = welcomeToggle;
            toggleWelcomeInput();
            document.getElementById('settingWelcomeMsg').value = (s.welcomeMsg !== undefined && s.welcomeMsg.trim() !== '') ? s.welcomeMsg : DEFAULT_WELCOME_TEXT;

            let endMsgToggle = s.endMsgToggle !== false;
            document.getElementById('settingEndMsgToggle').checked = endMsgToggle;
            toggleEndMsgInput();
            document.getElementById('settingCustomMsg').value = (s.customMsg !== undefined && s.customMsg.trim() !== '') ? s.customMsg : DEFAULT_END_TEXT;

            document.getElementById('settingDuration').value = s.duration || 30;
            document.getElementById('settingAttempts').value = s.attempts || 1;
            document.getElementById('settingPassingScore').value = s.passingScore || 50;
            document.getElementById('settingMaxQuota').value = s.maxQuota || '';
        };

        window.togglePasswordInput = function() {
            let isChecked = document.getElementById('settingPasswordLock').checked;
            let group = document.getElementById('passwordInputGroup');
            if (isChecked) group.classList.remove('hidden');
            else group.classList.add('hidden');
        };

        window.toggleWelcomeInput = function() {
            let isChecked = document.getElementById('settingWelcomeToggle').checked;
            let group = document.getElementById('welcomeMsgGroup');
            if (isChecked) group.classList.remove('hidden');
            else group.classList.add('hidden');
        };

        window.toggleEndMsgInput = function() {
            let isChecked = document.getElementById('settingEndMsgToggle').checked;
            let group = document.getElementById('endMsgGroup');
            if (isChecked) group.classList.remove('hidden');
            else group.classList.add('hidden');
        };

        window.toggleCertUploadBox = function(isChecked) {
            let section = document.getElementById('certUploadSection');
            if (isChecked) section.classList.remove('hidden');
            else section.classList.add('hidden');
        };

        window.updateCertFileName = function(input) {
            let file = input.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('settingCertImageUrl').value = event.target.result;
                    document.getElementById('certFileNameDisplay').innerHTML = `<span style="color:var(--success); font-weight:bold;">✔ تم اختيار: ${file.name}</span>`;
                    document.getElementById('certUploadStatus').textContent = `✔ تم رفع وتجهيز قالب الشهادة بنجاح`;
                };
                reader.readAsDataURL(file);
            }
        };

        window.saveExamSettingsToCloud = async function() {
            let selectedId = document.getElementById('selectedExamIdHidden').value;
            if (!selectedId) { alert('يرجى اختيار امتحان أولاً من القائمة!'); return; }

            let isPasswordLocked = document.getElementById('settingPasswordLock').checked;
            let hasCertChecked = document.getElementById('settingHasCertificate').checked;
            let certImageUrlVal = document.getElementById('settingCertImageUrl').value.trim();

            if (hasCertChecked && !certImageUrlVal) {
                let existingExam = globalExamsList.find(e => e.id === selectedId);
                certImageUrlVal = existingExam?.settings?.certImageUrl || '';
            }

            let newSettings = {
                active: true,
                password: isPasswordLocked ? document.getElementById('settingPassword').value.trim() : '',
                aiBot: document.getElementById('settingAIBot').checked,
                timer: document.getElementById('settingTimer').checked,
                shuffle: document.getElementById('settingShuffle').checked,
                instantResult: document.getElementById('settingInstantResult').checked,
                fullScreen: document.getElementById('settingFullScreen').checked,
                antiCheat: document.getElementById('settingAntiCheat').checked,
                fullMarkCongrats: document.getElementById('settingFullMarkCongrats').checked,
                hasCertificate: hasCertChecked,
                certImageUrl: certImageUrlVal,
                welcomeToggle: document.getElementById('settingWelcomeToggle').checked,
                welcomeMsg: document.getElementById('settingWelcomeMsg').value.trim() || DEFAULT_WELCOME_TEXT,
                endMsgToggle: document.getElementById('settingEndMsgToggle').checked,
                customMsg: document.getElementById('settingCustomMsg').value.trim() || DEFAULT_END_TEXT,
                duration: parseInt(document.getElementById('settingDuration').value) || 30,
                attempts: parseInt(document.getElementById('settingAttempts').value) || 1,
                passingScore: parseInt(document.getElementById('settingPassingScore').value) || 50,
                maxQuota: document.getElementById('settingMaxQuota').value.trim()
            };

            try {
                const examRef = doc(db, "exams", selectedId);
                await updateDoc(examRef, { settings: newSettings });
                
                let examIndex = globalExamsList.findIndex(e => e.id === selectedId);
                if (examIndex !== -1) {
                    globalExamsList[examIndex].settings = newSettings;
                    sessionStorage.setItem('cachedExamsListForSettings', JSON.stringify(globalExamsList));
                }

                alert('✔ تم حفظ وتفعيل إعدادات الامتحان والشهادة بنجاح في السحابة!');
            } catch (e) {
                console.error(e);
                alert("حدث خطأ أثناء حفظ الإعدادات في السحابة.");
            }
        };
    </script>
</body>
</html>
