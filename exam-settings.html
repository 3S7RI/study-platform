<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - إعدادات الامتحانات</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            --th-bg: rgba(255, 255, 255, 0.03);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.05);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            --th-bg: rgba(0, 0, 0, 0.02);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; }
        .container { max-width: 900px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        .header-right-side { display: flex; align-items: center; }
        .btn-home-link {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .platform-title-box { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: 700; color: var(--text-main); }
        .btn-theme-toggle {
            background-color: rgba(255, 255, 255, 0.04); color: var(--text-main); border: 1px solid var(--border-color);
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
        }
        .btn-theme-toggle:hover { background-color: var(--hover-bg); border-color: var(--primary); }

        .admin-nav-bar {
            display: flex; justify-content: center; align-items: center;
            background-color: var(--bg-card); padding: 12px 16px; border-radius: 16px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); gap: 10px; flex-wrap: wrap;
        }
        .admin-tabs-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .btn-tab {
            background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--border-color);
            padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; flex: 1; min-width: 120px; text-align: center; text-decoration: none; display: inline-block;
        }
        .btn-tab.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        .section-box {
            background-color: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow);
            padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
        }
        .section-header h2 { color: var(--text-main); font-size: 1.05rem; font-weight: 700; margin-bottom: 15px; }

        .exam-item-card {
            background: var(--th-bg); border: 1px solid var(--border-color); padding: 14px; border-radius: 12px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .btn-settings { background: var(--primary); color: white; border: none; padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .btn-settings:hover { background: var(--primary-hover); }

        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; gap: 10px; }
        .setting-row label { font-weight: 600; color: var(--text-main); }
        .setting-input, .setting-select {
            background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main);
            padding: 6px 12px; border-radius: 8px; font-size: 0.82rem; outline: none; width: 140px; text-align: center;
        }
        .setting-textarea { width: 100%; margin-top: 6px; padding: 8px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); font-size: 0.82rem; resize: vertical; }

        .btn-save-settings {
            background: var(--success); color: white; border: none; padding: 10px 20px; border-radius: 10px;
            font-weight: bold; cursor: pointer; font-size: 0.85rem; width: 100%; margin-top: 15px;
        }
        .btn-save-settings:hover { opacity: 0.9; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; overflow-y: auto; }
        .modal-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 20px; width: 100%; max-width: 550px; text-align: right; box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; }
        .hidden { display: none !important; }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <header class="platform-header">
            <div class="header-right-side"><a href="admin.html" class="btn-home-link">🏠 الرئيسية</a></div>
            <div class="platform-title-box"><span>إعدادات الامتحانات والشهادات</span> ⚙️</div>
            <div class="header-left-side"><button class="btn-theme-toggle" id="themeToggleBtn" title="تغيير الوضع">☀️</button></div>
        </header>

        <nav class="admin-nav-bar">
            <div class="admin-tabs-group">
                <a href="exam-create.html" class="btn-tab">إنشاء امتحان 📝</a>
                <a href="exam-settings.html" class="btn-tab active">الإعدادات ⚙️</a>
                <a href="exam-stats.html" class="btn-tab">إحصائيات 📊</a>
            </div>
        </nav>

        <div class="section-box">
            <div class="section-header">
                <h2>اختر الامتحان لتعديل إعداداته والتحكم في الشهادات ⚙️</h2>
            </div>
            <div id="examsSettingsListContainer"><p style="text-align: center; opacity: 0.7; padding: 15px; font-size: 0.8rem;">جاري جلب الامتحانات...</p></div>
        </div>
    </div>

    <!-- نافذة إعدادات الامتحان -->
    <div class="modal-overlay" id="examSettingsModal">
        <div class="modal-card">
            <h3 id="modalExamTitle" style="color: var(--primary); font-size: 1rem; margin-bottom: 14px; text-align: center;">⚙️ إعدادات الامتحان</h3>
            
            <div class="setting-row">
                <label>المدة الزمنية (بالدقائق):</label>
                <input type="number" id="setDuration" class="setting-input" value="30">
            </div>
            <div class="setting-row">
                <label>عدد المحاولات المتاحة للطالب:</label>
                <input type="number" id="setAttempts" class="setting-input" value="1">
            </div>
            <div class="setting-row">
                <label>كلمة مرور الامتحان (اختياري):</label>
                <input type="text" id="setPassword" class="setting-input" placeholder="اتركه فارغاً لعام">
            </div>
            <div class="setting-row">
                <label>تفعيل وضع ملء الشاشة الجبري:</label>
                <input type="checkbox" id="setFullScreen" style="width: 18px; height: 18px; cursor: pointer;">
            </div>
            <div class="setting-row">
                <label>مانع الغش (مغادرة الصفحة):</label>
                <input type="checkbox" id="setAntiCheat" style="width: 18px; height: 18px; cursor: pointer;">
            </div>
            <div class="setting-row">
                <label>خلط الأسئلة عشوائياً:</label>
                <input type="checkbox" id="setShuffle" style="width: 18px; height: 18px; cursor: pointer;">
            </div>

            <!-- إعدادات الشهادة الجديدة والذكية -->
            <div style="background: var(--th-bg); border: 1px solid var(--border-color); padding: 12px; border-radius: 12px; margin-top: 14px;">
                <div class="setting-row" style="border-bottom: none; padding-bottom: 0;">
                    <label style="color: var(--success);">🏆 تفعيل شهادة تقدير لهذا الامتحان (عند التقفيل 100%):</label>
                    <input type="checkbox" id="setHasCertificate" style="width: 18px; height: 18px; cursor: pointer;" onchange="toggleCertUploadBox(this.checked)">
                </div>
                
                <div id="certUploadSection" class="hidden" style="margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 10px;">
                    <label style="font-size: 0.8rem; display: block; margin-bottom: 6px; font-weight: bold; color: var(--text-main);">📁 ارفع صورة الشهادة الفاضية (قالب الخلفية):</label>
                    <input type="file" id="certImageFileInput" accept="image/*" style="font-size: 0.78rem; width: 100%; margin-bottom: 6px;">
                    <input type="hidden" id="setCertImageUrl" value="">
                    <p id="certUploadStatus" style="font-size: 0.75rem; color: var(--success); font-weight: bold;"></p>
                </div>
            </div>

            <div style="margin-top: 14px;">
                <label style="font-weight: 600; font-size: 0.82rem; display: block; margin-bottom: 4px;">رسالة نهاية الامتحان:</label>
                <textarea id="setCustomMsg" class="setting-textarea" rows="2" placeholder="عاش يا بطل.."></textarea>
            </div>

            <div style="display: flex; gap: 8px; margin-top: 18px;">
                <button onclick="saveExamSettingsToCloud()" class="btn-save-settings" style="margin-top: 0; flex: 1;">حفظ الإعدادات ✅</button>
                <button onclick="closeSettingsModal()" style="background: #475569; color: white; border: none; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 90px; font-size: 0.82rem;">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let globalExamsList = [];
        let activeEditingExamId = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await loadExamsList();
            } else {
                window.location.href = 'login.html';
            }
        });

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const bodyElement = document.body;
        const savedTheme = localStorage.getItem('platform_theme') || 'dark';
        bodyElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            let next = bodyElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            bodyElement.setAttribute('data-theme', next);
            localStorage.setItem('platform_theme', next);
            themeToggleBtn.textContent = next === 'dark' ? '☀️' : '🌙';
        });

        async function loadExamsList() {
            const container = document.getElementById('examsSettingsListContainer');
            try {
                const querySnapshot = await getDocs(collection(db, "exams"));
                globalExamsList = [];
                querySnapshot.forEach((docSnap) => {
                    globalExamsList.push({ id: docSnap.id, ...docSnap.data() });
                });

                if (globalExamsList.length === 0) {
                    container.innerHTML = `<p style="text-align: center; opacity: 0.7; padding: 15px; font-size: 0.8rem;">لا توجد امتحانات منشورة حالياً.</p>`;
                    return;
                }

                let html = '';
                globalExamsList.forEach((exam) => {
                    html += `
                        <div class="exam-item-card">
                            <div>
                                <h3 style="font-size: 0.92rem; font-weight: 700; margin-bottom: 2px;">🎯 ${exam.title}</h3>
                                <p style="font-size: 0.75rem; color: var(--text-muted);">المادة: ${exam.subject || 'عام'} | الأسئلة: ${(exam.questions || []).length}</p>
                            </div>
                            <button onclick="openExamSettingsModal('${exam.id}')" class="btn-settings">تعديل الإعدادات والشهادة ⚙️</button>
                        </div>`;
                });
                container.innerHTML = html;
            } catch (e) {
                console.error(e);
                container.innerHTML = `<p style="text-align: center; color: var(--danger); font-size: 0.8rem;">خطأ في تحميل الامتحانات.</p>`;
            }
        }

        window.openExamSettingsModal = function(examId) {
            activeEditingExamId = examId;
            let exam = globalExamsList.find(e => e.id === examId);
            if (!exam) return;

            let settings = exam.settings || {};
            document.getElementById('modalExamTitle').textContent = `⚙️ إعدادات امتحان: ${exam.title}`;
            document.getElementById('setDuration').value = settings.duration || 30;
            document.getElementById('setAttempts').value = settings.attempts || 1;
            document.getElementById('setPassword').value = settings.password || '';
            document.getElementById('setFullScreen').checked = settings.fullScreen === true;
            document.getElementById('setAntiCheat').checked = settings.antiCheat === true;
            document.getElementById('setShuffle').checked = settings.shuffle === true;
            
            let hasCert = settings.hasCertificate === true;
            document.getElementById('setHasCertificate').checked = hasCert;
            document.getElementById('setCertImageUrl').value = settings.certImageUrl || '';
            
            if (hasCert) {
                document.getElementById('certUploadSection').classList.remove('hidden');
                document.getElementById('certUploadStatus').textContent = settings.certImageUrl ? '✔ توجد صورة شهادة مرفوعة مسبقاً' : '';
            } else {
                document.getElementById('certUploadSection').classList.add('hidden');
            }

            document.getElementById('setCustomMsg').value = settings.customMsg || '';
            document.getElementById('examSettingsModal').style.display = 'flex';
        };

        window.toggleCertUploadBox = function(isChecked) {
            let section = document.getElementById('certUploadSection');
            if (isChecked) {
                section.classList.remove('hidden');
            } else {
                section.classList.add('hidden');
            }
        };

        // التعامل مع رفع صورة الشهادة الفاضية محلياً وتحويلها لتخزن في السحابة
        document.getElementById('certImageFileInput').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (file) {
                let reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('setCertImageUrl').value = event.target.result;
                    document.getElementById('certUploadStatus').textContent = `✔ تم تجهيز ورفع قالب الشهادة: ${file.name}`;
                };
                reader.readAsDataURL(file);
            }
        });

        window.closeSettingsModal = function() {
            document.getElementById('examSettingsModal').style.display = 'none';
        };

        window.saveExamSettingsToCloud = async function() {
            if (!activeEditingExamId) return;

            let settingsData = {
                duration: parseInt(document.getElementById('setDuration').value) || 30,
                attempts: parseInt(document.getElementById('setAttempts').value) || 1,
                password: document.getElementById('setPassword').value.trim(),
                fullScreen: document.getElementById('setFullScreen').checked,
                antiCheat: document.getElementById('setAntiCheat').checked,
                shuffle: document.getElementById('setShuffle').checked,
                hasCertificate: document.getElementById('setHasCertificate').checked,
                certImageUrl: document.getElementById('setCertImageUrl').value.trim(),
                customMsg: document.getElementById('setCustomMsg').value.trim()
            };

            try {
                const examRef = doc(db, "exams", activeEditingExamId);
                await updateDoc(examRef, { settings: settingsData });
                alert('✔ تم حفظ إعدادات الامتحان والشهادة بنجاح في السحابة!');
                closeSettingsModal();
                await loadExamsList();
            } catch (err) {
                console.error(err);
                alert('حدث خطأ أثناء حفظ الإعدادات.');
            }
        };
    </script>
</body>
</html>
