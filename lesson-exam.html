<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <script src="plans.js"></script>
    <script src="session.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - امتحان الحصة</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.12);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            --th-bg: rgba(255, 255, 255, 0.04);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            --th-bg: rgba(0, 0, 0, 0.02);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; user-select: none; -webkit-user-select: none; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        .btn-home-link {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem; cursor: pointer;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .timer-box-ui {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(99, 102, 241, 0.1);
            padding: 5px 12px; border-radius: 15px; border: 1px solid var(--primary);
            color: var(--primary); font-weight: bold; font-size: 0.82rem;
        }
        .timer-box-ui svg { width: 16px; height: 16px; fill: currentColor; }

        .exam-card {
            background-color: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow);
            padding: 24px; margin-bottom: 20px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
        }

        .exam-title { font-size: 1.3rem; font-weight: bold; color: var(--text-main); margin-bottom: 6px; text-align: center; }
        .exam-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; text-align: center; }

        .question-box {
            background: var(--th-bg); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 18px; margin-bottom: 16px;
        }
        .question-text { font-size: 0.95rem; font-weight: bold; color: var(--text-main); margin-bottom: 12px; text-align: right; }
        
        .option-label {
            display: flex; align-items: center; gap: 10px; background: var(--bg-main);
            padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color);
            margin-bottom: 8px; cursor: pointer; font-size: 0.88rem; text-align: right;
        }
        .option-label:hover { background: var(--hover-bg); border-color: var(--primary); }

        .btn-submit {
            background-color: var(--success); color: white; border: none; width: 100%;
            padding: 12px; border-radius: 10px; font-weight: bold; font-size: 1rem;
            cursor: pointer; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); margin-top: 20px;
        }
        .btn-submit:hover { opacity: 0.9; }

        /* شاشة التحميل والتصحيح المتحركة */
        .grading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 4000; padding: 15px;
        }
        .grading-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            width: 100%; max-width: 420px; border-radius: 20px; padding: 25px; text-align: center; box-shadow: var(--shadow);
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .spinner-bar {
            width: 100%; height: 6px; background: var(--border-color); border-radius: 3px; overflow: hidden; position: relative;
        }
        .spinner-bar::after {
            content: ''; position: absolute; top: 0; left: 0; height: 100%; width: 40%;
            background: var(--primary); border-radius: 3px; animation: progressAnim 1.2s infinite ease-in-out;
        }
        @keyframes progressAnim {
            0% { left: -40%; }
            100% { left: 100%; }
        }

        /* رسومات SVG المتحركة للنجاح والرسوب */
        .animated-icon-box { width: 70px; height: 70px; margin: 0 auto; display: none; }
        .success-svg circle { stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 3; stroke-miterlimit: 10; stroke: var(--success); fill: none; animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards; }
        .success-svg path { transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48; stroke: var(--success); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards; }

        .error-svg circle { stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 3; stroke-miterlimit: 10; stroke: var(--danger); fill: none; animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards; }
        .error-svg path { transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48; stroke: var(--danger); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards; }

        @keyframes stroke { 100% { stroke-dashoffset: 0; } }

        .platform-toast-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 2000; padding: 15px;
        }
        .platform-toast-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
            width: 100%; max-width: 380px; border-radius: 16px; padding: 22px; text-align: center; box-shadow: var(--shadow);
        }
        .platform-toast-card h3 { font-size: 1rem; color: var(--text-main); margin-bottom: 8px; font-weight: 700; }
        .platform-toast-card p { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; white-space: pre-line; text-align: right; }
        .platform-toast-btn {
            background: var(--primary); color: white; border: none; padding: 9px 16px; border-radius: 8px;
            font-weight: bold; font-size: 0.85rem; cursor: pointer; width: 100%;
        }
        .toast-btns-group { display: flex; gap: 8px; margin-top: 10px; }
    </style>

</head>
<body data-theme="dark">
    <script src="intro.js"></script>

    <div class="container">
        <header class="platform-header">
            <button onclick="confirmLeaveExam()" class="btn-home-link"><svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0' aria-hidden='true'><path d='M19 12H5M12 19l-7-7 7-7'/></svg> العودة للحصة</button>
            <div style="font-weight: 700; font-size: 0.95rem;">امتحان الحصة <svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0' aria-hidden='true'><path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/><path d='M14 2v6h6M16 13H8M16 17H8M10 9H8'/></svg></div>
            <div class="timer-box-ui" id="timerContainerBox">
                <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zm1-13h-2v6h6v-2h-4z"/></svg>

        <div id="examContainer">

        </div>

    <!-- نافذة التصحيح وتوضيح النتيجة المتحركة -->
    <div class="grading-overlay" id="gradingOverlayModal">
        <div class="grading-card">
            <div id="gradingLoadingState">
                <h3 style="color: var(--text-main); margin-bottom: 15px; font-size: 1.1rem;"><svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0' aria-hidden='true'><path d='M5 22h14M5 2h14M17 22v-4.17a2 2 0 0 0-.59-1.41L12 12l-4.41 4.42A2 2 0 0 0 7 17.83V22M7 2v4.17a2 2 0 0 0 .59 1.41L12 12l4.41-4.42A2 2 0 0 0 17 6.17V2'/></svg> جاري تصحيح الامتحان ورصد الدرجات...</h3>
                <div class="spinner-bar"></div>
                <p style="color: var(--text-muted); font-size: 0.8rem; margin-top: 15px;">يرجى الانتظار لحظات قليلة...</p>
            </div>
            <div id="gradingResultState" style="display: none; width: 100%;">
                <div id="successSvgContainer" class="animated-icon-box">
                    <svg class="success-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                        <circle cx="26" cy="26" r="25" fill="none"/>

                    </svg>
                </div>
                <div id="errorSvgContainer" class="animated-icon-box">
                    <svg class="error-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                        <circle cx="26" cy="26" r="25" fill="none"/>
                        <path fill="none" d="M16 16l20 20M36 16L16 36"/>
                    </svg>
                </div>
                <h3 id="resultTitleText" style="margin-top: 10px; font-size: 1.05rem; font-weight: 700;">نتيجة الامتحان</h3>
                <p id="resultDescText" style="color: var(--text-muted); font-size: 0.85rem; line-height: 1.6; margin: 15px 0; text-align: center;"></p>
                <button onclick="returnToLesson()" class="platform-toast-btn" style="background: var(--primary); margin-top: 5px;">العودة إلى الحصة الدراسية <svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0' aria-hidden='true'><path d='M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/><path d='M9 22V12h6v10'/></svg></button>
            </div>
        </div>
    </div>

    <div class="platform-toast-overlay" id="platformToastModal">
        <div class="platform-toast-card" onclick="event.stopPropagation()">
            <h3 id="toastTitle">تنبيه المنصة <svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0' aria-hidden='true'><path d='M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9'/><path d='M13.73 21a2 2 0 0 1-3.46 0'/></svg></h3>
            <p id="toastMessage">رسالة التنبيه هنا...</p>
            <div id="toastActionContainer">
                <button class="platform-toast-btn" id="toastActionBtn" onclick="closePlatformToast()">حسناً فهمت <svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0' aria-hidden='true'><path d='M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3'/></svg></button>
            </div>
        </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { addPointsToStudent } from './student-service.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserId = null;
        let activeLessonId = null;
        let activeExamTitle = null;
        let lessonSettings = {};
        let currentExamData = null;
        let timerInterval = null;
        let remainingSeconds = 0;
        let isSubmitted = false;

        onAuthStateChanged(auth, async (user) => {
            if (user) currentUserId = PS.studentId();

            const urlParams = new URLSearchParams(window.location.search);
            activeLessonId = urlParams.get('id');

            if (!activeLessonId) {
                document.getElementById('examContainer').innerHTML = `<div class="exam-card" style="text-align:center; color:var(--danger);">عذراً، لم يتم تحديد الحصة المطلوبة.</div>`;
                return;
            }

            await fetchLessonAndExamSettings(activeLessonId);
        });

        window.showPlatformToast = function(title, message, customButtonsHtml = null, callback = null) {
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastMessage').textContent = message;
            const container = document.getElementById('toastActionContainer');
            
            if (customButtonsHtml) {
                container.innerHTML = customButtonsHtml;
            } else {
                container.innerHTML = `<button class="platform-toast-btn" id="toastActionBtn">حسناً فهمت <svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg></button>`;
                document.getElementById('toastActionBtn').onclick = function() {
                    closePlatformToast();
                    if (callback) callback();
                };
            }

            document.getElementById('platformToastModal').style.display = 'flex';
        };

        window.closePlatformToast = function() {
            document.getElementById('platformToastModal').style.display = 'none';
        };

        window.returnToLesson = function() {
            if (activeLessonId) {
                window.location.href = `files-lesson-view.html?id=${activeLessonId}`;
            } else {
                window.location.href = 'files.html';
            }
        };

        function enableSecurityFeatures() {
            if (lessonSettings.fullScreen === true) {
                try {
                    let elem = document.documentElement;
                    if (elem.requestFullscreen) {
                        elem.requestFullscreen().catch(() => {});
                    } else if (elem.webkitRequestFullscreen) {
                        elem.webkitRequestFullscreen();
                    }
                } catch(e) {}
            }

            window.addEventListener('beforeunload', function (e) {
                if (!isSubmitted && lessonSettings.antiCheat === true) {
                    e.preventDefault();
                    e.returnValue = '';
                }
            });
        }

        window.confirmLeaveExam = function() {
            if (isSubmitted) {
                returnToLesson();
                return;
            }

            let btnsHtml = `
                <div class="toast-btns-group">
                    <button class="platform-toast-btn" style="background:var(--danger);" onclick="forceSubmitAndLeave()">موافق، تسليم <svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0;color:#f59e0b" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/></svg></button>
                    <button class="platform-toast-btn" style="background:var(--primary);" onclick="closePlatformToast()">إكمال الحل <svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
                </div>
            `;
            showPlatformToast("تنبيه مغادرة الامتحان", "إذا عدت إلى الحصة سيتم احتساب المحاولة وتسليم الإجابات الحالية.", btnsHtml);
        };

        window.forceSubmitAndLeave = function() {
            closePlatformToast();
            submitExam(null, true);
        };

        async function fetchLessonAndExamSettings(lessonId) {
            try {
                const lessonRef = doc(db, "lessons", lessonId);
                const lessonSnap = await getDoc(lessonRef);

                if (!lessonSnap.exists()) {
                    showPlatformToast("تنبيه", "هذه الحصة غير موجودة!", null, () => { window.location.href = 'files.html'; });
                    return;
                }

                const lessonData = lessonSnap.data();
                lessonSettings = lessonData.settings || {};
                activeExamTitle = lessonData.examId;

                if (!activeExamTitle) {
                    showPlatformToast("تنبيه", "لا يوجد امتحان مربوط بهذه الحصة حالياً!", null, () => { returnToLesson(); });
                    return;
                }

                const examRef = doc(db, "lessonExams", activeExamTitle);
                const examSnap = await getDoc(examRef);

                if (!examSnap.exists()) {
                    showPlatformToast("خطأ", "ملف الامتحان المرتبط غير موجود بالسحابة.", null, () => { returnToLesson(); });
                    return;
                }

                currentExamData = examSnap.data();

                if (lessonSettings.timer === false) {
                    document.getElementById('timerContainerBox').style.display = 'none';
                }

                if (lessonSettings.welcomeToggle !== false && lessonSettings.welcomeMsg) {
                    showPlatformToast("تعليمات الاختبار", lessonSettings.welcomeMsg, null, () => {
                        enableSecurityFeatures();
                        renderExamContent(currentExamData);
                        if (lessonSettings.timer !== false) startExamTimer();
                    });
                } else {
                    enableSecurityFeatures();
                    renderExamContent(currentExamData);
                    if (lessonSettings.timer !== false) startExamTimer();
                }

            } catch (e) {
                console.error(e);
                showPlatformToast("خطأ", "حدث خطأ أثناء تحميل بيانات الامتحان.");
            }
        }

        function startExamTimer() {
            let durationMinutes = lessonSettings.duration || 30;
            remainingSeconds = durationMinutes * 60;

            const timerEl = document.getElementById('timerDisplay');
            timerInterval = setInterval(() => {
                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    alert("انتهى وقت الامتحان المخصص! سيتم تسليم الإجابات تلقائياً.");
                    submitExam(null, true);
                    return;
                }
                let mins = Math.floor(remainingSeconds / 60);
                let secs = remainingSeconds % 60;
                timerEl.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                remainingSeconds--;
            }, 1000);
        }

        function renderExamContent(exam) {
            let questions = exam.questions || [];
            
            if (lessonSettings.shuffle === true && questions.length > 1) {
                questions.sort(() => Math.random() - 0.5);
            }

            let html = `
                <div class="exam-card">
                    <h2 class="exam-title"><svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg> ${exam.title || activeExamTitle}</h2>
                    <p class="exam-subtitle">المادة: ${exam.subject || 'عام'} | عدد الأسئلة: ${questions.length}</p>
                    <form id="examForm" onsubmit="handleExamFormSubmit(event)">
            `;

            if (questions.length > 0) {
                questions.forEach((q, qIdx) => {
                    html += `
                        <div class="question-box" id="q_box_${qIdx}">
                            <div class="question-text">سؤال ${qIdx + 1}: ${q.text} <span style="font-size:0.75rem; background:rgba(99,102,241,0.2); color:var(--primary); padding:2px 6px; border-radius:4px; margin-right:6px;">(${q.marks || 1} درجات)</span></div>
                            ${q.imageUrl ? `<img src="${q.imageUrl}" style="max-width:100%; max-height:220px; border-radius:8px; margin-bottom:12px; border:1px solid var(--border-color);" alt="صورة السؤال">` : ''}
                    `;

                    if (q.options && q.options.length > 0) {
                        q.options.forEach((opt, oIdx) => {
                            let inputType = q.type === 'checkbox' ? 'checkbox' : 'radio';
                            html += `
                                <label class="option-label">
                                    <input type="${inputType}" name="q_${qIdx}" value="${oIdx}" style="cursor:pointer; width:16px; height:16px;">
                                    <span>${opt}</span>
                                </label>
                            `;
                        });
                    } else if (q.type === 'essayImage') {
                        html += `
                            <div style="margin-top:10px;">
                                <textarea name="q_${qIdx}_text" rows="3" placeholder="اكتب إجابتك المقالية هنا..." style="width:100%; padding:10px; border-radius:8px; background:var(--bg-main); border:1px solid var(--border-color); color:var(--text-main); margin-bottom:8px;"></textarea>
                            </div>
                        `;
                    } else {
                        html += `<textarea name="q_${qIdx}" rows="4" placeholder="اكتب إجابتك هنا..." style="width:100%; padding:10px; border-radius:8px; background:var(--bg-main); border:1px solid var(--border-color); color:var(--text-main); margin-top:5px;"></textarea>`;
                    }

                    html += `</div>`;
                });
                html += `<button type="submit" class="btn-submit">إرسال وتسليم الامتحان نهائياً <svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg></button>`;
            } else {
                html += `<p style="text-align:center; color:var(--text-muted);">لا توجد أسئلة في هذا الامتحان.</p>`;
            }

            html += `</form></div>`;
            document.getElementById('examContainer').innerHTML = html;
        }

        window.handleExamFormSubmit = function(event) {
            event.preventDefault();
            
            let questions = currentExamData.questions || [];
            let unansweredCount = 0;

            questions.forEach((q, qIdx) => {
                let answered = false;
                if (q.options && q.options.length > 0) {
                    let checkedInputs = document.querySelectorAll(`input[name="q_${qIdx}"]:checked`);
                    if (checkedInputs.length > 0) answered = true;
                } else if (q.type === 'essayImage') {
                    let textVal = document.querySelector(`textarea[name="q_${qIdx}_text"]`);
                    if (textVal && textVal.value.trim() !== '') answered = true;
                } else {
                    let textVal = document.querySelector(`textarea[name="q_${qIdx}"]`);
                    if (textVal && textVal.value.trim() !== '') answered = true;
                }
                if (!answered) unansweredCount++;
            });

            if (unansweredCount > 0) {
                let btnsHtml = `
                    <div class="toast-btns-group">
                        <button class="platform-toast-btn" style="background:var(--primary);" onclick="closePlatformToast()">الرجوع للحل <svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
                        <button class="platform-toast-btn" style="background:var(--success);" onclick="proceedWithSubmission()">أنا أعلم، تسليم الان <svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg></button>
                    </div>
                `;
                showPlatformToast("تنبيه الأسئلة غير المكتملة", `لديك ${unansweredCount} أسئلة لم تقم بالإجابة عليها. هل أنت متأكد من التسليم؟`, btnsHtml);
            } else {
                submitExam(null, true);
            }
        };

        window.proceedWithSubmission = function() {
            closePlatformToast();
            submitExam(null, true);
        };

        window.submitExam = async function(event, isForced = false) {
            if (isSubmitted) return;
            isSubmitted = true;

            if (timerInterval) clearInterval(timerInterval);

            document.getElementById('gradingOverlayModal').style.display = 'flex';

            let totalScore = 0;
            let maxScore = 0;
            let questions = currentExamData.questions || [];
            let mistakes = []; // الأسئلة اللي اتجاوبت غلط (أو اتسابت) — بتظهر للطالب في صفحة «أخطائي»

            questions.forEach((q, qIdx) => {
                let qMarks = Number(q.marks || 1);
                maxScore += qMarks;

                if (q.options && q.options.length > 0) {
                    let checkedInputs = document.querySelectorAll(`input[name="q_${qIdx}"]:checked`);
                    let selectedVal = checkedInputs.length > 0 ? parseInt(checkedInputs[0].value) : -1;
                    let correctVal = parseInt(q.correct);
                    if (checkedInputs.length > 0 && selectedVal === correctVal) {
                        totalScore += qMarks;
                    } else if (!isNaN(correctVal)) {
                        mistakes.push({
                            idx: qIdx,
                            text: String(q.text || '').slice(0, 1500),
                            imageUrl: q.imageUrl ? String(q.imageUrl) : '',
                            marks: qMarks,
                            options: q.options.map(o => String(o).slice(0, 400)),
                            selected: selectedVal,
                            correct: correctVal
                        });
                    }
                }
            });

            if (currentUserId && activeLessonId) {
                try {
                    let resultId = `${currentUserId}_${activeLessonId}`;
                    let resultRef = doc(db, "studentExamResults", resultId);
                    let nowIso = new Date().toISOString();

                    let pts = lessonSettings.points || {};
                    let examPoints = Number(pts.exam !== undefined ? pts.exam : 10) || 0;
                    let perfectBonus = Number(pts.perfectExam !== undefined ? pts.perfectExam : 15) || 0;
                    let isPerfect = totalScore === maxScore && maxScore > 0 && lessonSettings.fullMarkCongrats !== false;

                    // النتيجة السابقة (لو الطالب أعاد الامتحان) — بنمنح النقاط بالفرق بس، عشان الإعادة متكسّبش نقاط تاني
                    let prevSnap = await getDoc(resultRef);
                    let prev = prevSnap.exists() ? prevSnap.data() : {};
                    let alreadyAwarded;
                    if (prev.pointsAwarded !== undefined) {
                        alreadyAwarded = Number(prev.pointsAwarded) || 0;
                    } else if (prevSnap.exists()) {
                        // نتيجة قديمة قبل التعديل: كانت بتاخد النقاط الثابتة (+ المكافأة لو الدرجة كاملة)
                        alreadyAwarded = examPoints + ((Number(prev.score) === Number(prev.maxScore) && Number(prev.maxScore) > 0) ? perfectBonus : 0);
                    } else {
                        alreadyAwarded = 0;
                    }

                    // النقاط حسب الدرجة: نقاط الامتحان × نسبة الدرجة + مكافأة الدرجة النهائية
                    let ratio = maxScore > 0 ? (totalScore / maxScore) : 0;
                    let earnedNow = Math.round(examPoints * ratio) + (isPerfect ? perfectBonus : 0);
                    let pointsToAdd = Math.max(0, earnedNow - alreadyAwarded);
                    let newAwardedTotal = Math.max(alreadyAwarded, earnedNow);

                    let prevBest = Number(prev.bestScore);
                    let bestScore = isNaN(prevBest) ? totalScore : Math.max(prevBest, totalScore);

                    await setDoc(resultRef, {
                        userId: currentUserId,
                        lessonId: activeLessonId,
                        examTitle: activeExamTitle,
                        score: totalScore,
                        maxScore: maxScore,
                        submittedAt: nowIso,
                        firstSubmittedAt: prev.firstSubmittedAt || prev.submittedAt || nowIso,
                        attempts: (Number(prev.attempts) || 0) + 1,
                        bestScore: bestScore,
                        bestMaxScore: maxScore,
                        pointsAwarded: newAwardedTotal,
                        mistakes: mistakes,
                        mistakesAt: nowIso
                    }, { merge: true });

                    // النقاط والرتبة تتحدثان معاً (points + totalScore + rank + level)
                    if (pointsToAdd > 0) await addPointsToStudent(db, PS.email(), pointsToAdd, { weekly: true });
                } catch(e) {
                    console.log("Error saving exam result:", e);
                }
            }

            setTimeout(() => {
                document.getElementById('gradingLoadingState').style.display = 'none';
                document.getElementById('gradingResultState').style.display = 'block';

                let percentage = maxScore > 0 ? Math.round((totalScore / maxScore) * 100) : 0;
                let isPassed = percentage >= 50;

                const successBox = document.getElementById('successSvgContainer');
                const errorBox = document.getElementById('errorSvgContainer');
                const titleEl = document.getElementById('resultTitleText');

                if (isPassed) {
                    successBox.style.display = 'block';
                    errorBox.style.display = 'none';
                    titleEl.style.color = 'var(--success)';
                    titleEl.textContent = 'مبروك، لقد اجتزت الامتحان بنجاح!';
                } else {
                    successBox.style.display = 'none';
                    errorBox.style.display = 'block';
                    titleEl.style.color = 'var(--danger)';
                    titleEl.textContent = 'لم تبلغ الحد المطلوب، حاول مرة أخرى.';
                }

                let customMsg = (lessonSettings.endMsgToggle !== false && lessonSettings.customMsg) ? lessonSettings.customMsg : "تم رصد وتسليم درجاتك بنجاح.";
                document.getElementById('resultDescText').innerHTML = `
                    ${customMsg}<br><br>
                    <span style="font-size: 1.05rem; font-weight: bold; color: var(--text-main);">
                        الدرجة: ${totalScore} من ${maxScore} (${percentage}%)
                    </span>
                    ${mistakes.length ? `<br><br><a href="mistakes.html" style="display:inline-block; padding:8px 18px; border-radius:10px; background:var(--danger); color:#fff; font-weight:800; text-decoration:none;">شوف أخطاءك (${mistakes.length})</a>` : ''}
                `;

            }, 1800);
        };
    </script>
</body>
