<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - امتحان الحصة</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.12);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            --th-bg: rgba(255, 255, 255, 0.04);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            --th-bg: rgba(0, 0, 0, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; user-select: none; -webkit-user-select: none; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        .btn-home-link {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .exam-card {
            background-color: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow);
            padding: 24px; margin-bottom: 20px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
        }

        .exam-title { font-size: 1.3rem; font-weight: bold; color: var(--text-main); margin-bottom: 6px; text-align: center; }
        .exam-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; text-align: center; }

        .question-box {
            background: var(--th-bg); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 18px; margin-bottom: 16px;
        }
        .question-text { font-size: 0.95rem; font-weight: bold; color: var(--text-main); margin-bottom: 12px; text-align: right; }
        
        .option-label {
            display: flex; align-items: center; gap: 10px; background: var(--bg-main);
            padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color);
            margin-bottom: 8px; cursor: pointer; font-size: 0.88rem; text-align: right;
        }
        .option-label:hover { background: var(--hover-bg); border-color: var(--primary); }

        .btn-submit {
            background-color: var(--success); color: white; border: none; width: 100%;
            padding: 12px; border-radius: 10px; font-weight: bold; font-size: 1rem;
            cursor: pointer; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); margin-top: 20px;
        }
        .btn-submit:hover { opacity: 0.9; }

        /* تذكرة التنبيه المنبثقة */
        .platform-toast-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 2000; padding: 15px;
        }
        .platform-toast-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
            width: 100%; max-width: 360px; border-radius: 14px; padding: 18px; text-align: center; box-shadow: var(--shadow);
        }
        .platform-toast-card h3 { font-size: 0.95rem; color: var(--text-main); margin-bottom: 6px; font-weight: 700; }
        .platform-toast-card p { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4; }
        .platform-toast-btn {
            background: var(--primary); color: white; border: none; padding: 7px 16px; border-radius: 8px;
            font-weight: bold; font-size: 0.8rem; cursor: pointer; width: 100%;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="container">
        <header class="platform-header">
            <div id="backLinkContainer"><a href="files.html" class="btn-home-link">⬅ العودة</a></div>
            <div style="font-weight: 700; font-size: 0.95rem;">منصة رحلة دراسية - اختبار الحصة 📝</div>
            <div><button id="fullscreenBtn" style="background:var(--primary); color:white; border:none; padding:5px 10px; border-radius:6px; cursor:pointer; font-size:0.75rem; font-weight:bold;">⛶ تفعيل الشاشة الكاملة</button></div>
        </header>

        <div id="examContainer">
            <div style="text-align: center; padding: 50px; color: var(--text-muted);">جاري تحميل الامتحان المرتبط بالحصة وتفعيل الأمان...</div>
        </div>
    </div>

    <!-- نافذة التنبيهات -->
    <div class="platform-toast-overlay" id="platformToastModal" onclick="closePlatformToast()">
        <div class="platform-toast-card" onclick="event.stopPropagation()">
            <h3 id="toastTitle">تنبيه المنصة 🔔</h3>
            <p id="toastMessage">رسالة التنبيه هنا...</p>
            <button class="platform-toast-btn" onclick="closePlatformToast()">حسناً فهمت 👍</button>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentExamData = null;

        onAuthStateChanged(auth, async (user) => {
            const urlParams = new URLSearchParams(window.location.search);
            const lessonId = urlParams.get('id');

            if (!lessonId) {
                document.getElementById('examContainer').innerHTML = `<div class="exam-card" style="text-align:center; color:var(--danger);">عذراً، لم يتم تحديد الحصة المطلوبة.</div>`;
                return;
            }

            document.getElementById('backLinkContainer').innerHTML = `<a href="lesson-view.html?id=${lessonId}" class="btn-home-link">⬅ العودة للحصة</a>`;

            // منع عمل ريفريش أو الخروج الخطأ
            window.addEventListener('beforeunload', function (e) {
                e.preventDefault();
                e.returnValue = '';
            });

            await fetchLessonAndExam(lessonId);
        });

        // تفعيل زر الشاشة الكاملة
        document.getElementById('fullscreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("خطأ في تفعيل الشاشة الكاملة:", err);
                });
            } else {
                document.exitFullscreen();
            }
        });

        window.showPlatformToast = function(title, message) {
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastMessage').textContent = message;
            document.getElementById('platformToastModal').style.display = 'flex';
        };

        window.closePlatformToast = function() {
            document.getElementById('platformToastModal').style.display = 'none';
        };

        async function fetchLessonAndExam(lessonId) {
            try {
                const lessonRef = doc(db, "lessons", lessonId);
                const lessonSnap = await getDoc(lessonRef);

                if (!lessonSnap.exists()) {
                    showPlatformToast("تنبيه هام", "هذه الحصة غير موجودة!");
                    document.getElementById('examContainer').innerHTML = `<div class="exam-card" style="text-align:center; color:var(--danger);">هذه الحصة غير موجودة.</div>`;
                    return;
                }

                const lessonData = lessonSnap.data();
                if (!lessonData.examId) {
                    showPlatformToast("تنبيه هام", "لا يوجد امتحان مربوط بهذه الحصة حالياً!");
                    document.getElementById('examContainer').innerHTML = `<div class="exam-card" style="text-align:center; color:var(--danger); padding:40px;">عذراً، لا يوجد امتحان مربوط بهذه الحصة حتى الآن.</div>`;
                    return;
                }

                const examRef = doc(db, "exams", lessonData.examId);
                const examSnap = await getDoc(examRef);

                if (!examSnap.exists()) {
                    showPlatformToast("تنبيه هام", "الامتحان المرتبط غير موجود بالسحابة!");
                    document.getElementById('examContainer').innerHTML = `<div class="exam-card" style="text-align:center; color:var(--danger); padding:40px;">الامتحان المرتبط بهذه الحصة غير موجود أو تم حذفه.</div>`;
                    return;
                }

                currentExamData = examSnap.data();
                renderExam(currentExamData);
                showPlatformToast("بدء الاختبار 🚀", "تم تحميل الامتحان بنجاح. نتمنى لك التوفيق!");

            } catch (e) {
                console.error(e);
                showPlatformToast("خطأ ❌", "حدث خطأ أثناء تحميل بيانات الامتحان.");
                document.getElementById('examContainer').innerHTML = `<div class="exam-card" style="text-align:center; color:var(--danger); padding:40px;">حدث خطأ أثناء تحميل بيانات الامتحان.</div>`;
            }
        }

        function renderExam(exam) {
            let html = `
                <div class="exam-card">
                    <h2 class="exam-title">📝 ${exam.title || 'امتحان الحصة'}</h2>
                    <p class="exam-subtitle">المادة: ${exam.subject || 'عام'} | عدد الأسئلة: ${exam.questions ? exam.questions.length : 0}</p>
                    <form id="examForm" onsubmit="submitExam(event)">
            `;

            if (exam.questions && exam.questions.length > 0) {
                exam.questions.forEach((q, qIdx) => {
                    let typeLabel = getTypeNameArabic(q.type);
                    html += `
                        <div class="question-box">
                            <div class="question-text">سؤال ${qIdx + 1}: ${q.text} <span style="font-size:0.75rem; background:rgba(99,102,241,0.2); color:var(--primary); padding:2px 6px; border-radius:4px; margin-right:6px;">(${q.marks || 1} درجات - ${typeLabel})</span></div>
                            ${q.imageUrl ? `<img src="${q.imageUrl}" style="max-width:100%; max-height:220px; border-radius:8px; margin-bottom:12px; border:1px solid var(--border-color);" alt="صورة توضيحية">` : ''}
                    `;

                    // بناء واجهة السؤال بناءً على نوعه
                    if (q.type === 'tf' || q.type === 'mcq') {
                        if (q.options && q.options.length > 0) {
                            q.options.forEach((opt, oIdx) => {
                                html += `
                                    <label class="option-label">
                                        <input type="radio" name="q_${qIdx}" value="${oIdx}" style="cursor:pointer; width:16px; height:16px;">
                                        <span>${opt}</span>
                                    </label>
                                `;
                            });
                        }
                    } else if (q.type === 'checkbox') {
                        if (q.options && q.options.length > 0) {
                            q.options.forEach((opt, oIdx) => {
                                html += `
                                    <label class="option-label">
                                        <input type="checkbox" name="q_${qIdx}" value="${oIdx}" style="cursor:pointer; width:16px; height:16px;">
                                        <span>${opt}</span>
                                    </label>
                                `;
                            });
                        }
                    } else if (q.type === 'short' || q.type === 'long') {
                        let lines = q.type === 'short' ? 5 : 10;
                        html += `<textarea name="q_${qIdx}" rows="${lines}" placeholder="اكتب إجابتك هنا..." style="width:100%; padding:10px; border-radius:8px; background:var(--bg-main); border:1px solid var(--border-color); color:var(--text-main); margin-top:5px; resize:vertical;"></textarea>`;
                    } else if (q.type === 'essayImage') {
                        html += `
                            <div style="margin-top:10px;">
                                <textarea name="q_${qIdx}_text" rows="3" placeholder="اكتب إجابتك المقالية هنا..." style="width:100%; padding:10px; border-radius:8px; background:var(--bg-main); border:1px solid var(--border-color); color:var(--text-main); margin-bottom:8px;"></textarea>
                                <label style="font-size:0.78rem; color:var(--text-muted); display:block; margin-bottom:4px;">إرفاق صورة إجابة السؤال:</label>
                                <input type="file" name="q_${qIdx}_image" accept="image/*" style="width:100%; padding:8px; background:var(--bg-main); border:1px dashed var(--primary); border-radius:8px; color:var(--text-main);">
                            </div>
                        `;
                    } else if (q.type === 'voice') {
                        html += `
                            <div style="margin-top:10px; padding:12px; background:var(--bg-main); border-radius:8px; border:1px solid var(--border-color); text-align:center;">
                                <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:8px;">🎙️ سؤال إجابة صوتية (تسجيل ريكورد):</p>
                                <button type="button" onclick="alert('خاصية التسجيل الصوتى مفعلة، جاهز للربط بالميكروفون.')" style="background:var(--primary); color:white; border:none; padding:6px 14px; border-radius:6px; font-weight:bold; cursor:pointer;">بدء التسجيل 🔴</button>
                            </div>
                        `;
                    } else {
                        html += `<textarea name="q_${qIdx}" rows="3" placeholder="اكتب إجابتك هنا..." style="width:100%; padding:10px; border-radius:8px; background:var(--bg-main); border:1px solid var(--border-color); color:var(--text-main); margin-top:5px;"></textarea>`;
                    }

                    html += `</div>`;
                });
                html += `<button type="submit" class="btn-submit">إرسال وتسليم الامتحان نهائياً 🚀</button>`;
            } else {
                html += `<p style="text-align:center; color:var(--text-muted);">لا توجد أسئلة في هذا الامتحان.</p>`;
            }

            html += `</form></div>`;
            document.getElementById('examContainer').innerHTML = html;
        }

        function getTypeNameArabic(type) {
            switch(type) {
                case 'mcq': return 'اختياري مفرد';
                case 'checkbox': return 'اختياري متعدد';
                case 'tf': return 'صح وخطأ';
                case 'short': return 'نص قصير';
                case 'long': return 'نص طويل مقال';
                case 'essayImage': return 'مقالي مع صورة';
                case 'voice': return 'تسجيل صوتي';
                default: return 'سؤال عام';
            }
        }

        window.submitExam = function(event) {
            event.preventDefault();
            showPlatformToast("تم التسليم بنجاح 🎓", "✔ تم تسليم الامتحان بنجاح، جاري مراجعة إجاباتك ورصد الدرجات!");
            setTimeout(() => {
                window.location.href = window.location.search.includes('id=') ? `lesson-view.html?id=${new URLSearchParams(window.location.search).get('id')}` : 'files.html';
            }, 3000);
        };
    </script>
</body>
</html>
