<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - امتحان الحصة</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.12);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            --th-bg: rgba(255, 255, 255, 0.04);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            --th-bg: rgba(0, 0, 0, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        .btn-home-link {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .exam-card {
            background-color: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow);
            padding: 24px; margin-bottom: 20px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
        }

        .exam-title { font-size: 1.3rem; font-weight: bold; color: var(--text-main); margin-bottom: 6px; text-align: center; }
        .exam-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; text-align: center; }

        .question-box {
            background: var(--th-bg); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 18px; margin-bottom: 16px;
        }
        .question-text { font-size: 0.95rem; font-weight: bold; color: var(--text-main); margin-bottom: 12px; }
        
        .option-label {
            display: flex; align-items: center; gap: 10px; background: var(--bg-main);
            padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color);
            margin-bottom: 8px; cursor: pointer; font-size: 0.88rem;
        }
        .option-label:hover { background: var(--hover-bg); border-color: var(--primary); }

        .btn-submit {
            background-color: var(--success); color: white; border: none; width: 100%;
            padding: 12px; border-radius: 10px; font-weight: bold; font-size: 1rem;
            cursor: pointer; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); margin-top: 20px;
        }
        .btn-submit:hover { opacity: 0.9; }

        .result-box {
            background: var(--bg-card); border-radius: 16px; padding: 30px; text-align: center;
            border: 1px solid var(--border-color); box-shadow: var(--shadow); display: none;
        }
    </style>
</head>
<body data-theme="dark">

    <div class="container">
        <header class="platform-header">
            <div id="backLinkContainer"><a href="files.html" class="btn-home-link">⬅ العودة</a></div>
            <div style="font-weight: 700; font-size: 0.95rem;">منصة رحلة دراسية - اختبار الحصة 📝</div>
            <div></div>
        </header>

        <div id="examContainer">
            <div style="text-align: center; padding: 50px; color: var(--text-muted);">جاري تحميل الامتحان المرتبط بالحصة...</div>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentExamData = null;

        onAuthStateChanged(auth, async (user) => {
            const urlParams = new URLSearchParams(window.location.search);
            const lessonId = urlParams.get('id');

            if (!lessonId) {
                document.getElementById('examContainer').innerHTML = `<div class="exam-card" style="text-align:center; color:var(--danger);">عذراً، لم يتم تحديد الحصة المطلوبة.</div>`;
                return;
            }

            // تحديث زر العودة ليرجع لصفحة عرض الحصة الأصلية
            document.getElementById('backLinkContainer').innerHTML = `<a href="lesson-view.html?id=${lessonId}" class="btn-home-link">⬅ العودة للحصة</a>`;

            await fetchLessonAndExam(lessonId);
        });

        async function fetchLessonAndExam(lessonId) {
            try {
                const lessonRef = doc(db, "lessons", lessonId);
                const lessonSnap = await getDoc(lessonRef);

                if (!lessonSnap.exists()) {
                    document.getElementById('examContainer').innerHTML = `<div class="exam-card" style="text-align:center; color:var(--danger);">هذه الحصة غير موجودة.</div>`;
                    return;
                }

                const lessonData = lessonSnap.data();
                if (!lessonData.examId) {
                    document.getElementById('examContainer').innerHTML = `<div class="exam-card" style="text-align:center; color:var(--danger); padding:40px;">عذراً، لا يوجد امتحان مربوط بهذه الحصة حتى الآن.</div>`;
                    return;
                }

                // جلب الامتحان من كولكشن exams
                const examRef = doc(db, "exams", lessonData.examId);
                const examSnap = await getDoc(examRef);

                if (!examSnap.exists()) {
                    document.getElementById('examContainer').innerHTML = `<div class="exam-card" style="text-align:center; color:var(--danger); padding:40px;">الامتحان المرتبط بهذه الحصة غير موجود أو تم حذفه.</div>`;
                    return;
                }

                currentExamData = examSnap.data();
                renderExam(currentExamData);

            } catch (e) {
                console.error(e);
                document.getElementById('examContainer').innerHTML = `<div class="exam-card" style="text-align:center; color:var(--danger); padding:40px;">حدث خطأ أثناء تحميل بيانات الامتحان.</div>`;
            }
        }

        function renderExam(exam) {
            let html = `
                <div class="exam-card">
                    <h2 class="exam-title">📝 ${exam.title || 'امتحان الحصة'}</h2>
                    <p class="exam-subtitle">المادة: ${exam.subject || 'عام'} | عدد الأسئلة: ${exam.questions ? exam.questions.length : 0}</p>
                    <form id="examForm" onsubmit="submitExam(event)">
            `;

            if (exam.questions && exam.questions.length > 0) {
                exam.questions.forEach((q, qIdx) => {
                    html += `
                        <div class="question-box">
                            <div class="question-text">سؤال ${qIdx + 1}: ${q.text} (${q.marks || 1} درجة)</div>
                            ${q.imageUrl ? `<img src="${q.imageUrl}" style="max-width:100%; max-height:200px; border-radius:8px; margin-bottom:10px;" alt="صورة السؤال">` : ''}
                    `;

                    if (q.options && q.options.length > 0) {
                        q.options.forEach((opt, oIdx) => {
                            let inputType = q.type === 'checkbox' ? 'checkbox' : 'radio';
                            html += `
                                <label class="option-label">
                                    <input type="${inputType}" name="q_${qIdx}" value="${oIdx}" style="cursor:pointer;">
                                    <span>${opt}</span>
                                </label>
                            `;
                        });
                    } else {
                        html += `<textarea name="q_${qIdx}" rows="3" placeholder="اكتب إجابتك هنا..." style="width:100%; padding:10px; border-radius:8px; background:var(--bg-main); border:1px solid var(--border-color); color:var(--text-main); margin-top:5px;"></textarea>`;
                    }

                    html += `</div>`;
                });
                html += `<button type="submit" class="btn-submit">إرسال وتسليم الامتحان 🚀</button>`;
            } else {
                html += `<p style="text-align:center; color:var(--text-muted);">لا توجد أسئلة في هذا الامتحان.</p>`;
            }

            html += `</form></div>`;
            document.getElementById('examContainer').innerHTML = html;
        }

        window.submitExam = function(event) {
            event.preventDefault();
            alert('✔ تم تسليم الامتحان بنجاح! (سيتم إرسال الدرجة والتقرير قريباً)');
            window.location.href = window.location.href; // إعادة تحميل الصفحة أو توجيه الطالب
        };
    </script>
</body>
</html>
