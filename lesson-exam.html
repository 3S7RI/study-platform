<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - امتحان الحصة</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.12);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            --th-bg: rgba(255, 255, 255, 0.04);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            --th-bg: rgba(0, 0, 0, 0.02);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; user-select: none; -webkit-user-select: none; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        .btn-home-link {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem; cursor: pointer;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .timer-box-ui {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(99, 102, 241, 0.1);
            padding: 5px 12px; border-radius: 15px; border: 1px solid var(--primary);
            color: var(--primary); font-weight: bold; font-size: 0.82rem;
        }
        .timer-box-ui svg { width: 16px; height: 16px; fill: currentColor; }

        .exam-card {
            background-color: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow);
            padding: 24px; margin-bottom: 20px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
        }

        .exam-title { font-size: 1.3rem; font-weight: bold; color: var(--text-main); margin-bottom: 6px; text-align: center; }
        .exam-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; text-align: center; }

        .question-box {
            background: var(--th-bg); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 18px; margin-bottom: 16px;
        }
        .question-text { font-size: 0.95rem; font-weight: bold; color: var(--text-main); margin-bottom: 12px; text-align: right; }
        
        .option-label {
            display: flex; align-items: center; gap: 10px; background: var(--bg-main);
            padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color);
            margin-bottom: 8px; cursor: pointer; font-size: 0.88rem; text-align: right;
        }
        .option-label:hover { background: var(--hover-bg); border-color: var(--primary); }

        .btn-submit {
            background-color: var(--success); color: white; border: none; width: 100%;
            padding: 12px; border-radius: 10px; font-weight: bold; font-size: 1rem;
            cursor: pointer; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); margin-top: 20px;
        }
        .btn-submit:hover { opacity: 0.9; }

        /* نافذة التنبيهات ونظام الـ Modal المنمقة */
        .platform-toast-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 2000; padding: 15px;
        }
        .platform-toast-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
            width: 100%; max-width: 380px; border-radius: 16px; padding: 22px; text-align: center; box-shadow: var(--shadow);
        }
        .platform-toast-card h3 { font-size: 1rem; color: var(--text-main); margin-bottom: 8px; font-weight: 700; }
        .platform-toast-card p { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 16px; line-height: 1.5; white-space: pre-line; text-align: right; }
        .platform-toast-btn {
            background: var(--primary); color: white; border: none; padding: 9px 16px; border-radius: 8px;
            font-weight: bold; font-size: 0.85rem; cursor: pointer; width: 100%;
        }
        .toast-btns-group { display: flex; gap: 8px; margin-top: 10px; }
    </style>
</head>
<body data-theme="dark">

    <div class="container">
        <header class="platform-header">
            <button onclick="confirmLeaveExam()" class="btn-home-link">⬅ العودة للحصة</button>
            <div style="font-weight: 700; font-size: 0.95rem;">امتحان الحصة 📝</div>
            <div class="timer-box-ui">
                <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8zm1-13h-2v6h6v-2h-4z"/></svg>
                <span id="timerDisplay">جاري التحميل...</span>
            </div>
        </header>

        <div id="examContainer">
            <div style="text-align: center; padding: 50px; color: var(--text-muted);">جاري تحميل الامتحان المرتبط بالحصة وتفعيل إعدادات الأمان...</div>
        </div>
    </div>

    <!-- نافذة التنبيهات والرسائل -->
    <div class="platform-toast-overlay" id="platformToastModal">
        <div class="platform-toast-card" onclick="event.stopPropagation()">
            <h3 id="toastTitle">تنبيه المنصة 🔔</h3>
            <p id="toastMessage">رسالة التنبيه هنا...</p>
            <div id="toastActionContainer">
                <button class="platform-toast-btn" id="toastActionBtn" onclick="closePlatformToast()">حسناً فهمت 👍</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserId = null;
        let activeLessonId = null;
        let lessonSettings = {};
        let currentExamData = null;
        let timerInterval = null;
        let remainingSeconds = 0;
        let isSubmitted = false;

        onAuthStateChanged(auth, async (user) => {
            if (user) currentUserId = user.uid;

            const urlParams = new URLSearchParams(window.location.search);
            activeLessonId = urlParams.get('id');

            if (!activeLessonId) {
                document.getElementById('examContainer').innerHTML = `<div class="exam-card" style="text-align:center; color:var(--danger);">عذراً، لم يتم تحديد الحصة المطلوبة.</div>`;
                return;
            }

            await fetchLessonAndExamSettings(activeLessonId);
        });

        window.showPlatformToast = function(title, message, customButtonsHtml = null, callback = null) {
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastMessage').textContent = message;
            const container = document.getElementById('toastActionContainer');
            
            if (customButtonsHtml) {
                container.innerHTML = customButtonsHtml;
            } else {
                container.innerHTML = `<button class="platform-toast-btn" id="toastActionBtn">حسناً فهمت 👍</button>`;
                document.getElementById('toastActionBtn').onclick = function() {
                    closePlatformToast();
                    if (callback) callback();
                };
            }

            document.getElementById('platformToastModal').style.display = 'flex';
        };

        window.closePlatformToast = function() {
            document.getElementById('platformToastModal').style.display = 'none';
        };

        // زر العودة للحصة مع تنبيه المنصة المخصص
        window.confirmLeaveExam = function() {
            if (isSubmitted) {
                window.location.href = `files-lesson-view.html?id=${activeLessonId}`;
                return;
            }

            let btnsHtml = `
                <div class="toast-btns-group">
                    <button class="platform-toast-btn" style="background:var(--danger);" onclick="forceSubmitAndLeave()">موافق، تسليم 🚨</button>
                    <button class="platform-toast-btn" style="background:var(--primary);" onclick="closePlatformToast()">إكمال الحل ✍️</button>
                </div>
            `;
            showPlatformToast("تنبيه مغادرة الامتحان ⚠️", "إذا عدت إلى الحصة سيتم احتساب المحاولة وخصمها منك وستهلك إجاباتك للتصحيح.", btnsHtml);
        };

        window.forceSubmitAndLeave = function() {
            closePlatformToast();
            submitExam(null, true);
        };

        async function fetchLessonAndExamSettings(lessonId) {
            try {
                const lessonRef = doc(db, "lessons", lessonId);
                const lessonSnap = await getDoc(lessonRef);

                if (!lessonSnap.exists()) {
                    showPlatformToast("تنبيه 🔔", "هذه الحصة غير موجودة!", null, () => { window.location.href = 'files.html'; });
                    return;
                }

                const lessonData = lessonSnap.data();
                lessonSettings = lessonData.settings || {};

                if (!lessonData.examId) {
                    showPlatformToast("تنبيه 🔔", "لا يوجد امتحان مربوط بهذه الحصة حالياً!", null, () => { window.location.href = `files-lesson-view.html?id=${lessonId}`; });
                    return;
                }

                const examRef = doc(db, "exams", lessonData.examId);
                const examSnap = await getDoc(examRef);

                if (!examSnap.exists()) {
                    showPlatformToast("خطأ ❌", "الامتحان المرتبط غير موجود بالسحابة.", null, () => { window.location.href = `files-lesson-view.html?id=${lessonId}`; });
                    return;
                }

                currentExamData = examSnap.data();

                // تفعيل الشاشة الكاملة فوراً عند التحميل
                if (lessonSettings.fullScreen !== false) {
                    activateFullScreen();
                }

                // منع الريفريش والخروج لمنع الغش
                window.addEventListener('beforeunload', function (e) {
                    if (!isSubmitted) {
                        e.preventDefault();
                        e.returnValue = '';
                    }
                });

                if (lessonSettings.welcomeToggle !== false && lessonSettings.welcomeMsg) {
                    showPlatformToast("تعليمات الاختبار 📌", lessonSettings.welcomeMsg, null, () => {
                        renderExamContent(currentExamData);
                        startExamTimer();
                    });
                } else {
                    renderExamContent(currentExamData);
                    startExamTimer();
                }

            } catch (e) {
                console.error(e);
                showPlatformToast("خطأ ❌", "حدث خطأ أثناء تحميل بيانات الامتحان.");
            }
        }

        function activateFullScreen() {
            try {
                let elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {});
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            } catch(e) {}
        }

        function startExamTimer() {
            let durationMinutes = lessonSettings.duration || 30;
            remainingSeconds = durationMinutes * 60;

            const timerEl = document.getElementById('timerDisplay');
            timerInterval = setInterval(() => {
                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    alert("انتهى وقت الامتحان المخصص! سيتم تسليم الإجابات تلقائياً.");
                    submitExam(null, true);
                    return;
                }
                let mins = Math.floor(remainingSeconds / 60);
                let secs = remainingSeconds % 60;
                timerEl.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                remainingSeconds--;
            }, 1000);
        }

        function renderExamContent(exam) {
            let questions = exam.questions || [];
            if (lessonSettings.shuffle && questions.length > 1) {
                questions.sort(() => Math.random() - 0.5);
            }

            let html = `
                <div class="exam-card">
                    <h2 class="exam-title">📝 ${exam.title || 'امتحان الحصة'}</h2>
                    <p class="exam-subtitle">المادة: ${exam.subject || 'عام'} | عدد الأسئلة: ${questions.length}</p>
                    <form id="examForm" onsubmit="handleExamFormSubmit(event)">
            `;

            if (questions.length > 0) {
                questions.forEach((q, qIdx) => {
                    html += `
                        <div class="question-box" id="q_box_${qIdx}">
                            <div class="question-text">سؤال ${qIdx + 1}: ${q.text} <span style="font-size:0.75rem; background:rgba(99,102,241,0.2); color:var(--primary); padding:2px 6px; border-radius:4px; margin-right:6px;">(${q.marks || 1} درجات)</span></div>
                            ${q.imageUrl ? `<img src="${q.imageUrl}" style="max-width:100%; max-height:220px; border-radius:8px; margin-bottom:12px; border:1px solid var(--border-color);" alt="صورة السؤال">` : ''}
                    `;

                    if (q.options && q.options.length > 0) {
                        q.options.forEach((opt, oIdx) => {
                            let inputType = q.type === 'checkbox' ? 'checkbox' : 'radio';
                            html += `
                                <label class="option-label">
                                    <input type="${inputType}" name="q_${qIdx}" value="${oIdx}" style="cursor:pointer; width:16px; height:16px;">
                                    <span>${opt}</span>
                                </label>
                            `;
                        });
                    } else if (q.type === 'essayImage') {
                        html += `
                            <div style="margin-top:10px;">
                                <textarea name="q_${qIdx}_text" rows="3" placeholder="اكتب إجابتك المقالية هنا..." style="width:100%; padding:10px; border-radius:8px; background:var(--bg-main); border:1px solid var(--border-color); color:var(--text-main); margin-bottom:8px;"></textarea>
                                <input type="file" name="q_${qIdx}_image" accept="image/*" style="width:100%; padding:8px; background:var(--bg-main); border:1px dashed var(--primary); border-radius:8px; color:var(--text-main);">
                            </div>
                        `;
                    } else {
                        html += `<textarea name="q_${qIdx}" rows="4" placeholder="اكتب إجابتك هنا..." style="width:100%; padding:10px; border-radius:8px; background:var(--bg-main); border:1px solid var(--border-color); color:var(--text-main); margin-top:5px;"></textarea>`;
                    }

                    html += `</div>`;
                });
                html += `<button type="submit" class="btn-submit">إرسال وتسليم الامتحان نهائياً 🚀</button>`;
            } else {
                html += `<p style="text-align:center; color:var(--text-muted);">لا توجد أسئلة في هذا الامتحان.</p>`;
            }

            html += `</form></div>`;
            document.getElementById('examContainer').innerHTML = html;
        }

        window.handleExamFormSubmit = function(event) {
            event.preventDefault();
            
            // فحص هل هناك أسئلة لم تُحل
            let questions = currentExamData.questions || [];
            let unansweredCount = 0;

            questions.forEach((q, qIdx) => {
                let answered = false;
                if (q.options && q.options.length > 0) {
                    let checkedInputs = document.querySelectorAll(`input[name="q_${qIdx}"]:checked`);
                    if (checkedInputs.length > 0) answered = true;
                } else if (q.type === 'essayImage') {
                    let textVal = document.querySelector(`textarea[name="q_${qIdx}_text"]`);
                    if (textVal && textVal.value.trim() !== '') answered = true;
                } else {
                    let textVal = document.querySelector(`textarea[name="q_${qIdx}"]`);
                    if (textVal && textVal.value.trim() !== '') answered = true;
                }
                if (!answered) unansweredCount++;
            });

            if (unansweredCount > 0) {
                let btnsHtml = `
                    <div class="toast-btns-group">
                        <button class="platform-toast-btn" style="background:var(--primary);" onclick="closePlatformToast()">الرجوع للحل ✍️</button>
                        <button class="platform-toast-btn" style="background:var(--success);" onclick="proceedWithSubmission()">أنا أعلم، تسليم الان 🚀</button>
                    </div>
                `;
                showPlatformToast("تنبيه الأسئلة غير المكتملة ⚠️", `لديك ${unansweredCount} أسئلة لم تقم بالإجابة عليها. هل أنت متأكد من التسليم؟`, btnsHtml);
            } else {
                submitExam(event, true);
            }
        };

        window.proceedWithSubmission = function() {
            closePlatformToast();
            submitExam(null, true);
        };

        window.submitExam = async function(event, isForced = false) {
            if (isSubmitted) return;
            isSubmitted = true;

            if (timerInterval) clearInterval(timerInterval);

            if (currentUserId) {
                try {
                    let userRef = doc(db, "users", currentUserId);
                    let pts = lessonSettings.points || {};
                    let examPoints = pts.exam !== undefined ? pts.exam : 10;

                    await updateDoc(userRef, {
                        points: increment(examPoints)
                    });
                } catch(e) {
                    console.log("Error awarding points:", e);
                }
            }

            // التحقق من تفعيل النتيجة الفورية
            let instantResultActive = lessonSettings.instantResult !== false;
            let endMsg = "";

            if (instantResultActive) {
                endMsg = (lessonSettings.endMsgToggle !== false && lessonSettings.customMsg) ? lessonSettings.customMsg : "✔ تم تسليم الامتحان بنجاح، شكراً لجهودك!";
            } else {
                endMsg = "⏳ تم تسليم إجاباتك بنجاح. يرجى الانتظار حتى يتم تصحيح الامتحان من قبل المعلم.";
            }
            
            showPlatformToast("انتهى الامتحان 🎓", endMsg, null, () => {
                window.location.href = `files-lesson-view.html?id=${activeLessonId}`;
            });
        };
    </script>
</body>
</html>
