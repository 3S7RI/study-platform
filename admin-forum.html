<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المنتدى والأسئلة - لوحة التحكم</title>
    <style>
        :root {
            --bg-color: #121212;
            --header-bg: #1f1f1f;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --heading-color: #ffffff;
            --input-bg: #0f172a;
            --th-bg: rgba(255,255,255,0.05);
        }
        [data-theme="light"] {
            --bg-color: #f4f7f6;
            --header-bg: #1e3c72;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #eee;
            --heading-color: #1e3c72;
            --input-bg: #ffffff;
            --th-bg: rgba(0,0,0,0.02);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); padding: 15px; transition: background 0.3s, color 0.3s; }
        .container { max-width: 1050px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; background: var(--header-bg); color: white; padding: 10px 15px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 10px;}
        .header-right { display: flex; align-items: center; gap: 10px; }
        .header-center { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; flex: 1; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        
        .btn-action, .btn-back { background: #34495e; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.78rem; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; }
        .btn-action.active { background: #8e44ad; }
        .btn-theme { background: #34495e; color: white; border: none; width: 34px; height: 34px; font-size: 0.95rem; padding: 0; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }

        .section-box { background: var(--card-bg); border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); padding: 20px; margin-bottom: 20px; border-top: 4px solid #8e44ad; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .section-header h2 { color: var(--heading-color); font-size: 1.1rem; }
        
        /* إعدادات المنتدى */
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .setting-card { background: var(--th-bg); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .setting-card label { font-size: 0.82rem; font-weight: 500; cursor: pointer; }
        
        .switch { position: relative; display: inline-block; width: 42px; height: 22px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #27ae60; }
        input:checked + .slider:before { transform: translateX(20px); }

        .form-group { margin-top: 12px; }
        .form-group label { display: block; font-size: 0.82rem; margin-bottom: 5px; opacity: 0.8; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); font-size: 0.85rem; outline: none; }
        
        .btn-save { background: #27ae60; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; margin-top: 12px; }

        /* ستايل عرض المنتدى والدردشة */
        .post-card, .chat-msg-card { background: var(--th-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .post-author { font-weight: bold; color: var(--heading-color); font-size: 0.9rem; }
        .post-date { font-size: 0.72rem; opacity: 0.6; }
        .post-content { font-size: 0.9rem; line-height: 1.5; margin-bottom: 10px; word-break: break-word; }
        
        .comments-section { margin-top: 10px; border-top: 1px dashed var(--border-color); padding-top: 10px; }
        .comment-item { background: var(--card-bg); padding: 8px 10px; border-radius: 6px; margin-bottom: 8px; font-size: 0.82rem; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        
        .reply-box { display: flex; gap: 8px; margin-top: 10px; }
        .reply-box input { flex: 1; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); font-size: 0.82rem; outline: none; }
        .btn-reply { background: #3498db; color: white; border: none; padding: 7px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.8rem; white-space: nowrap; }
        
        .btn-danger { background: #e74c3c; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.72rem; cursor: pointer; font-weight: bold; }
        .btn-pin { background: #f39c12; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.72rem; cursor: pointer; font-weight: bold; }
        .post-actions { display: flex; gap: 6px; align-items: center; }

        /* تنسيق دردشة الطلاب المصغرة للأدمن */
        .chat-bubble { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; background: var(--card-bg); padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); }
        .chat-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #8e44ad; }
        .chat-info { flex: 1; }
        .chat-username { font-weight: bold; font-size: 0.85rem; color: var(--heading-color); }
        .chat-level { background: #8e44ad; color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; margin-right: 5px; }
        .chat-text { font-size: 0.85rem; margin-top: 4px; word-break: break-word; }

        .hidden { display: none !important; }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <!-- الهيدر المحدث -->
        <header>
            <div class="header-right">
                <a href="admin-dashboard.html" class="btn-back">اللوحة الرئيسية ↩️</a>
            </div>
            
            <div class="header-center">
                <button class="btn-action active" id="btnTabPosts" onclick="switchTab('posts')">أسئلة المنتدى 💬</button>
                <button class="btn-action" id="btnTabChat" onclick="switchTab('chat')">دردشة الطلاب 👥</button>
                <button class="btn-action" id="btnTabSettings" onclick="switchTab('settings')">إعدادات المنتدى ⚙️</button>
            </div>
            
            <div class="header-left">
                <button class="btn-theme" id="themeToggleBtn" title="تغيير الثيم">☀️</button>
            </div>
        </header>

        <!-- شاشة 1: أسئلة ومنشورات المنتدى -->
        <div id="tabPostsContent" class="section-box">
            <div class="section-header">
                <h2>أسئلة ومنشورات الطلاب (متابعة وتفاعل مباشر)</h2>
            </div>
            <div id="adminForumFeed">
                <p style="text-align: center; opacity: 0.7; padding: 20px;">جاري تحميل أسئلة وتفاعلات المنتدى من السحابة...</p>
            </div>
        </div>

        <!-- شاشة 2: دردشة الطلاب -->
        <div id="tabChatContent" class="section-box hidden">
            <div class="section-header">
                <h2>دردشة الطلاب الجماعية (بأنماط الواتساب) 💬</h2>
            </div>
            <div id="adminChatFeed">
                <p style="text-align: center; opacity: 0.7; padding: 20px;">جاري تحميل رسائل دردشة الطلاب...</p>
            </div>
            <div class="reply-box" style="margin-top: 15px;">
                <input type="text" id="adminChatInput" placeholder="اكتب رسالة في دردشة الطلاب كمعلم...">
                <button class="btn-reply" onclick="sendAdminChatMessage()">إرسال رسالة 🚀</button>
            </div>
        </div>

        <!-- شاشة 3: إعدادات المنتدى المطورة -->
        <div id="tabSettingsContent" class="section-box hidden">
            <div class="section-header">
                <h2>إعدادات وتحكم المنتدى السحابي ⚙️</h2>
            </div>
            
            <div class="settings-grid">
                <div class="setting-card">
                    <label for="settingOpenForum">وضع صيانة المنتدى</label>
                    <label class="switch"><input type="checkbox" id="settingOpenForum" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingAllowNewQuestions">استقبال الأسئلة</label>
                    <label class="switch"><input type="checkbox" id="settingAllowNewQuestions" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingAllowReplies">السماح برد الطلاب على بعضهم</label>
                    <label class="switch"><input type="checkbox" id="settingAllowReplies" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingAutoApprove">النشر المباشر (بدون مراجعة الأدمن)</label>
                    <label class="switch"><input type="checkbox" id="settingAutoApprove" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingAllowLikes">تفعيل الإعجابات والتفاعلات</label>
                    <label class="switch"><input type="checkbox" id="settingAllowLikes" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingAllowEmojis">تحديد رموز التفاعل</label>
                    <label class="switch"><input type="checkbox" id="settingAllowEmojis" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingEnableStudentChat">تفعيل صفحة دردشة الطلاب</label>
                    <label class="switch"><input type="checkbox" id="settingEnableStudentChat" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingHideStudentChat">إخفاء صفحة دردشة الطلاب تماماً</label>
                    <label class="switch"><input type="checkbox" id="settingHideStudentChat"><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingBlockLinks">حظر إرسال الروابط الخارجية</label>
                    <label class="switch"><input type="checkbox" id="settingBlockLinks"><span class="slider"></span></label>
                </div>
            </div>
            
            <div class="form-group">
                <label>الحد الأقصى لعدد حروف المنشور أو التعليق:</label>
                <input type="number" id="settingMaxLength" value="500">
            </div>
            <div class="form-group">
                <label>إيموجيات التفاعلات المتاحة (افصل بينها بفاصلة ,):</label>
                <input type="text" id="settingEmojisList" placeholder="🤍, 👀, 😂, 🔥, 👍">
            </div>
            <div class="form-group">
                <label>الكلمات الممنوعة (افصل بينها بفاصلة ,):</label>
                <input type="text" id="settingBadWords" placeholder="سب, شتم, رابط_مشبوه">
            </div>
            <div class="form-group">
                <label>رسالة الصيانة:</label>
                <textarea id="settingMaintenanceMsg" placeholder="المنتدى مغلق مؤقتاً للصيانة والتحديث..." style="height: 60px; resize: none;"></textarea>
            </div>
            <button class="btn-save" onclick="saveForumSettings()">حفظ وتحديث الإعدادات بالسحابة 🚀</button>
        </div>
    </div>

    <script>
        const BIN_ID = '6ab78eaeffd5d1605330ce1e'; 
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';
        let globalRecordData = { forumPosts: [], studentChat: [], forumSettings: { isOpen: true, allowNewQuestions: true, allowReplies: true, autoApprove: true, allowLikes: true, allowEmojis: true, emojisList: '🤍, 👀, 😂, 🔥, 👍', enableStudentChat: true, hideStudentChat: false, blockLinks: false, maxLength: 500, badWords: '', maintenanceMsg: '' } };

        const cloudHeaders = { 'X-Master-Key': API_KEY, 'Content-Type': 'application/json' };

        // نظام تبديل الثيم
        const themeBtn = document.getElementById('themeToggleBtn');
        let currentTheme = document.body.getAttribute('data-theme');
        themeBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';

        themeBtn.addEventListener('click', () => {
            let theme = document.body.getAttribute('data-theme');
            if (theme === 'dark') {
                document.body.setAttribute('data-theme', 'light');
                themeBtn.textContent = '🌙';
            } else {
                document.body.setAttribute('data-theme', 'dark');
                themeBtn.textContent = '☀️';
            }
        });

        // نظام التبديل بين التبويبات
        function switchTab(tab) {
            const btnPosts = document.getElementById('btnTabPosts');
            const btnChat = document.getElementById('btnTabChat');
            const btnSettings = document.getElementById('btnTabSettings');
            
            const contentPosts = document.getElementById('tabPostsContent');
            const contentChat = document.getElementById('tabChatContent');
            const contentSettings = document.getElementById('tabSettingsContent');

            btnPosts.classList.remove('active');
            btnChat.classList.remove('active');
            btnSettings.classList.remove('active');
            
            contentPosts.classList.add('hidden');
            contentChat.classList.add('hidden');
            contentSettings.classList.add('hidden');

            if (tab === 'posts') {
                btnPosts.classList.add('active');
                contentPosts.classList.remove('hidden');
            } else if (tab === 'chat') {
                btnChat.classList.add('active');
                contentChat.classList.remove('hidden');
            } else {
                btnSettings.classList.add('active');
                contentSettings.classList.remove('hidden');
            }
        }

        // جلب البيانات من السحابة
        initForumPage();

        async function initForumPage() {
            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { method: 'GET', headers: cloudHeaders });
                if (response.ok) {
                    let result = await response.json();
                    if (result && result.record) {
                        globalRecordData = result.record;
                        loadSettingsToUI();
                    }
                }
            } catch (err) {
                console.warn("خطأ في جلب بيانات المنتدى:", err);
            } finally {
                renderAdminForumFeed(globalRecordData.forumPosts || []);
                renderAdminChatFeed(globalRecordData.studentChat || []);
            }
        }

        function loadSettingsToUI() {
            let settings = globalRecordData.forumSettings || {};
            document.getElementById('settingOpenForum').checked = settings.isOpen !== false;
            document.getElementById('settingAllowNewQuestions').checked = settings.allowNewQuestions !== false;
            document.getElementById('settingAllowReplies').checked = settings.allowReplies !== false;
            document.getElementById('settingAutoApprove').checked = settings.autoApprove !== false;
            document.getElementById('settingAllowLikes').checked = settings.allowLikes !== false;
            document.getElementById('settingAllowEmojis').checked = settings.allowEmojis !== false;
            document.getElementById('settingEnableStudentChat').checked = settings.enableStudentChat !== false;
            document.getElementById('settingHideStudentChat').checked = settings.hideStudentChat === true;
            document.getElementById('settingBlockLinks').checked = settings.blockLinks === true;
            document.getElementById('settingMaxLength').value = settings.maxLength || 500;
            document.getElementById('settingEmojisList').value = settings.emojisList || '🤍, 👀, 😂, 🔥, 👍';
            document.getElementById('settingBadWords').value = settings.badWords || '';
            document.getElementById('settingMaintenanceMsg').value = settings.maintenanceMsg || '';
        }

        async function updateCloudData() {
            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: cloudHeaders,
                    body: JSON.stringify(globalRecordData)
                });
                if (!response.ok) alert("فشل التحديث في السحابة!");
            } catch(e) {
                console.error("خطأ سحابي:", e);
                alert("حدث خطأ أثناء الاتصال بالسحابة.");
            }
        }

        async function saveForumSettings() {
            if (!globalRecordData.forumSettings) globalRecordData.forumSettings = {};
            
            globalRecordData.forumSettings.isOpen = document.getElementById('settingOpenForum').checked;
            globalRecordData.forumSettings.allowNewQuestions = document.getElementById('settingAllowNewQuestions').checked;
            globalRecordData.forumSettings.allowReplies = document.getElementById('settingAllowReplies').checked;
            globalRecordData.forumSettings.autoApprove = document.getElementById('settingAutoApprove').checked;
            globalRecordData.forumSettings.allowLikes = document.getElementById('settingAllowLikes').checked;
            globalRecordData.forumSettings.allowEmojis = document.getElementById('settingAllowEmojis').checked;
            globalRecordData.forumSettings.enableStudentChat = document.getElementById('settingEnableStudentChat').checked;
            globalRecordData.forumSettings.hideStudentChat = document.getElementById('settingHideStudentChat').checked;
            globalRecordData.forumSettings.blockLinks = document.getElementById('settingBlockLinks').checked;
            globalRecordData.forumSettings.maxLength = parseInt(document.getElementById('settingMaxLength').value) || 500;
            globalRecordData.forumSettings.emojisList = document.getElementById('settingEmojisList').value.trim();
            globalRecordData.forumSettings.badWords = document.getElementById('settingBadWords').value.trim();
            globalRecordData.forumSettings.maintenanceMsg = document.getElementById('settingMaintenanceMsg').value.trim();

            await updateCloudData();
            alert('تم حفظ إعدادات المنتدى وتحديثها سحابياً بنجاح! 🚀');
        }

        // عرض المنشورات والتعليقات الخاصة بالأسئلة
        function renderAdminForumFeed(posts) {
            const container = document.getElementById('adminForumFeed');
            if (!posts || posts.length === 0) {
                container.innerHTML = '<p style="text-align: center; opacity: 0.7; padding: 20px;">لا توجد أسئلة أو منشورات في المنتدى حالياً.</p>';
                return;
            }

            let html = '';
            posts.forEach((post, postIndex) => {
                let isPinned = post.pinned === true;
                let commentsHtml = '';
                
                if (post.comments && post.comments.length > 0) {
                    post.comments.forEach((comm, commIndex) => {
                        commentsHtml += `
                            <div class="comment-item">
                                <div><b>💬 ${comm.author || 'مستخدم'}:</b> ${comm.text}</div>
                                <button class="btn-danger" onclick="deleteComment(${postIndex}, ${commIndex})">حذف</button>
                            </div>`;
                    });
                } else {
                    commentsHtml = '<p style="font-size: 0.78rem; opacity: 0.5; margin-bottom: 6px;">لا توجد تعليقات بعد.</p>';
                }

                html += `
                    <div class="post-card">
                        <div class="post-header">
                            <div>
                                <span class="post-author">👤 ${post.author || 'طالب'}</span>
                                <span class="post-date"> - ${post.date || ''}</span>
                                ${isPinned ? '<span style="color:#f39c12; font-weight:bold; margin-right: 6px;">📌 مثبت</span>' : ''}
                            </div>
                            <div class="post-actions">
                                <button class="btn-pin" onclick="togglePinPost(${postIndex})">${isPinned ? 'إلغاء التثبيت' : 'تثبيت'}</button>
                                <button class="btn-danger" onclick="deleteForumPost(${postIndex})">حذف السؤال</button>
                            </div>
                        </div>
                        <div class="post-content">${post.content || ''}</div>
                        
                        <div class="comments-section">
                            <p style="font-size: 0.8rem; font-weight: bold; margin-bottom: 5px;">التعليقات والردود:</p>
                            ${commentsHtml}
                            <div class="reply-box">
                                <input type="text" id="adminReplyInput_${postIndex}" placeholder="اكتب رد كأدمن...">
                                <button class="btn-reply" onclick="sendAdminReply(${postIndex})">إرسال ↩️</button>
                            </div>
                        </div>
                    </div>`;
            });

            container.innerHTML = html;
        }

        // عرض رسائل دردشة الطلاب للأدمن
        function renderAdminChatFeed(chatList) {
            const container = document.getElementById('adminChatFeed');
            if (!chatList || chatList.length === 0) {
                container.innerHTML = '<p style="text-align: center; opacity: 0.7; padding: 20px;">لا توجد رسائل في دردشة الطلاب حتى الآن.</p>';
                return;
            }

            let html = '';
            chatList.forEach((msg, index) => {
                html += `
                    <div class="chat-bubble">
                        <img src="${msg.avatar || 'https://via.placeholder.com/40'}" class="chat-avatar" alt="صورة">
                        <div class="chat-info">
                            <div style="display: flex; justify-content: space-between; align-items: center;">
                                <div>
                                    <span class="chat-username">${msg.author || 'طالب'}</span>
                                    <span class="chat-level">${msg.level || 'طالب نشط'}</span>
                                    <span class="post-date">${msg.date || ''}</span>
                                </div>
                                <button class="btn-danger" onclick="deleteChatMessage(${index})">حذف</button>
                            </div>
                            <div class="chat-text">${msg.text || ''}</div>
                        </div>
                    </div>`;
            });
            container.innerHTML = html;
        }

        async function sendAdminChatMessage() {
            let input = document.getElementById('adminChatInput');
            let text = input.value.trim();
            if (!text) return;

            if (!globalRecordData.studentChat) globalRecordData.studentChat = [];

            globalRecordData.studentChat.push({
                author: 'المعلم / الأدمن 👨‍🏫',
                level: 'المعلم الأساسي',
                avatar: 'https://via.placeholder.com/40',
                text: text,
                date: new Date().toLocaleDateString('ar-EG') + ' ' + new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'})
            });

            await updateCloudData();
            input.value = '';
            renderAdminChatFeed(globalRecordData.studentChat);
            alert('تم إرسال الرسالة لدردشة الطلاب بنجاح! 🚀');
        }

        async function deleteChatMessage(index) {
            if (!confirm('هل تريد حذف هذه الرسالة من الدردشة؟')) return;
            globalRecordData.studentChat.splice(index, 1);
            await updateCloudData();
            renderAdminChatFeed(globalRecordData.studentChat);
        }

        async function togglePinPost(index) {
            if (!globalRecordData.forumPosts[index]) return;
            globalRecordData.forumPosts[index].pinned = !globalRecordData.forumPosts[index].pinned;
            await updateCloudData();
            renderAdminForumFeed(globalRecordData.forumPosts);
        }

        async function deleteForumPost(index) {
            if (!confirm('هل تريد حذف هذا السؤال نهائياً؟')) return;
            globalRecordData.forumPosts.splice(index, 1);
            await updateCloudData();
            renderAdminForumFeed(globalRecordData.forumPosts);
            alert('تم حذف السؤال بنجاح.');
        }

        async function sendAdminReply(postIndex) {
            let input = document.getElementById(`adminReplyInput_${postIndex}`);
            let text = input.value.trim();
            if (!text) return;

            if (!globalRecordData.forumPosts[postIndex].comments) {
                globalRecordData.forumPosts[postIndex].comments = [];
            }

            globalRecordData.forumPosts[postIndex].comments.push({
                author: 'المعلم / الأدمن 👨‍🏫',
                text: text,
                date: new Date().toLocaleDateString('ar-EG')
            });

            await updateCloudData();
            input.value = '';
            renderAdminForumFeed(globalRecordData.forumPosts);
            alert('تم إرسال الرد بنجاح ونشره للطلاب! 🚀');
        }

        async function deleteComment(postIndex, commIndex) {
            if (!confirm('هل تريد حذف هذا التعليق؟')) return;
            globalRecordData.forumPosts[postIndex].comments.splice(commIndex, 1);
            await updateCloudData();
            renderAdminForumFeed(globalRecordData.forumPosts);
        }
    </script>
</body>
</html>
