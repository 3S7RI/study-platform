<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المنتدى والأسئلة - لوحة التحكم الاحترافية 💬</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            --th-bg: rgba(255, 255, 255, 0.03);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.05);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            --th-bg: rgba(0, 0, 0, 0.02);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
            flex-wrap: wrap; gap: 10px;
        }

        .header-right-side { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .btn-home-link {
            display: inline-flex; align-items: center; gap: 5px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }
        .btn-home-link.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        .platform-title-box { font-size: 0.95rem; font-weight: 700; color: var(--text-main); }

        .btn-theme-toggle {
            background-color: var(--th-bg); color: var(--text-main); border: 1px solid var(--border-color);
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
        }
        .btn-theme-toggle:hover { background-color: var(--hover-bg); border-color: var(--primary); }

        .section-box {
            background: var(--bg-card); padding: 18px; border-radius: 16px;
            box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid var(--border-color);
            border-top: 4px solid var(--primary);
        }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .section-header h2 { color: var(--text-main); font-size: 1rem; font-weight: 700; }
        
        /* إعدادات المنتدى */
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .setting-card { background: var(--th-bg); padding: 12px 16px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .setting-card label { font-size: 0.82rem; font-weight: 500; cursor: pointer; color: var(--text-main); }
        
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.2); transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(20px); }

        .form-group { margin-top: 12px; }
        .form-group label { display: block; font-size: 0.82rem; margin-bottom: 5px; color: var(--text-muted); }
        .form-group input, .form-group textarea { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); font-size: 0.88rem; outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); }
        
        .btn-save { background: var(--success); color: white; border: none; padding: 10px 22px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.85rem; margin-top: 15px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-save:hover { opacity: 0.9; }

        /* ستايل عرض المنتدى */
        .post-card {
            background: var(--bg-card); padding: 18px; border-radius: 16px; box-shadow: var(--shadow);
            border: 1px solid var(--border-color); margin-bottom: 15px;
        }
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .post-author { font-weight: bold; color: var(--text-main); font-size: 0.92rem; }
        .post-date { font-size: 0.7rem; color: var(--text-muted); }
        .post-content { font-size: 0.9rem; line-height: 1.6; margin-bottom: 12px; word-break: break-word; color: var(--text-main); }
        
        .comments-section { border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 10px; }
        .comment-item {
            background: var(--th-bg); padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 0.85rem;
            border-right: 3px solid var(--primary); border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
        }
        
        .reply-box { display: flex; gap: 6px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
        .reply-box input {
            flex: 1; min-width: 140px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-main); color: var(--text-main); font-size: 0.85rem; outline: none;
        }
        .reply-box input:focus { border-color: var(--primary); }
        
        .btn-reply {
            background: var(--primary); color: white; border: none; padding: 8px 14px;
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem;
        }
        .btn-reply:hover { background: var(--primary-hover); }
        
        .btn-danger {
            background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold;
        }
        .btn-danger:hover { background: var(--danger); color: white; }
        
        .btn-pin {
            background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold;
        }
        .btn-pin:hover { background: #f59e0b; color: white; }

        .post-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .hidden { display: none !important; }

        footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.78rem; border-top: 1px solid var(--border-color); margin-top: 30px; }
    </style>
</head>
<body id="pageBody" data-theme="dark">

    <div class="container">
        <!-- هيدر متطابق تماماً مع منتدى الطالب -->
        <header class="platform-header">
            <div class="header-right-side">
                <a href="admin.html" class="btn-home-link" title="العودة للوحة الرئيسية">↩️ اللوحة الرئيسية</a>
                <a href="#" class="btn-home-link active" id="btnTabPosts" onclick="switchTab('posts')">💬 إدارة الأسئلة</a>
                <a href="#" class="btn-home-link" id="btnTabSettings" onclick="switchTab('settings')">⚙️ إعدادات المنتدى</a>
            </div>
            <div class="platform-title-box">إدارة المنتدى 🛡️</div>
            <button id="themeToggleBtn" class="btn-theme-toggle" title="تغيير الوضع">☀️</button>
        </header>

        <!-- شاشة 1: أسئلة ومنشورات المنتدى -->
        <div id="tabPostsContent" class="section-box">
            <div class="section-header">
                <h2>أسئلة ومنشورات الطلاب (متابعة وتفاعل مباشر)</h2>
            </div>
            <div id="adminForumFeed">
                <p style="text-align: center; opacity: 0.7; padding: 20px;">جاري تحميل أسئلة وتفاعلات المنتدى من السحابة...</p>
            </div>
        </div>

        <!-- شاشة 2: إعدادات المنتدى المطورة -->
        <div id="tabSettingsContent" class="section-box hidden">
            <div class="section-header">
                <h2>إعدادات وتحكم المنتدى السحابي ⚙️</h2>
            </div>
            
            <div class="settings-grid">
                <div class="setting-card">
                    <label for="settingOpenForum">وضع صيانة المنتدى</label>
                    <label class="switch"><input type="checkbox" id="settingOpenForum" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingAllowNewQuestions">استقبال الأسئلة</label>
                    <label class="switch"><input type="checkbox" id="settingAllowNewQuestions" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingAllowReplies">السماح برد الطلاب على بعضهم</label>
                    <label class="switch"><input type="checkbox" id="settingAllowReplies" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingAutoApprove">النشر المباشر (بدون مراجعة الأدمن)</label>
                    <label class="switch"><input type="checkbox" id="settingAutoApprove" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingAllowLikes">تفعيل الإعجابات والتفاعلات</label>
                    <label class="switch"><input type="checkbox" id="settingAllowLikes" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingAllowEmojis">تحديد رموز التفاعل</label>
                    <label class="switch"><input type="checkbox" id="settingAllowEmojis" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingBlockLinks">حظر إرسال الروابط الخارجية</label>
                    <label class="switch"><input type="checkbox" id="settingBlockLinks"><span class="slider"></span></label>
                </div>
            </div>
            
            <div class="form-group">
                <label>الحد الأقصى لعدد حروف المنشور أو التعليق:</label>
                <input type="number" id="settingMaxLength" value="500">
            </div>
            <div class="form-group">
                <label>إيموجيات التفاعلات المتاحة (افصل بينها بفاصلة ,):</label>
                <input type="text" id="settingEmojisList" placeholder="🤍, 👀, 😂, 🔥, 👍">
            </div>
            <div class="form-group">
                <label>الكلمات الممنوعة (افصل بينها بفاصلة ,):</label>
                <input type="text" id="settingBadWords" placeholder="سب, شتم, رابط_مشبوه">
            </div>
            <div class="form-group">
                <label>رسالة الصيانة:</label>
                <textarea id="settingMaintenanceMsg" placeholder="المنتدى مغلق مؤقتاً للصيانة والتحديث..." style="height: 60px; resize: none;"></textarea>
            </div>
            <button class="btn-save" onclick="saveForumSettings()">حفظ وتحديث الإعدادات بالسحابة 🚀</button>
        </div>

        <footer>
            منصة رحلة دراسية التعليمية © 2026 - جميع الحقوق محفوظة للمؤسس <strong>محمد عماد (عشري)</strong>
        </footer>
    </div>

    <!-- Firebase SDK (Modular v10) & Firestore Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc, deleteDoc, updateDoc, arrayUnion, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const bodyElement = document.getElementById('pageBody');
        const themeBtn = document.getElementById('themeToggleBtn');
        
        let savedTheme = localStorage.getItem('platform_theme') || 'dark';
        bodyElement.setAttribute('data-theme', savedTheme);
        themeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeBtn.addEventListener('click', () => {
            let currentTheme = bodyElement.getAttribute('data-theme');
            let newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            bodyElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('platform_theme', newTheme);
            themeBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        window.switchTab = function(tab) {
            const btnPosts = document.getElementById('btnTabPosts');
            const btnSettings = document.getElementById('btnTabSettings');
            const contentPosts = document.getElementById('tabPostsContent');
            const contentSettings = document.getElementById('tabSettingsContent');

            btnPosts.classList.remove('active');
            btnSettings.classList.remove('active');
            contentPosts.classList.add('hidden');
            contentSettings.classList.add('hidden');

            if (tab === 'posts') {
                btnPosts.classList.add('active');
                contentPosts.classList.remove('hidden');
            } else {
                btnSettings.classList.add('active');
                contentSettings.classList.remove('hidden');
            }
        };

        initAdminForum();

        async function initAdminForum() {
            await loadSettingsFromFirebase();
            await loadPostsFromFirebase();
        }

        async function loadSettingsFromFirebase() {
            try {
                let docSnap = await getDoc(doc(db, "forumSettings", "config"));
                if (docSnap.exists()) {
                    let s = docSnap.data();
                    document.getElementById('settingOpenForum').checked = s.isOpen !== false;
                    document.getElementById('settingAllowNewQuestions').checked = s.allowNewQuestions !== false;
                    document.getElementById('settingAllowReplies').checked = s.allowReplies !== false;
                    document.getElementById('settingAutoApprove').checked = s.autoApprove !== false;
                    document.getElementById('settingAllowLikes').checked = s.allowLikes !== false;
                    document.getElementById('settingAllowEmojis').checked = s.allowEmojis !== false;
                    document.getElementById('settingBlockLinks').checked = s.blockLinks === true;
                    document.getElementById('settingMaxLength').value = s.maxLength || 500;
                    document.getElementById('settingEmojisList').value = s.emojisList || '🤍, 👀, 😂, 🔥, 👍';
                    document.getElementById('settingBadWords').value = s.badWords || '';
                    document.getElementById('settingMaintenanceMsg').value = s.maintenanceMsg || '';
                }
            } catch (e) {
                console.error("خطأ في تحميل الإعدادات:", e);
            }
        }

        window.saveForumSettings = async function() {
            let settingsData = {
                isOpen: document.getElementById('settingOpenForum').checked,
                allowNewQuestions: document.getElementById('settingAllowNewQuestions').checked,
                allowReplies: document.getElementById('settingAllowReplies').checked,
                autoApprove: document.getElementById('settingAutoApprove').checked,
                allowLikes: document.getElementById('settingAllowLikes').checked,
                allowEmojis: document.getElementById('settingAllowEmojis').checked,
                blockLinks: document.getElementById('settingBlockLinks').checked,
                maxLength: parseInt(document.getElementById('settingMaxLength').value) || 500,
                emojisList: document.getElementById('settingEmojisList').value.trim(),
                badWords: document.getElementById('settingBadWords').value.trim(),
                maintenanceMsg: document.getElementById('settingMaintenanceMsg').value.trim()
            };

            try {
                await setDoc(doc(db, "forumSettings", "config"), settingsData);
                alert('تم حفظ إعدادات المنتدى وتحديثها في فايربيز بنجاح! 🚀');
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء حفظ الإعدادات.');
            }
        };

        async function loadPostsFromFirebase() {
            try {
                const q = query(collection(db, "forumPosts"), orderBy("createdAt", "asc"));
                const querySnapshot = await getDocs(q);
                let posts = [];
                querySnapshot.forEach((docSnap) => {
                    posts.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderAdminForumFeed(posts);
            } catch (e) {
                console.error("خطأ في جلب المنشورات:", e);
                document.getElementById('adminForumFeed').innerHTML = '<p style="text-align: center; color: var(--danger);">فشل تحميل أسئلة المنتدى من السحابة.</p>';
            }
        }

        function renderAdminForumFeed(posts) {
            const container = document.getElementById('adminForumFeed');
            if (!posts || posts.length === 0) {
                container.innerHTML = '<p style="text-align: center; opacity: 0.7; padding: 20px;">لا توجد أسئلة أو منشورات في المنتدى حالياً.</p>';
                return;
            }

            let html = '';
            posts.slice().reverse().forEach((post) => {
                let isPinned = post.pinned === true;
                let commentsHtml = '';
                
                if (post.comments && post.comments.length > 0) {
                    post.comments.forEach((comm, commIndex) => {
                        commentsHtml += `
                            <div class="comment-item">
                                <div><b>💬 ${comm.authorName || 'مشرف'}:</b> ${comm.text}</div>
                                <button class="btn-danger" onclick="deleteComment('${post.id}', ${commIndex})">حذف</button>
                            </div>`;
                    });
                } else {
                    commentsHtml = '<p style="font-size: 0.78rem; opacity: 0.5; margin-bottom: 6px;">لا توجد تعليقات بعد.</p>';
                }

                html += `
                    <div class="post-card">
                        <div class="post-header">
                            <div>
                                <span class="post-author">👤 ${post.authorName || 'طالب'}</span>
                                <span class="post-date"> - ${post.date || ''}</span>
                                ${isPinned ? '<span style="color:#f59e0b; font-weight:bold; margin-right: 6px;">📌 مثبت</span>' : ''}
                            </div>
                            <div class="post-actions">
                                <button class="btn-pin" onclick="togglePinPost('${post.id}', ${isPinned})">${isPinned ? 'إلغاء التثبيت' : 'تثبيت'}</button>
                                <button class="btn-danger" onclick="deleteForumPost('${post.id}')">حذف السؤال</button>
                            </div>
                        </div>
                        <div class="post-content">${post.content || ''}</div>
                        ${post.image ? `<img src="${post.image}" style="max-width:140px; max-height:110px; border-radius:8px; margin-bottom:8px; display:block; object-fit:cover;">` : ''}
                        
                        <div class="comments-section">
                            <p style="font-size: 0.8rem; font-weight: bold; margin-bottom: 5px;">التعليقات والردود:</p>
                            ${commentsHtml}
                            <div class="reply-box">
                                <input type="text" id="adminReplyInput_${post.id}" placeholder="اكتب رد كأدمن معتمد...">
                                <button class="btn-reply" onclick="sendAdminReply('${post.id}')">إرسال ↩️</button>
                            </div>
                        </div>
                    </div>`;
            });

            container.innerHTML = html;
        }

        window.togglePinPost = async function(postId, currentPinned) {
            try {
                await updateDoc(doc(db, "forumPosts", postId), { pinned: !currentPinned });
                loadPostsFromFirebase();
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء تحديث حالة التثبيت.');
            }
        };

        window.deleteForumPost = async function(postId) {
            if (!confirm('هل تريد حذف هذا السؤال نهائياً من المنصة؟')) return;
            try {
                await deleteDoc(doc(db, "forumPosts", postId));
                loadPostsFromFirebase();
                alert('تم حذف السؤال بنجاح.');
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء حذف السؤال.');
            }
        };

        window.sendAdminReply = async function(postId) {
            let input = document.getElementById(`adminReplyInput_${postId}`);
            let text = input.value.trim();
            if (!text) return;

            let adminName = 'محمد عماد (مؤسس المنصة ⚡)';

            try {
                const newComment = {
                    authorName: adminName,
                    text: text,
                    isAdmin: true,
                    createdAt: Date.now()
                };

                await updateDoc(doc(db, "forumPosts", postId), {
                    comments: arrayUnion(newComment)
                });

                input.value = '';
                loadPostsFromFirebase();
                alert('تم إرسال رد الأدمن بنجاح ونشره للطلاب! 🚀');
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء إرسال الرد.');
            }
        };

        window.deleteComment = async function(postId, commentIndex) {
            if (!confirm('هل تريد حذف هذا التعليق؟')) return;
            try {
                let postRef = doc(db, "forumPosts", postId);
                let docSnap = await getDoc(postRef);
                if (docSnap.exists()) {
                    let comments = docSnap.data().comments || [];
                    comments.splice(commentIndex, 1);
                    await updateDoc(postRef, { comments: comments });
                    loadPostsFromFirebase();
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء حذف التعليق.');
            }
        };
    </script>
</body>
</html>
