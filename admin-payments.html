<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="plans.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طلبات الدفع</title>
    <style>
        :root {
            --bg-main: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8;
            --border-color: #334155; --primary: #6366f1; --success: #10b981; --danger: #ef4444; --gold: #fbbf24;
            --th-bg: rgba(255,255,255,0.04); --hover-bg: rgba(99,102,241,0.08); --shadow: 0 8px 20px rgba(0,0,0,0.12);
        }
        [data-theme="light"] {
            --bg-main: #f1f5f9; --bg-card: #ffffff; --text-main: #1e293b; --text-muted: #64748b;
            --border-color: #e2e8f0; --primary: #4f46e5; --gold: #d97706; --th-bg: rgba(0,0,0,0.03); --shadow: 0 8px 20px rgba(0,0,0,0.04);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.82rem; }
        body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 10px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 8px 15px; border-radius: 14px; margin-bottom: 14px; border: 1px solid var(--border-color); box-shadow: var(--shadow); }
        .back-btn { text-decoration: none; color: var(--text-main); background: var(--th-bg); padding: 5px 12px; border-radius: 10px; border: 1px solid var(--border-color); font-weight: 700; font-size: 0.78rem; }
        .title { font-weight: 800; color: var(--gold); font-size: 0.9rem; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 15px; margin-bottom: 14px; box-shadow: var(--shadow); }
        .card h3 { font-size: 0.9rem; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
        label { display: block; font-size: 0.74rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 700; }
        input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--th-bg); color: var(--text-main); outline: none; }
        input:focus { border-color: var(--gold); }
        .btn { border: none; border-radius: 8px; padding: 7px 14px; font-weight: 800; cursor: pointer; color: #fff; }
        .btn-gold { background: linear-gradient(135deg, #fef08a, #fbbf24, #d97706); color: #1e293b; }
        .btn-ok { background: var(--success); } .btn-no { background: var(--danger); }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .tab { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--th-bg); color: var(--text-main); cursor: pointer; font-weight: 700; }
        .tab.active { border-color: var(--gold); background: rgba(251,191,36,0.15); color: var(--gold); }
        .req { border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: var(--th-bg); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .req .info { line-height: 1.9; }
        .req .info b { color: var(--gold); }
        .req .acts { display: flex; gap: 8px; align-items: center; }
        .badge { padding: 2px 8px; border-radius: 15px; font-size: 0.7rem; font-weight: 800; }
        .b-pending { background: rgba(251,191,36,0.15); color: var(--gold); } .b-approved { background: rgba(16,185,129,0.15); color: var(--success); } .b-rejected { background: rgba(239,68,68,0.15); color: var(--danger); }
        .muted { color: var(--text-muted); }
        .empty { text-align: center; padding: 24px; color: var(--text-muted); }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 18px; border-radius: 12px; z-index: 99; display: none; }
    </style>
    <link rel="stylesheet" href="mobile.css">
</head>
<body>
    <script src="intro.js"></script>
<div class="container">
    <div class="header">
        <a href="admin.html" class="back-btn"><svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0' aria-hidden='true'><path d='M19 12H5M12 19l-7-7 7-7'/></svg> لوحة الأدمن</a>
        <div class="title"><svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0' aria-hidden='true'><rect x='1' y='4' width='22' height='16' rx='2'/><path d='M1 10h22'/></svg> طلبات الدفع</div>
    </div>

    <div class="card">
        <h3><svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0' aria-hidden='true'><circle cx='12' cy='12' r='3'/><path d='M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z'/></svg> إعدادات الدفع (اللي بيظهر للطالب)</h3>
        <div class="grid">
            <div><label>رقم اتصالات كاش</label><input type="text" id="cfgWallet" placeholder="01122161407" dir="ltr"></div>
            <div><label>رقم فوري</label><input type="text" id="cfgFawry" placeholder="01122161407" dir="ltr"></div>
            <div><label>InstaPay (سيبه فاضي = غير متاح / قريباً)</label><input type="text" id="cfgInstapay" placeholder="اكتب العنوان أو الرقم لما يشتغل" dir="ltr"></div>
            <div><label>IBAN 1 (فيزا / تحويل بنكي)</label><input type="text" id="cfgIban1" dir="ltr"></div>
            <div><label>IBAN 2</label><input type="text" id="cfgIban2" dir="ltr"></div>
            <div><label>بداية أوقات العمل</label><input type="text" id="cfgFrom" placeholder="10 صباحاً"></div>
            <div><label>نهاية أوقات العمل</label><input type="text" id="cfgTo" placeholder="11 مساءً"></div>
        </div>
        <button class="btn btn-gold" style="margin-top:12px;" onclick="saveConfig()">حفظ الإعدادات</button>
    </div>

    <div class="card">
        <div class="tabs">
            <button class="tab active" data-st="pending" onclick="setTab('pending')"><svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0' aria-hidden='true'><path d='M5 22h14M5 2h14M17 22v-4.17a2 2 0 0 0-.59-1.41L12 12l-4.41 4.42A2 2 0 0 0 7 17.83V22M7 2v4.17a2 2 0 0 0 .59 1.41L12 12l4.41-4.42A2 2 0 0 0 17 6.17V2'/></svg> معلّقة <span id="cntPending"></span></button>
            <button class="tab" data-st="approved" onclick="setTab('approved')"><svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0;color:#22c55e' aria-hidden='true'><circle cx='12' cy='12' r='10'/><path d='M8 12.5l2.7 2.7L16 9.5'/></svg> مقبولة</button>
            <button class="tab" data-st="rejected" onclick="setTab('rejected')"><svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0;color:#ef4444' aria-hidden='true'><circle cx='12' cy='12' r='10'/><path d='M15 9l-6 6M9 9l6 6'/></svg> مرفوضة</button>
        </div>
        <div id="list"><div class="empty">جاري التحميل...</div></div>
    </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { logAdminAction } from "./admin-service.js";
    import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs, runTransaction, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const app = initializeApp({
        apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
        authDomain: "study-trip-1.firebaseapp.com",
        projectId: "study-trip-1",
        storageBucket: "study-trip-1.firebasestorage.app",
        messagingSenderId: "632096690853",
        appId: "1:632096690853:web:f9622d14de73a761dcf34c"
    });
    const auth = getAuth(app);
    const db = getFirestore(app);

    const esc = (t) => String(t === undefined || t === null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const $ = (id) => document.getElementById(id);
    const toast = (m) => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2600); };
    const METHODS = { etisalat_cash: 'اتصالات كاش', fawry: 'فوري', instapay: 'InstaPay', bank_iban: 'فيزا / تحويل بنكي', vodafone_cash: 'فودافون كاش', other_wallet: 'محفظة أخرى' };
    const DEF = { walletNumber: '01122161407', fawryNumber: '01122161407', iban1: 'EG390037002708181020729838535', iban2: 'EG300037004608181130729820170' };
    const STAT = { pending: 'معلّق', approved: 'مقبول', rejected: 'مرفوض' };
    const fmt = (ms) => ms ? new Date(ms).toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' }) : '';

    let currentTab = 'pending';
    let adminName = 'admin';

    async function loadConfig() {
        try {
            const c = await getDoc(doc(db, 'config', 'payment'));
            const d = c.exists() ? c.data() : {};
            $('cfgWallet').value = d.walletNumber || DEF.walletNumber;
            $('cfgFawry').value = d.fawryNumber || DEF.fawryNumber;
            $('cfgInstapay').value = d.instapayNumber || '';
            $('cfgIban1').value = d.iban1 || DEF.iban1;
            $('cfgIban2').value = d.iban2 || DEF.iban2;
            $('cfgFrom').value = d.workFrom || '';
            $('cfgTo').value = d.workTo || '';
        } catch (e) {}
    }

    window.saveConfig = async function () {
        try {
            await setDoc(doc(db, 'config', 'payment'), {
                walletNumber: $('cfgWallet').value.trim(),
                fawryNumber: $('cfgFawry').value.trim(),
                instapayNumber: $('cfgInstapay').value.trim(),
                iban1: $('cfgIban1').value.trim(),
                iban2: $('cfgIban2').value.trim(),
                workFrom: $('cfgFrom').value.trim(),
                workTo: $('cfgTo').value.trim(),
                updatedAt: Date.now()
            }, { merge: true });
            toast('تم حفظ الإعدادات');
        } catch (e) { toast('حصل خطأ في الحفظ'); }
    };

    window.setTab = function (st) {
        currentTab = st;
        document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.st === st));
        loadRequests();
    };

    async function loadRequests() {
        $('list').innerHTML = '<div class="empty">جاري التحميل...</div>';
        try {
            const snap = await getDocs(query(collection(db, 'subscriptionRequests'), where('status', '==', currentTab), limit(100)));
            const rows = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));
            if (currentTab === 'pending') $('cntPending').textContent = rows.length ? '(' + rows.length + ')' : '';
            if (!rows.length) { $('list').innerHTML = '<div class="empty">مفيش طلبات هنا.</div>'; return; }
            $('list').innerHTML = rows.map(r => `
                <div class="req">
                    <div class="info">
                        <b>${esc(r.studentName || 'طالب')}</b> <span class="muted">(${esc(r.studentId)})</span>
                        <span class="badge b-${esc(r.status)}">${STAT[r.status] || ''}</span><br>
                        الباقة: <b>${esc(r.planName)}</b> • المبلغ: <b>${esc(r.amount)} جنيه</b> • المدة: ${esc(r.days)} يوم<br>
                        رقم الدفع: <b dir="ltr">${esc(r.payerPhone)}</b> • الطريقة: ${esc(METHODS[r.method] || r.method)}<br>
                        ${r.reference ? 'المرجع: ' + esc(r.reference) + '<br>' : ''}
                        <span class="muted">${esc(r.email)} • ${fmt(r.createdAtMs)}</span>
                        ${r.reviewNote ? '<br><span class="muted">ملاحظة: ' + esc(r.reviewNote) + '</span>' : ''}
                    </div>
                    ${r.status === 'pending' ? `<div class="acts">
                        <button class="btn btn-ok" onclick="approveReq('${esc(r.id)}', this)">موافقة <svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0;color:#22c55e" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg></button>
                        <button class="btn btn-no" onclick="rejectReq('${esc(r.id)}', this)">رفض <svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0;color:#ef4444" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg></button>
                    </div>` : ''}
                </div>`).join('');
        } catch (e) {
            console.error(e);
            $('list').innerHTML = '<div class="empty">تعذر تحميل الطلبات.</div>';
        }
    }

    // موافقة: الطلب والطالب في Transaction واحدة. لو عنده اشتراك شغال الأيام بتتضاف على المتبقي
    window.approveReq = async function (id, btn) {
        if (!confirm('تأكيد الموافقة وتفعيل الاشتراك؟')) return;
        btn.disabled = true;
        try {
            const reqRef = doc(db, 'subscriptionRequests', id);
            await runTransaction(db, async (tx) => {
                const rs = await tx.get(reqRef);
                if (!rs.exists()) throw new Error('GONE');
                const r = rs.data();
                if (r.status !== 'pending') throw new Error('DONE');
                const stRef = doc(db, 'students', String(r.email).toLowerCase().trim());
                const ss = await tx.get(stRef);
                if (!ss.exists()) throw new Error('NO_STUDENT');
                const st = ss.data();
                const days = Number(r.days) || 0;
                if (days < 1) throw new Error('BAD_DAYS');
                const tier = r.planTier || (PSPlans.optionById(r.plan) || {}).tier || 'plus';
                const g = PSPlans.grant(st, tier, days);
                const cRef = r.couponCode ? doc(db, 'coupons', String(r.couponCode)) : null;
                const cSnap = cRef ? await tx.get(cRef) : null;
                tx.update(stRef, Object.assign(g, { lastPlanName: String(r.planName || ''), lastPlanSource: 'payment', lastUpdated: new Date().toISOString() }));
                if (cSnap && cSnap.exists()) tx.update(cRef, { usedCount: (Number(cSnap.data().usedCount) || 0) + 1, lastUsedAt: Date.now() });
                tx.update(reqRef, { status: 'approved', reviewedAt: Date.now(), reviewedBy: adminName, reviewNote: '' });
            });
            logAdminAction(db, adminName, 'approve_payment', id, 'تفعيل اشتراك من طلب دفع');
            toast('تم تفعيل الاشتراك');
        } catch (e) {
            const m = String(e && e.message || '');
            toast(m.includes('DONE') ? 'الطلب اتراجع قبل كده' : m.includes('NO_STUDENT') ? 'مفيش حساب طالب بالإيميل ده' : 'حصل خطأ، جرّب تاني');
        }
        loadRequests();
    };

    window.rejectReq = async function (id, btn) {
        const reason = prompt('سبب الرفض (هيظهر للطالب):');
        if (reason === null) return;
        btn.disabled = true;
        try {
            const reqRef = doc(db, 'subscriptionRequests', id);
            await runTransaction(db, async (tx) => {
                const rs = await tx.get(reqRef);
                if (!rs.exists() || rs.data().status !== 'pending') throw new Error('DONE');
                tx.update(reqRef, { status: 'rejected', reviewedAt: Date.now(), reviewedBy: adminName, reviewNote: String(reason).trim().slice(0, 200) || 'لم نستلم التحويل' });
            });
            logAdminAction(db, adminName, 'reject_payment', id, String(reason).trim().slice(0, 100));
            toast('تم رفض الطلب');
        } catch (e) { toast('الطلب اتراجع قبل كده'); }
        loadRequests();
    };

    onAuthStateChanged(auth, (user) => {
        if (!user) { window.location.href = 'login.html'; return; }
        adminName = user.email || 'admin';
        loadConfig();
        loadRequests();
    });
</script>
</body>
</html>
