<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مرحباً بك - رحلة دراسية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInScale 1.2s ease-in-out forwards;
        }

        /* أنيميشن ظهور ودخول العنصر */
        @keyframes fadeInScale {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            70% {
                transform: scale(1.05);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .avatar-box {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        h1 span {
            color: #4ade80; /* لون مميز لاسم الطالب */
        }

        p {
            font-size: 1.1rem;
            opacity: 0.85;
            margin-bottom: 25px;
        }

        /* مؤشر التحميل المتحرك */
        .loader-bar {
            width: 180px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .loader-fill {
            position: absolute;
            height: 100%;
            width: 0%;
            background: #4ade80;
            border-radius: 3px;
            animation: fillProgress 2.5s linear forwards;
        }

        @keyframes fillProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <div class="avatar-box">🎓</div>
        <h1>أهلاً بك يا <span id="studentNameDisplay">بطل</span>!</h1>
        <p>جاري تجهيز منصتك التعليمية...</p>
        
        <div class="loader-bar">
            <div class="loader-fill"></div>
        </div>
    </div>

    <script>
        // سحب اسم الطالب المخزن في المتصفح وعرضه
        const studentData = JSON.parse(localStorage.getItem('studentUser'));
        if (studentData && studentData.fullName) {
            // جلب الاسم الأول فقط أو الاسم بالكامل حسب رغبتك (هنا جبنا الاسم الأول للطف/الطالب)
            const firstName = studentData.fullName.split(' ')[0];
            document.getElementById('studentNameDisplay').textContent = firstName;
        }

        // التوجيه التلقائي للصفحة الرئيسية بعد 2.8 ثانية (وقت انتهاء الأنيميشن)
        setTimeout(() => {
            window.location.href = 'main.html';
        }, 2800);
    </script>

</body>
</html>
