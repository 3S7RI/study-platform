<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - تسجيل طالب جديد</title>
    <!-- كود تحقق جوجل -->
    <meta name="google-site-verification" content="MC3Rq1pTIdJP0dN2fwFucfpowlsfzQnmTTtvVxj9O28" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72, #2a5298); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .register-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 450px; }
        .register-container h2 { text-align: center; color: #1e3c72; margin-bottom: 20px; font-size: 1.6rem; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #333; font-weight: bold; font-size: 0.9rem; }
        .input-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.3s; }
        .input-group input:focus { border-color: #2a5298; }
        
        /* تنسيق مخصص وجميل لزر رفع الصورة */
        .file-upload-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 2px dashed #2a5298;
            padding: 10px 15px;
            border-radius: 8px;
            background: #f8faff;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .file-upload-wrapper:hover {
            background: #eef4ff;
            border-color: #1e3c72;
        }
        .file-upload-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .file-upload-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #2a5298;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .file-preview {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            display: none;
            border: 2px solid #27ae60;
        }

        .password-wrapper { position: relative; width: 100%; }
        .password-wrapper input { width: 100%; padding-left: 45px !important; } 
        .toggle-password { position: absolute; left: 12px !important; right: auto !important; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.2rem; user-select: none; z-index: 10; }

        .btn-submit { display: block; width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; text-align: center; cursor: pointer; transition: background 0.3s; margin-top: 15px; }
        .btn-submit:hover { background-color: #219653; }
        .footer-text { text-align: center; margin-top: 15px; color: #666; font-size: 0.85rem; }
        .footer-text a { color: #27ae60; text-decoration: none; font-weight: bold; }
        .footer-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>إنشاء حساب طالب جديد</h2>
        <form id="registerForm" onsubmit="return false;">
            <div class="input-group">
                <label for="fullName">اسم الطالب الكامل</label>
                <input type="text" id="fullName" placeholder="اكتب اسمك ثلاثي أو رباعي" required>
            </div>
            <div class="input-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>
            <div class="input-group">
                <label for="studentPhone">رقم هاتف الطالب</label>
                <input type="tel" id="studentPhone" placeholder="01xxxxxxxx0" required>
            </div>
            <div class="input-group">
                <label for="parentPhone">رقم هاتف ولي الأمر</label>
                <input type="tel" id="parentPhone" placeholder="01xxxxxxxx0" required>
            </div>
            
            <div class="input-group">
                <label>صورة البروفايل الشخصية</label>
                <div class="file-upload-wrapper">
                    <div class="file-upload-label">
                        <span id="uploadIcon">📷</span>
                        <span id="fileName">اختر صورة البروفايل...</span>
                    </div>
                    <img id="imagePreview" class="file-preview" alt="معاينة الصورة">
                    <input type="file" id="profileImageInput" accept="image/*">
                </div>
            </div>

            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="********" required>
                    <span class="toggle-password" id="togglePassBtn">👁️</span>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">تسجيل الحساب وانطلاق</button>
        </form>
        <div class="footer-text">
            لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxQlQEKRKgTZ93Nnpnyhp6jJnJH_LZs4fhkeS0L46bzPK5hMYDhTPILVwJtFA3Elvv7/exec';
        const BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';

        const passwordInput = document.getElementById('password');
        const togglePassBtn = document.getElementById('togglePassBtn');

        togglePassBtn.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePassBtn.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                togglePassBtn.textContent = '👁️';
            }
        });

        const profileImageInput = document.getElementById('profileImageInput');
        const fileNameSpan = document.getElementById('fileName');
        const uploadIcon = document.getElementById('uploadIcon');
        const imagePreview = document.getElementById('imagePreview');

        profileImageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                fileNameSpan.textContent = file.name;
                uploadIcon.style.display = 'none';
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    imagePreview.src = event.target.result;
                    imagePreview.style.display = 'block';
                };
                reader.readAsDataURL(file);
            } else {
                fileNameSpan.textContent = 'اختر صورة البروفايل...';
                uploadIcon.style.display = 'inline';
                imagePreview.style.display = 'none';
            }
        });

        function convertImageToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 300;
                        const MAX_HEIGHT = 300;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.onerror = error => reject(error);
                };
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const sPhone = document.getElementById('studentPhone').value.trim();
            const pPhone = document.getElementById('parentPhone').value.trim();
            const pass = document.getElementById('password').value;
            const imageFile = profileImageInput.files[0];

            if (!name || !email || !sPhone || !pass) {
                alert('من فضلك املأ الحقول المطلوبة أولاً!');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.textContent = 'جاري إنشاء الحساب على السحابة...';
            btn.disabled = true;

            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 
                        'X-Master-Key': API_KEY,
                        'X-Access-Key': API_KEY 
                    }
                });
                let result = await response.json();
                let currentRecord = result.record || {};
                let studentsList = Array.isArray(currentRecord.users) ? currentRecord.users : [];

                const emailExists = studentsList.some(student => student.email && student.email.toLowerCase() === email);
                const phoneExists = studentsList.some(student => student.studentPhone === sPhone);

                if (emailExists) {
                    alert('عذراً يا بطل! البريد الإلكتروني هذا مسجل مسبقاً، سيتم توجيهك لصفحة تسجيل الدخول.');
                    window.location.href = 'login.html';
                    return;
                }

                if (phoneExists) {
                    alert('رقم هاتف الطالب هذا مسجل بحساب آخر بالفعل!');
                    btn.textContent = 'تسجيل الحساب وانطلاق';
                    btn.disabled = false;
                    return;
                }

                let profileImageBase64 = "";
                if (imageFile) {
                    try {
                        profileImageBase64 = await convertImageToBase64(imageFile);
                    } catch (e) {
                        console.error("خطأ في معالجة الصورة، سيتم المتابعة بدونها", e);
                    }
                }

                const nextNumber = studentsList.length + 1;
                const formattedId = String(nextNumber).padStart(4, '0');
                const studentId = 'STU-' + formattedId;

                const userData = {
                    studentId: studentId,
                    fullName: name,
                    email: email,
                    studentPhone: sPhone,
                    parentPhone: pPhone,
                    password: pass,
                    status: 'active',
                    rank: 'unranked',
                    profileImage: profileImageBase64
                };

                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                }).catch(err => console.error(err));

                studentsList.push(userData);
                currentRecord.users = studentsList;

                let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY,
                        'X-Access-Key': API_KEY
                    },
                    body: JSON.stringify(currentRecord)
                });

                if (!updateRes.ok) throw new Error('فشل حفظ البيانات في السحابة');

                localStorage.setItem('studentUser', JSON.stringify(userData));
                localStorage.setItem('isLoggedIn', 'true');

                alert('تم إنشاء الحساب بنجاح على السحابة يا بطل! كود تعريفك هو: ' + studentId);
                window.location.href = 'main.html';

            } catch (error) {
                console.error('خطأ في الاتصال بالسحابة:', error);
                alert('حدث خطأ أثناء الاتصال بالسحابة، تأكد من اتصالك بالإنترنت وحاول مرة أخرى.');
                btn.textContent = 'تسجيل الحساب وانطلاق';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
