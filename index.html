<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - تسجيل طالب جديد</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72, #2a5298); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .register-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 450px; }
        .register-container h2 { text-align: center; color: #1e3c72; margin-bottom: 20px; font-size: 1.6rem; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #333; font-weight: bold; font-size: 0.9rem; }
        .input-group input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.3s; }
        .input-group input:focus { border-color: #2a5298; }
        .btn-submit { display: block; width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; text-align: center; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-submit:hover { background-color: #219653; }
        .footer-text { text-align: center; margin-top: 15px; color: #666; font-size: 0.85rem; }
        .footer-text a { color: #27ae60; text-decoration: none; font-weight: bold; }
        .footer-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>إنشاء حساب طالب جديد</h2>
        <div>
            <div class="input-group">
                <label>اسم الطالب الكامل</label>
                <input type="text" id="fullName" placeholder="اكتب اسمك ثلاثي أو رباعي" required>
            </div>
            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>
            <div class="input-group">
                <label>رقم هاتف الطالب</label>
                <input type="tel" id="studentPhone" placeholder="01xxxxxxxx0" required>
            </div>
            <div class="input-group">
                <label>رقم هاتف ولي الأمر</label>
                <input type="tel" id="parentPhone" placeholder="01xxxxxxxx0" required>
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="********" required>
            </div>
            <button type="button" id="submitBtn" class="btn-submit">تسجيل الحساب وانطلاق</button>
        </div>
        <div class="footer-text">
            لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxQlQEKRKgTZ93Nnpnyhp6jJnJH_LZs4fhkeS0L46bzPK5hMYDhTPILVwJtFA3Elvv7/exec';

        document.getElementById('submitBtn').addEventListener('click', function() {
            const name = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const sPhone = document.getElementById('studentPhone').value.trim();
            const pPhone = document.getElementById('parentPhone').value.trim();
            const pass = document.getElementById('password').value;

            if (!name || !email || !sPhone || !pass) {
                alert('من فضلك املأ الحقول المطلوبة أولاً!');
                return;
            }

            // التحقق من عدم تكرار البريد أو الهاتف محلياً
            const savedUser = JSON.parse(localStorage.getItem('studentUser'));
            
            if (savedUser) {
                if (savedUser.email === email) {
                    alert('عذراً يا بطل! البريد الإلكتروني هذا مسجل مسبقاً، قم بتسجيل الدخول بدلاً من ذلك.');
                    window.location.href = 'login.html';
                    return;
                }
                if (savedUser.studentPhone === sPhone) {
                    alert('رقم هاتف الطالب هذا مسجل بحساب آخر بالفعل!');
                    return;
                }
            }

            const userData = {
                fullName: name,
                email: email,
                studentPhone: sPhone,
                parentPhone: pPhone,
                password: pass
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            }).catch(err => console.log(err));

            localStorage.setItem('studentUser', JSON.stringify(userData));
            localStorage.setItem('isLoggedIn', 'true');

            alert('تم تسجيل الحساب بنجاح يا بطل!');
            window.location.href = 'main.html';
        });
    </script>
</body>
</html>
