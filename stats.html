<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إحصائياتي - منصة رحلة دراسية</title>
    <style>
        :root {
            --bg-main: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8;
            --border-color: #334155; --primary: #6366f1; --primary-hover: #4f46e5; --success: #10b981;
            --danger: #ef4444; --warn: #f59e0b; --hover-bg: rgba(99, 102, 241, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15); --th-bg: rgba(255, 255, 255, 0.04);
        }
        [data-theme="light"] {
            --bg-main: #f1f5f9; --bg-card: #ffffff; --text-main: #1e293b; --text-muted: #64748b;
            --border-color: #e2e8f0; --primary: #4f46e5; --primary-hover: #4338ca; --success: #059669;
            --danger: #dc2626; --warn: #d97706; --hover-bg: rgba(79, 70, 229, 0.05);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.04); --th-bg: rgba(0, 0, 0, 0.03);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 15px; }
        .container { max-width: 920px; margin: 0 auto; }

        .platform-header { display: flex; justify-content: space-between; align-items: center; background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px; margin-bottom: 18px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        .btn-home-link { display: inline-flex; align-items: center; gap: 5px; background: var(--th-bg); padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color); text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem; }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }
        .platform-title-box { font-size: 0.95rem; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .btn-theme-toggle { background-color: var(--th-bg); color: var(--text-main); border: 1px solid var(--border-color); width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-theme-toggle:hover { background-color: var(--hover-bg); border-color: var(--primary); }

        /* بطاقة الهيرو */
        .hero { --c1: #6366f1; --c2: #a855f7; position: relative; overflow: hidden; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 22px; padding: 26px 18px 20px; text-align: center; box-shadow: var(--shadow); margin-bottom: 16px; }
        .hero::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 120px; background: linear-gradient(135deg, var(--c1), var(--c2)); opacity: 0.28; }
        .hero > * { position: relative; }
        .hero .lv-avatar { margin: 22px auto 10px; }
        .hero .lv-avatar.lv-t6, .hero .lv-avatar.lv-t7 { margin-top: 44px; }
        .hero-name { font-size: 1.25rem; font-weight: 800; }
        .hero-sub { color: var(--text-muted); font-size: 0.78rem; margin: 4px 0 10px; }
        .hero-badges { display: flex; justify-content: center; flex-wrap: wrap; gap: 7px; margin-bottom: 14px; }
        .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 11px; border-radius: 20px; font-size: 0.72rem; font-weight: 800; border: 1px solid var(--border-color); background: var(--th-bg); white-space: nowrap; }
        .pill.vip { background: linear-gradient(135deg, #fef08a, #f59e0b); color: #1e293b; border-color: transparent; }
        .pill.trial { background: linear-gradient(135deg, #34d399, #06b6d4); color: #052e2b; border-color: transparent; }
        .pill.free { background: var(--th-bg); color: var(--text-muted); }
        .pill.ok { background: rgba(16,185,129,0.15); color: var(--success); border-color: rgba(16,185,129,0.4); }
        .pill.bad { background: rgba(239,68,68,0.12); color: var(--danger); border-color: rgba(239,68,68,0.4); }
        .pill.wait { background: rgba(245,158,11,0.14); color: var(--warn); border-color: rgba(245,158,11,0.4); }
        .hero-xp { max-width: 440px; margin: 0 auto; }

        /* شبكة الأرقام */
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 11px; margin-bottom: 16px; }
        .kpi { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px 8px; text-align: center; box-shadow: var(--shadow); border-top: 3px solid var(--k, var(--primary)); }
        .kpi .ic { font-size: 1.35rem; }
        .kpi .lbl { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; margin: 3px 0 2px; }
        .kpi .val { font-size: 1.15rem; font-weight: 900; }
        .kpi .sub { font-size: 0.66rem; color: var(--text-muted); margin-top: 2px; }

        .sec { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 18px; padding: 18px 16px; box-shadow: var(--shadow); margin-bottom: 16px; scroll-margin-top: 14px; }
        .sec > h3 { font-size: 1rem; font-weight: 800; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 8px; }
        .sec > h3 small { margin-right: auto; font-size: 0.7rem; color: var(--text-muted); font-weight: 600; }
        .empty { text-align: center; color: var(--text-muted); padding: 16px; font-size: 0.82rem; }

        .rows { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 9px; margin-bottom: 4px; }
        .rw { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--th-bg); border: 1px solid var(--border-color); border-radius: 11px; padding: 9px 12px; font-size: 0.8rem; }
        .rw span { color: var(--text-muted); font-size: 0.78rem; }
        .rw b { font-weight: 800; text-align: left; }

        .bar { height: 9px; border-radius: 9px; background: rgba(148,163,184,0.22); overflow: hidden; }
        .bar > i { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, #6366f1, #22d3ee); transition: width 0.8s ease; }
        .bar.warn > i { background: linear-gradient(90deg, #f59e0b, #ef4444); }
        .bar.good > i { background: linear-gradient(90deg, #10b981, #22d3ee); }

        .countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 12px; }
        .cd { background: var(--th-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 4px; text-align: center; }
        .cd b { display: block; font-size: 1.3rem; font-weight: 900; font-variant-numeric: tabular-nums; }
        .cd span { font-size: 0.66rem; color: var(--text-muted); font-weight: 700; }
        .sub-cta { display: block; text-align: center; margin-top: 12px; padding: 10px; border-radius: 12px; background: linear-gradient(135deg, #fde047, #f59e0b); color: #1e293b; font-weight: 800; text-decoration: none; font-size: 0.84rem; }

        .item { background: var(--th-bg); border: 1px solid var(--border-color); border-radius: 13px; padding: 11px 13px; margin-bottom: 9px; }
        .item-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-weight: 800; font-size: 0.86rem; }
        .item-h em { font-style: normal; font-size: 0.74rem; color: var(--text-muted); font-weight: 700; white-space: nowrap; }
        .item .bar { margin: 8px 0; height: 7px; }
        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .ck { font-size: 0.7rem; font-weight: 700; padding: 2px 9px; border-radius: 10px; border: 1px solid var(--border-color); color: var(--text-muted); }
        .ck.on { background: rgba(16,185,129,0.15); border-color: rgba(16,185,129,0.45); color: var(--success); }
        .meta { font-size: 0.74rem; color: var(--text-muted); margin-top: 7px; line-height: 1.8; }
        .meta b { color: var(--text-main); }
        .score { font-weight: 900; }
        .score.hi { color: var(--success); } .score.mid { color: var(--warn); } .score.lo { color: var(--danger); }

        .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
        .tab { padding: 5px 13px; border-radius: 18px; border: 1px solid var(--border-color); background: var(--th-bg); color: var(--text-main); cursor: pointer; font-size: 0.76rem; font-weight: 700; }
        .tab.active { background: var(--primary); border-color: var(--primary); color: #fff; }

        footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.78rem; border-top: 1px solid var(--border-color); margin-top: 24px; }
        @media (max-width: 420px) { .countdown { grid-template-columns: repeat(2, 1fr); } }
    </style>

<body id="pageBody" data-theme="dark">
    <div class="container">
        <header class="platform-header">
            <a href="main.html" class="btn-home-link" title="العودة للرئيسية"><svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0' aria-hidden='true'><path d='M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/><path d='M9 22V12h6v10'/></svg> الرئيسية</a>
            <div class="platform-title-box"><span id="navStudentName">إحصائياتي</span></div>
            <button id="themeToggleBtn" class="btn-theme-toggle" title="تغيير الوضع"><svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0;color:#fbbf24' aria-hidden='true'><circle cx='12' cy='12' r='4'/><path d='M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41'/></svg></button>
        </header>

        <div id="statsRoot"><div class="sec"><div class="empty">جاري تجميع إحصائياتك من كل أنحاء المنصة... <svg class='ic' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='vertical-align:-0.125em;flex-shrink:0' aria-hidden='true'><path d='M5 22h14M5 2h14M17 22v-4.17a2 2 0 0 0-.59-1.41L12 12l-4.41 4.42A2 2 0 0 0 7 17.83V22M7 2v4.17a2 2 0 0 0 .59 1.41L12 12l4.41-4.42A2 2 0 0 0 17 6.17V2'/></svg></div></div></div>

        <footer>منصة رحلة دراسية التعليمية © 2026 - جميع الحقوق محفوظة للمؤسس <strong>محمد عماد (عشري)</strong></footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, getDocs, collection, query, where, limit, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { syncStudyTime, getMyLeaderboardRank, normalizeSubscription } from "./student-service.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        /* ---------- الثيم ---------- */
        const bodyElement = document.getElementById('pageBody');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const savedTheme = localStorage.getItem('platform_theme') || 'dark';
        bodyElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.innerHTML = savedTheme === 'dark' ? '<svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0;color:#fbbf24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>' : '<svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0;color:#a5b4fc" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
        themeToggleBtn.addEventListener('click', () => {
            const next = bodyElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            bodyElement.setAttribute('data-theme', next);
            localStorage.setItem('platform_theme', next);
            themeToggleBtn.innerHTML = next === 'dark' ? '<svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0;color:#fbbf24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>' : '<svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0;color:#a5b4fc" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
        });

        /* ---------- أدوات ---------- */
        const esc = PS.esc;
        const DEFAULT_AV = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231e293b'/><circle cx='50' cy='38' r='18' fill='%2300a2ff'/><path d='M22 82c0-15.5 12.5-28 28-28s28 12.5 28 28' fill='%2300a2ff'/></svg>";
        const num = (v) => { const n = Number(v); return isNaN(n) ? 0 : n; };
        const toMs = (v) => { if (!v) return 0; if (typeof v === 'number') return v; if (v.toMillis) return v.toMillis(); const t = new Date(v).getTime(); return isNaN(t) ? 0 : t; };
        const fmtDate = (v) => { const t = toMs(v); return t ? new Date(t).toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' }) : '—'; };
        const fmtDateTime = (v) => { const t = toMs(v); return t ? new Date(t).toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' }) : '—'; };
        const pctOf = (a, b) => b > 0 ? Math.round((a / b) * 100) : 0;
        const scoreCls = (p) => p >= 85 ? 'hi' : (p >= 50 ? 'mid' : 'lo');
        function fmtDur(secs) {
            secs = Math.max(0, Math.floor(secs));
            const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
            if (h > 0) return h + ' ساعة' + (m ? ' و ' + m + ' دقيقة' : '');
            return m + ' دقيقة';
        }
        const kpi = (ic, lbl, val, sub, color) => `<div class="kpi" style="--k:${color || 'var(--primary)'}"><div class="ic">${ic}</div><div class="lbl">${lbl}</div><div class="val">${val}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>`;
        const rw = (l, v) => `<div class="rw"><span>${l}</span><b>${v}</b></div>`;

        let countdownTimer = null;

        onAuthStateChanged(auth, async (user) => {
            const email = String((user && user.email) || PS.email() || '').toLowerCase().trim();
            if (!email) { if (!user) window.location.replace('login.html'); return; }
            await loadAll(email);
        });

        async function safe(fn, fallback) { try { return await fn(); } catch (e) { console.warn('stats part failed', e); return fallback; } }

        async function loadAll(email) {
            const root = document.getElementById('statsRoot');
            try {
                await safe(() => syncStudyTime(db, email), null);
                const snap = await getDoc(doc(db, 'students', email));
                if (!snap.exists()) { root.innerHTML = '<div class="sec"><div class="empty">لم يتم العثور على ملف الطالب. سجّل الدخول من جديد.</div></div>'; return; }
                const d = await normalizeSubscription(db, email, snap.data());
                const sid = String(d.studentId || d.id || PS.studentId() || '');
                PS.saveStudent(d);

                const [lessonsSnap, resSnap, examsSnap, reqSnap, postsCnt, pendCnt, friendsList, totalStudents] = await Promise.all([
                    safe(() => getDocs(collection(db, 'lessons')), null),
                    safe(() => getDocs(query(collection(db, 'studentExamResults'), where('userId', '==', sid))), null),
                    safe(() => getDocs(collection(db, 'exams')), null),
                    safe(() => getDocs(query(collection(db, 'subscriptionRequests'), where('studentId', '==', sid), limit(30))), null),
                    safe(async () => (await getCountFromServer(query(collection(db, 'forumPosts'), where('authorId', '==', sid)))).data().count, null),
                    safe(async () => (await getCountFromServer(query(collection(db, 'pendingPosts'), where('authorId', '==', sid)))).data().count, null),
                    safe(async () => {
                        const [a, b] = await Promise.all([
                            getDocs(query(collection(db, 'friends'), where('user1', '==', sid))),
                            getDocs(query(collection(db, 'friends'), where('user2', '==', sid)))
                        ]);
                        const out = new Map();
                        [...a.docs, ...b.docs].forEach(x => { const v = x.data(); if (v.deleted !== true && v.blocked !== true) out.set(x.id, 1); });
                        return out.size;
                    }, null),
                    safe(async () => (await getCountFromServer(collection(db, 'students'))).data().count, null)
                ]);

                const score = Math.max(num(d.totalScore), num(d.points));
                const myRank = await safe(() => getMyLeaderboardRank(db, score), null);

                const lessons = lessonsSnap ? lessonsSnap.docs.map(x => ({ id: x.id, ...x.data() })).filter(l => (l.settings || {}).generalActive !== false).sort((a, b) => num(a.number) - num(b.number)) : [];
                const lessonResults = resSnap ? resSnap.docs.map(x => ({ id: x.id, ...x.data() })) : [];
                const exams = examsSnap ? examsSnap.docs.map(x => ({ id: x.id, ...x.data() })) : [];
                const reqs = reqSnap ? reqSnap.docs.map(x => ({ id: x.id, ...x.data() })).sort((a, b) => num(b.createdAtMs) - num(a.createdAtMs)) : [];

                render(root, { d, email, sid, score, myRank, totalStudents, lessons, lessonResults, exams, reqs, postsCnt, pendCnt, friendsCnt: friendsList });
            } catch (e) {
                console.error('خطأ في تحميل الإحصائيات:', e);
                root.innerHTML = '<div class="sec"><div class="empty">تعذر تحميل الإحصائيات دلوقتي. حدّث الصفحة وجرّب تاني.</div></div>';
            }
        }

        function render(root, ctx) {
            const { d, sid, score, myRank, totalStudents, lessons, lessonResults, exams, reqs, postsCnt, pendCnt, friendsCnt } = ctx;
            const LIM = PS.limits(d);
            const lv = LV.info(score);
            const rankInfo = PS.rank(score);
            const name = d.fullName || d.name || 'طالب';
            const firstName = String(name).trim().split(' ')[0];
            document.getElementById('navStudentName').textContent = 'إحصائيات ' + firstName;

            /* ---------- الاشتراك ---------- */
            const expMs = d.subscriptionExpiry ? new Date(d.subscriptionExpiry).getTime() : 0;
            const activeSub = expMs ? expMs > Date.now() : (d.isSubscribed === true || d.accountType === 'vip');
            const isTrial = d.accountType === 'trial' && activeSub;
            const typeLabel = activeSub ? (isTrial ? 'تجربة مجانية' : 'VIP') : 'مجاني';
            const typeCls = activeSub ? (isTrial ? 'trial' : 'vip') : 'free';

            /* ---------- الحصص ---------- */
            const acts = d.lessonsActivity || {};
            const resByLesson = {};
            lessonResults.forEach(r => { resByLesson[r.lessonId] = r; });
            let sVideos = 0, sNotes = 0, sSums = 0, sAccess = 0, sDone = 0, sStarted = 0;
            let tVideos = 0, tNotes = 0, tSums = 0, tExams = 0;
            const lessonCards = lessons.map(l => {
                const a = acts[l.id] || {};
                const st = l.settings || {};
                const hasV = (l.videosList || []).length > 0, hasN = (l.notesList || []).length > 0, hasS = (l.summariesList || []).length > 0;
                const hasE = !!(l.examId && String(l.examId).trim()) && st.showExamSection !== false;
                const res = resByLesson[l.id];
                const doneV = a.videoWatched === true, doneN = a.studyNotes === true, doneS = a.summarySeen === true, doneE = !!res;
                if (hasV) { tVideos++; if (doneV) sVideos++; }
                if (hasN) { tNotes++; if (doneN) sNotes++; }
                if (hasS) { tSums++; if (doneS) sSums++; }
                if (hasE) { tExams++; }
                const parts = [hasV, hasN, hasS, hasE].filter(Boolean).length;
                const done = (hasV && doneV ? 1 : 0) + (hasN && doneN ? 1 : 0) + (hasS && doneS ? 1 : 0) + (hasE && doneE ? 1 : 0);
                const access = num(a.accessCount);
                sAccess += access;
                if (access > 0 || done > 0) sStarted++;
                if (parts > 0 && done === parts) sDone++;
                const maxAccess = ((st.lessonAttempts !== undefined && st.lessonAttempts !== '') ? num(st.lessonAttempts) : 5) + LIM.lessonBonus;

                    <div class="kpi-grid">
                        ${kpi('<svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><path d="M23 7l-7 5 7 5z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>', 'فيديوهات شاهدتها', sVideos + ' / ' + tVideos, '', '#0ea5e9')}
                        ${kpi('<svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>', 'ملازم فتحتها', sNotes + ' / ' + tNotes, '', '#10b981')}
                        ${kpi('<svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>', 'ملخصات فتحتها', sSums + ' / ' + tSums, '', '#f59e0b')}
                        ${kpi('<svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>', 'مرات دخول الحصص', sAccess, '', '#8b5cf6')}
                    </div>
                    ${lessonCards || '<div class="empty">مفيش حصص متاحة دلوقتي.</div>'}
                </div>

                <div class="sec" id="lessonExamsSection">
                    <h3><svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg> امتحانات الحصص <small>${sortedRes.length} اتحلّ • ${leRemaining.length} لسه</small></h3>
                    <div class="kpi-grid">
                        ${kpi('<svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0;color:#22c55e" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>', 'امتحانات اتحلّت', sortedRes.length, 'من ' + tExams, '#10b981')}
                        ${kpi('<svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>', 'المتوسط', sortedRes.length ? leAvg + '%' : '—', '', '#6366f1')}
                        ${kpi('<svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0;color:#fbbf24" aria-hidden="true"><circle cx="12" cy="8" r="6"/><path d="M15.48 13.89L17 22l-5-3-5 3 1.52-8.11"/></svg>', 'أعلى درجة', sortedRes.length ? leBest + '%' : '—', '', '#eab308')}
                        ${kpi('<svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><path d="M5 22h14M5 2h14M17 22v-4.17a2 2 0 0 0-.59-1.41L12 12l-4.41 4.42A2 2 0 0 0 7 17.83V22M7 2v4.17a2 2 0 0 0 .59 1.41L12 12l4.41-4.42A2 2 0 0 0 17 6.17V2"/></svg>', 'متبقي ليك', leRemaining.length, 'امتحان حصة', '#ef4444')}
                    </div>
                    ${leHtml || '<div class="empty">لسه ماحلّتش أي امتحان حصة.</div>'}
                    ${leRemaining.length ? `<div class="meta" style="margin-top:6px">امتحانات لسه ماحلّتهاش: ${leRemaining.map(l => esc('الحصة ' + (l.number || '') + ' - ' + (l.title || ''))).join(' • ')}</div>` : ''}
                </div>

                <div class="sec" id="examsSection">
                    <h3><svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg> الامتحانات الشاملة <small>${exams.length} امتحان</small></h3>
                    <div class="kpi-grid">
                        ${kpi('<svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0;color:#22c55e" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.7 2.7L16 9.5"/></svg>', 'اتسلّمت', ceTaken + ' / ' + exams.length, '', '#10b981')}
                        ${kpi('<svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0;color:#fbbf24" aria-hidden="true"><circle cx="12" cy="8" r="6"/><path d="M15.48 13.89L17 22l-5-3-5 3 1.52-8.11"/></svg>', 'معتمدة', cePublished, 'درجتها ظهرت', '#6366f1')}
                        ${kpi('<svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><path d="M5 22h14M5 2h14M17 22v-4.17a2 2 0 0 0-.59-1.41L12 12l-4.41 4.42A2 2 0 0 0 7 17.83V22M7 2v4.17a2 2 0 0 0 .59 1.41L12 12l4.41-4.42A2 2 0 0 0 17 6.17V2"/></svg>', 'بانتظار الاعتماد', cePending, '', '#f59e0b')}
                        ${kpi('<svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><path d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1z"/></svg>', 'متبقي ليك', Math.max(0, ceRemaining), 'امتحان شامل', '#ef4444')}
                    </div>
                    ${ceHtml || '<div class="empty">مفيش امتحانات شاملة متاحة دلوقتي.</div>'}
                </div>

                <div class="sec" id="communitySection">
                    <h3><svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8z"/></svg> المنتدى والأصدقاء</h3>
                    <div class="rows">
                        ${rw('أسئلة نشرتها في المنتدى', postsCnt === null ? '—' : postsCnt)}
                        ${rw('أسئلة بانتظار مراجعة الأدمن', pendCnt === null ? '—' : pendCnt)}
                        ${rw('عدد أصدقائك', friendsCnt === null ? '—' : friendsCnt)}
                        ${rw('ظهورك في المقارنة ولوحة المتصدرين', d.allowComparison === false ? 'مخفي' : 'ظاهر')}
                    </div>
                </div>

                <div class="sec" id="accountSection">
                    <h3><svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> بيانات حسابك</h3>
                    <div class="rows">
                        ${rw('رقم الطالب (ID)', esc(sid))}
                        ${rw('تاريخ الانضمام', fmtDate(createdMs))}
                        ${rw('بقالك على المنصة', daysSinceJoin ? daysSinceJoin + ' يوم' : '—')}
                        ${rw('آخر يوم نشاط', esc(d.lastActiveDay || '—'))}
                        ${rw('المستوى الحالي', 'Lv.' + lv.level + ' — ' + lv.tier.name)}
                        ${rw('الرتبة', rankInfo.label)}
                        ${rw('النقاط للمستوى الجاي', lv.maxed ? 'وصلت للقمة' : lv.toNext + ' نقطة')}
                        ${rw('أقرب ميزة هتفتحها', lv.nextPerk ? lv.nextPerk.icon + ' ' + lv.nextPerk.title + ' (Lv.' + lv.nextPerk.lvl + ')' : 'كل المميزات مفتوحة')}
                    </div>
                    <a class="sub-cta" style="background:linear-gradient(135deg,#818cf8,#a855f7); color:#fff;" href="profile.html"><svg class="ic" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.125em;flex-shrink:0" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> افتح بروفايلك ومميزات المستويات</a>
                </div>`;
            root.innerHTML = html;

            /* ---------- باقة Plus: إحصائيات أساسية — تفاصيل الامتحانات والمجتمع لـ Pro وأعلى ---------- */
            try {
                if (!PS.isAdminSession() && PSPlans.rank(LIM.tier) < PSPlans.rank('pro')) {
                    ['lessonExamsSection', 'examsSection', 'communitySection'].forEach(function (id) {
                        const el = document.getElementById(id); if (!el) return;
                        const h = el.querySelector('h3');
                        el.innerHTML = (h ? '<h3>' + h.innerHTML + '</h3>' : '') + '<div class="empty">الإحصائيات الكاملة متاحة في باقة Pro وأعلى. <a href="subscribe.html" style="color:var(--gold);font-weight:800;">رقّي باقتك</a></div>';
                    });
                }
                const tn = LIM.tier && PSPlans.tier(LIM.tier);
                if (tn) { document.querySelectorAll('#subSection .rows .row, #subSection .rows > div').forEach(function (r) { if (/الخطة \/ الباقة/.test(r.textContent)) { const v = r.lastElementChild; if (v) v.innerHTML = '<b style="color:' + tn.color + '">' + tn.name + '</b>'; } }); }
            } catch (e) { console.warn('tier ui', e); }

            /* ---------- عدّاد الاشتراك الحي ---------- */
            clearInterval(countdownTimer);
            if (activeSub && expMs) {
                const startMs = toMs(d.subscriptionActivatedAt || d.trialStartedAt);
                const tick = () => {
                    const left = expMs - Date.now();
                    if (left <= 0) { clearInterval(countdownTimer); location.reload(); return; }
                    const dd = Math.floor(left / 86400000), hh = Math.floor((left % 86400000) / 3600000), mm = Math.floor((left % 3600000) / 60000), ss = Math.floor((left % 60000) / 1000);
                    document.getElementById('cdD').textContent = dd; document.getElementById('cdH').textContent = hh;
                    document.getElementById('cdM').textContent = mm; document.getElementById('cdS').textContent = ss;
                    const bar = document.getElementById('cdBar'), note = document.getElementById('cdNote');
                    if (startMs && expMs > startMs) {
                        const usedPct = Math.max(0, Math.min(100, Math.round(((Date.now() - startMs) / (expMs - startMs)) * 100)));
                        bar.firstElementChild.style.width = usedPct + '%';
                        bar.className = 'bar' + (usedPct >= 85 ? ' warn' : '');
                        note.innerHTML = 'استهلكت <b>' + usedPct + '%</b> من مدة اشتراكك • باقي <b>' + dd + '</b> يوم' + (dd < 3 ? ' قرّب يخلص — جدّده من الزرار تحت' : '');
                    } else {
                        bar.firstElementChild.style.width = Math.min(100, Math.round((dd / 90) * 100)) + '%';
                        note.innerHTML = 'باقي <b>' + dd + '</b> يوم على انتهاء اشتراكك' + (dd < 3 ? ' قرّب يخلص — جدّده من الزرار تحت' : '');
                    }
                };
                tick();
                countdownTimer = setInterval(tick, 1000);
            }
        }
    </script>
</body>
</html>
