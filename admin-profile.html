<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بروفايل الأدمن - رحلة دراسية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; color: #333; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .profile-card { background: white; width: 100%; max-width: 450px; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; }
        .profile-img-container { position: relative; width: 120px; height: 120px; margin: 0 auto 20px; }
        .profile-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid #1e3c72; background: #ddd; }
        h2 { color: #1e3c72; margin-bottom: 5px; }
        p.email { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        .info-box { background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: right; }
        .info-box p { margin-bottom: 8px; font-size: 0.95rem; }
        .btn-back { background: #1e3c72; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; text-decoration: none; display: inline-block; }
        .btn-back:hover { background: #162c54; }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="profile-img-container">
            <img id="adminProfileImg" src="" alt="صورة الأدمن" class="profile-img" onerror="this.src='https://via.placeholder.com/120?text=Admin'">
        </div>
        <h2 id="adminNameDisplay">جاري التحميل...</h2>
        <p class="email" id="adminEmailDisplay">...</p>

        <div class="info-box">
            <p><b>الرتبة:</b> <span id="adminRoleDisplay" style="color: #8e44ad; font-weight: bold;">متحكم كامل ⚡</span></p>
            <p><b>حالة الحساب:</b> <span style="color: green; font-weight: bold;">نشط 🟢</span></p>
        </div>

        <a href="admin.html" class="btn-back">⬅ العودة لوحة التحكم</a>
    </div>

    <script>
        const BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';

        // تم إزالة شرط التحقق من الجلسة (sessionStorage) الذي كان يسبب مشكلة الطرد

        async function loadAdminProfile() {
            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: {
                        'X-Master-Key': API_KEY,
                        'X-Access-Key': API_KEY
                    }
                });
                let result = await response.json();
                let rec = result.record || {};
                let currentEmail = sessionStorage.getItem('adminEmail') || 'mohamad66xm@gmail.com';

                let admins = rec.admins || [];
                let currentAdmin = admins.find(a => a.email === currentEmail) || admins[0];

                if (currentAdmin) {
                    document.getElementById('adminNameDisplay').textContent = currentAdmin.name || 'محمد عشري';
                    document.getElementById('adminEmailDisplay').textContent = currentAdmin.email || currentEmail;
                    
                    if (currentAdmin.profileImage) {
                        document.getElementById('adminProfileImg').src = currentAdmin.profileImage;
                    }
                }
            } catch (err) {
                console.error(err);
            }
        }

        loadAdminProfile();
    </script>
</body>
</html>
