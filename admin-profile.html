<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بروفايل الأدمن - رحلة دراسية</title>
    
    <!-- استيراد مكتبات Firebase SDK (نسخة 10 المعيارية) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, addDoc, getDocs, query, where, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.doc = doc;
        window.getDoc = getDoc;
        window.setDoc = setDoc;
        window.deleteDoc = deleteDoc;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.query = query;
        window.where = where;
        window.serverTimestamp = serverTimestamp;
        window.updateDoc = updateDoc;
    </script>

    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            --card-bg: rgba(30, 41, 59, 0.85);
            --form-bg: rgba(15, 23, 42, 0.6);
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --input-bg: rgba(15, 23, 42, 0.8);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            --success: #10b981;
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #e0e7ff, #f3e8ff, #f1f5f9);
            --card-bg: rgba(255, 255, 255, 0.9);
            --form-bg: #f8fafc;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --border-color: #cbd5e1;
            --input-bg: #ffffff;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s, border-color 0.3s; }
        
        body { 
            background: var(--bg-gradient);
            color: var(--text-main); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
        }
        
        .profile-container { 
            background-color: var(--card-bg); 
            backdrop-filter: blur(16px);
            width: 100%; 
            max-width: 520px; 
            border-radius: 24px; 
            box-shadow: var(--shadow); 
            padding: 25px; 
            border: 1px solid var(--border-color); 
            position: relative; 
            overflow: hidden; 
        }

        .card-bg-pattern {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1; opacity: 0.15; background-repeat: repeat; background-size: 40px 40px;
        }

        .profile-container > * { position: relative; z-index: 2; }

        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .back-btn { background: none; border: none; color: var(--text-secondary); font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; font-weight: 600; }
        .back-btn:hover { color: var(--primary-color); }
        
        .profile-header { text-align: center; margin-bottom: 20px; }
        
        .avatar-wrapper { 
            position: relative; width: 110px; height: 110px; margin: 0 auto 12px; 
            border-radius: 50%; padding: 4px; display: flex; align-items: center; justify-content: center;
        }
        .avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #334155; position: relative; z-index: 2; }

        .rank-frame-mythic { 
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6, #ec4899); background-size: 300% 300%; 
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.8); 
            animation: mythicGlow 2.5s ease infinite;
        }
        @keyframes mythicGlow { 0% { box-shadow: 0 0 15px rgba(236,72,153,0.6); } 50% { box-shadow: 0 0 30px rgba(6,182,212,0.8); } 100% { box-shadow: 0 0 15px rgba(236,72,153,0.6); } }

        .upload-badge {
            position: absolute; bottom: 2px; left: 2px; background: var(--primary-color); color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid var(--card-bg); box-shadow: 0 2px 5px rgba(0,0,0,0.2); font-size: 0.85rem; transition: transform 0.2s; z-index: 5;
        }
        .upload-badge:hover { transform: scale(1.1); background: var(--primary-hover); }

        .admin-name { font-size: 1.35rem; font-weight: 700; margin-bottom: 3px; color: var(--text-main); display: flex; align-items: center; justify-content: center; gap: 6px; }
        .verified-badge { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background-color: #38bdf8; border-radius: 50%; vertical-align: middle; }
        .verified-badge svg { width: 11px; height: 11px; fill: #0f172a; }

        .level-badge-box {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 7px 18px; border-radius: 12px; font-size: 0.9rem; font-weight: 700; margin-bottom: 10px;
            background: linear-gradient(135deg, #be185d, #831843); color: #fce7f3; border: 1.5px solid #ec4899;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
            cursor: pointer;
        }

        .admin-email { color: var(--text-secondary); font-size: 0.88rem; }
        .info-card { background-color: var(--form-bg); border-radius: 12px; padding: 12px 18px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.88rem; }
        .info-label { color: var(--text-secondary); }
        .info-value { font-weight: 600; display: flex; align-items: center; gap: 4px; }

        .action-buttons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .btn { width: 100%; padding: 11px; border-radius: 10px; font-size: 0.88rem; font-weight: 700; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; background-color: var(--primary-color); color: white; transition: background 0.2s; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-full { grid-column: span 2; }
        .btn-save { background-color: #10b981; }
        .btn-danger { background-color: #ef4444; }
        .btn-secondary { background-color: #334155; }
        .btn-special { background: linear-gradient(135deg, #8b5cf6, #6366f1); }

        .form-group { margin-bottom: 10px; text-align: right; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: bold; margin-bottom: 4px; color: var(--text-secondary); }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-main); border-radius: 8px; outline: none; font-size: 0.88rem; }

        /* نوافذ عائمة منظمة وموحدة */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s; padding: 15px; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-card { background: var(--card-bg); width: 100%; max-width: 460px; border-radius: 20px; border: 1px solid var(--border-color); box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5); overflow: hidden; transform: scale(0.85) translateY(20px); transition: transform 0.3s; }
        .modal-overlay.active .modal-card { transform: scale(1) translateY(0); }
        .modal-header { padding: 15px 20px; background: var(--form-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .close-modal { background: none; border: none; font-size: 1.2rem; color: var(--text-secondary); cursor: pointer; }
        .modal-body { padding: 20px; text-align: right; max-height: 80vh; overflow-y: auto; }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1e293b; color: #f8fafc; padding: 12px 24px; border-radius: 12px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 0.9rem; z-index: 2000; transition: transform 0.3s ease; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .loading { text-align: center; padding: 30px; color: var(--text-secondary); }
    </style>
</head>
<body>

    <div class="profile-container" id="profileCardMain">
        <div id="cardPatternBg" class="card-bg-pattern"></div>

        <div class="header-actions">
            <a href="admin.html" class="back-btn"><span>←</span> عودة لوحة التحكم</a>
            <button class="back-btn" onclick="logoutAdmin()" style="color: #ef4444;">تسجيل الخروج 🚪</button>

            <div class="loading">جاري جلب بيانات البروفايل من السحابة... ⏳</div>

    <!-- نافذة عائمة للإعدادات وتعديل الملف -->
    <div class="modal-overlay" id="settingsModal" onclick="closeModalOnOuterClick(event, 'settingsModal')">
        <div class="modal-card">
            <div class="modal-header">
                <h3>⚙️ إعدادات وتعديل البروفايل</h3>

            </div>
            <div class="modal-body">
                <div class="form-group">

                </div>

                    <input type="password" id="editAdminPassword" placeholder="اتركها فارغة إذا لم ترد تغييرها">
                </div>
                <div style="display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 15px;">
                    <button class="btn btn-save btn-full" onclick="saveAdminChanges()">حفظ التعديلات 💾</button>
                    <button class="btn btn-secondary btn-full" onclick="removeProfileImage()">حذف صورة البروفايل 🗑️</button>

    <!-- نافذة عائمة للإشعار الجماعي -->
    <div class="modal-overlay" id="broadcastModal" onclick="closeModalOnOuterClick(event, 'broadcastModal')">
        <div class="modal-card">
            <div class="modal-header">
                <h3>📢 إرسال إشعار جماعي للطلاب</h3>
                <button class="close-modal" onclick="closeModal('broadcastModal')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>عنوان الإشعار</label>
                    <input type="text" id="broadcastTitle" placeholder="مثال: تنبيه هام بخصوص الامتحان القادم">

    <!-- نافذة عائمة للملاحظات (متزامنة مع Firebase) -->
    <div class="modal-overlay" id="notesModal" onclick="closeModalOnOuterClick(event, 'notesModal')">
        <div class="modal-card">
            <div class="modal-header">
                <h3>📝 مفكرة الملاحظات الشخصية</h3>

            </div>
            <div class="modal-body">
                <div class="form-group">

                    <textarea id="adminNotesText" rows="6" placeholder="اكتب ملاحظاتك هنا..."></textarea>

    <!-- نافذة عائمة لمؤلف الرسائل السريعة (تتسحب من فايربيس) -->
    <div class="modal-overlay" id="messageComposerModal" onclick="closeModalOnOuterClick(event, 'messageComposerModal')">
        <div class="modal-card">
            <div class="modal-header">
                <h3>⚡ مؤلف الرسائل السريعة للطلاب</h3>
                <button class="close-modal" onclick="closeModal('messageComposerModal')">✕</button>

            <div class="modal-body">
                <div class="form-group">
                    <label>اختر تصنيف الرسالة من السحابة</label>
                    <select id="msgCategorySelect" onchange="loadQuickMessageFromCloud()">
                        <option value="motivation">🔥 تحفيز وشحن معنوي</option>
                        <option value="warning">⚠️ تنبيه للطلاب المتكسلين</option>

                <button class="btn btn-special btn-full" onclick="loadQuickMessageFromCloud()">توليد رسالة جديدة 🔄</button>

    <!-- نافذة عائمة لتحدي اليوم للمشرف (تتسحب من فايربيس) -->
    <div class="modal-overlay" id="adminQuestModal" onclick="closeModalOnOuterClick(event, 'adminQuestModal')">
        <div class="modal-card">
            <div class="modal-header">
                <h3>🎯 تحدي اليوم للمشرف</h3>
                <button class="close-modal" onclick="closeModal('adminQuestModal')">✕</button>
            </div>
            <div class="modal-body" style="text-align:center;">
                <div style="font-size:3rem; margin-bottom:10px;">👑</div>
                <div id="dailyQuestDisplay" style="font-size:1.05rem; font-weight:bold; color:var(--text-main); line-height:1.6; margin-bottom:20px; background:var(--form-bg); padding:15px; border-radius:12px; border:1px solid var(--border-color);">
                    جاري تحميل تحدي اليوم من السحابة...
                </div>
                <button class="btn btn-save btn-full" onclick="loadDailyQuestFromCloud()">إحضار تحدي جديد 🔄</button>
            </div>
        </div>
    </div>

    <div class="toast" id="customToast">
        <span id="toastIcon">✨</span>
        <span id="toastMessage">تم بنجاح</span>
    </div>

    <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">

    <script>
        let currentAdminData = null;

        function showToast(message, icon = "✨") {
            const toast = document.getElementById('customToast');
            document.getElementById('toastMessage').innerText = message;
            document.getElementById('toastIcon').innerText = icon;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        async function initProfile() {
            const container = document.getElementById('profileContent');
            let sessionAdmin = sessionStorage.getItem('adminUser') || sessionStorage.getItem('currentUser');
            let adminEmail = sessionStorage.getItem('adminEmail');

            if (!sessionAdmin && !adminEmail) {
                container.innerHTML = `<div class="loading" style="color: #ef4444;">لم يتم العثور على جلسة نشطة. <br><a href="login.html" style="color:#6366f1; text-decoration:underline;">تسجيل الدخول</a></div>`;
                return;
            }

            try {
                if (sessionAdmin) currentAdminData = JSON.parse(sessionAdmin);

                if (adminEmail && window.firebaseDb && window.doc && window.getDoc) {
                    const docRef = window.doc(window.firebaseDb, "admins", adminEmail.toLowerCase());
                    const docSnap = await window.getDoc(docRef);
                    if (docSnap.exists()) {
                        currentAdminData = docSnap.data();
                    }
                }

                if (currentAdminData) {
                    renderProfile(currentAdminData);
                } else {
                    container.innerHTML = `<div class="loading" style="color: #ef4444;">عذراً، لم يتم العثور على بيانات الحساب!</div>`;
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="loading" style="color: #ef4444;">حدث خطأ أثناء تحميل البيانات.</div>`;
            }
        }

        function renderProfile(admin) {
            const container = document.getElementById('profileContent');
            let avatarUrl = admin.profileImage || admin.avatar || "https://via.placeholder.com/150/1e293b/94a3b8?text=صورة";
            let fullName = admin.fullname || admin.name || "مسؤول النظام";
            let email = admin.email || sessionStorage.getItem('adminEmail') || "";
            let phone = admin.phone || "غير محدد";

            container.innerHTML = `
                <div class="profile-header">
                    <div class="avatar-wrapper rank-frame-mythic">
                        <img src="${avatarUrl}" alt="صورة الأدمن" id="adminAvatarImg">
                        <label for="imageInput" class="upload-badge" title="تغيير صورة البروفايل">📷</label>
                    </div>
                    <div class="level-badge-box" onclick="openModal('adminQuestModal'); loadDailyQuestFromCloud();">
                        <span>👑</span>
                        <span>مستوى مشرف رئيسي (اضغط للتحدي)</span>
                    </div>
                    <h1 class="admin-name">
                        <span>${fullName}</span>
                        <span class="verified-badge" title="حساب موثق">
                            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                        </span>
                    </h1>
                    <p class="admin-email">${email}</p>
                </div>

                <div class="info-card">
                    <div class="info-row">
                        <span class="info-label">رقم الهاتف:</span>
                        <span class="info-value">${phone}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">نوع الحساب:</span>
                        <span class="info-value" style="color: #6366f1;">أدمن / مشرف 🛡️</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">حالة الحساب:</span>
                        <span class="info-value" style="color: #10b981;">نشط ✅</span>
                    </div>
                </div>

                <!-- أزرار التحكم والبروفايل المنظمة -->
                <div class="action-buttons-grid">
                    <button class="btn btn-secondary" onclick="openModal('settingsModal')">⚙️ الإعدادات</button>
                    <button class="btn btn-special" onclick="openModal('broadcastModal')">📢 إشعار جماعي</button>
                    <button class="btn btn-special" onclick="openModal('notesModal'); loadAdminNotesFromCloud();">📝 الملاحظات</button>
                    <button class="btn" onclick="openModal('messageComposerModal'); loadQuickMessageFromCloud();">⚡ الرسائل السريعة</button>
                    <button class="btn btn-full btn-special" onclick="openModal('adminQuestModal'); loadDailyQuestFromCloud();">🎯 تحدي اليوم للمشرف</button>
                    <!-- زر مؤقت لرفع الـ 200 جملة تهنئة وتفوق (congrats) -->
                    <button class="btn btn-full btn-danger" onclick="runCongratsUploadScript()" style="background:#10b981; margin-top:5px;">🌟 رفع الـ 200 جملة تهنئة (Congrats) لفايربيس</button>
                </div>
            `;
        }

        window.openModal = function(modalId) { document.getElementById(modalId).classList.add('active'); };
        window.closeModal = function(modalId) { document.getElementById(modalId).classList.remove('active'); };
        window.closeModalOnOuterClick = function(e, modalId) { if (e.target.classList.contains('modal-overlay')) closeModal(modalId); };

        function processImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_SIZE = 250;
                        let width = img.width, height = img.height;
                        if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } }
                        else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                    img.onerror = error => reject(error);
                };
                reader.onerror = error => reject(error);
            });
        }

        async function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            try {
                let base64Img = await processImage(file);
                document.getElementById('adminAvatarImg').src = base64Img;
                currentAdminData.profileImage = base64Img;
                currentAdminData.avatar = base64Img;

                let email = currentAdminData.email;
                if (window.firebaseDb && window.doc) {
                    await window.setDoc(window.doc(window.firebaseDb, "admins", email), currentAdminData, { merge: true });

                sessionStorage.setItem('adminUser', JSON.stringify(currentAdminData));

                    congrats: congratsArray
                }, { merge: true });

                showToast("تم رفع الـ 200 جملة تهنئة (Congrats) بنجاح! 🌟", "✅");
            } catch (error) {
                console.error("خطأ أثناء الرفع: ", error);
                showToast("حصل خطأ أثناء الرفع، راجع الكونسول.", "❌");
            }
        };

        // دالة جلب الرسائل السريعة ديناميكياً
        window.loadQuickMessageFromCloud = async function() {
            const cat = document.getElementById('msgCategorySelect').value;
            const outputArea = document.getElementById('generatedMsgOutput');
            outputArea.value = "جاري جلب الرسالة من السحابة... ⏳";

            try {
                const docRef = window.doc(window.firebaseDb, "messagestore", cat);
                const docSnap = await window.getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const messagesList = data[cat]; 

                    if (messagesList && messagesList.length > 0) {
                        const randomMsg = messagesList[Math.floor(Math.random() * messagesList.length)];
                        outputArea.value = randomMsg;
                    } else {
                        outputArea.value = "عذراً، هذا الحقل فارغ حالياً في فايربيس.";
                    }
                } else {
                    outputArea.value = "لم يتم العثور على مستند " + cat + " في messagestore!";
                }
            } catch (err) {
                console.error(err);
                outputArea.value = "حدث خطأ أثناء الاتصال بقاعدة البيانات.";
            }
        };

        window.copyGeneratedMessage = function() {
            const textarea = document.getElementById('generatedMsgOutput');
            textarea.select();
            document.execCommand('copy');
            showToast("تم نسخ الرسالة إلى الحافظة بنجاح! 📋", "✨");
        };

        // دالة جلب تحدي اليوم للمشرف
        window.loadDailyQuestFromCloud = async function() {
            const questDisplay = document.getElementById('dailyQuestDisplay');
            questDisplay.innerText = "جاري جلب التحدي من السحابة... ⏳";

            try {
                const docRef = window.doc(window.firebaseDb, "messagestore", "adminQuests");
                const docSnap = await window.getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const questsList = data.adminQuests || []; 

                    if (questsList.length > 0) {
                        const randomQuest = questsList[Math.floor(Math.random() * questsList.length)];
                        questDisplay.innerText = randomQuest;
                    } else {
                        questDisplay.innerText = "لا توجد تحديات مسجلة حالياً.";
                    }
                } else {
                    questDisplay.innerText = "لم يتم العثور على مستند adminQuests في messagestore!";
                }
            } catch (err) {
                console.error(err);
                questDisplay.innerText = "حدث خطأ أثناء جلب التحدي.";
            }
        };

        function logoutAdmin() {
            sessionStorage.clear();
            window.location.href = 'login.html';
        }

        initProfile();
    </script>
</body>
</html>
