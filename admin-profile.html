<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي للأدمن - رحلة دراسية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f7f6; color: #333; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
        
        .profile-card { background: white; width: 100%; max-width: 450px; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        
        /* الهيدر مع صورة بروفايل قابلة للتغيير */
        .profile-header { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; padding: 30px 20px; text-align: center; position: relative; }
        .admin-badge { position: absolute; top: 15px; left: 15px; background: #e74c3c; color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        
        .avatar-container { position: relative; width: 90px; height: 90px; margin: 0 auto 12px; }
        .avatar-box { width: 100%; height: 100%; background: #e2e8f0; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; border: 3px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); overflow: hidden; object-fit: cover; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        
        /* زر رفع الصورة الصغير */
        .upload-label { position: absolute; bottom: 0; right: 0; background: #27ae60; color: white; width: 28px; height: 28px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 0.8rem; cursor: pointer; border: 2px solid white; transition: background 0.2s; }
        .upload-label:hover { background: #219653; }
        #avatarInput { display: none; }

        .profile-header h1 { font-size: 1.3rem; margin-bottom: 4px; }
        .profile-header p { font-size: 0.85rem; opacity: 0.9; }

        /* تفاصيل البيانات */
        .profile-body { padding: 20px; }
        .info-group { margin-bottom: 15px; }
        .info-group label { display: block; font-size: 0.8rem; color: #666; margin-bottom: 5px; font-weight: bold; }
        .info-value { background: #f8f9fa; border: 1px solid #e2e8f0; padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; color: #1e293b; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }

        /* الأزرار */
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn { padding: 11px; border-radius: 8px; border: none; font-size: 0.85rem; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 5px; }
        .btn-primary { background: #2980b9; color: white; }
        .btn-primary:hover { background: #2471a3; }
        .btn-secondary { background: #7f8c8d; color: white; }
        .btn-secondary:hover { background: #6c7a89; }
        .btn-danger { background: #e74c3c; color: white; grid-column: span 2; }
        .btn-danger:hover { background: #c0392b; }
    </style>
</head>
<body>

    <div class="profile-card" id="adminProfileCard" style="display: none;">
        <div class="profile-header">
            <span class="admin-badge">مدير النظام ⚡</span>
            
            <div class="avatar-container">
                <div class="avatar-box" id="avatarPreviewContainer">👨‍💻</div>
                <label for="avatarInput" class="upload-label" title="تغيير الصورة الشخصية">📷</label>
                <input type="file" id="avatarInput" accept="image/*">
            </div>

            <h1>محمد عشري</h1>
            <p>مؤسس ومطور منصة رحلة دراسية</p>
        </div>

        <div class="profile-body">
            <div class="info-group">
                <label>البريد الإلكتروني للأدمن</label>
                <div class="info-value">mohamad66xm@gmail.com</div>
            </div>

            <div class="info-group">
                <label>نوع الحساب والصلاحيات</label>
                <div class="info-value" style="color: #2980b9; font-weight: bold;">تحكم كامل - Admin 🚀</div>
            </div>

            <div class="info-group">
                <label>حالة السحابة والدعم</label>
                <div class="info-value" style="color: #27ae60;">متصلة ونشطة 🟢</div>
            </div>

            <div class="btn-grid">
                <a href="admin.html" class="btn btn-primary">لوحة التحكم ⚙️</a>
                <a href="main.html" class="btn btn-secondary">المنصة الرئيسية 🏠</a>
                <button class="btn btn-danger" id="logoutAdminBtn">تسجيل الخروج 🚪</button>
            </div>
        </div>
    </div>

    <script>
        // التحقق من صلاحية الدخول للأدمن
        if (sessionStorage.getItem('isAdminLoggedIn') !== 'true') {
            alert('غير مصرح لك بالدخول، يجيب تسجيل الدخول كأدمن أولاً!');
            window.location.href = 'login.html';
        } else {
            document.getElementById('adminProfileCard').style.display = 'block';
        }

        // استرجاع الصورة المخزنة مسبقاً لو موجودة
        const savedAvatar = localStorage.getItem('adminAvatar');
        const previewContainer = document.getElementById('avatarPreviewContainer');
        if (savedAvatar) {
            previewContainer.innerHTML = `<img src="${savedAvatar}" alt="Admin Avatar">`;
        }

        // رفع وتغيير الصورة الشخصية وحفظها محلياً
        document.getElementById('avatarInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const base64Image = event.target.result;
                    localStorage.setItem('adminAvatar', base64Image);
                    previewContainer.innerHTML = `<img src="${base64Image}" alt="Admin Avatar">`;
                    alert('تم تحديث صورة البروفايل بنجاح! ✅');
                };
                reader.readAsDataURL(file);
            }
        });

        // زر الخروج
        document.getElementById('logoutAdminBtn').addEventListener('click', function() {
            sessionStorage.removeItem('isAdminLoggedIn');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
