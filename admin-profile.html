<script>
    const BIN_ID = '6ab78eaeffd5d1605330ce1e';
    const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';

    // التأكد أولاً أن الأدمن مسجل دخول من الأساس (نفس حماية لوحة التحكم)
    if (sessionStorage.getItem('isAdminLoggedIn') !== 'true') {
        alert('يجب تسجيل الدخول أولاً!');
        window.location.href = 'login.html';
    }

    async function initProfileFromCloud() {
        try {
            // توحيد مصدر قراءة الإيميل من sessionStorage ليتطابق تماماً مع لوحة التحكم
            let currentEmail = sessionStorage.getItem('adminEmail') || localStorage.getItem('adminEmail') || 'mohamad66xm@gmail.com';

            let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: {
                    'X-Master-Key': API_KEY,
                    'X-Access-Key': API_KEY
                }
            });

            if (!response.ok) throw new Error('فشل الاتصال بقاعدة البيانات السحابية');

            let result = await response.json();
            let rec = result.record || {};
            let rawAdmins = rec.admins || [];
            let adminsList = [];

            // معالجة بيانات الأدمنز سواء كانت Array أو Object لضمان عدم حدوث أي خطأ في البحث
            if (Array.isArray(rawAdmins)) {
                adminsList = rawAdmins;
            } else if (typeof rawAdmins === 'object' && rawAdmins !== null) {
                adminsList = Object.keys(rawAdmins).map(key => {
                    let val = rawAdmins[key];
                    return (typeof val === 'object' && val !== null) ? { email: key, ...val } : { email: key, name: key.split('@')[0], role: 'sub' };
                });
            }

            // البحث عن الأدمن الحالي بالبريد الإلكتروني بدقة
            let currentAdmin = adminsList.find(a => a.email && a.email.toLowerCase() === currentEmail.toLowerCase());

            // لو مش موجود في القائمة بس هو المطور الأساسي، ننشئ له كائن افتراضي مؤقت عشان الصفحة تفتح وما تطردوش
            if (!currentAdmin && currentEmail === 'mohamad66xm@gmail.com') {
                currentAdmin = {
                    name: 'محمد عشري',
                    email: 'mohamad66xm@gmail.com',
                    role: 'master',
                    isVerified: true
                };
            }

            if (currentAdmin) {
                // تحديث الجلسة والتخزين المحلي لضمان استقرار التطبيق
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                sessionStorage.setItem('adminEmail', currentAdmin.email);
                renderProfile(currentAdmin);
            } else {
                document.getElementById('profileContent').innerHTML = `
                    <div class="loading" style="color: #ef4444;">لم يتم العثور على حساب المشرف المطابق في السحابة.</div>
                    <div class="actions-section" style="margin-top: 15px;">
                        <a href="admin.html" class="btn">العودة لوحة التحكم</a>
                    </div>
                `;
            }
        } catch (err) {
            console.error(err);
            document.getElementById('profileContent').innerHTML = `
                <div class="loading" style="color: #ef4444;">خطأ في الاتصال بالإنترنت أو قاعدة البيانات.</div>
                <div class="actions-section" style="margin-top: 15px;">
                    <a href="admin.html" class="btn">إعادة المحاولة</a>
                </div>
            `;
        }
    }

    function renderProfile(admin) {
        const container = document.getElementById('profileContent');
        
        let isMaster = (admin.role === 'master' || admin.email === 'mohamad66xm@gmail.com');
        let roleText = isMaster ? 'متحكم رئيسي ⚡' : 'أدمن فرعي 🛡️';
        let avatarUrl = admin.profileImage && admin.profileImage.trim() !== '' ? admin.profileImage : 'https://via.placeholder.com/110?text=Admin';

        container.innerHTML = `
            <div class="profile-header">
                <div class="avatar-wrapper">
                    <img src="${avatarUrl}" alt="صورة الأدمن" class="avatar" onerror="this.src='https://via.placeholder.com/110?text=Admin'">
                </div>
                <h1 class="admin-name">${admin.name || 'محمد عشري'}</h1>
                <p class="admin-email">${admin.email || 'mohamad66xm@gmail.com'}</p>
            </div>

            <div class="info-card">
                <div class="info-row">
                    <span class="info-label">الصلاحية:</span>
                    <span class="info-value" style="color: #4f46e5;">${roleText}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">حالة الحساب:</span>
                    <span class="info-value" style="color: #10b981;">نشط ومتصل بالسحابة 🌐</span>
                </div>
            </div>

            <div class="actions-section">
                <a href="admin.html" class="btn">الذهاب للوحة التحكم الرئيسية</a>
            </div>
        `;
    }

    // تشغيل المزامنة فور فتح الصفحة
    initProfileFromCloud();
</script>
