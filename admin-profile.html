<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بروفايل الأدمن - رحلة دراسية</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --form-bg: #0f172a;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --input-bg: #1e293b;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --form-bg: #f8fafc;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, border-color 0.3s; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .profile-container { background-color: var(--card-bg); width: 100%; max-width: 520px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); padding: 25px; border: 1px solid var(--border-color); }
        .header-actions { margin-bottom: 15px; }
        .back-btn { background: none; border: none; color: var(--text-secondary); font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; font-weight: 600; }
        .back-btn:hover { color: var(--primary-color); }
        .profile-header { text-align: center; margin-bottom: 20px; }
        
        .avatar-wrapper { position: relative; width: 105px; height: 105px; margin: 0 auto 12px; }
        .avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary-color); background: #334155; }
        
        .upload-badge {
            position: absolute; bottom: 2px; left: 2px; background: var(--primary-color); color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid var(--card-bg); box-shadow: 0 2px 5px rgba(0,0,0,0.2); font-size: 0.85rem; transition: transform 0.2s;
        }
        .upload-badge:hover { transform: scale(1.1); background: var(--primary-hover); }

        .admin-name { font-size: 1.35rem; font-weight: 700; margin-bottom: 3px; color: var(--text-main); display: flex; align-items: center; justify-content: center; gap: 6px; }
        
        .verified-badge { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background-color: #38bdf8; border-radius: 50%; vertical-align: middle; }
        .verified-badge svg { width: 11px; height: 11px; fill: #0f172a; }

        .admin-email { color: var(--text-secondary); font-size: 0.88rem; }
        
        .info-card { background-color: var(--form-bg); border-radius: 12px; padding: 12px 18px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 0.88rem; }
        .info-row:last-child { margin-bottom: 0; }
        .info-label { color: var(--text-secondary); }
        .info-value { font-weight: 600; display: flex; align-items: center; gap: 4px; }

        .edit-form { margin-bottom: 15px; background: var(--form-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: bold; margin-bottom: 4px; color: var(--text-secondary); }
        .form-group input { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-main); border-radius: 8px; outline: none; font-size: 0.88rem; }
        .form-group input:focus { border-color: var(--primary-color); }

        /* صندوق البحث المضبوط متناسق جنب بعض */
        .admin-search-box { background: var(--form-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .admin-search-box h3 { font-size: 0.95rem; margin-bottom: 10px; color: var(--primary-color); display: flex; align-items: center; gap: 6px; }
        .search-input-group { display: flex; gap: 8px; align-items: center; width: 100%; }
        .search-input-group input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.88rem; background: var(--input-bg); color: var(--text-main); outline: none; }
        .search-input-group button { padding: 10px 18px; background: var(--primary-color); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.88rem; transition: 0.2s; white-space: nowrap; flex-shrink: 0; }
        .search-input-group button:hover { background: var(--primary-hover); }

        /* تصميم الأوسمة والمستويات */
        .rank-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 8px; font-size: 0.78rem; font-weight: 700; border: 1px solid transparent; box-shadow: 0 2px 6px rgba(0,0,0,0.15); backdrop-filter: blur(4px); }
        .rank-badge svg { width: 14px; height: 14px; flex-shrink: 0; }
        
        .rank-unranked { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border-color: #64748b; }
        .rank-bronze { background: rgba(217, 119, 6, 0.15); color: #f59e0b; border-color: #d97706; }
        .rank-silver { background: rgba(203, 213, 225, 0.2); color: #e2e8f0; border-color: #94a3b8; }
        .rank-gold { background: rgba(234, 179, 8, 0.2); color: #facc15; border-color: #eab308; }
        .rank-diamond { background: rgba(6, 182, 212, 0.2); color: #38bdf8; border-color: #06b6d4; }
        .rank-mythic { background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(168, 85, 247, 0.25)); color: #f43f5e; border-color: #f43f5e; }

        /* Modal النافذة العائمة للبحث */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease; padding: 15px; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-card { background: var(--card-bg); width: 100%; max-width: 440px; border-radius: 20px; border: 1px solid var(--border-color); box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5); overflow: hidden; transform: scale(0.9); transition: transform 0.3s ease; position: relative; }
        .modal-overlay.active .modal-card { transform: scale(1); }
        
        .modal-header { padding: 15px 20px; background: var(--form-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { font-size: 1rem; color: var(--text-main); }
        .close-modal { background: none; border: none; font-size: 1.2rem; color: var(--text-secondary); cursor: pointer; line-height: 1; }
        .close-modal:hover { color: #ef4444; }

        .modal-body { padding: 20px; text-align: center; max-height: 80vh; overflow-y: auto; }
        .modal-avatar-wrapper { position: relative; width: 80px; height: 80px; margin: 0 auto 12px; }
        .modal-avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary-color); }
        
        .modal-info-list { margin-top: 15px; text-align: right; background: var(--form-bg); border-radius: 12px; padding: 12px; border: 1px solid var(--border-color); }
        .modal-field { text-align: right; margin-bottom: 10px; }
        .modal-field label { display: block; font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 3px; }
        .modal-field input, .modal-field select { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); font-size: 0.85rem; outline: none; }

        .modal-actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
        .modal-actions-grid button { width: 100%; padding: 9px; border-radius: 8px; border: none; font-weight: bold; font-size: 0.82rem; cursor: pointer; }
        .btn-full { grid-column: span 2; }

        .btn { width: 100%; padding: 11px; border-radius: 10px; font-size: 0.92rem; font-weight: 600; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; background-color: var(--primary-color); color: white; transition: background 0.2s; margin-bottom: 8px; }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-save { background-color: #10b981; }
        .btn-save:hover { background-color: #059669; }
        .btn-logout { background-color: #ef4444; }
        .btn-logout:hover { background-color: #dc2626; }
        .loading { text-align: center; padding: 30px; color: var(--text-secondary); font-size: 0.95rem; }
        .permission-warning { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; padding: 10px; border-radius: 8px; font-size: 0.82rem; margin-top: 10px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div class="profile-container">
        <div class="header-actions">
            <a href="admin.html" class="back-btn"><span>←</span> عودة لوحة التحكم</a>
        </div>
        <div id="profileContent">
            <div class="loading">جاري جلب بيانات البروفايل... ⏳</div>
        </div>
    </div>

    <!-- Modal النافذة العائمة للبحث وإدارة الحسابات -->
    <div class="modal-overlay" id="searchModal" onclick="closeModalOnOuterClick(event)">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalProfileTitle">تفاصيل الحساب 🔍</h3>
                <button class="close-modal" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modalContent">
                <!-- المكونات الديناميكية ستظهر هنا -->
            </div>
        </div>
    </div>

    <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">

    <script>
        const BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';
        
        let globalRecord = {};
        let currentAdminData = null;
        let oldAdminEmail = '';

        if (sessionStorage.getItem('isAdminLoggedIn') !== 'true') {
            alert('يجب تسجيل الدخول أولاً!');
            window.location.href = 'login.html';
        }

        const verifiedBadgeHTML = `
            <span class="verified-badge" title="حساب موثق">
                <svg viewBox="0 0 24 24">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
            </span>
        `;

        async function initProfileFromCloud() {
            try {
                let currentEmail = sessionStorage.getItem('adminEmail') || 'mohamad66xm@gmail.com';
                oldAdminEmail = currentEmail;

                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                if (!response.ok) throw new Error('فشل الاتصال بالسحابة');

                let result = await response.json();
                globalRecord = result.record || {};
                let rawAdmins = globalRecord.admins || [];
                let adminsList = Array.isArray(rawAdmins) ? rawAdmins : [];

                currentAdminData = adminsList.find(a => a.email && a.email.toLowerCase() === currentEmail.toLowerCase());
                
                if (!currentAdminData && currentEmail === 'mohamad66xm@gmail.com') {
                    currentAdminData = { name: 'محمد عشري', email: 'mohamad66xm@gmail.com', phone: '01122161407', role: 'master', isVerified: true, profileImage: '' };
                }

                if (currentAdminData) {
                    renderProfile(currentAdminData);
                } else {
                    document.getElementById('profileContent').innerHTML = `<div class="loading" style="color: #ef4444;">لم يتم العثور على بيانات الحساب.</div>`;
                }
            } catch (err) {
                console.error(err);
                document.getElementById('profileContent').innerHTML = `<div class="loading" style="color: #ef4444;">خطأ في الاتصال بالإنترنت!</div>`;
            }
        }

        function renderProfile(admin) {
            const container = document.getElementById('profileContent');
            let isMaster = (admin.role === 'master' || admin.email === 'mohamad66xm@gmail.com');
            let roleText = isMaster ? 'متحكم رئيسي ⚡' : 'أدمن فرعي 🛡️';
            let avatarUrl = admin.profileImage && admin.profileImage.trim() !== '' ? admin.profileImage : 'https://via.placeholder.com/105?text=Admin';
            let isVerified = admin.isVerified === true;

            container.innerHTML = `
                <div class="profile-header">
                    <div class="avatar-wrapper">
                        <img src="${avatarUrl}" alt="صورة الأدمن" class="avatar" id="adminAvatarImg" onerror="this.src='https://via.placeholder.com/105?text=Admin'">
                        <label for="imageInput" class="upload-badge" title="تغيير صورة البروفايل">📷</label>
                    </div>
                    <h1 class="admin-name">
                        <span id="displayAdminName">${admin.name || 'محمد عشري'}</span>
                        ${isVerified ? verifiedBadgeHTML : ''}
                    </h1>
                    <p class="admin-email" id="displayAdminEmail">${admin.email}</p>
                </div>

                <div class="info-card">
                    <div class="info-row">
                        <span class="info-label">الصلاحية:</span>
                        <span class="info-value" style="color: #6366f1;">${roleText}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">حالة التوثيق:</span>
                        <span class="info-value" style="color: ${isVerified ? '#38bdf8' : '#888'};">
                            ${isVerified ? 'موثق رسمياً ' + verifiedBadgeHTML : 'غير موثق ⚪'}
                        </span>
                    </div>
                </div>

                <!-- صندوق البحث الموحد والمضبوط -->
                <div class="admin-search-box">
                    <h3>🔍 البحث الفوري عن بروفايل طالب أو أدمن</h3>
                    <div class="search-input-group">
                        <input type="text" id="adminSearchQuery" placeholder="كود ID، البريد، أو الاسم..." onkeydown="if(event.key==='Enter') searchUserProfile()">
                        <button onclick="searchUserProfile()">بحث</button>
                    </div>
                </div>

                <div class="edit-form">
                    <div class="form-group">
                        <label>الاسم الكامل</label>
                        <input type="text" id="editAdminName" value="${admin.name || ''}" placeholder="اسم الأدمن">
                    </div>
                    <div class="form-group">
                        <label>البريد الإلكتروني</label>
                        <input type="email" id="editAdminEmail" value="${admin.email || ''}" placeholder="example@mail.com">
                    </div>
                    <div class="form-group">
                        <label>رقم الهاتف</label>
                        <input type="tel" id="editAdminPhone" value="${admin.phone || ''}" placeholder="01xxxxxxxxx">
                    </div>
                    <div class="form-group">
                        <label>كلمة المرور الجديدة</label>
                        <input type="password" id="editAdminPassword" value="${admin.password || ''}" placeholder="كلمة المرور">
                    </div>
                    <button type="button" class="btn btn-save" id="saveBtn" onclick="saveAdminChanges()">حفظ البيانات المحدثة 💾</button>
                </div>

                <div class="actions-section">
                    <a href="admin.html" class="btn">الذهاب لوحة التحكم الرئيسية ⚡</a>
                    <button class="btn btn-logout" onclick="logoutAdmin()">تسجيل الخروج 🚪</button>
                </div>
            `;
        }

        // دالة بحث شاملة تبحث في الطلاب والأدمنز وتفتح نافذة التحكم العائمة بنفس الصلاحيات
        function searchUserProfile() {
            const query = document.getElementById('adminSearchQuery').value.trim().toLowerCase();
            const modal = document.getElementById('searchModal');
            const modalContent = document.getElementById('modalContent');
            
            if (!query) {
                alert('اكتب بيانات البحث أولاً!');
                return;
            }

            modal.classList.add('active');
            modalContent.innerHTML = '<p style="font-size:0.9rem; padding:20px;">جاري الاستعلام عن البيانات... ⏳</p>';

            let users = globalRecord.users || [];
            let admins = globalRecord.admins || [];

            let foundStudent = users.find(u => 
                (u.studentId && u.studentId.toLowerCase() === query) ||
                (u.email && u.email.toLowerCase() === query) ||
                (u.studentPhone && u.studentPhone === query) ||
                (u.fullName && u.fullName.toLowerCase().includes(query))
            );

            let foundAdmin = admins.find(a => 
                (a.email && a.email.toLowerCase() === query) ||
                (a.name && a.name.toLowerCase().includes(query))
            );

            let currentSessionRole = sessionStorage.getItem('adminRole');
            let isMasterUser = (currentSessionRole === 'master' || sessionStorage.getItem('adminEmail') === 'mohamad66xm@gmail.com');

            if (foundStudent) {
                let imgUrl = foundStudent.profileImage || foundStudent.profileImg || 'https://via.placeholder.com/80?text=Student';
                let rank = foundStudent.rank || 'unranked';
                let isBlocked = foundStudent.status === 'blocked';

                modalContent.innerHTML = `
                    <div class="modal-avatar-wrapper">
                        <img src="${imgUrl}" alt="صورة الطالب">
                    </div>
                    <h2 style="font-size:1.1rem; color:var(--text-main); margin-bottom:4px;">${foundStudent.fullName}</h2>
                    <p style="font-size:0.8rem; color:var(--text-secondary); margin-bottom:12px;">طالب مسجل</p>

                    <div class="modal-info-list">
                        <div class="modal-field">
                            <label>اسم الطالب:</label>
                            <input type="text" id="modalStudentName" value="${foundStudent.fullName}">
                        </div>
                        <div class="modal-field">
                            <label>كود الطالب (ID):</label>
                            <input type="text" id="modalStudentId" value="${foundStudent.studentId || ''}">
                        </div>
                        <div class="modal-field">
                            <label>هاتف الطالب:</label>
                            <input type="text" id="modalStudentPhone" value="${foundStudent.studentPhone || ''}">
                        </div>
                        <div class="modal-field">
                            <label>المستوى الدراسي:</label>
                            <select id="modalStudentRank">
                                <option value="unranked" ${rank === 'unranked' ? 'selected' : ''}>مجهول</option>
                                <option value="bronze" ${rank === 'bronze' ? 'selected' : ''}>ضعيف (Level 1)</option>
                                <option value="silver" ${rank === 'silver' ? 'selected' : ''}>متوسط (Level 2)</option>
                                <option value="gold" ${rank === 'gold' ? 'selected' : ''}>قوي (Level 3)</option>
                                <option value="diamond" ${rank === 'diamond' ? 'selected' : ''}>قوي جداً (Level 4)</option>
                                <option value="mythic" ${rank === 'mythic' ? 'selected' : ''}>أسطوري (Level 5)</option>
                            </select>
                        </div>
                    </div>

                    <div class="modal-actions-grid">
                        <button style="background:#e67e22; color:#fff;" onclick="toggleBlockStudentModal('${foundStudent.email}')">${isBlocked ? 'فك الحظر' : 'حظر الطالب'}</button>
                        <button style="background:#ef4444; color:#fff;" onclick="deleteStudentModal('${foundStudent.email}')">حذف الطالب</button>
                        <button style="background:#10b981; color:#fff;" class="btn-full" onclick="saveStudentSearchModal('${foundStudent.email}')">حفظ التعديلات 💾</button>
                    </div>
                `;
            } else if (foundAdmin) {
                let isMasterRole = (foundAdmin.role === 'master' || foundAdmin.email === 'mohamad66xm@gmail.com');
                let isVerified = foundAdmin.isVerified === true;
                let isBlocked = foundAdmin.status === 'blocked';
                let canEdit = isMasterUser;

                modalContent.innerHTML = `
                    <div class="modal-avatar-wrapper">
                        <img src="${foundAdmin.profileImage || 'https://via.placeholder.com/80?text=Admin'}" alt="صورة الأدمن">
                    </div>
                    <h2 style="font-size:1.1rem; color:var(--text-main); margin-bottom:4px;">${foundAdmin.name || 'مشرف'} ${isVerified ? verifiedBadgeHTML : ''}</h2>
                    <p style="font-size:0.8rem; color:#6366f1; margin-bottom:12px;">${isMasterRole ? 'متحكم رئيسي ⚡' : 'أدمن فرعي 🛡️'}</p>

                    ${!canEdit ? `<div class="permission-warning">⚠️ غير مصرح لك بتعديل بيانات مشرف آخر</div>` : ''}

                    <div class="modal-info-list">
                        <div class="modal-field">
                            <label>الاسم الكامل:</label>
                            <input type="text" id="modalAdminName" value="${foundAdmin.name || ''}" ${!canEdit ? 'disabled' : ''}>
                        </div>
                        <div class="modal-field">
                            <label>رقم الهاتف:</label>
                            <input type="text" id="modalAdminPhone" value="${foundAdmin.phone || ''}" ${!canEdit ? 'disabled' : ''}>
                        </div>
                    </div>

                    ${canEdit ? `
                        <div class="modal-actions-grid">
                            <button style="background:#3498db; color:#fff;" onclick="toggleVerifyAdminModal('${foundAdmin.email}')">${isVerified ? 'إلغاء التوثيق' : 'توثيق'}</button>
                            <button style="background:#8e44ad; color:#fff;" onclick="toggleRoleAdminModal('${foundAdmin.email}')">${isMasterRole ? 'تنزيل عادي' : 'ترقية كامل'}</button>
                            <button style="background:#e67e22; color:#fff;" onclick="toggleBlockAdminModal('${foundAdmin.email}')">${isBlocked ? 'فك الحظر' : 'حظر الأدمن'}</button>
                            <button style="background:#ef4444; color:#fff;" onclick="deleteAdminModal('${foundAdmin.email}')">حذف الحساب</button>
                            <button style="background:#10b981; color:#fff;" class="btn-full" onclick="saveAdminSearchModal('${foundAdmin.email}')">حفظ التعديلات 💾</button>
                        </div>
                    ` : ''}
                `;
            } else {
                modalContent.innerHTML = `
                    <div style="padding:20px; color:#ef4444;">
                        <p style="font-size:2rem; margin-bottom:10px;">❌</p>
                        <p>لم يتم العثور على أي حساب بهذه البيانات!</p>
                    </div>
                `;
            }
        }

        async function saveStudentSearchModal(email) {
            let student = (globalRecord.users || []).find(u => u.email === email);
            if (student) {
                student.fullName = document.getElementById('modalStudentName').value;
                student.studentId = document.getElementById('modalStudentId').value;
                student.studentPhone = document.getElementById('modalStudentPhone').value;
                student.rank = document.getElementById('modalStudentRank').value;
                await syncDataToCloud("تم تحديث بيانات الطالب بنجاح! ⚡");
                closeModal();
            }
        }

        async function saveAdminSearchModal(email) {
            let admin = (globalRecord.admins || []).find(a => a.email === email);
            if (admin) {
                admin.name = document.getElementById('modalAdminName').value;
                admin.phone = document.getElementById('modalAdminPhone').value;
                await syncDataToCloud("تم تحديث بيانات الأدمن بنجاح! ⚡");
                closeModal();
            }
        }

        async function toggleBlockStudentModal(email) {
            let st = (globalRecord.users || []).find(u => u.email === email);
            if (st) { st.status = st.status === 'blocked' ? 'active' : 'blocked'; await syncDataToCloud("تم تغيير حالة حظر الطالب!"); searchUserProfile(); }
        }

        async function deleteStudentModal(email) {
            if (confirm("هل أنت متأكد من حذف الطالب؟")) {
                globalRecord.users = (globalRecord.users || []).filter(u => u.email !== email);
                await syncDataToCloud("تم حذف الطالب!"); closeModal();
            }
        }

        async function toggleVerifyAdminModal(email) {
            let adm = (globalRecord.admins || []).find(a => a.email === email);
            if (adm) { adm.isVerified = !adm.isVerified; await syncDataToCloud("تم تغيير التوثيق!"); searchUserProfile(); }
        }

        async function toggleRoleAdminModal(email) {
            let adm = (globalRecord.admins || []).find(a => a.email === email);
            if (adm) { adm.role = adm.role === 'master' ? 'sub' : 'master'; await syncDataToCloud("تم تغيير الرتبة!"); searchUserProfile(); }
        }

        async function toggleBlockAdminModal(email) {
            let adm = (globalRecord.admins || []).find(a => a.email === email);
            if (adm) { adm.status = adm.status === 'blocked' ? 'active' : 'blocked'; await syncDataToCloud("تم تغيير حالة حظر الأدمن!"); searchUserProfile(); }
        }

        async function deleteAdminModal(email) {
            if (confirm("هل أنت متأكد من حذف هذا الأدمن؟")) {
                globalRecord.admins = (globalRecord.admins || []).filter(a => a.email !== email);
                await syncDataToCloud("تم حذف الأدمن!"); closeModal();
            }
        }

        function closeModal() { document.getElementById('searchModal').classList.remove('active'); }
        function closeModalOnOuterClick(e) { if (e.target.classList.contains('modal-overlay')) closeModal(); }

        function compressImage(file, maxWidth, maxHeight, quality, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function (event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; } }
                    else { if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', quality));
                };
            };
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            compressImage(file, 200, 200, 0.7, async function (compressedBase64) {
                document.getElementById('adminAvatarImg').src = compressedBase64;
                currentAdminData.profileImage = compressedBase64;
                await syncDataToCloud("تم حفظ صورة البروفايل في السحابة بنجاح! 📸");
            });
        }

        async function saveAdminChanges() {
            const newName = document.getElementById('editAdminName').value.trim();
            const newEmail = document.getElementById('editAdminEmail').value.trim().toLowerCase();
            const newPhone = document.getElementById('editAdminPhone').value.trim();
            const newPassword = document.getElementById('editAdminPassword').value.trim();

            if (!newName || !newEmail) {
                alert("يرجى ملء الاسم والبريد الإلكتروني!");
                return;
            }

            currentAdminData.name = newName;
            currentAdminData.email = newEmail;
            currentAdminData.phone = newPhone;
            if (newPassword) currentAdminData.password = newPassword;

            document.getElementById('saveBtn').innerText = "جاري الحفظ... ⏳";
            document.getElementById('saveBtn').disabled = true;

            await syncDataToCloud("تم حفظ كافة بيانات الأدمن بنجاح! ✅");

            sessionStorage.setItem('adminEmail', newEmail);
            oldAdminEmail = newEmail;

            document.getElementById('saveBtn').innerText = "حفظ البيانات المحدثة 💾";
            document.getElementById('saveBtn').disabled = false;
            document.getElementById('displayAdminName').textContent = newName;
            document.getElementById('displayAdminEmail').textContent = newEmail;
        }

        async function syncDataToCloud(successMsg) {
            try {
                if (!Array.isArray(globalRecord.admins)) globalRecord.admins = [];
                let index = globalRecord.admins.findIndex(a => a.email && a.email.toLowerCase() === oldAdminEmail.toLowerCase());
                if (index !== -1) {
                    globalRecord.admins[index] = currentAdminData;
                } else {
                    globalRecord.admins.push(currentAdminData);
                }

                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(globalRecord)
                });

                if (response.ok) alert(successMsg);
                else alert("فشل تحديث البيانات في السحابة!");
            } catch (err) {
                console.error(err);
                alert("حدث خطأ أثناء الاتصال بالخادم!");
            }
        }

        function logoutAdmin() {
            sessionStorage.clear();
            window.location.href = 'login.html';
        }

        initProfileFromCloud();
    </script>
</body>
