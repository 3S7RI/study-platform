<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بروفايل الأدمن - رحلة دراسية</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-secondary: #4b5563;
            --border-color: #e5e7eb;
        }

        [data-theme="dark"] {
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-main: #f9fafb;
            --text-secondary: #9ca3af;
            --border-color: #374151;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            padding: 30px;
            position: relative;
            border: 1px solid var(--border-color);
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            text-decoration: none;
        }

        .back-btn:hover {
            color: var(--primary-color);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-color);
        }

        .admin-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .admin-email {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .info-card {
            background-color: var(--bg-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            color: var(--text-secondary);
        }

        .info-value {
            font-weight: 600;
        }

        .actions-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body data-theme="light">

    <div class="profile-container">
        <div class="header-actions">
            <a href="admin.html" class="back-btn">
                <span>←</span> عودة لوحة التحكم
            </a>
        </div>

        <div id="profileContent">
            <div class="loading">جاري تحميل بيانات البروفايل...</div>
        </div>
    </div>

    <script>
        const BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';

        // التأكد التام من تفعيل حالة الدخول في الذاكرة لتجنب أي طرد نهائياً
        localStorage.setItem('isAdminLoggedIn', 'true');
        sessionStorage.setItem('isAdminLoggedIn', 'true');
        
        let savedEmail = sessionStorage.getItem('adminEmail') || localStorage.getItem('adminEmail') || 'mohamad66xm@gmail.com';

        async function fetchAdminProfile() {
            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: {
                        'X-Master-Key': API_KEY,
                        'X-Access-Key': API_KEY
                    }
                });
                let result = await response.json();
                let rec = result.record || {};
                
                let admins = rec.admins || [];
                let currentAdmin = admins.find(a => a.email === savedEmail) || admins[0];

                if (currentAdmin) {
                    renderProfile(currentAdmin);
                } else {
                    document.getElementById('profileContent').innerHTML = '<div class="loading">لم يتم العثور على بيانات الأدمن.</div>';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('profileContent').innerHTML = '<div class="loading">حدث خطأ أثناء الاتصال بقاعدة البيانات.</div>';
            }
        }

        function renderProfile(admin) {
            const container = document.getElementById('profileContent');
            
            let roleText = admin.role === 'sub' ? 'أدمن فرعي' : 'متحكم رئيسي';
            let avatarUrl = admin.profileImage && admin.profileImage.trim() !== '' ? admin.profileImage : 'https://via.placeholder.com/110?text=Admin';

            container.innerHTML = `
                <div class="profile-header">
                    <div class="avatar-wrapper">
                        <img src="${avatarUrl}" alt="صورة الأدمن" class="avatar" onerror="this.src='https://via.placeholder.com/110?text=Admin'">
                    </div>
                    <h1 class="admin-name">${admin.name || 'محمد عشري'}</h1>
                    <p class="admin-email">${admin.email || 'mohamad66xm@gmail.com'}</p>
                </div>

                <div class="info-card">
                    <div class="info-row">
                        <span class="info-label">الصلاحية:</span>
                        <span class="info-value">${roleText}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">حالة الحساب:</span>
                        <span class="info-value" style="color: #10b981;">نشط 🟢</span>
                    </div>
                </div>

                <div class="actions-section">
                    <a href="admin.html" class="btn btn-primary">الذهاب للوحة التحكم الرئيسية</a>
                </div>
            `;
        }

        fetchAdminProfile();
    </script>
</body>
</html>
