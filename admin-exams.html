<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - إدارة الامتحانات</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            --th-bg: rgba(255, 255, 255, 0.03);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.05);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            --th-bg: rgba(0, 0, 0, 0.02);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        /* الهيدر الموحد للمنصة */
        .platform-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--bg-card);
            padding: 12px 18px;
            border-radius: 30px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .header-right-side { display: flex; align-items: center; }
        .btn-home-link {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.85rem;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .header-center-box { display: flex; align-items: center; justify-content: center; }
        .platform-title-box { display: flex; align-items: center; gap: 6px; font-size: 1rem; font-weight: 700; color: var(--text-main); }
        
        .header-left-side { display: flex; align-items: center; gap: 10px; }
        .btn-theme-toggle {
            background-color: rgba(255, 255, 255, 0.04); color: var(--text-main); border: 1px solid var(--border-color);
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center;
        }
        .btn-theme-toggle:hover { background-color: var(--hover-bg); border-color: var(--primary); }

        /* شريط أزرار التنقل بين أقسام الامتحان */
        .admin-nav-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-card);
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            gap: 10px;
            flex-wrap: wrap;
        }
        .admin-tabs-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .btn-tab {
            background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--border-color);
            padding: 9px 20px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; flex: 1; min-width: 120px; text-align: center;
        }
        .btn-tab.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        /* الصناديق والمحتوى */
        .section-box {
            background-color: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow);
            padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color);
            border-top: 4px solid var(--primary);
        }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .section-header h2 { color: var(--text-main); font-size: 1.15rem; font-weight: 700; }

        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .setting-card { background: var(--th-bg); padding: 12px 15px; border-radius: 10px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .setting-card label { font-size: 0.85rem; font-weight: 500; cursor: pointer; color: var(--text-main); }
        
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #475569; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(22px); }

        .form-group { margin-top: 15px; text-align: right; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: var(--text-muted); font-weight: 600; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border-color);
            background: var(--bg-main); color: var(--text-main); font-size: 0.9rem; outline: none;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }
        
        .form-row-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .form-row-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        
        @media (max-width: 768px) {
            .form-row-grid-3, .form-row-grid-2 { grid-template-columns: 1fr; }
        }

        .btn-save { background: var(--success); color: white; border: none; padding: 12px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.95rem; margin-top: 20px; width: 100%; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2); }
        .btn-save:hover { opacity: 0.9; }

        /* ستايل إضافة الأسئلة (الدرجة بجانب نص السؤال بشكل صغير ومضبوط) */
        .question-builder-card { background: var(--th-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-top: 18px; }
        .question-top-row { display: grid; grid-template-columns: 1fr 110px; gap: 12px; align-items: end; }
        @media (max-width: 500px) { .question-top-row { grid-template-columns: 1fr; } }

        .option-row { display: flex; gap: 10px; margin-top: 8px; align-items: center; }
        .option-row input[type="text"] { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main); }
        
        .btn-add-opt { background: #0ea5e9; color: white; border: none; padding: 7px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; font-weight: bold; margin-top: 8px; }
        .btn-add-ques { background: var(--primary); color: white; border: none; padding: 11px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 14px; }
        .btn-add-ques:hover { background: var(--primary-hover); }

        /* الجداول والإحصائيات */
        table { width: 100%; border-collapse: collapse; text-align: right; margin-top: 12px; }
        th, td { padding: 12px 10px; border-bottom: 1px solid var(--border-color); font-size: 0.88rem; color: var(--text-main); }
        th { background: var(--th-bg); color: var(--text-main); font-weight: 700; }
        .btn-danger { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; font-weight: bold; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <!-- الهيدر الموحد -->
        <header class="platform-header">
            <div class="header-right-side">
                <a href="admin.html" class="btn-home-link">
                    الرئيسية ↩️
                </a>
            </div>

            <div class="header-center-box">
                <div class="platform-title-box">
                    <span>إدارة الامتحانات</span> 📊
                </div>
            </div>

            <div class="header-left-side">
                <button class="btn-theme-toggle" id="themeToggleBtn" title="تغيير الوضع">☀️</button>
            </div>
        </header>

        <!-- شريط التنقل المتناسق -->
        <nav class="admin-nav-bar">
            <div class="admin-tabs-group">
                <button class="btn-tab active" id="btnTabBuilder" onclick="switchTab('builder')">إنشاء امتحان 📝</button>
                <button class="btn-tab" id="btnTabSettings" onclick="switchTab('settings')">الإعدادات ⚙️</button>
                <button class="btn-tab" id="btnTabStats" onclick="switchTab('stats')">إحصائيات 📊</button>
            </div>
        </nav>

        <!-- شاشة 1: كتابة وإنشاء الامتحان -->
        <div id="tabBuilderContent" class="section-box">
            <div class="section-header">
                <h2>إعداد وتصميم الامتحان والأسئلة 📝</h2>
            </div>
            
            <div class="form-group">
                <label>عنوان الامتحان العام:</label>
                <input type="text" id="examTitle" placeholder="مثال: امتحان شامل الباب الأول كيمياء">
            </div>
            <div class="form-row-grid-2">
                <div class="form-group">
                    <label>المادة الدراسية:</label>
                    <input type="text" id="examSubject" placeholder="كيمياء">
                </div>
                <div class="form-group">
                    <label>الفئة / الشعبة المستهدفة:</label>
                    <input type="text" id="examTargetGroup" placeholder="الصف الثالث الثانوي">
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

            <h3 style="color: var(--text-main); font-size: 1rem; margin-bottom: 10px;">الأسئلة المضافة حالياً:</h3>
            <div id="questionsContainer">
                <p style="opacity: 0.6; font-size: 0.9rem;">لم تقم بإضافة أسئلة بعد لهذا الامتحان.</p>
            </div>

            <!-- إضافة سؤال جديد (درجة السؤال صغيرة بجانب النص) -->
            <div class="question-builder-card">
                <h4 style="font-size: 0.95rem; margin-bottom: 12px; color: var(--text-main);">إضافة سؤال جديد:</h4>
                <div class="question-top-row">
                    <div class="form-group" style="margin-top: 0;">
                        <label>نص السؤال:</label>
                        <input type="text" id="newQText" placeholder="اكتب السؤال هنا...">
                    </div>
                    <div class="form-group" style="margin-top: 0;">
                        <label>الدرجة:</label>
                        <input type="number" id="newQMarks" value="1" min="1" style="text-align: center;">
                    </div>
                </div>
                <div class="form-group">
                    <label>الخيارات (حدد الدائرة بجانب الخيار الصحيح):</label>
                    <div id="optionsBuilderList">
                        <div class="option-row">
                            <input type="radio" name="correctOpt" value="0" checked style="width: 18px; height: 18px; cursor: pointer;">
                            <input type="text" class="opt-input" placeholder="الخيار الأول">
                        </div>
                        <div class="option-row">
                            <input type="radio" name="correctOpt" value="1" style="width: 18px; height: 18px; cursor: pointer;">
                            <input type="text" class="opt-input" placeholder="الخيار الثاني">
                        </div>
                    </div>
                    <button class="btn-add-opt" onclick="addOptionInput()">إضافة خيار آخر ➕</button>
                </div>
                <button class="btn-add-ques" onclick="addNewQuestionToExam()">إضافة السؤال للامتحان ✅</button>
            </div>

            <button class="btn-save" onclick="saveFullExamToCloud()">نشر الامتحان 🚀</button>
        </div>

        <!-- شاشة 2: إعدادات الامتحان -->
        <div id="tabSettingsContent" class="section-box hidden">
            <div class="section-header">
                <h2>إعدادات الخيارات والتحكم في الامتحان ⚙️</h2>
            </div>
            <div class="settings-grid">
                <div class="setting-card">
                    <label for="settingActive">حالة الامتحان (نشط / مغلق)</label>
                    <label class="switch"><input type="checkbox" id="settingActive" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingTimer">تفعيل المؤقت الزمني</label>
                    <label class="switch"><input type="checkbox" id="settingTimer" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingShuffle">خلط ترتيب الأسئلة عشوائياً</label>
                    <label class="switch"><input type="checkbox" id="settingShuffle"><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingShuffleOpts">ترتيب الخيارات عشوائياً</label>
                    <label class="switch"><input type="checkbox" id="settingShuffleOpts"><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingInstantResult">عرض النتيجة الفورية للطالب</label>
                    <label class="switch"><input type="checkbox" id="settingInstantResult" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingShowAnswers">إظهار الإجابات الصحيحة بعد التسليم</label>
                    <label class="switch"><input type="checkbox" id="settingShowAnswers" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingAllowBack">السماح بالرجوع لتعديل الإجابات</label>
                    <label class="switch"><input type="checkbox" id="settingAllowBack" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingAntiCheat">منع مغادرة متصفح الامتحان</label>
                    <label class="switch"><input type="checkbox" id="settingAntiCheat"><span class="slider"></span></label>
                </div>
            </div>
            
            <div class="form-row-grid-3">
                <div class="form-group">
                    <label>المدة (بالدقائق):</label>
                    <input type="number" id="settingDuration" value="30">
                </div>
                <div class="form-group">
                    <label>عدد المحاولات:</label>
                    <input type="number" id="settingAttempts" value="1">
                </div>
                <div class="form-group">
                    <label>درجة النجاح (%):</label>
                    <input type="number" id="settingPassingScore" value="50">
                </div>
            </div>

            <div class="form-row-grid-2">
                <div class="form-group">
                    <label>كلمة سر فتح الامتحان (اختياري):</label>
                    <input type="text" id="settingPassword" placeholder="مثال: 1234">
                </div>
                <div class="form-group">
                    <label>الحد الأقصى للمتقدمين (Quota):</label>
                    <input type="number" id="settingMaxQuota" placeholder="بلا حدود">
                </div>
            </div>

            <div class="form-group">
                <label>رسالة نهاية الامتحان المخصصة:</label>
                <textarea id="settingCustomMsg" placeholder="شكراً لإتمامك الامتحان، بالتوفيق دائماً..." style="height: 65px; resize: none;"></textarea>
            </div>

            <button class="btn-save" onclick="saveExamSettingsOnly()">حفظ إعدادات الامتحان بالسحابة 🚀</button>
        </div>

        <!-- شاشة 3: الإحصائيات والنتائج -->
        <div id="tabStatsContent" class="section-box hidden">
            <div class="section-header">
                <h2>إحصائيات ونتائج الطلاب في الامتحان 📊</h2>
            </div>
            <div id="examStatsContainer">
                <p style="text-align: center; opacity: 0.7; padding: 25px;">جاري جلب تقارير ونتائج الطلاب من السحابة...</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await loadExamDataFromCloud();
            } else {
                window.location.href = 'login.html';
            }
        });

        // --- الثيم المظلم والفاتح ---
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const bodyElement = document.body;
        const savedTheme = localStorage.getItem('platform_theme') || 'dark';
        bodyElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            let activeTheme = bodyElement.getAttribute('data-theme');
            let nextTheme = activeTheme === 'dark' ? 'light' : 'dark';
            bodyElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('platform_theme', nextTheme);
            themeToggleBtn.textContent = nextTheme === 'dark' ? '☀️' : '🌙';
        });

        // --- إدارة التبويبات الثلاثة ---
        window.switchTab = function(tab) {
            document.getElementById('btnTabBuilder').classList.remove('active');
            document.getElementById('btnTabSettings').classList.remove('active');
            document.getElementById('btnTabStats').classList.remove('active');
            document.getElementById('tabBuilderContent').classList.add('hidden');
            document.getElementById('tabSettingsContent').classList.add('hidden');
            document.getElementById('tabStatsContent').classList.add('hidden');

            if (tab === 'builder') {
                document.getElementById('btnTabBuilder').classList.add('active');
                document.getElementById('tabBuilderContent').classList.remove('hidden');
            } else if (tab === 'settings') {
                document.getElementById('btnTabSettings').classList.add('active');
                document.getElementById('tabSettingsContent').classList.remove('hidden');
            } else if (tab === 'stats') {
                document.getElementById('btnTabStats').classList.add('active');
                document.getElementById('tabStatsContent').classList.remove('hidden');
                renderExamStats();
            }
        };

        let currentDraftQuestions = [];
        let globalExamData = { currentExam: { questions: [], settings: {} }, examSubmissions: [] };

        async function loadExamDataFromCloud() {
            try {
                const docRef = doc(db, "config", "activeExam");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    globalExamData = docSnap.data();
                    loadActiveExamToUI();
                }
            } catch (err) {
                console.error("خطأ في جلب الامتحان من السحابة:", err);
            }
        }

        async function saveExamDataToCloud() {
            try {
                await setDoc(doc(db, "config", "activeExam"), globalExamData);
            } catch (e) {
                console.error("خطأ في الحفظ السحابي:", e);
                alert("حدث خطأ أثناء الحفظ في السحابة.");
            }
        }

        function loadActiveExamToUI() {
            if (!globalExamData.currentExam) return;
            let exam = globalExamData.currentExam;
            
            document.getElementById('examTitle').value = exam.title || '';
            document.getElementById('examSubject').value = exam.subject || '';
            document.getElementById('examTargetGroup').value = exam.targetGroup || '';
            currentDraftQuestions = exam.questions || [];
            renderQuestionsList();

            let s = exam.settings || {};
            document.getElementById('settingActive').checked = s.active !== false;
            document.getElementById('settingTimer').checked = s.timer !== false;
            document.getElementById('settingShuffle').checked = s.shuffle === true;
            document.getElementById('settingShuffleOpts').checked = s.shuffleOpts === true;
            document.getElementById('settingInstantResult').checked = s.instantResult !== false;
            document.getElementById('settingShowAnswers').checked = s.showAnswers !== false;
            document.getElementById('settingAllowBack').checked = s.allowBack !== false;
            document.getElementById('settingAntiCheat').checked = s.antiCheat === true;
            document.getElementById('settingDuration').value = s.duration || 30;
            document.getElementById('settingAttempts').value = s.attempts || 1;
            document.getElementById('settingPassingScore').value = s.passingScore || 50;
            document.getElementById('settingPassword').value = s.password || '';
            document.getElementById('settingMaxQuota').value = s.maxQuota || '';
            document.getElementById('settingCustomMsg').value = s.customMsg || '';
        }

        window.addOptionInput = function() {
            const list = document.getElementById('optionsBuilderList');
            const optIndex = list.children.length;
            const row = document.createElement('div');
            row.className = 'option-row';
            row.innerHTML = `
                <input type="radio" name="correctOpt" value="${optIndex}" style="width: 18px; height: 18px; cursor: pointer;">
                <input type="text" class="opt-input" placeholder="خيار إضافي">`;
            list.appendChild(row);
        };

        window.addNewQuestionToExam = function() {
            let qText = document.getElementById('newQText').value.trim();
            let marks = parseInt(document.getElementById('newQMarks').value) || 1;
            let optInputs = document.querySelectorAll('.opt-input');
            let radioBtns = document.querySelectorAll('input[name="correctOpt"]');

            if (!qText) { alert('يرجى كتابة نص السؤال!'); return; }

            let options = [];
            let correctIndex = 0;
            optInputs.forEach((inp, idx) => {
                if (inp.value.trim()) {
                    options.push(inp.value.trim());
                    if (radioBtns[idx] && radioBtns[idx].checked) {
                        correctIndex = options.length - 1;
                    }
                }
            });

            if (options.length < 2) { alert('يرجى إدخال خيارين صحيحين على الأقل!'); return; }

            currentDraftQuestions.push({ text: qText, marks: marks, options: options, correct: correctIndex });

            document.getElementById('newQText').value = '';
            document.getElementById('newQMarks').value = '1';
            document.getElementById('optionsBuilderList').innerHTML = `
                <div class="option-row"><input type="radio" name="correctOpt" value="0" checked style="width: 18px; height: 18px; cursor: pointer;"><input type="text" class="opt-input" placeholder="الخيار الأول"></div>
                <div class="option-row"><input type="radio" name="correctOpt" value="1" style="width: 18px; height: 18px; cursor: pointer;"><input type="text" class="opt-input" placeholder="الخيار الثاني"></div>`;

            renderQuestionsList();
        };

        function renderQuestionsList() {
            const container = document.getElementById('questionsContainer');
            if (currentDraftQuestions.length === 0) {
                container.innerHTML = '<p style="opacity: 0.6; font-size: 0.9rem;">لم تقم بإضافة أسئلة بعد لهذا الامتحان.</p>';
                return;
            }

            let html = '';
            currentDraftQuestions.forEach((q, idx) => {
                let optsHtml = q.options.map((o, i) => `<span style="display:inline-block; margin-left: 12px; ${i === q.correct ? 'color:var(--success); font-weight:bold;' : ''}">• ${o} ${i === q.correct ? '✔️' : ''}</span>`).join('');
                html += `
                    <div style="background: var(--th-bg); padding: 14px; border-radius: 10px; border: 1px solid var(--border-color); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start;">
                        <div>
                            <p style="font-weight: bold; font-size: 0.95rem; margin-bottom: 6px;">سؤال ${idx+1}: ${q.text} <span style="font-size:0.8rem; background: rgba(99, 102, 241, 0.15); color: var(--primary); padding: 2px 8px; border-radius: 6px; margin-right: 6px;">(${q.marks} درجات)</span></p>
                            <div style="font-size: 0.85rem;">${optsHtml}</div>
                        </div>
                        <button class="btn-danger" onclick="deleteDraftQuestion(${idx})">حذف</button>
                    </div>`;
            });
            container.innerHTML = html;
        }

        window.deleteDraftQuestion = function(idx) {
            currentDraftQuestions.splice(idx, 1);
            renderQuestionsList();
        };

        window.saveFullExamToCloud = async function() {
            let title = document.getElementById('examTitle').value.trim();
            let subject = document.getElementById('examSubject').value.trim();
            let targetGroup = document.getElementById('examTargetGroup').value.trim();

            if (!title) { alert('يرجى كتابة عنوان الامتحان!'); return; }
            if (currentDraftQuestions.length === 0) { alert('يرجى إضافة سؤال واحد على الأقل للامتحان!'); return; }

            if (!globalExamData.currentExam) globalExamData.currentExam = {};

            globalExamData.currentExam.title = title;
            globalExamData.currentExam.subject = subject;
            globalExamData.currentExam.targetGroup = targetGroup;
            globalExamData.currentExam.questions = currentDraftQuestions;

            if (!globalExamData.currentExam.settings) {
                globalExamData.currentExam.settings = { active: true, timer: true, duration: 30, attempts: 1, passingScore: 50 };
            }

            await saveExamDataToCloud();
            alert('تم نشر الامتحان بنجاح في السحابة للطلاب! 🎉');
        };

        window.saveExamSettingsOnly = async function() {
            if (!globalExamData.currentExam) globalExamData.currentExam = {};
            if (!globalExamData.currentExam.settings) globalExamData.currentExam.settings = {};

            let s = globalExamData.currentExam.settings;
            s.active = document.getElementById('settingActive').checked;
            s.timer = document.getElementById('settingTimer').checked;
            s.shuffle = document.getElementById('settingShuffle').checked;
            s.shuffleOpts = document.getElementById('settingShuffleOpts').checked;
            s.instantResult = document.getElementById('settingInstantResult').checked;
            s.showAnswers = document.getElementById('settingShowAnswers').checked;
            s.allowBack = document.getElementById('settingAllowBack').checked;
            s.antiCheat = document.getElementById('settingAntiCheat').checked;
            s.duration = parseInt(document.getElementById('settingDuration').value) || 30;
            s.attempts = parseInt(document.getElementById('settingAttempts').value) || 1;
            s.passingScore = parseInt(document.getElementById('settingPassingScore').value) || 50;
            s.password = document.getElementById('settingPassword').value.trim();
            s.maxQuota = document.getElementById('settingMaxQuota').value.trim();
            s.customMsg = document.getElementById('settingCustomMsg').value.trim();

            await saveExamDataToCloud();
            alert('تم حفظ إعدادات الامتحان وتحديثها بالسحابة بنجاح! ⚙️');
        };

        function renderExamStats() {
            const container = document.getElementById('examStatsContainer');
            let subs = globalExamData.examSubmissions || [];

            if (subs.length === 0) {
                container.innerHTML = '<p style="text-align: center; opacity: 0.7; padding: 25px;">لا توجد أي تسليمات أو نتائج لطلاب حتى الآن.</p>';
                return;
            }

            let html = `<table><thead><tr><th>اسم الطالب</th><th>الدرجة الحاصل عليها</th><th>حالة النجاح</th><th>تاريخ التسليم</th></tr></thead><tbody>`;
            subs.forEach(sub => {
                let passed = sub.score >= (globalExamData.currentExam?.settings?.passingScore || 50);
                html += `
                    <tr>
                        <td><b>👤 ${sub.studentName || 'طالب'}</b></td>
                        <td>${sub.score} / ${sub.totalMarks}</td>
                        <td>${passed ? '<span style="color:var(--success); font-weight:bold;">ناجح 🎉</span>' : '<span style="color:var(--danger); font-weight:bold;">راسب ❌</span>'}</td>
                        <td>${sub.date || ''}</td>
                    </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }
    </script>
</body>
