<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الامتحانات والإحصائيات - لوحة التحكم</title>
    <style>
        :root {
            --bg-color: #121212;
            --header-bg: #1f1f1f;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --heading-color: #ffffff;
            --input-bg: #0f172a;
            --th-bg: rgba(255,255,255,0.05);
        }
        [data-theme="light"] {
            --bg-color: #f4f7f6;
            --header-bg: #1e3c72;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #eee;
            --heading-color: #1e3c72;
            --input-bg: #ffffff;
            --th-bg: rgba(0,0,0,0.02);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); padding: 15px; transition: background 0.3s, color 0.3s; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; background: var(--header-bg); color: white; padding: 12px 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 10px;}
        header h1 { font-size: 1.1rem; color: #ffffff !important; }
        .header-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-action, .btn-theme, .btn-back { background: #34495e; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem; text-decoration: none; }
        .btn-action.active { background: #2980b9; }
        
        .section-box { background: var(--card-bg); border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); padding: 20px; margin-bottom: 20px; border-top: 4px solid #2980b9; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .section-header h2 { color: var(--heading-color); font-size: 1.2rem; }
        
        /* إعدادات الامتحان (شاشة 2) */
        .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .setting-card { background: var(--th-bg); padding: 12px 15px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .setting-card label { font-size: 0.9rem; font-weight: 500; cursor: pointer; }
        
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #27ae60; }
        input:checked + .slider:before { transform: translateX(22px); }

        .form-group { margin-top: 15px; }
        .form-group label { display: block; font-size: 0.85rem; margin-bottom: 5px; opacity: 0.8; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); font-size: 0.9rem; outline: none; }
        
        .btn-save { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem; margin-top: 15px; }

        /* ستايل تصميم وإضافة الأسئلة (شاشة 1 - جوجل فورم) */
        .question-builder-card { background: var(--th-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .option-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
        .option-row input[type="text"] { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); }
        .btn-add-opt { background: #16a085; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; font-weight: bold; margin-top: 8px; }
        .btn-add-ques { background: #2980b9; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }

        /* الجداول والإحصائيات (شاشة 3) */
        table { width: 100%; border-collapse: collapse; text-align: right; margin-top: 10px; }
        th, td { padding: 12px 10px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-color); }
        th { background: var(--th-bg); color: var(--heading-color); font-weight: bold; }
        .btn-danger { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }

        .hidden { display: none !important; }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <header>
            <div class="header-btns">
                <button class="btn-theme" id="themeToggleBtn">☀️ فاتح</button>
                <button class="btn-action active" id="btnTabBuilder" onclick="switchTab('builder')">كتابة وإدارة الامتحان 📝</button>
                <button class="btn-action" id="btnTabSettings" onclick="switchTab('settings')">إعدادات الامتحان ⚙️</button>
                <button class="btn-action" id="btnTabStats" onclick="switchTab('stats')">الإحصائيات والنتائج 📊</button>
            </div>
            <a href="admin-dashboard.html" class="btn-back">اللوحة الرئيسية ↩️</a>
        </header>

        <!-- شاشة 1: كتابة وإنشاء الامتحان (Google Form Style) -->
        <div id="tabBuilderContent" class="section-box">
            <div class="section-header">
                <h2>إعداد وتصميم الامتحان والأسئلة 📝</h2>
            </div>
            
            <div class="form-group">
                <label>عنوان الامتحان العام:</label>
                <input type="text" id="examTitle" placeholder="مثال: امتحان شامل الباب الأول كيمياء">
            </div>
            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label>المادة الدراسية:</label>
                    <input type="text" id="examSubject" placeholder="كيمياء">
                </div>
                <div>
                    <label>الفئة / الشعبة المستهدفة:</label>
                    <input type="text" id="examTargetGroup" placeholder="الصف الثالث الثانوي">
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">

            <h3 style="color: var(--heading-color); font-size: 1rem; margin-bottom: 10px;">الأسئلة المضافة:</h3>
            <div id="questionsContainer">
                <p style="opacity: 0.6; font-size: 0.9rem;">لم تقم بإضافة أسئلة بعد لهذا الامتحان.</p>
            </div>

            <!-- إضافة سؤال جديد -->
            <div class="question-builder-card">
                <h4 style="font-size: 0.95rem; margin-bottom: 8px; color: var(--heading-color);">إضافة سؤال جديد:</h4>
                <div class="form-group">
                    <label>نص السؤال:</label>
                    <input type="text" id="newQText" placeholder="اكتب السؤال هنا...">
                </div>
                <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div>
                        <label>درجة السؤال:</label>
                        <input type="number" id="newQMarks" value="1" min="1">
                    </div>
                </div>
                <div class="form-group">
                    <label>الخيارات (اختر الإجابة الصحيحة بتحديد الدائرة):</label>
                    <div id="optionsBuilderList">
                        <div class="option-row">
                            <input type="radio" name="correctOpt" value="0" checked>
                            <input type="text" class="opt-input" placeholder="الخيار الأول">
                        </div>
                        <div class="option-row">
                            <input type="radio" name="correctOpt" value="1">
                            <input type="text" class="opt-input" placeholder="الخيار الثاني">
                        </div>
                    </div>
                    <button class="btn-add-opt" onclick="addOptionInput()">إضافة خيار آخر ➕</button>
                </div>
                <button class="btn-add-ques" onclick="addNewQuestionToExam()">إضافة السؤال للامتحان ✅</button>
            </div>

            <button class="btn-save" onclick="saveFullExamToCloud()" style="width: 100%; margin-top: 15px;">حفظ ونشر الامتحان بالكامل بالسحابة 🚀</button>
        </div>

        <!-- شاشة 2: إعدادات الامتحان المتكاملة -->
        <div id="tabSettingsContent" class="section-box hidden">
            <div class="section-header">
                <h2>إعدادات الخيارات والتحكم في الامتحان ⚙️</h2>
            </div>
            <div class="settings-grid">
                <div class="setting-card">
                    <label for="settingActive">حالة الامتحان (نشط / مغلق)</label>
                    <label class="switch"><input type="checkbox" id="settingActive" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingTimer">تفعيل المؤقت الزمني</label>
                    <label class="switch"><input type="checkbox" id="settingTimer" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingShuffle">خلط وتغيير ترتيب الأسئلة عشوائياً</label>
                    <label class="switch"><input type="checkbox" id="settingShuffle"><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingShuffleOpts">ترتيب الخيارات عشوائياً لكل سؤال</label>
                    <label class="switch"><input type="checkbox" id="settingShuffleOpts"><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingInstantResult">عرض النتيجة الفورية للطالب</label>
                    <label class="switch"><input type="checkbox" id="settingInstantResult" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingShowAnswers">إظهار الإجابات الصحيحة بعد التسليم</label>
                    <label class="switch"><input type="checkbox" id="settingShowAnswers" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingAllowBack">السماح بالرجوع لتعديل الإجابات</label>
                    <label class="switch"><input type="checkbox" id="settingAllowBack" checked><span class="slider"></span></label>
                </div>
                <div class="setting-card">
                    <label for="settingAntiCheat">منع مغادرة متصفح الامتحان (مكافحة الغش)</label>
                    <label class="switch"><input type="checkbox" id="settingAntiCheat"><span class="slider"></span></label>
                </div>
            </div>
            
            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                <div>
                    <label>المدة الزمنية (بالدقائق):</label>
                    <input type="number" id="settingDuration" value="30">
                </div>
                <div>
                    <label>عدد مرات المحاولات:</label>
                    <input type="number" id="settingAttempts" value="1">
                </div>
                <div>
                    <label>الحد الأدنى لدرجة النجاح (%):</label>
                    <input type="number" id="settingPassingScore" value="50">
                </div>
            </div>

            <div class="form-group" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div>
                    <label>كلمة سر فتح الامتحان (اختياري):</label>
                    <input type="text" id="settingPassword" placeholder="مثال: 1234 أو اتركه فارغاً">
                </div>
                <div>
                    <label>الحد الأقصى للمتقدمين (Quota):</label>
                    <input type="number" id="settingMaxQuota" placeholder="بلا حدود">
                </div>
            </div>

            <div class="form-group">
                <label>رسالة نهاية الامتحان المخصصة:</label>
                <textarea id="settingCustomMsg" placeholder="شكراً لإتمامك الامتحان، بالتوفيق دائماً..." style="height: 60px; resize: none;"></textarea>
            </div>

            <button class="btn-save" onclick="saveExamSettingsOnly()">حفظ إعدادات الامتحان بالسحابة 🚀</button>
        </div>

        <!-- شاشة 3: الإحصائيات والنتائج -->
        <div id="tabStatsContent" class="section-box hidden">
            <div class="section-header">
                <h2>إحصائيات ونتائج الطلاب في الامتحان 📊</h2>
            </div>
            <div id="examStatsContainer">
                <p style="text-align: center; opacity: 0.7; padding: 20px;">جاري جلب تقارير ونتائج الطلاب من السحابة...</p>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = '6ab78eaeffd5d1605330ce1e'; 
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';
        let globalRecordData = { exams: [], examSubmissions: [] };
        let currentDraftQuestions = [];

        const cloudHeaders = { 'X-Master-Key': API_KEY, 'Content-Type': 'application/json' };

        // الثيم
        const themeBtn = document.getElementById('themeToggleBtn');
        let currentTheme = document.body.getAttribute('data-theme');
        themeBtn.textContent = currentTheme === 'dark' ? '☀️ فاتح' : '🌙 داكن';

        themeBtn.addEventListener('click', () => {
            let theme = document.body.getAttribute('data-theme');
            if (theme === 'dark') {
                document.body.setAttribute('data-theme', 'light');
                themeBtn.textContent = '🌙 داكن';
            } else {
                document.body.setAttribute('data-theme', 'dark');
                themeBtn.textContent = '☀️ فاتح';
            }
        });

        // التبديل بين التبويبات التلاتة
        function switchTab(tab) {
            const btnBuilder = document.getElementById('btnTabBuilder');
            const btnSettings = document.getElementById('btnTabSettings');
            const btnStats = document.getElementById('btnTabStats');

            const contentBuilder = document.getElementById('tabBuilderContent');
            const contentSettings = document.getElementById('tabSettingsContent');
            const contentStats = document.getElementById('tabStatsContent');

            btnBuilder.classList.remove('active');
            btnSettings.classList.remove('active');
            btnStats.classList.remove('active');
            contentBuilder.classList.add('hidden');
            contentSettings.classList.add('hidden');
            contentStats.classList.add('hidden');

            if (tab === 'builder') {
                btnBuilder.classList.add('active');
                contentBuilder.classList.remove('hidden');
            } else if (tab === 'settings') {
                btnSettings.classList.add('active');
                contentSettings.classList.remove('hidden');
            } else if (tab === 'stats') {
                btnStats.classList.add('active');
                contentStats.classList.remove('hidden');
                renderExamStats();
            }
        }

        // جلب البيانات من السحابة عند الفتح
        initExamPage();

        async function initExamPage() {
            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { method: 'GET', headers: cloudHeaders });
                if (response.ok) {
                    let result = await response.json();
                    if (result && result.record) {
                        globalRecordData = result.record;
                        loadActiveExamToUI();
                    }
                }
            } catch (err) {
                console.warn("خطأ سحابي:", err);
            }
        }

        function loadActiveExamToUI() {
            if (!globalRecordData.currentExam) return;
            let exam = globalRecordData.currentExam;
            
            document.getElementById('examTitle').value = exam.title || '';
            document.getElementById('examSubject').value = exam.subject || '';
            document.getElementById('examTargetGroup').value = exam.targetGroup || '';
            currentDraftQuestions = exam.questions || [];
            renderQuestionsList();

            let s = exam.settings || {};
            document.getElementById('settingActive').checked = s.active !== false;
            document.getElementById('settingTimer').checked = s.timer !== false;
            document.getElementById('settingShuffle').checked = s.shuffle === true;
            document.getElementById('settingShuffleOpts').checked = s.shuffleOpts === true;
            document.getElementById('settingInstantResult').checked = s.instantResult !== false;
            document.getElementById('settingShowAnswers').checked = s.showAnswers !== false;
            document.getElementById('settingAllowBack').checked = s.allowBack !== false;
            document.getElementById('settingAntiCheat').checked = s.antiCheat === true;
            document.getElementById('settingDuration').value = s.duration || 30;
            document.getElementById('settingAttempts').value = s.attempts || 1;
            document.getElementById('settingPassingScore').value = s.passingScore || 50;
            document.getElementById('settingPassword').value = s.password || '';
            document.getElementById('settingMaxQuota').value = s.maxQuota || '';
            document.getElementById('settingCustomMsg').value = s.customMsg || '';
        }

        async function updateCloudData() {
            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: cloudHeaders,
                    body: JSON.stringify(globalRecordData)
                });
                if (!response.ok) alert("فشل التحديث في السحابة!");
            } catch(e) {
                console.error("خطأ سحابي:", e);
                alert("حدث خطأ في الاتصال بالسحابة.");
            }
        }

        // إضافة خيار إضافي للسؤال في وضع البناء
        function addOptionInput() {
            const list = document.getElementById('optionsBuilderList');
            const optIndex = list.children.length;
            const row = document.createElement('div');
            row.className = 'option-row';
            row.innerHTML = `
                <input type="radio" name="correctOpt" value="${optIndex}">
                <input type="text" class="opt-input" placeholder="خيار إضافي">`;
            list.appendChild(row);
        }

        function addNewQuestionToExam() {
            let qText = document.getElementById('newQText').value.trim();
            let marks = parseInt(document.getElementById('newQMarks').value) || 1;
            let optInputs = document.querySelectorAll('.opt-input');
            let radioBtns = document.querySelectorAll('input[name="correctOpt"]');

            if (!qText) {
                alert('يرجى كتابة نص السؤال!');
                return;
            }

            let options = [];
            let correctIndex = 0;
            optInputs.forEach((inp, idx) => {
                if (inp.value.trim()) {
                    options.push(inp.value.trim());
                    if (radioBtns[idx] && radioBtns[idx].checked) {
                        correctIndex = options.length - 1;
                    }
                }
            });

            if (options.length < 2) {
                alert('يرجى إدخال خيارين صحيحين على الأقل!');
                return;
            }

            currentDraftQuestions.push({
                text: qText,
                marks: marks,
                options: options,
                correct: correctIndex
            });

            // تفريغ المدخلات
            document.getElementById('newQText').value = '';
            document.getElementById('newQMarks').value = '1';
            document.getElementById('optionsBuilderList').innerHTML = `
                <div class="option-row"><input type="radio" name="correctOpt" value="0" checked><input type="text" class="opt-input" placeholder="الخيار الأول"></div>
                <div class="option-row"><input type="radio" name="correctOpt" value="1"><input type="text" class="opt-input" placeholder="الخيار الثاني"></div>`;

            renderQuestionsList();
        }

        function renderQuestionsList() {
            const container = document.getElementById('questionsContainer');
            if (currentDraftQuestions.length === 0) {
                container.innerHTML = '<p style="opacity: 0.6; font-size: 0.9rem;">لم تقم بإضافة أسئلة بعد لهذا الامتحان.</p>';
                return;
            }

            let html = '';
            currentDraftQuestions.forEach((q, idx) => {
                let optsHtml = q.options.map((o, i) => `<span style="display:inline-block; margin-left: 10px; ${i === q.correct ? 'color:#27ae60; font-weight:bold;' : ''}">• ${o} ${i === q.correct ? '✔️' : ''}</span>`).join('');
                html += `
                    <div style="background: var(--th-bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: flex-start;">
                        <div>
                            <p style="font-weight: bold; font-size: 0.95rem; margin-bottom: 4px;">سؤال ${idx+1}: ${q.text} <span style="font-size:0.8rem; opacity:0.7;">(${q.marks} درجات)</span></p>
                            <div style="font-size: 0.85rem;">${optsHtml}</div>
                        </div>
                        <button class="btn-danger" onclick="deleteDraftQuestion(${idx})">حذف</button>
                    </div>`;
            });
            container.innerHTML = html;
        }

        function deleteDraftQuestion(idx) {
            currentDraftQuestions.splice(idx, 1);
            renderQuestionsList();
        }

        async function saveFullExamToCloud() {
            let title = document.getElementById('examTitle').value.trim();
            let subject = document.getElementById('examSubject').value.trim();
            let targetGroup = document.getElementById('examTargetGroup').value.trim();

            if (!title) {
                alert('يرجى كتابة عنوان الامتحان!');
                return;
            }
            if (currentDraftQuestions.length === 0) {
                alert('يرجى إضافة سؤال واحد على الأقل للامتحان!');
                return;
            }

            if (!globalRecordData.currentExam) globalRecordData.currentExam = {};

            globalRecordData.currentExam.title = title;
            globalRecordData.currentExam.subject = subject;
            globalRecordData.currentExam.targetGroup = targetGroup;
            globalRecordData.currentExam.questions = currentDraftQuestions;

            if (!globalRecordData.currentExam.settings) {
                globalRecordData.currentExam.settings = { active: true, timer: true, duration: 30, attempts: 1, passingScore: 50 };
            }

            await updateCloudData();
            alert('تم نشر وحفظ الامتحان بنجاح في السحابة للطلاب! 🎉');
        }

        async function saveExamSettingsOnly() {
            if (!globalRecordData.currentExam) globalRecordData.currentExam = {};
            if (!globalRecordData.currentExam.settings) globalRecordData.currentExam.settings = {};

            let s = globalRecordData.currentExam.settings;
            s.active = document.getElementById('settingActive').checked;
            s.timer = document.getElementById('settingTimer').checked;
            s.shuffle = document.getElementById('settingShuffle').checked;
            s.shuffleOpts = document.getElementById('settingShuffleOpts').checked;
            s.instantResult = document.getElementById('settingInstantResult').checked;
            s.showAnswers = document.getElementById('settingShowAnswers').checked;
            s.allowBack = document.getElementById('settingAllowBack').checked;
            s.antiCheat = document.getElementById('settingAntiCheat').checked;
            s.duration = parseInt(document.getElementById('settingDuration').value) || 30;
            s.attempts = parseInt(document.getElementById('settingAttempts').value) || 1;
            s.passingScore = parseInt(document.getElementById('settingPassingScore').value) || 50;
            s.password = document.getElementById('settingPassword').value.trim();
            s.maxQuota = document.getElementById('settingMaxQuota').value.trim();
            s.customMsg = document.getElementById('settingCustomMsg').value.trim();

            await updateCloudData();
            alert('تم حفظ إعدادات الامتحان وتحديثها بالسحابة بنجاح! ⚙️');
        }

        function renderExamStats() {
            const container = document.getElementById('examStatsContainer');
            let subs = globalRecordData.examSubmissions || [];

            if (subs.length === 0) {
                container.innerHTML = '<p style="text-align: center; opacity: 0.7; padding: 20px;">لا توجد أي تسليمات أو نتائج لطلاب حتى الآن.</p>';
                return;
            }

            let html = `<table><thead><tr><th>اسم الطالب</th><th>الدرجة الحاصل عليها</th><th>حالة النجاح</th><th>تاريخ التسليم</th></tr></thead><tbody>`;
            subs.forEach(sub => {
                let passed = sub.score >= (globalRecordData.currentExam?.settings?.passingScore || 50);
                html += `
                    <tr>
                        <td><b>👤 ${sub.studentName || 'طالب'}</b></td>
                        <td>${sub.score} / ${sub.totalMarks}</td>
                        <td>${passed ? '<span style="color:#27ae60; font-weight:bold;">ناجح 🎉</span>' : '<span style="color:#e74c3c; font-weight:bold;">راسب ❌</span>'}</td>
                        <td>${sub.date || ''}</td>
                    </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }
    </script>
</body>
</html>
