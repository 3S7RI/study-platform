<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - إدارة الامتحانات</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            --th-bg: rgba(255, 255, 255, 0.03);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.05);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            --th-bg: rgba(0, 0, 0, 0.02);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        .header-right-side { display: flex; align-items: center; }
        .btn-home-link {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .header-center-box { display: flex; align-items: center; justify-content: center; }
        .platform-title-box { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: 700; color: var(--text-main); white-space: nowrap; }
        
        .header-left-side { display: flex; align-items: center; gap: 10px; }
        .btn-theme-toggle {
            background-color: rgba(255, 255, 255, 0.04); color: var(--text-main); border: 1px solid var(--border-color);
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
        }
        .btn-theme-toggle:hover { background-color: var(--hover-bg); border-color: var(--primary); }

        /* شريط التنقل المستقل بين صفحات الامتحانات الثلاثة */
        .admin-nav-bar {
            display: flex; justify-content: center; align-items: center;
            background-color: var(--bg-card); padding: 12px 16px; border-radius: 16px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); gap: 10px; flex-wrap: wrap;
        }
        .admin-tabs-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .btn-tab {
            background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--border-color);
            padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; flex: 1; min-width: 120px; text-align: center; text-decoration: none; display: inline-block;
        }
        .btn-tab.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        .section-box {
            background-color: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow);
            padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
        }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .section-header h2 { color: var(--text-main); font-size: 1.05rem; font-weight: 700; }

        table { width: 100%; border-collapse: collapse; text-align: right; margin-top: 8px; font-size: 0.82rem; white-space: nowrap; }
        th, td { padding: 9px 10px; border-bottom: 1px solid var(--border-color); color: var(--text-main); }
        th { background: var(--th-bg); color: var(--text-main); font-weight: 700; }
        .student-link { color: var(--primary); cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 6px; }
        .student-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); }
        .score-link { color: #f59e0b; cursor: pointer; font-weight: bold; text-decoration: underline; }
        .btn-danger { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 0.78rem; cursor: pointer; font-weight: bold; }
        
        .exam-item-card {
            background: var(--th-bg); border: 1px solid var(--border-color); padding: 12px 15px; border-radius: 10px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
        .profile-modal-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px; padding: 20px; width: 100%; max-width: 360px; text-align: center; box-shadow: var(--shadow);
        }
        .profile-avatar-box {
            width: 75px; height: 75px; border-radius: 50%; margin: 0 auto 10px; padding: 2px; background: linear-gradient(135deg, #6366f1, #a855f7); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(99,102,241,0.4);
        }
        .profile-avatar-box img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .hidden { display: none !important; }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <header class="platform-header">
            <div class="header-right-side"><a href="admin.html" class="btn-home-link">🏠 الرئيسية</a></div>
            <div class="header-center-box"><div class="platform-title-box"><span>إدارة الامتحانات والنتائج</span> 📊</div></div>
            <div class="header-left-side"><button class="btn-theme-toggle" id="themeToggleBtn" title="تغيير الوضع">☀️</button></div>
        </header>

        <!-- أزرار التنقل المستقلة بين صفحات الامتحانات الثلاثة -->
        <nav class="admin-nav-bar">
            <div class="admin-tabs-group">
                <a href="exam-create.html" class="btn-tab">إنشاء امتحان 📝</a>
                <a href="exam-settings.html" class="btn-tab">الإعدادات ⚙️</a>
                <a href="exam-stats.html" class="btn-tab active">إحصائيات ونتائج 📊</a>
            </div>
        </nav>

        <div class="section-box">
            <div class="section-header"><h2>إحصائيات ونتائج الامتحانات 📊</h2></div>
            <div id="examStatsContainer"><p style="text-align: center; opacity: 0.7; padding: 20px; font-size: 0.82rem;">جاري جلب الامتحانات بسرعة عالية...</p></div>
        </div>
    </div>

    <div class="modal-overlay" id="studentProfileModal">
        <div class="profile-modal-card">
            <div class="profile-avatar-box"><img id="modalStudentAvatar" src="" alt="صورة الطالب"></div>
            <h3 id="modalStudentName" style="color: var(--text-main); font-size: 1rem; margin-bottom: 4px;">اسم الطالب</h3>
            <p id="modalStudentEmail" style="color: var(--text-muted); font-size: 0.75rem; margin-bottom: 10px;"></p>
            <div style="background: rgba(99,102,241,0.1); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: bold; color: var(--primary); display: inline-block; margin-bottom: 12px;">👑 طالب مميز • نشط</div>
            <div style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px;">
                <button onclick="upgradeStudentLevel()" style="background: var(--primary); color: white; border: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold; flex: 1;">ترقية المستوى ⬆️</button>
                <button onclick="toggleBanStudent()" style="background: #f59e0b; color: white; border: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold;">حظر 🚫</button>
                <button onclick="deleteStudentAccount()" style="background: var(--danger); color: white; border: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold;">حذف 🗑️</button>
            </div>
            <button onclick="closeStudentModal()" style="background: #475569; color: white; border: none; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; width: 100%;">إغلاق</button>
        </div>
    </div>

    <div class="modal-overlay" id="examAnswersModal">
        <div class="modal-card" style="max-width: 600px; width: 100%; text-align: right; background: var(--bg-card); padding: 18px; border-radius: 14px; max-height: 85vh; overflow-y: auto; border: 1px solid var(--border-color);">
            <h3 style="color: var(--primary); margin-bottom: 10px; text-align: center; font-size: 0.95rem;" id="answersModalTitle">📋 معاينة إجابات الطالب والتصحيح</h3>
            <div id="studentAnswersContainer" style="font-size: 0.82rem;"></div>
            <div style="display: flex; gap: 8px; margin-top: 12px;">
                <button onclick="saveManualGradingAndNotify()" style="background: var(--success); color: white; border: none; padding: 9px; border-radius: 6px; cursor: pointer; font-weight: bold; flex: 1; font-size: 0.8rem;">حفظ التصحيح وإرسال النتيجة لجرس الطالب 🔔</button>
                <button onclick="closeAnswersModal()" style="background: #475569; color: white; border: none; padding: 9px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100px; font-size: 0.8rem;">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let globalExamsList = [];
        let activeSelectedStudent = null;
        let activeSelectedSubmission = null;
        let activeExamId = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await renderExamsStatsList();
            } else {
                window.location.href = 'login.html';
            }
        });

        // نظام الوضع الداكن والفاتح
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const bodyElement = document.body;
        const savedTheme = localStorage.getItem('platform_theme') || 'dark';
        bodyElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            let nextTheme = bodyElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            bodyElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('platform_theme', nextTheme);
            themeToggleBtn.textContent = nextTheme === 'dark' ? '☀️' : '🌙';
        });

        async function loadExamsFromCloud() {
            try {
                const querySnapshot = await getDocs(collection(db, "exams"));
                globalExamsList = [];
                querySnapshot.forEach((docSnap) => {
                    globalExamsList.push({ id: docSnap.id, ...docSnap.data() });
                });
            } catch (err) {
                console.error("خطأ في جلب الامتحانات:", err);
            }
        }

        async function renderExamsStatsList() {
            const container = document.getElementById('examStatsContainer');
            container.innerHTML = '<p style="text-align: center; opacity: 0.7; padding: 15px; font-size: 0.82rem;">جاري جلب الامتحانات...</p>';
            
            await loadExamsFromCloud();

            if (globalExamsList.length === 0) {
                container.innerHTML = '<p style="text-align: center; opacity: 0.7; padding: 15px; font-size: 0.82rem;">لا توجد أي امتحانات منشورة حتى الآن.</p>';
                return;
            }

            let html = `<p style="margin-bottom: 10px; font-size: 0.82rem; color: var(--text-muted);">اختر الامتحان لعرض إحصائيات ونتائج الطلاب:</p>`;
            
            globalExamsList.forEach((exam) => {
                let subsCount = (exam.examSubmissions || []).length;
                html += `
                    <div class="exam-item-card">
                        <div>
                            <h3 style="font-size: 0.9rem; color: var(--text-main); margin-bottom: 2px;">🎯 ${exam.title}</h3>
                            <p style="font-size: 0.75rem; color: var(--text-muted);">المادة: ${exam.subject || 'عام'} | المتقدمون: ${subsCount} طالب</p>
                        </div>
                        <div style="display: flex; gap: 6px;">
                            <button onclick="renderSingleExamSubmissions('${exam.id}')" style="background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.78rem; font-weight: bold;">النتائج 📊</button>
                            <button onclick="gradeAllSubmissionsForExam('${exam.id}')" style="background: #0ea5e9; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.78rem; font-weight: bold;">تصحيح وإرسال الكل 🔔</button>
                            <button onclick="deleteExamFromCloud('${exam.id}')" class="btn-danger">حذف 🗑️</button>
                        </div>
                    </div>`;
            });

            container.innerHTML = html;
        }

        window.deleteExamFromCloud = async function(examId) {
            if (confirm("هل أنت متأكد من حذف هذا الامتحان نهائياً؟")) {
                try {
                    await deleteDoc(doc(db, "exams", examId));
                    alert("تم حذف الامتحان بنجاح");
                    renderExamsStatsList();
                } catch (e) {
                    console.error(e);
                }
            }
        };

        window.renderSingleExamSubmissions = function(examId) {
            activeExamId = examId;
            let exam = globalExamsList.find(e => e.id === examId);
            if (!exam) return;

            const container = document.getElementById('examStatsContainer');
            let subs = exam.examSubmissions || [];

            let html = `
                <button onclick="renderExamsStatsList()" style="background: #475569; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.78rem; font-weight: bold; margin-bottom: 10px;">← العودة لقائمة الامتحانات</button>
                <h3 style="font-size: 0.95rem; color: var(--primary); margin-bottom: 8px;">نتائج امتحان: ${exam.title}</h3>`;

            if (subs.length === 0) {
                html += `<p style="text-align: center; opacity: 0.7; padding: 15px; font-size: 0.82rem;">لا توجد تسليمات حتى الآن.</p>`;
                container.innerHTML = html;
                return;
            }

            let passingScore = exam.settings?.passingScore || 50;
            html += `<div style="overflow-x: auto;"><table><thead><tr><th>الطالب</th><th>الدرجة</th><th>الحالة</th><th>التاريخ</th></tr></thead><tbody>`;
            
            subs.forEach((sub, subIdx) => {
                let percentage = sub.totalMarks > 0 ? (sub.score / sub.totalMarks) * 100 : 0;
                let passed = percentage >= passingScore;
                let fullName = sub.studentName || 'طالب المنصة';
                let email = sub.studentEmail || 'غير متوفر';
                let avatarUrl = sub.studentAvatar || 'https://www.w3schools.com/howto/img_avatar.png';
                let isPublished = sub.published === true;

                html += `
                    <tr>
                        <td>
                            <span class="student-link" onclick='openStudentModal(${JSON.stringify(fullName)}, ${JSON.stringify(email)}, ${JSON.stringify(avatarUrl)})'>
                                <img src="${avatarUrl}" class="student-avatar" alt="صورة">
                                <span>${fullName}</span>
                            </span>
                        </td>
                        <td><span class="score-link" onclick='openStudentExamView("${examId}", ${subIdx})'>${sub.score} / ${sub.totalMarks} ${!isPublished ? '<span style="color:#f59e0b;">(بانتظار الاعتماد)</span>' : '<span style="color:var(--success);">(تم الإرسال 🔔)</span>'}</span></td>
                        <td>${passed ? '<span style="color:var(--success); font-weight:bold;">ناجح 🎉</span>' : '<span style="color:var(--danger); font-weight:bold;">راسب ❌</span>'}</td>
                        <td style="font-size:0.75rem; opacity:0.8;">${sub.date || ''}</td>
                    </tr>`;
            });
            html += `</tbody></table></div>`;
            container.innerHTML = html;
        };

        window.openStudentExamView = function(examId, subIdx) {
            activeExamId = examId;
            let exam = globalExamsList.find(e => e.id === examId);
            if (!exam) return;
            let sub = exam.examSubmissions[subIdx];
            activeSelectedSubmission = { examId, subIdx, sub };

            let container = document.getElementById('studentAnswersContainer');
            document.getElementById('answersModalTitle').textContent = `📋 معاينة إجابات الطالب: ${sub.studentName}`;
            
            let questions = exam.questions || [];
            let studentAnswers = sub.answers || {};
            let html = `<p style="margin-bottom:10px; font-weight:bold; color:var(--text-muted); background:var(--th-bg); padding:8px; border-radius:6px; font-size:0.8rem;">الامتحان: ${exam.title} | مجموع الدرجات: <input type="number" id="manualTotalScore" value="${sub.score}" style="width:60px; display:inline-block; padding:3px; text-align:center; font-size:0.8rem;"> من ${sub.totalMarks}</p>`;

            questions.forEach((q, qIdx) => {
                let qType = q.type || 'mcq';
                let studentAns = studentAnswers[qIdx] !== undefined ? studentAnswers[qIdx] : 'لم يُجب';
                
                html += `<div style="background:var(--th-bg); padding:10px; border-radius:8px; margin-bottom:10px; border:1px solid var(--border-color); text-align:right;">
                    <p style="font-weight:bold; margin-bottom:6px; color:var(--text-main);">س${qIdx+1}: ${q.text} <span style="font-size:0.7rem; color:var(--primary);">(${q.marks} درجات - ${getTypeNameArabic(qType)})</span></p>`;

                if (q.imageUrl) {
                    html += `<img src="${q.imageUrl}" style="max-width:100%; max-height:120px; border-radius:6px; margin-bottom:6px; display:block;">`;
                }

                if (qType === 'mcq' || qType === 'tf' || qType === 'checkbox') {
                    html += `<div style="display:flex; flex-direction:column; gap:5px; margin-top:5px;">`;
                    (q.options || ['صح', 'خطأ']).forEach((opt, oIdx) => {
                        let isCorrectOpt = Array.isArray(q.correct) ? q.correct.includes(oIdx) : (q.correct === oIdx);
                        let isStudentChoice = Array.isArray(studentAns) ? studentAns.includes(oIdx) || studentAns.includes(opt) : (studentAns === opt || studentAns === oIdx);
                        let styleBg = 'background:var(--bg-main);';
                        let badge = '';

                        if (isCorrectOpt) {
                            styleBg = 'background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success);';
                            badge = '<span style="color:var(--success); font-weight:bold; font-size:0.7rem; margin-right:auto;">✔ الإجابة الصحيحة</span>';
                        }
                        if (isStudentChoice && !isCorrectOpt) {
                            styleBg = 'background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger);';
                            badge = '<span style="color:var(--danger); font-weight:bold; font-size:0.7rem; margin-right:auto;">❌ اختيار الطالب الخاطئ</span>';
                        } else if (isStudentChoice && isCorrectOpt) {
                            badge = '<span style="color:var(--success); font-weight:bold; font-size:0.7rem; margin-right:auto;">✔ اختيار الطالب (صحيح)</span>';
                        }

                        html += `<div style="display:flex; align-items:center; padding:6px 10px; border-radius:6px; ${styleBg}">
                            <span>• ${opt}</span> ${badge}
                        </div>`;
                    });
                    html += `</div>`;
                } else if (qType === 'essayImage') {
                    html += `<div style="margin-top:6px;">`;
                    if (studentAns && studentAns.startsWith('data:image')) {
                        html += `<p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:3px;">صورة إجابة الطالب المرفوعة:</p><img src="${studentAns}" style="max-width:100%; max-height:200px; border-radius:6px; border:1px solid var(--border-color); display:block;">`;
                    } else {
                        html += `<p style="color:var(--danger);">لم يرفع الطالب صورة أو الملف غير متاح.</p>`;
                    }
                    html += `</div>`;
                } else if (qType === 'voice') {
                    html += `<div style="margin-top:6px;">`;
                    if (studentAns && studentAns.startsWith('data:audio')) {
                        html += `<p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:3px;">التسجيل الصوتي للطالب:</p><audio controls src="${studentAns}" style="width:100%;"></audio>`;
                    } else {
                        html += `<p style="color:var(--danger);">لا يوجد تسجيل صوتي صحيح مرفق.</p>`;
                    }
                    html += `</div>`;
                } else {
                    html += `<div style="margin-top:6px; padding:8px; background:var(--bg-main); border-radius:6px; border:1px solid var(--border-color);">
                        <span style="font-weight:bold; color:var(--primary);">✍️ إجابة الطالب:</span> <span style="color:var(--text-main);">${studentAns}</span>
                    </div>`;
                }
                html += `</div>`;
            });

            container.innerHTML = html;
            document.getElementById('examAnswersModal').style.display = 'flex';
        };

        function getTypeNameArabic(type) {
            switch(type) {
                case 'mcq': return 'اختياري (مفرد)';
                case 'checkbox': return 'اختياري (مربعات)';
                case 'tf': return 'صح وخطأ';
                case 'short': return 'نص قصير';
                case 'long': return 'نص طويل';
                case 'essayImage': return 'مقالي مع صورة';
                case 'voice': return 'تسجيل صوتي';
                default: return 'سؤال عام';
            }
        }

        window.saveManualGradingAndNotify = async function() {
            if (!activeSelectedSubmission) return;
            let newScore = parseFloat(document.getElementById('manualTotalScore').value) || 0;
            let { examId, subIdx } = activeSelectedSubmission;
            let exam = globalExamsList.find(e => e.id === examId);
            if (!exam) return;

            exam.examSubmissions[subIdx].score = newScore;
            exam.examSubmissions[subIdx].published = true;

            try {
                const examRef = doc(db, "exams", examId);
                await updateDoc(examRef, { examSubmissions: exam.examSubmissions });
                alert('تم حفظ التصحيح وإرسال النتيجة للطالب بنجاح على جرس الإشعارات الخاص به 🔔🎉');
                closeAnswersModal();
                renderSingleExamSubmissions(examId);
            } catch (e) {
                console.error(e);
                alert("حدث خطأ أثناء حفظ التصحيح.");
            }
        };

        window.gradeAllSubmissionsForExam = async function(examId) {
            let exam = globalExamsList.find(e => e.id === examId);
            if (!exam || !exam.examSubmissions || exam.examSubmissions.length === 0) {
                alert('لا توجد تسليمات لتصحيحها في هذا الامتحان.');
                return;
            }

            if (confirm("هل تريد اعتماد وتصحيح وإرسال النتائج لكل الطلاب المتقدمين لهذا الامتحان على جرس إشعاراتهم؟")) {
                exam.examSubmissions.forEach(sub => { sub.published = true; });
                try {
                    const examRef = doc(db, "exams", examId);
                    await updateDoc(examRef, { examSubmissions: exam.examSubmissions });
                    alert('تم تصحيح وإرسال النتائج لكل الطلاب بنجاح عبر الإشعارات 🔔🚀');
                    renderSingleExamSubmissions(examId);
                } catch (e) {
                    console.error(e);
                }
            }
        };

        window.closeAnswersModal = function() {
            document.getElementById('examAnswersModal').style.display = 'none';
        };

        window.openStudentModal = function(name, email, avatar) {
            activeSelectedStudent = { name, email, avatar };
            document.getElementById('modalStudentName').textContent = name;
            document.getElementById('modalStudentEmail').textContent = email;
            document.getElementById('modalStudentAvatar').src = avatar;
            document.getElementById('studentProfileModal').style.display = 'flex';
        };

        window.closeStudentModal = function() {
            document.getElementById('studentProfileModal').style.display = 'none';
        };

        window.upgradeStudentLevel = function() { alert('تم ترقية مستوى الطالب بنجاح! ⭐'); };
        window.toggleBanStudent = function() { alert('تم تحديث حالة الحظر بنجاح.'); };
        window.deleteStudentAccount = function() { alert('تم حذف حساب الطالب بنجاح.'); closeStudentModal(); };
    </script>
</body>
</html>
