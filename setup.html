<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إعداد قاعدة بيانات فايربيس</title>

<body>
    <h2>جاري إعداد قاعدة البيانات وتجهيز الهيكل...</h2>
    <p>برجاء الانتظار ثوانٍ معدودة...</p>

    <!-- استدعاء مكتبات فايربيس الإصدار التاسع أو العاشر الحديث -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات مشروعك اللي جبناها
        const firebaseConfig = {
          apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
          authDomain: "study-trip-1.firebaseapp.com",
          projectId: "study-trip-1",
          storageBucket: "study-trip-1.firebasestorage.app",
          messagingSenderId: "632096690853",
          appId: "1:632096690853:web:f9622d14de73a761dcf34c",
          measurementId: "G-0382HVXWMT"
        };

        // تهيئة فايربيس
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function setupDatabase() {
            try {
                // رفع هيكل systemConfig والـ user الافتراضي تماماً زي ما خططنا
                const configRef = doc(db, "config", "platform data");
                await setDoc(configRef, {
                    systemConfig: {
                        developerEmail: "mohamad66xm@gmail.com",
                        adminPassword: "@Mohamad66xm01122161407",
                        allowDualAccountLogin: true,
                        counters: {
                            nextStudentSeq: 1,
                            nextAdminSeq: 1
                        }
                    },
                    user: {
                        id: "",
                        studentId: "",
                        fullName: "",
                        email: "",
                        name: "",
                        studentPhone: "",
                        phone: "",
                        parentPhone: "",
                        avatar: "",
                        profileImage: "",
                        streak: 0,
                        rank: "",
                        rankClass: "",
                        role: "",
                        status: "active",
                        allowProfileView: true,
                        allowMentionAlert: true,
                        blockFriendReq: false,
                        allowComparison: true,
                        bgPatternEnabled: true,
                        friends: [],
                        friendRequests: [],
                        chats: {}
                    }
                });
                
                alert("تم إنشاء قاعدة البيانات ورفع الهيكل بنجاح تام يا بطل!");
                console.log("Database initialized successfully!");
            } catch (error) {
                console.error("حدث خطأ أثناء الإنشاء: ", error);
                alert("حصل خطأ، افتح الـ Console عشان تشوف التفاصيل.");
            }
        }

        // تشغيل الدالة فوراً
        setupDatabase();
    </script>
</body>
