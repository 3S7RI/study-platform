<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - الملف الشخصي</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72, #2a5298); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .profile-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 450px; text-align: center; }
        .profile-avatar { width: 90px; height: 90px; background-color: #2a5298; color: white; font-size: 2.5rem; display: flex; justify-content: center; align-items: center; border-radius: 50%; margin: 0 auto 15px auto; font-weight: bold; }
        .profile-container h2 { color: #1e3c72; margin-bottom: 20px; font-size: 1.5rem; }
        .info-group { background: #f8f9fa; padding: 12px 15px; border-radius: 8px; margin-bottom: 12px; text-align: right; border: 1px solid #e9ecef; }
        .info-group label { display: block; font-size: 0.8rem; color: #666; margin-bottom: 3px; font-weight: bold; }
        .info-group span { font-size: 1rem; color: #333; font-weight: 600; }
        .btn-back { display: block; width: 100%; padding: 12px; background-color: #2a5298; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; text-align: center; cursor: pointer; text-decoration: none; margin-top: 20px; transition: background 0.3s; }
        .btn-back:hover { background-color: #1e3c72; }
    </style>
</head>
<body>

    <div class="profile-container">
        <div class="profile-avatar" id="avatarText">ط</div>
        <h2>الملف الشخصي للطالب</h2>
        
        <div class="info-group">
            <label>اسم الطالب الكامل</label>
            <span id="pName">جاري التحميل...</span>
        </div>
        <div class="info-group">
            <label>البريد الإلكتروني</label>
            <span id="pEmail">جاري التحميل...</span>
        </div>
        <div class="info-group">
            <label>رقم هاتف الطالب</label>
            <span id="pStudentPhone">جاري التحميل...</span>
        </div>
        <div class="info-group">
            <label>رقم هاتف ولي الأمر</label>
            <span id="pParentPhone">جاري التحميل...</span>
        </div>

        <a href="main.html" class="btn-back">العودة إلى لوحة التحكم</a>
    </div>

    <script>
        // التأكد من أن الطالب مسجل دخول، وإلا توجيهه لصفحة الدخول
        if (localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }

        // جلب بيانات الطالب الحالي من الـ LocalStorage
        const currentUser = JSON.parse(localStorage.getItem('studentUser'));

        if (currentUser) {
            document.getElementById('pName').innerText = currentUser.fullName || 'غير متوفر';
            document.getElementById('pEmail').innerText = currentUser.email || 'غير متوفر';
            document.getElementById('pStudentPhone').innerText = currentUser.studentPhone || 'غير متوفر';
            document.getElementById('pParentPhone').innerText = currentUser.parentPhone || 'غير متوفر';
            
            // وضع أول حرف من اسم الطالب في الأفاتار (الصورة الرمزية)
            if (currentUser.fullName) {
                document.getElementById('avatarText').innerText = currentUser.fullName.charAt(0);
            }
        }
    </script>
</body>
</html>
