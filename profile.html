<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - بروفايل الطالب</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72, #2a5298); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .profile-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 450px; text-align: center; }
        
        /* تصميم صورة البروفايل */
        .avatar-section { position: relative; width: 120px; height: 120px; margin: 0 auto 20px auto; }
        .avatar-section img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid #2a5298; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .upload-btn { position: absolute; bottom: 0; right: 0; background: #27ae60; color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 1.1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .upload-btn input { display: none; }

        .profile-container h2 { color: #1e3c72; margin-bottom: 5px; font-size: 1.5rem; }
        .student-id { display: inline-block; background: #e8f4fd; color: #1e3c72; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; margin-bottom: 20px; }
        
        .info-card { text-align: right; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-right: 4px solid #2a5298; }
        .info-card label { display: block; color: #666; font-size: 0.85rem; margin-bottom: 3px; }
        .info-card span { color: #333; font-size: 1rem; font-weight: bold; }

        .btn-logout { display: block; width: 100%; padding: 12px; background-color: #e74c3c; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 15px; text-decoration: none; }
        .btn-logout:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <div class="profile-container">
        <!-- صورة البروفايل وزر التعديل -->
        <div class="avatar-section">
            <img id="profileImage" src="https://via.placeholder.com/120" alt="صورة الطالب">
            <label class="upload-btn" title="تغيير الصورة">
                📷
                <input type="file" id="imageInput" accept="image/*">
            </label>
        </div>

        <h2 id="studentName">اسم الطالب</h2>
        <div class="student-id" id="studentIdBadge">الكود: STU-0000</div>

        <div class="info-card">
            <label>البريد الإلكتروني</label>
            <span id="studentEmail">example@gmail.com</span>
        </div>
        <div class="info-card">
            <label>رقم هاتف الطالب</label>
            <span id="studentPhoneVal">01xxxxxxxx0</span>
        </div>
        <div class="info-card">
            <label>رقم هاتف ولي الأمر</label>
            <span id="parentPhoneVal">01xxxxxxxx0</span>
        </div>

        <button type="button" class="btn-logout" id="logoutBtn">تسجيل الخروج</button>
    </div>

    <script>
        // استرجاع بيانات الطالب الحالي المسجل الدخول
        let currentUser = JSON.parse(localStorage.getItem('studentUser'));
        let studentsList = JSON.parse(localStorage.getItem('studentsList')) || [];

        if (!currentUser) {
            alert('يجب تسجيل الدخول أولاً!');
            window.location.href = 'login.html';
        } else {
            // حل مشكلة الحسابات القديمة: لو المستخدم ملوش ID، بنولدله واحد تلقائياً ونحفظه
            if (!currentUser.studentId) {
                // نبحث عنه في القائمة أو ندي إي دي برقم تسلسلي جديد
                let indexInList = studentsList.findIndex(st => st.email === currentUser.email);
                let serialNum = indexInList !== -1 ? indexInList + 1 : studentsList.length + 1;
                currentUser.studentId = 'STU-' + String(serialNum).padStart(4, '0');
                
                // تحديثه في القائمة المحلية
                if (indexInList !== -1) {
                    studentsList[indexInList].studentId = currentUser.studentId;
                    localStorage.setItem('studentsList', JSON.stringify(studentsList));
                }
                localStorage.setItem('studentUser', JSON.stringify(currentUser));
            }

            // عرض البيانات في الصفحة بشكل مؤكد
            document.getElementById('studentName').textContent = currentUser.fullName || 'طالب جديد';
            document.getElementById('studentIdBadge').textContent = 'الكود: ' + currentUser.studentId;
            document.getElementById('studentEmail').textContent = currentUser.email || '-';
            document.getElementById('studentPhoneVal').textContent = currentUser.studentPhone || '-';
            document.getElementById('parentPhoneVal').textContent = currentUser.parentPhone || '-';
            
            // عرض الصورة لو موجودة
            if (currentUser.profileImg) {
                document.getElementById('profileImage').src = currentUser.profileImg;
            }
        }

        // التعامل مع رفع وتغيير صورة البروفايل وحفظها فوريًا
        const imageInput = document.getElementById('imageInput');
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const base64Image = event.target.result;
                    document.getElementById('profileImage').src = base64Image;

                    // تحديث الصورة في بيانات المستخدم الحالي
                    currentUser.profileImg = base64Image;
                    localStorage.setItem('studentUser', JSON.stringify(currentUser));

                    // تحديث القائمة الشاملة أيضاً لضمان حفظها بالذاكرة
                    studentsList = studentsList.map(st => {
                        if (st.email === currentUser.email) {
                            st.profileImg = base64Image;
                        }
                        return st;
                    });
                    localStorage.setItem('studentsList', JSON.stringify(studentsList));

                    alert('تم تحديث صورة البروفايل بنجاح يا بطل! 🚀');
                };
                reader.readAsDataURL(file);
            }
        });

        // زر تسجيل الخروج
        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('studentUser');
            localStorage.setItem('isLoggedIn', 'false');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
