<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي للطالب - رحلة دراسية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s; }
        
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --navbar-bg: linear-gradient(135deg, #1e3c72, #2a5298);
            --card-bg: #ffffff;
            --card-text: #555;
            --input-bg: #fff;
            --input-border: #ddd;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --text-color: #e0e0e0;
            --navbar-bg: linear-gradient(135deg, #0d1b2a, #1b263b);
            --card-bg: #1e293b;
            --card-text: #bbb;
            --input-bg: #0f172a;
            --input-border: #334155;
        }

        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; padding-bottom: 40px; }
        
        .navbar { background: var(--navbar-bg); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .navbar a { color: white; text-decoration: none; font-weight: bold; font-size: 0.9rem; background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 6px; }
        .navbar h1 { font-size: 1.1rem; }

        .profile-container { max-width: 600px; margin: 30px auto; background: var(--card-bg); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .profile-header { text-align: center; margin-bottom: 25px; }
        
        .avatar-wrapper { position: relative; width: 110px; height: 110px; margin: 0 auto 15px; }
        .avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid #2a5298; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background: #e2e8f0; }
        
        .upload-badge {
            position: absolute; bottom: 2px; left: 2px; background: #2a5298; color: white; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid var(--card-bg); box-shadow: 0 2px 5px rgba(0,0,0,0.2); font-size: 0.9rem; transition: transform 0.2s, background 0.2s;
        }
        .upload-badge:hover { transform: scale(1.1); background: #1e3c72; }

        .profile-header h2 { color: var(--text-color); font-size: 1.5rem; margin-bottom: 5px; }
        .student-badge-code { display: inline-block; background: #27ae60; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; margin-bottom: 8px; }

        /* تصميم الأوسمة والمستويات الشتوية والمضيئة للطالب */
        .rank-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 8px; font-size: 0.82rem; font-weight: 700; border: 1px solid transparent; box-shadow: 0 2px 6px rgba(0,0,0,0.15); backdrop-filter: blur(4px); margin-top: 4px; }
        .rank-badge svg { width: 16px; height: 16px; flex-shrink: 0; }
        
        .rank-unranked { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border-color: #64748b; }
        .rank-bronze { background: rgba(217, 119, 6, 0.15); color: #f59e0b; border-color: #d97706; }
        .rank-silver { background: rgba(203, 213, 225, 0.2); color: #e2e8f0; border-color: #94a3b8; }
        .rank-gold { background: rgba(234, 179, 8, 0.2); color: #facc15; border-color: #eab308; }
        .rank-diamond { background: rgba(6, 182, 212, 0.2); color: #38bdf8; border-color: #06b6d4; }
        .rank-mythic { background: linear-gradient(135deg, rgba(239, 68, 68, 0.25), rgba(168, 85, 247, 0.25)); color: #f43f5e; border-color: #f43f5e; animation: mythicGlow 2s infinite alternate; }

        @keyframes mythicGlow {
            0% { box-shadow: 0 0 5px rgba(244, 63, 94, 0.4); }
            100% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.8); }
        }

        /* قسم البحث المخصص للطالب عن الطلاب الآخرين أو الملازم */
        .doc-search-section { background: rgba(0,0,0,0.02); border: 1px solid var(--input-border); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .doc-search-section h3 { font-size: 0.95rem; color: #2a5298; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .doc-search-section input { width: 100%; padding: 10px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 8px; font-size: 0.9rem; outline: none; margin-bottom: 10px; }
        
        .search-row { display: flex; gap: 8px; }
        .search-row button { padding: 8px 16px; background: #2a5298; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        .info-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 25px; }
        .info-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; color: var(--card-text); }
        .info-group input { width: 100%; padding: 10px 12px; background: var(--input-bg); color: var(--text-color); border: 1px solid var(--input-border); border-radius: 8px; font-size: 0.95rem; outline: none; }
        .info-group input:disabled { opacity: 0.8; cursor: not-allowed; }

        .btn-action { display: block; width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; text-align: center; transition: background 0.3s; margin-top: 10px; }
        .btn-action:hover { background-color: #219653; }
        .btn-action:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .btn-logout { background-color: #e74c3c; margin-top: 15px; }
        .btn-logout:hover { background-color: #c0392b; }

        /* Modal النافذة العائمة الخاصة بالطالب مع تعتيم وتشفير بيانات للخصوصية */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease; padding: 15px; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        
        .modal-card { background: var(--card-bg); width: 100%; max-width: 420px; border-radius: 20px; border: 1px solid var(--input-border); box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4); overflow: hidden; transform: scale(0.9); transition: transform 0.3s ease; position: relative; }
        .modal-overlay.active .modal-card { transform: scale(1); }
        
        .modal-header { padding: 15px 20px; background: rgba(0,0,0,0.03); border-bottom: 1px solid var(--input-border); display: flex; justify-content: space-between; align-items: center; }
        .close-modal { background: none; border: none; font-size: 1.2rem; color: var(--card-text); cursor: pointer; }

        .modal-body { padding: 20px; text-align: center; }
        .modal-avatar-wrapper { position: relative; width: 80px; height: 80px; margin: 0 auto 12px; }
        .modal-avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #2a5298; }
        
        .modal-info-list { margin-top: 15px; text-align: right; background: rgba(0,0,0,0.02); border-radius: 12px; padding: 12px; border: 1px solid var(--input-border); }
        .modal-info-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--input-border); font-size: 0.85rem; }
        .modal-info-item:last-child { border-bottom: none; }
    </style>
</head>
<body id="pageBody">

    <header class="navbar">
        <a href="main.html">🏠 العودة للرئيسية</a>
        <h1>الملف الشخصي</h1>
        <button id="themeToggleBtn" style="background:none; border:none; color:white; font-size:1.2rem; cursor:pointer;" title="تغيير الوضع">🌙</button>
    </header>

    <div class="profile-container">
        <div class="profile-header">
            <div class="avatar-wrapper">
                <img id="profileImg" src="https://via.placeholder.com/110?text=Student" alt="صورة الطالب" onerror="this.src='https://via.placeholder.com/110?text=Student'">
                <label for="editImageInput" class="upload-badge" title="تغيير الصورة الشخصية">📷</label>
            </div>
            <h2 id="profileName">اسم الطالب</h2>
            <span class="student-badge-code" id="profileStudentId">STU-0000</span>
            <div id="profileRankBadge"></div>
        </div>

        <!-- قسم البحث الفوري للزملاء والطلاب -->
        <div class="doc-search-section">
            <h3>🔍 البحث عن بروفايل طالب آخر</h3>
            <div class="search-row">
                <input type="text" id="studentSearchInput" placeholder="ادخل ID الطالب أو اسمه..." onkeydown="if(event.key==='Enter') searchOtherStudent()">
                <button onclick="searchOtherStudent()">بحث</button>
            </div>
        </div>

        <input type="file" id="editImageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">

        <div class="info-grid">
            <div class="info-group">
                <label>الاسم الكامل</label>
                <input type="text" id="editFullName">
            </div>
            <div class="info-group">
                <label>البريد الإلكتروني (غير قابل للتعديل)</label>
                <input type="email" id="editEmail" disabled>
            </div>
            <div class="info-group">
                <label>رقم هاتف الطالب</label>
                <input type="tel" id="editStudentPhone">
            </div>
            <div class="info-group">
                <label>رقم هاتف ولي الأمر</label>
                <input type="tel" id="editParentPhone">
            </div>
        </div>

        <button type="button" id="saveChangesBtn" class="btn-action">حفظ التعديلات 💾</button>
        <button type="button" id="logoutBtn" class="btn-action btn-logout">تسجيل الخروج 🚪</button>
    </div>

    <!-- Modal النافذة العائمة للبحث عن الطلاب للمستخدم العادي (تشفير الخصوصية) -->
    <div class="modal-overlay" id="studentSearchModal" onclick="closeModalOnOuterClick(event)">
        <div class="modal-card">
            <div class="modal-header">
                <h3>بيانات الطالب 🎓</h3>
                <button class="close-modal" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modalStudentContent">
                <!-- بيانات البحث ستظهر هنا مشفرة للحفاظ على الخصوصية -->
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';

        const cloudHeaders = {
            'X-Master-Key': API_KEY,
            'X-Access-Key': API_KEY,
            'Content-Type': 'application/json'
        };

        if (localStorage.getItem('isLoggedIn') !== 'true') {
            alert('يجب تسجيل الدخول أولاً!');
            window.location.href = 'login.html';
        }

        let userData = JSON.parse(localStorage.getItem('studentUser')) || {};

        document.getElementById('profileName').textContent = userData.fullName || 'طالب رحلة دراسية';
        document.getElementById('profileStudentId').textContent = userData.studentId || 'STU-0000';
        document.getElementById('editFullName').value = userData.fullName || '';
        document.getElementById('editEmail').value = userData.email || '';
        document.getElementById('editStudentPhone').value = userData.studentPhone || '';
        document.getElementById('editParentPhone').value = userData.parentPhone || '';

        if (userData.profileImage || userData.profileImg) {
            document.getElementById('profileImg').src = userData.profileImage || userData.profileImg;
        }

        // إظهار الشارة الحالية للطالب
        document.getElementById('profileRankBadge').innerHTML = getRankBadgeHTML(userData.rank || 'unranked');

        function getRankBadgeHTML(rankKey) {
            const ranks = {
                'unranked': {
                    name: 'مجهول',
                    class: 'rank-unranked',
                    svg: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`
                },
                'bronze': {
                    name: 'ضعيف (Level 1)',
                    class: 'rank-bronze',
                    svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L4 5v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-5.45 8-12V5l-8-3z"/></svg>`
                },
                'silver': {
                    name: 'متوسط (Level 2)',
                    class: 'rank-silver',
                    svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`
                },
                'gold': {
                    name: 'قوي (Level 3)',
                    class: 'rank-gold',
                    svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>`
                },
                'diamond': {
                    name: 'قوي جداً (Level 4)',
                    class: 'rank-diamond',
                    svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 9l10 13 10-13-10-7zm0 3.21L18.42 9 12 17.35 5.58 9 12 5.21z"/></svg>`
                },
                'mythic': {
                    name: 'أسطوري (Level 5)',
                    class: 'rank-mythic',
                    svg: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1.1 0 2 .9 2 2 0 .74-.4 1.38-1 1.72V7h2a5 5 0 0 1 5 5v1.17c.6.34 1 .98 1 1.72a2 2 0 0 1-2 2c-.74 0-1.38-.4-1.72-1H17.1c-.48 2.83-2.95 5-5.9 5s-5.42-2.17-5.9-5H5.12c-.34.6-.98 1-1.72 1a2 2 0 0 1-2-2c0-.74.4-1.38 1-1.72V12a5 5 0 0 1 5-5h2V5.72c-.6-.34-1-.98-1-1.72 0-1.1.9-2 2-2z"/></svg>`
                }
            };

            let key = (rankKey && ranks[rankKey]) ? rankKey : 'unranked';
            let rank = ranks[key];
            return `<span class="rank-badge ${rank.class}">${rank.svg} ${rank.name}</span>`;
        }

        // دالة تشفير البيانات للخصوصية (Masking)
        function maskEmail(email) {
            if (!email || !email.includes('@')) return '******';
            let parts = email.split('@');
            let name = parts[0];
            let visibleName = name.length > 2 ? name.substring(0, 2) + '*****' : name + '***';
            return visibleName + '@' + parts[1];
        }

        function maskPhone(phone) {
            if (!phone || phone.length < 8) return '01******';
            return phone.substring(0, 4) + '****' + phone.substring(phone.length - 3);
        }

        // دالة البحث عن طالب مع التشفير لحماية الخصوصية
        async function searchOtherStudent() {
            const query = document.getElementById('studentSearchInput').value.trim().toLowerCase();
            const modal = document.getElementById('studentSearchModal');
            const modalContent = document.getElementById('modalStudentContent');

            if (!query) {
                alert('اكتب كود أو اسم الطالب!');
                return;
            }

            modal.classList.add('active');
            modalContent.innerHTML = '<p style="padding:20px;">جاري البحث عن بيانات الطالب... ⏳</p>';

            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: cloudHeaders });
                let result = await response.json();
                let users = result.record.users || [];

                let found = users.find(u => 
                    (u.studentId && u.studentId.toLowerCase() === query) ||
                    (u.fullName && u.fullName.toLowerCase().includes(query))
                );

                if (found) {
                    let imgUrl = found.profileImage || found.profileImg || 'https://via.placeholder.com/80?text=Student';
                    modalContent.innerHTML = `
                        <div class="modal-avatar-wrapper">
                            <img src="${imgUrl}" alt="صورة الطالب">
                        </div>
                        <h2 style="font-size:1.1rem; color:var(--text-color); margin-bottom:4px;">${found.fullName}</h2>
                        <div style="margin-bottom:12px;">${getRankBadgeHTML(found.rank || 'unranked')}</div>

                        <div class="modal-info-list">
                            <div class="modal-info-item">
                                <label>كود الطالب:</label>
                                <span>${found.studentId || 'STU-0000'}</span>
                            </div>
                            <div class="modal-info-item">
                                <label>البريد الإلكتروني:</label>
                                <span>${maskEmail(found.email)}</span>
                            </div>
                            <div class="modal-info-item">
                                <label>رقم هاتف الطالب:</label>
                                <span>${maskPhone(found.studentPhone)}</span>
                            </div>
                            <div class="modal-info-item">
                                <label>رقم ولي الأمر:</label>
                                <span>${maskPhone(found.parentPhone)}</span>
                            </div>
                        </div>
                    `;
                } else {
                    modalContent.innerHTML = `<div style="padding:20px; color:#e74c3c;"><p>❌ لم يتم العثور على طالب بهذه البيانات!</p></div>`;
                }
            } catch (e) {
                console.error(e);
                modalContent.innerHTML = `<div style="padding:20px; color:#e74c3c;"><p>حدث خطأ أثناء الاتصال بالسحابة!</p></div>`;
            }
        }

        function closeModal() {
            document.getElementById('studentSearchModal').classList.remove('active');
        }

        function closeModalOnOuterClick(e) {
            if (e.target.classList.contains('modal-overlay')) closeModal();
        }

        function convertImageToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 200;
                        const MAX_HEIGHT = 200;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.onerror = error => reject(error);
                };
                reader.onerror = error => reject(error);
            });
        }

        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            try {
                let base64Img = await convertImageToBase64(file);
                document.getElementById('profileImg').src = base64Img;
                userData.profileImage = base64Img;
                userData.profileImg = base64Img;

                await syncStudentToCloud("تم تحديث صورة البروفايل بنجاح! 📸");
            } catch (e) {
                console.error("خطأ في معالجة الصورة", e);
                alert("تعذر معالجة الصورة المحددة!");
            }
        }

        document.getElementById('saveChangesBtn').addEventListener('click', async function() {
            const newName = document.getElementById('editFullName').value.trim();
            const newSPhone = document.getElementById('editStudentPhone').value.trim();
            const newPPhone = document.getElementById('editParentPhone').value.trim();

            if (!newName || !newSPhone) {
                alert('الاسم ورقم الهاتف حقول أساسية ولا يمكن تركها فارغة!');
                return;
            }

            userData.fullName = newName;
            userData.studentPhone = newSPhone;
            userData.parentPhone = newPPhone;

            const saveBtn = document.getElementById('saveChangesBtn');
            saveBtn.textContent = 'جاري الحفظ بالسحابة... ⏳';
            saveBtn.disabled = true;

            await syncStudentToCloud("تم تحديث بيانات بروفايلك بنجاح يا بطل! ⚡");

            document.getElementById('profileName').textContent = newName;
            saveBtn.textContent = 'حفظ التعديلات 💾';
            saveBtn.disabled = false;
        });

        async function syncStudentToCloud(successMsg) {
            localStorage.setItem('studentUser', JSON.stringify(userData));

            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: cloudHeaders });
                if (!response.ok) throw new Error('فشل جلب البيانات السحابية');

                let result = await response.json();
                let record = result.record || {};
                let users = Array.isArray(record.users) ? record.users : [];

                let index = users.findIndex(u => 
                    (u.email && userData.email && u.email.toLowerCase() === userData.email.toLowerCase()) || 
                    (u.studentId && userData.studentId && u.studentId === userData.studentId)
                );

                if (index !== -1) {
                    users[index] = { ...users[index], ...userData };
                } else {
                    users.push(userData);
                }

                record.users = users;

                let updateResponse = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: cloudHeaders,
                    body: JSON.stringify(record)
                });

                if (updateResponse.ok) {
                    alert(successMsg);
                } else {
                    alert('تم الحفظ محلياً فقط، تعذر الاتصال بالسحابة!');
                }
            } catch (err) {
                console.error(err);
                alert('حدث خطأ في المزامنة السحابية!');
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('studentUser');
            window.location.href = 'login.html';
        });

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const pageBody = document.getElementById('pageBody');

        if (localStorage.getItem('theme') === 'dark') {
            pageBody.classList.add('dark-mode');
            themeToggleBtn.textContent = '☀️';
        }

        themeToggleBtn.addEventListener('click', function() {
            pageBody.classList.toggle('dark-mode');
            if (pageBody.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                themeToggleBtn.textContent = '☀️';
            } else {
                localStorage.setItem('theme', 'light');
                themeToggleBtn.textContent = '🌙';
            }
        });
    </script>
</body>
</html>
