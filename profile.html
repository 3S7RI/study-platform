<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي للطالب - رحلة دراسية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s; }
        
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --navbar-bg: linear-gradient(135deg, #1e3c72, #2a5298);
            --card-bg: #ffffff;
            --card-text: #555;
            --input-bg: #fff;
            --input-border: #ddd;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --navbar-bg: linear-gradient(135deg, #0d1b2a, #1b263b);
            --card-bg: #1e1e1e;
            --card-text: #bbb;
            --input-bg: #2d2d2d;
            --input-border: #444;
        }

        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; padding-bottom: 40px; }
        
        .navbar { 
            background: var(--navbar-bg); 
            color: white; 
            padding: 12px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        .navbar a { color: white; text-decoration: none; font-weight: bold; font-size: 0.9rem; background: rgba(255,255,255,0.15); padding: 6px 12px; border-radius: 6px; }
        .navbar h1 { font-size: 1.1rem; }

        .profile-container { max-width: 600px; margin: 30px auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        .profile-header { text-align: center; margin-bottom: 25px; }
        
        .avatar-wrapper { position: relative; width: 110px; height: 110px; margin: 0 auto 15px; }
        .avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid #2a5298; box-shadow: 0 4px 10px rgba(0,0,0,0.1); background: #e2e8f0; }
        
        .upload-badge {
            position: absolute;
            bottom: 2px;
            left: 2px;
            background: #2a5298;
            color: white;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid var(--card-bg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-size: 0.9rem;
            transition: transform 0.2s, background 0.2s;
        }
        .upload-badge:hover { transform: scale(1.1); background: #1e3c72; }

        .profile-header h2 { color: var(--text-color); font-size: 1.5rem; margin-bottom: 5px; }
        .student-badge { display: inline-block; background: #27ae60; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }

        /* قسم البحث المخصص للطالب عن الملازم والمستندات */
        .doc-search-section {
            background: rgba(0,0,0,0.02);
            border: 1px solid var(--input-border);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .doc-search-section h3 { font-size: 1rem; color: #2a5298; margin-bottom: 10px; }
        .doc-search-section input { width: 100%; padding: 10px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color); border-radius: 6px; font-size: 0.9rem; outline: none; margin-bottom: 10px; }
        .doc-list { display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; }
        .doc-item { padding: 8px 12px; background: var(--card-bg); border: 1px solid var(--input-border); border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .doc-item span { font-size: 0.88rem; font-weight: 600; }
        .doc-item a { text-decoration: none; color: white; background: #27ae60; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; }

        .info-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 25px; }
        .info-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; color: var(--card-text); }
        .info-group input { width: 100%; padding: 10px 12px; background: var(--input-bg); color: var(--text-color); border: 1px solid var(--input-border); border-radius: 6px; font-size: 0.95rem; outline: none; }
        .info-group input:disabled { opacity: 0.8; cursor: not-allowed; }

        .btn-action { display: block; width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; text-align: center; transition: background 0.3s; margin-top: 10px; }
        .btn-action:hover { background-color: #219653; }
        .btn-action:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .btn-logout { background-color: #e74c3c; margin-top: 15px; }
        .btn-logout:hover { background-color: #c0392b; }
    </style>
</head>
<body id="pageBody">

    <header class="navbar">
        <a href="main.html">🏠 العودة للرئيسية</a>
        <h1>الملف الشخصي</h1>
        <button id="themeToggleBtn" style="background:none; border:none; color:white; font-size:1.2rem; cursor:pointer;" title="تغيير الوضع">🌙</button>
    </header>

    <div class="profile-container">
        <div class="profile-header">
            <div class="avatar-wrapper">
                <img id="profileImg" src="https://via.placeholder.com/110?text=Student" alt="صورة الطالب" onerror="this.src='https://via.placeholder.com/110?text=Student'">
                <label for="editImageInput" class="upload-badge" title="تغيير الصورة الشخصية">📷</label>
            </div>
            <h2 id="profileName">اسم الطالب</h2>
            <span class="student-badge" id="profileStudentId">STU-0000</span>
        </div>

        <!-- قسم البحث الفوري عن الملازم والمستندات للطالب -->
        <div class="doc-search-section">
            <h3>📖 البحث في المستندات والملازم</h3>
            <input type="text" id="docSearchInput" placeholder="ابحث باسم المادة، الملزمة أو الدرس..." onkeyup="filterDocuments()">
            <div class="doc-list" id="docListContainer">
                <div class="doc-item" data-title="ملزمة الفيزياء الفصل الاول">
                    <span>📄 ملزمة الفيزياء - الفصل الأول</span>
                    <a href="#" onclick="alert('جاري تجهيز التحميل...')">تحميل 📥</a>
                </div>
                <div class="doc-item" data-title="ملخص الكيمياء العضوية">
                    <span>📄 ملخص الكيمياء العضوية</span>
                    <a href="#" onclick="alert('جاري تجهيز التحميل...')">تحميل 📥</a>
                </div>
                <div class="doc-item" data-title="بنك أسئلة الرياضيات">
                    <span>📄 بنك أسئلة الرياضيات</span>
                    <a href="#" onclick="alert('جاري تجهيز التحميل...')">تحميل 📥</a>
                </div>
            </div>
        </div>

        <input type="file" id="editImageInput" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">

        <div class="info-grid">
            <div class="info-group">
                <label>الاسم الكامل</label>
                <input type="text" id="editFullName">
            </div>
            <div class="info-group">
                <label>البريد الإلكتروني (غير قابل للتعديل)</label>
                <input type="email" id="editEmail" disabled>
            </div>
            <div class="info-group">
                <label>رقم هاتف الطالب</label>
                <input type="tel" id="editStudentPhone">
            </div>
            <div class="info-group">
                <label>رقم هاتف ولي الأمر</label>
                <input type="tel" id="editParentPhone">
            </div>
        </div>

        <button type="button" id="saveChangesBtn" class="btn-action">حفظ التعديلات 💾</button>
        <button type="button" id="logoutBtn" class="btn-action btn-logout">تسجيل الخروج 🚪</button>
    </div>

    <script>
        const BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';

        const cloudHeaders = {
            'X-Master-Key': API_KEY,
            'X-Access-Key': API_KEY,
            'Content-Type': 'application/json'
        };

        if (localStorage.getItem('isLoggedIn') !== 'true') {
            alert('يجب تسجيل الدخول أولاً!');
            window.location.href = 'login.html';
        }

        let userData = JSON.parse(localStorage.getItem('studentUser')) || {};

        document.getElementById('profileName').textContent = userData.fullName || 'طالب رحلة دراسية';
        document.getElementById('profileStudentId').textContent = userData.studentId || 'STU-0000';
        document.getElementById('editFullName').value = userData.fullName || '';
        document.getElementById('editEmail').value = userData.email || '';
        document.getElementById('editStudentPhone').value = userData.studentPhone || '';
        document.getElementById('editParentPhone').value = userData.parentPhone || '';

        if (userData.profileImage || userData.profileImg) {
            document.getElementById('profileImg').src = userData.profileImage || userData.profileImg;
        }

        // تصفية المستندات
        function filterDocuments() {
            let input = document.getElementById('docSearchInput').value.toLowerCase();
            let items = document.querySelectorAll('.doc-item');

            items.forEach(item => {
                let title = item.getAttribute('data-title').toLowerCase();
                if (title.includes(input)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function convertImageToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 200;
                        const MAX_HEIGHT = 200;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                    img.onerror = error => reject(error);
                };
                reader.onerror = error => reject(error);
            });
        }

        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            try {
                let base64Img = await convertImageToBase64(file);
                document.getElementById('profileImg').src = base64Img;
                userData.profileImage = base64Img;
                userData.profileImg = base64Img;

                await syncStudentToCloud("تم تحديث صورة البروفايل بنجاح! 📸");
            } catch (e) {
                console.error("خطأ في معالجة الصورة", e);
                alert("تعذر معالجة الصورة المحددة!");
            }
        }

        document.getElementById('saveChangesBtn').addEventListener('click', async function() {
            const newName = document.getElementById('editFullName').value.trim();
            const newSPhone = document.getElementById('editStudentPhone').value.trim();
            const newPPhone = document.getElementById('editParentPhone').value.trim();

            if (!newName || !newSPhone) {
                alert('الاسم ورقم الهاتف حقول أساسية ولا يمكن تركها فارغة!');
                return;
            }

            userData.fullName = newName;
            userData.studentPhone = newSPhone;
            userData.parentPhone = newPPhone;

            const saveBtn = document.getElementById('saveChangesBtn');
            saveBtn.textContent = 'جاري الحفظ بالسحابة... ⏳';
            saveBtn.disabled = true;

            await syncStudentToCloud("تم تحديث بيانات بروفايلك بنجاح يا بطل! ⚡");

            document.getElementById('profileName').textContent = newName;
            saveBtn.textContent = 'حفظ التعديلات 💾';
            saveBtn.disabled = false;
        });

        async function syncStudentToCloud(successMsg) {
            localStorage.setItem('studentUser', JSON.stringify(userData));

            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: cloudHeaders
                });
                if (!response.ok) throw new Error('فشل جلب البيانات السحابية');

                let result = await response.json();
                let record = result.record || {};
                let users = Array.isArray(record.users) ? record.users : [];

                let index = users.findIndex(u => 
                    (u.email && userData.email && u.email.toLowerCase() === userData.email.toLowerCase()) || 
                    (u.studentId && userData.studentId && u.studentId === userData.studentId)
                );

                if (index !== -1) {
                    users[index] = { ...users[index], ...userData };
                } else {
                    users.push(userData);
                }

                record.users = users;

                let updateResponse = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: cloudHeaders,
                    body: JSON.stringify(record)
                });

                if (updateResponse.ok) {
                    alert(successMsg);
                } else {
                    alert('تم الحفظ محلياً فقط، تعذر الاتصال بالسحابة!');
                }
            } catch (err) {
                console.error(err);
                alert('حدث خطأ في المزامنة السحابية!');
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('studentUser');
            window.location.href = 'login.html';
        });

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const pageBody = document.getElementById('pageBody');

        if (localStorage.getItem('theme') === 'dark') {
            pageBody.classList.add('dark-mode');
            themeToggleBtn.textContent = '☀️';
        }

        themeToggleBtn.addEventListener('click', function() {
            pageBody.classList.toggle('dark-mode');
            if (pageBody.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                themeToggleBtn.textContent = '☀️';
            } else {
                localStorage.setItem('theme', 'light');
                themeToggleBtn.textContent = '🌙';
            }
        });
    </script>
</body>
</html>
