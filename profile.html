<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - رحلة دراسية</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --form-bg: #0f172a;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --input-bg: #1e293b;
        }

        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Tahoma, sans-serif; 
            transition: background 0.3s, border-color 0.3s; 
        }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .profile-container { background-color: var(--card-bg); width: 100%; max-width: 520px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); padding: 25px; border: 1px solid var(--border-color); position: relative; overflow: hidden; }
        
        .card-bg-pattern {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; opacity: 0.12; background-repeat: repeat; background-size: 35px 35px;
        }

        .profile-container > * { position: relative; z-index: 2; }

        .header-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .back-btn { background: none; border: none; color: var(--text-secondary); font-size: 0.95rem; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; text-decoration: none; font-weight: 600; }
        .back-btn:hover { color: var(--primary-color); }
        
        .profile-header { text-align: center; margin-bottom: 20px; }
        
        .avatar-wrapper { 
            position: relative; width: 110px; height: 110px; margin: 0 auto 12px; 
            border-radius: 50%; padding: 4px; display: flex; align-items: center; justify-content: center;
        }
        .avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #334155; position: relative; z-index: 2; }

        .rank-frame-bronze { background: linear-gradient(45deg, #a77044, #cd7f32); box-shadow: 0 0 12px rgba(205, 127, 50, 0.4); animation: bronzePulse 2s infinite alternate; }
        .rank-frame-silver { background: linear-gradient(45deg, #95a5a6, #cbd5e1); box-shadow: 0 0 14px rgba(149, 165, 166, 0.5); animation: silverPulse 2s infinite alternate; }
        .rank-frame-gold { background: linear-gradient(45deg, #eab308, #ca8a04, #fef08a); box-shadow: 0 0 18px rgba(234, 179, 8, 0.7); animation: goldPulse 1.8s infinite alternate; }
        .rank-frame-diamond { background: linear-gradient(45deg, #06b6d4, #3b82f6, #67e8f9); box-shadow: 0 0 22px rgba(6, 182, 212, 0.8); animation: diamondPulse 1.6s infinite alternate; }
        .rank-frame-mythic { 
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6, #ec4899); background-size: 300% 300%; 
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.8), 0 0 10px rgba(139, 92, 246, 0.6); 
            animation: mythicGlow 2.5s ease infinite, mythicGradient 4s ease infinite; 
        }
        .rank-frame-unranked { background: var(--border-color); }

        @keyframes bronzePulse { 0% { box-shadow: 0 0 8px rgba(205,127,50,0.3); } 100% { box-shadow: 0 0 15px rgba(205,127,50,0.7); } }
        @keyframes silverPulse { 0% { box-shadow: 0 0 8px rgba(149,165,166,0.3); } 100% { box-shadow: 0 0 16px rgba(149,165,166,0.7); } }
        @keyframes goldPulse { 0% { box-shadow: 0 0 10px rgba(234,179,8,0.4); } 100% { box-shadow: 0 0 20px rgba(234,179,8,0.9); } }
        @keyframes diamondPulse { 0% { box-shadow: 0 0 12px rgba(6,182,212,0.4); } 100% { box-shadow: 0 0 24px rgba(6,182,212,0.9); } }
        @keyframes mythicGlow { 0% { box-shadow: 0 0 15px rgba(236,72,153,0.6); } 50% { box-shadow: 0 0 30px rgba(6,182,212,0.8); } 100% { box-shadow: 0 0 15px rgba(236,72,153,0.6); } }
        @keyframes mythicGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .upload-badge {
            position: absolute; bottom: 2px; left: 2px; background: var(--primary-color); color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid var(--card-bg); box-shadow: 0 2px 5px rgba(0,0,0,0.2); font-size: 0.85rem; transition: transform 0.2s; z-index: 5;
        }
        .upload-badge:hover { transform: scale(1.1); background: var(--primary-hover); }

        .student-name { font-size: 1.35rem; font-weight: 700; margin-bottom: 5px; color: var(--text-main); }
        
        .level-badge-box {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 6px 16px; border-radius: 10px; font-size: 0.88rem; font-weight: 600; margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1);
        }
        .badge-bronze { background-color: #78350f; color: #fde68a; }
        .badge-silver { background-color: #334155; color: #e2e8f0; }
        .badge-gold { background-color: #713f12; color: #fef08a; }
        .badge-diamond { background-color: #1e3a8a; color: #93c5fd; }
        .badge-mythic { background-color: #831843; color: #fbcfe8; }
        .badge-unranked { background-color: #1e293b; color: #94a3b8; }

        /* صندوق البحث الفوري */
        .student-search-box { background: var(--form-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .student-search-box h3 { font-size: 0.95rem; margin-bottom: 10px; color: var(--primary-color); display: flex; align-items: center; gap: 6px; }
        .search-input-group { display: flex; gap: 8px; align-items: center; width: 100%; }
        .search-input-group input { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 0.88rem; background: var(--input-bg); color: var(--text-main); outline: none; }
        .search-input-group button { padding: 10px 18px; background: var(--primary-color); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.88rem; white-space: nowrap; flex-shrink: 0; }

        .edit-form { background: var(--form-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); margin-top: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: bold; margin-bottom: 4px; color: var(--text-secondary); }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); background-color: var(--input-bg); color: var(--text-main); border-radius: 8px; outline: none; font-size: 0.88rem; }
        
        .pattern-control-row { display: flex; gap: 8px; align-items: center; }
        .pattern-control-row select { flex: 1; }
        .toggle-switch-container { display: flex; align-items: center; gap: 6px; background: var(--input-bg); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
        .toggle-switch-container input { cursor: pointer; width: 16px; height: 16px; accent-color: var(--primary-color); }
        .toggle-switch-container span { font-size: 0.8rem; color: var(--text-main); font-weight: 600; }

        /* الشاشة العائمة لنتائج البحث */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s; padding: 15px; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-card { background: var(--card-bg); width: 100%; max-width: 440px; border-radius: 20px; border: 1px solid var(--border-color); box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5); overflow: hidden; transform: scale(0.85) translateY(20px); transition: transform 0.3s; }
        .modal-overlay.active .modal-card { transform: scale(1) translateY(0); }
        .modal-header { padding: 15px 20px; background: var(--form-bg); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .close-modal { background: none; border: none; font-size: 1.2rem; color: var(--text-secondary); cursor: pointer; }
        .modal-body { padding: 20px; text-align: center; max-height: 80vh; overflow-y: auto; }
        
        .modal-avatar-wrapper { position: relative; width: 110px; height: 110px; margin: 0 auto 12px; border-radius: 50%; padding: 4px; display: flex; align-items: center; justify-content: center; }
        .modal-avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #334155; position: relative; z-index: 2; }

        .btn { width: 100%; padding: 11px; border-radius: 10px; font-size: 0.92rem; font-weight: 600; cursor: pointer; border: none; background-color: var(--primary-color); color: white; transition: background 0.2s; margin-top: 5px; }
        .btn:hover { background-color: var(--primary-hover); }
        .loading { text-align: center; padding: 30px; color: var(--text-secondary); }
    </style>
</head>
<body>

    <div class="profile-container" id="profileCardMain">
        <!-- طبقة خلفية الرموز الشفافة -->
        <div id="cardPatternBg" class="card-bg-pattern"></div>

        <div class="header-actions">
            <a href="main.html" class="back-btn"><span>←</span> الرئيسية</a>
            <button class="back-btn" onclick="logoutStudent()" style="color: #ef4444;">تسجيل الخروج 🚪</button>
        </div>
        
        <div id="studentProfileContent">
            <div class="loading">جاري تحميل بيانات البروفايل... ⏳</div>
        </div>
    </div>

    <!-- الشاشة العائمة لنتائج البحث عن طالب -->
    <div class="modal-overlay" id="searchModal" onclick="closeModalOnOuterClick(event)">
        <div class="modal-card">
            <div class="modal-header">
                <h3>تفاصيل بروفايل الطالب 🔍</h3>
                <button class="close-modal" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modalContent"></div>
        </div>
    </div>

    <input type="file" id="studentImageInput" accept="image/*" style="display: none;" onchange="handleStudentImageUpload(event)">

    <script>
        const BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';
        
        let globalRecord = {};
        let currentStudentData = null;

        if (localStorage.getItem('isLoggedIn') !== 'true') {
            alert('يجب تسجيل الدخول أولاً!');
            window.location.href = 'login.html';
        }

        function getStudentImage(userObj) {
            if (userObj && userObj.profileImage && userObj.profileImage.trim() !== '') {
                return userObj.profileImage;
            }
            return "https://via.placeholder.com/150/1e293b/94a3b8?text=لا+توجد+صورة";
        }

        function getRankDetails(rank) {
            switch (rank) {
                case 'bronze': return { title: 'ضعيف (Level 1)', class: 'rank-frame-bronze', badgeClass: 'badge-bronze', icon: '🥉', levelNum: 1 };
                case 'silver': return { title: 'متوسط (Level 2)', class: 'rank-frame-silver', badgeClass: 'badge-silver', icon: '🥈', levelNum: 2 };
                case 'gold': return { title: 'قوي (Level 3)', class: 'rank-frame-gold', badgeClass: 'badge-gold', icon: '🥇', levelNum: 3 };
                case 'diamond': return { title: 'قوي جداً (Level 4)', class: 'rank-frame-diamond', badgeClass: 'badge-diamond', icon: '💎', levelNum: 4 };
                case 'mythic': return { title: 'أسطوري (Level 5)', class: 'rank-frame-mythic', badgeClass: 'badge-mythic', icon: '👑', levelNum: 5 };
                default: return { title: 'جديد (Level 0)', class: 'rank-frame-unranked', badgeClass: 'badge-unranked', icon: '⚪', levelNum: 0 };
            }
        }

        function updateCardBackgroundPattern(patternChoice, levelNum, isEnabled) {
            const bgDiv = document.getElementById('cardPatternBg');
            if (!bgDiv) return;

            if (!isEnabled || levelNum < 3) {
                bgDiv.style.backgroundImage = 'none';
                return;
            }

            let strokeColor = levelNum === 3 ? '%23ca8a04' : (levelNum === 4 ? '%2306b6d4' : '%23ec4899');
            let symbols = {
                star: '<polygon points=\'12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2\'/>',
                heart: '<path d=\'M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z\'/>',
                crown: '<path d=\'M2 4l3 12h14l3-12-6 7-4-5-4 5-6-7zm3 16h14\'/>',
                lightning: '<path d=\'M13 2L3 14h9l-1 8 10-12h-9l1-8z\'/>',
                shield: '<path d=\'M12 2l10 5v6c0 5.55-3.84 10.74-9 12-5.16-1.26-9-6.45-9-12V7l10-5z\'/>'
            };

            let chosenSvgContent = symbols.star;
            if (patternChoice === 'heart') chosenSvgContent = symbols.heart;
            else if (patternChoice === 'crown') chosenSvgContent = symbols.crown;
            else if (patternChoice === 'lightning') chosenSvgContent = symbols.lightning;
            else if (patternChoice === 'shield') chosenSvgContent = symbols.shield;
            else if (patternChoice === 'mixed' || !patternChoice) {
                chosenSvgContent = symbols.star + symbols.heart + symbols.crown;
            }

            let svgString = `<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 24 24' fill='none' stroke='${strokeColor}' stroke-width='1.3'>${chosenSvgContent}</svg>`;
            bgDiv.style.backgroundImage = `url("data:image/svg+xml;utf8,${encodeURIComponent(svgString)}")`;
        }

        async function initStudentProfile() {
            try {
                let localUser = JSON.parse(localStorage.getItem('studentUser') || '{}');
                let userEmail = localUser.email || '';

                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                let result = await response.json();
                globalRecord = result.record || {};
                let usersList = Array.isArray(globalRecord.users) ? globalRecord.users : [];

                currentStudentData = usersList.find(u => u.email && u.email.toLowerCase() === userEmail.toLowerCase()) || usersList[0];

                if (currentStudentData) {
                    renderStudentProfile(currentStudentData);
                } else {
                    document.getElementById('studentProfileContent').innerHTML = `<div class="loading" style="color: #ef4444;">لم يتم العثور على بيانات الطالب.</div>`;
                }
            } catch (err) {
                console.error(err);
                document.getElementById('studentProfileContent').innerHTML = `<div class="loading" style="color: #ef4444;">خطأ في الاتصال بالخادم!</div>`;
            }
        }

        function renderStudentProfile(student) {
            const container = document.getElementById('studentProfileContent');
            let avatarUrl = getStudentImage(student);
            let rankKey = student.rank || 'bronze';
            let rankInfo = getRankDetails(rankKey);
            let patternChoice = student.bgPattern || 'mixed';
            let isPatternEnabled = student.bgPatternEnabled !== false;

            updateCardBackgroundPattern(patternChoice, rankInfo.levelNum, isPatternEnabled);

            container.innerHTML = `
                <div class="profile-header">
                    <div class="avatar-wrapper ${rankInfo.class}">
                        <img src="${avatarUrl}" alt="صورة الطالب" id="studentAvatarImg">
                        <label for="studentImageInput" class="upload-badge" title="تغيير الصورة">📷</label>
                    </div>
                    <!-- الأيقونة في اليمين بجوار اسم المستوى -->
                    <div class="level-badge-box ${rankInfo.badgeClass}">
                        <span>${rankInfo.icon}</span>
                        <span>${rankInfo.title}</span>
                    </div>
                    <h1 class="student-name">${student.fullName}</h1>
                    <p style="color: var(--text-secondary); font-size: 0.85rem;">كود الطالب: ${student.studentId || 'STU-0000'}</p>
                </div>

                <div class="student-search-box">
                    <h3>🔍 البحث عن بروفايل طالب آخر</h3>
                    <div class="search-input-group">
                        <input type="text" id="studentSearchQuery" placeholder="أدخل كود ID أو اسم الطالب..." onkeydown="if(event.key==='Enter') searchPeerProfile()">
                        <button onclick="searchPeerProfile()">بحث</button>
                    </div>
                </div>

                <div class="edit-form">
                    <div class="form-group">
                        <label>الاسم الكامل</label>
                        <input type="text" id="editName" value="${student.fullName || ''}">
                    </div>
                    <div class="form-group">
                        <label>رقم هاتف الطالب</label>
                        <input type="tel" id="editPhone" value="${student.studentPhone || ''}">
                    </div>
                    <div class="form-group">
                        <label>رقم هاتف ولي الأمر</label>
                        <input type="tel" id="editParentPhone" value="${student.parentPhone || ''}">
                    </div>
                    <div class="form-group">
                        <label>تخصيص رموز خلفية البروفايل (تظهر من المستوى الثالث)</label>
                        <div class="pattern-control-row">
                            <select id="editBgPattern">
                                <option value="mixed" ${patternChoice === 'mixed' ? 'selected' : ''}>✨ مدمج (تشكيلة متعددة)</option>
                                <option value="star" ${patternChoice === 'star' ? 'selected' : ''}>🌟 نجوم ورموز</option>
                                <option value="heart" ${patternChoice === 'heart' ? 'selected' : ''}>💖 قلوب وورد</option>
                                <option value="crown" ${patternChoice === 'crown' ? 'selected' : ''}>👑 تيجان وملك</option>
                                <option value="lightning" ${patternChoice === 'lightning' ? 'selected' : ''}>⚡ صواعق وطاقة</option>
                                <option value="shield" ${patternChoice === 'shield' ? 'selected' : ''}>🛡️ دروع وحماية</option>
                            </select>
                            <label class="toggle-switch-container" title="تفعيل أو إيقاف الرموز في الخلفية">
                                <input type="checkbox" id="editPatternToggle" ${isPatternEnabled ? 'checked' : ''}>
                                <span>تفعيل</span>
                            </label>
                        </div>
                    </div>
                    <button type="button" class="btn" onclick="saveStudentChanges()">حفظ التعديلات والخيارات 💾</button>
                </div>
            `;
        }

        function searchPeerProfile() {
            const query = document.getElementById('studentSearchQuery').value.trim().toLowerCase();
            const modal = document.getElementById('searchModal');
            const modalContent = document.getElementById('modalContent');
            
            if (!query) { alert('اكتب بيانات البحث أولاً!'); return; }

            modal.classList.add('active');
            modalContent.innerHTML = '<p style="font-size:0.9rem; padding:20px;">جاري البحث... ⏳</p>';

            let users = Array.isArray(globalRecord.users) ? globalRecord.users : [];
            let found = users.find(u => 
                (u.studentId && u.studentId.toLowerCase() === query) ||
                (u.fullName && u.fullName.toLowerCase().includes(query))
            );

            if (found) {
                let imgUrl = getStudentImage(found);
                let rankKey = found.rank || 'bronze';
                let rankInfo = getRankDetails(rankKey);
                
                modalContent.innerHTML = `
                    <div class="modal-avatar-wrapper ${rankInfo.class}">
                        <img src="${imgUrl}" alt="صورة الطالب">
                    </div>
                    <div class="level-badge-box ${rankInfo.badgeClass}">
                        <span>${rankInfo.icon}</span>
                        <span>${rankInfo.title}</span>
                    </div>
                    <h2 style="font-size:1.15rem; color:var(--text-main); margin-bottom:4px;">${found.fullName}</h2>
                    <p style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:15px;">كود الطالب: ${found.studentId || 'غير محدد'}</p>
                    <p style="font-size:0.85rem; color:#10b981;">الحالة: طالب مسجل ونشط ✅</p>
                `;
            } else {
                modalContent.innerHTML = `<div style="padding:20px; color:#ef4444;"><p>لم يتم العثور على طالب بهذا الاسم أو الكود!</p></div>`;
            }
        }

        function closeModal() { document.getElementById('searchModal').classList.remove('active'); }
        function closeModalOnOuterClick(e) { if (e.target.classList.contains('modal-overlay')) closeModal(); }

        function handleStudentImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) { if (width > 200) { height *= 200 / width; width = 200; } }
                    else { if (height > 200) { width *= 200 / height; height = 200; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    let base64Img = canvas.toDataURL('image/jpeg', 0.6);

                    document.getElementById('studentAvatarImg').src = base64Img;
                    currentStudentData.profileImage = base64Img;
                    syncStudentDataToCloud("تم تحديث صورة البروفايل بنجاح! 📸");
                };
            };
        }

        async function saveStudentChanges() {
            currentStudentData.fullName = document.getElementById('editName').value.trim();
            currentStudentData.studentPhone = document.getElementById('editPhone').value.trim();
            currentStudentData.parentPhone = document.getElementById('editParentPhone').value.trim();
            currentStudentData.bgPattern = document.getElementById('editBgPattern').value;
            currentStudentData.bgPatternEnabled = document.getElementById('editPatternToggle').checked;

            await syncStudentDataToCloud("تم حفظ كافة التعديلات بنجاح! ✅");
            renderStudentProfile(currentStudentData);
        }

        async function syncStudentDataToCloud(successMsg) {
            try {
                let users = globalRecord.users || [];
                let idx = users.findIndex(u => u.email.toLowerCase() === currentStudentData.email.toLowerCase());
                if (idx !== -1) users[idx] = currentStudentData;
                globalRecord.users = users;

                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY },
                    body: JSON.stringify(globalRecord)
                });

                if (res.ok) {
                    localStorage.setItem('studentUser', JSON.stringify(currentStudentData));
                    alert(successMsg);
                } else {
                    alert("فشل الحفظ في السحابة!");
                }
            } catch (err) {
                console.error(err);
                alert("حدث خطأ في الاتصال!");
            }
        }

        function logoutStudent() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        initStudentProfile();
    </script>
</body>
