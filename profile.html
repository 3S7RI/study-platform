<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - بروفايل الطالب</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72, #2a5298); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .profile-container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 450px; text-align: center; }
        
        /* تصميم صورة البروفايل */
        .avatar-section { position: relative; width: 120px; height: 120px; margin: 0 auto 20px auto; }
        .avatar-section img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 4px solid #2a5298; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .upload-btn { position: absolute; bottom: 0; right: 0; background: #27ae60; color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 1.1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .upload-btn input { display: none; }

        .profile-container h2 { color: #1e3c72; margin-bottom: 5px; font-size: 1.5rem; }
        .student-id { display: inline-block; background: #e8f4fd; color: #1e3c72; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; margin-bottom: 10px; }
        
        /* زر نسخ الآيدي المصغر */
        .btn-copy { display: inline-block; background-color: #f39c12; color: white; border: none; padding: 4px 12px; border-radius: 15px; font-size: 0.85rem; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-bottom: 20px; }
        .btn-copy:hover { background-color: #d68910; }

        .info-card { text-align: right; background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-right: 4px solid #2a5298; }
        .info-card label { display: block; color: #666; font-size: 0.85rem; margin-bottom: 3px; }
        .info-card span { color: #333; font-size: 1rem; font-weight: bold; }

        /* الأزرار الرئيسية */
        .btn-back { display: block; width: 100%; padding: 12px; background-color: #2980b9; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 15px; text-decoration: none; text-align: center; }
        .btn-back:hover { background-color: #2471a3; }

        .btn-logout { display: block; width: 100%; padding: 12px; background-color: #e74c3c; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; text-decoration: none; }
        .btn-logout:hover { background-color: #c0392b; }

        /* زر حذف الحساب */
        .btn-delete { display: block; width: 100%; padding: 12px; background-color: #c0392b; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-delete:hover { background-color: #962d22; }
    </style>
</head>
<body>

    <div class="profile-container">
        <!-- صورة البروفايل وزر التعديل -->
        <div class="avatar-section">
            <img id="profileImageTag" src="https://via.placeholder.com/120" alt="صورة الطالب">
            <label class="upload-btn" title="تغيير الصورة">
                📷
                <input type="file" id="imageInput" accept="image/*">
            </label>
        </div>

        <h2 id="studentName">اسم الطالب</h2>
        <div>
            <span class="student-id" id="studentIdBadge">الكود: STU-0000</span>
        </div>
        <!-- زر نسخ الآيدي -->
        <button type="button" class="btn-copy" id="copyIdBtn">نسخ الآيدي 📋</button>

        <div class="info-card">
            <label>البريد الإلكتروني</label>
            <span id="studentEmail">example@gmail.com</span>
        </div>
        <div class="info-card">
            <label>رقم هاتف الطالب</label>
            <span id="studentPhoneVal">01xxxxxxxx0</span>
        </div>
        <div class="info-card">
            <label>رقم هاتف ولي الأمر</label>
            <span id="parentPhoneVal">01xxxxxxxx0</span>
        </div>

        <!-- زر العودة للرئيسية -->
        <a href="main.html" class="btn-back">العودة للرئيسية 🏠</a>

        <button type="button" class="btn-logout" id="logoutBtn">تسجيل الخروج</button>
        <button type="button" class="btn-delete" id="deleteAccountBtn">حذف الحساب نهائياً 🗑️</button>
    </div>

    <script>
        // بيانات سحابة JSONBin
        const BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';

        // استرجاع بيانات الطالب الحالي المسجل الدخول
        let currentUser = JSON.parse(localStorage.getItem('studentUser'));

        if (!currentUser) {
            alert('يجب تسجيل الدخول أولاً!');
            window.location.href = 'login.html';
        } else {
            // عرض البيانات في الصفحة بشكل مؤكد
            document.getElementById('studentName').textContent = currentUser.fullName || 'طالب جديد';
            document.getElementById('studentIdBadge').textContent = 'الكود: ' + (currentUser.studentId || 'STU-0000');
            document.getElementById('studentEmail').textContent = currentUser.email || '-';
            document.getElementById('studentPhoneVal').textContent = currentUser.studentPhone || '-';
            document.getElementById('parentPhoneVal').textContent = currentUser.parentPhone || '-');
            
            // دعم التوافق مع المفتاحين (لضمان ظهور الصورة القديمة أو الجديدة)
            let imgSource = currentUser.profileImage || currentUser.profileImg;
            if (imgSource) {
                document.getElementById('profileImageTag').src = imgSource;
            }
        }

        // كود نسخ الآيدي للحافظة
        document.getElementById('copyIdBtn').addEventListener('click', function() {
            if (currentUser && currentUser.studentId) {
                navigator.clipboard.writeText(currentUser.studentId).then(() => {
                    alert('تم نسخ الآيدي بنجاح: ' + currentUser.studentId + ' 📋');
                }).catch(err => {
                    alert('فشل نسخ الآيدي!');
                });
            }
        });

        // التعامل مع رفع وتغيير صورة البروفايل وحفظها فوريًا محلياً وفي السحابة
        const imageInput = document.getElementById('imageInput');
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async function(event) {
                    const base64Image = event.target.result;
                    document.getElementById('profileImageTag').src = base64Image;

                    // تحديث المفتاح الموحد profileImage
                    currentUser.profileImage = base64Image;
                    currentUser.profileImg = base64Image; // احتياطي
                    localStorage.setItem('studentUser', JSON.stringify(currentUser));

                    // تحديث السحابة فوراً بالصورة الجديدة
                    try {
                        let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                            headers: { 'X-Master-Key': API_KEY }
                        });
                        let data = await res.json();
                        let rec = data.record;

                        if (rec.users) {
                            rec.users = rec.users.map(st => {
                                if (st.email === currentUser.email) {
                                    st.profileImage = base64Image;
                                    st.profileImg = base64Image;
                                }
                                return st;
                            });

                            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                                method: 'PUT',
                                headers: {
                                    'Content-Type': 'application/json',
                                    'X-Master-Key': API_KEY
                                },
                                body: JSON.stringify(rec)
                            });
                        }
                    } catch (err) {
                        console.error('خطأ في مزامنة الصورة مع السحابة:', err);
                    }

                    alert('تم تحديث صورة البروفايل وحفظها بنجاح يا بطل! 🚀');
                };
                reader.readAsDataURL(file);
            }
        });

        // زر تسجيل الخروج
        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('studentUser');
            localStorage.setItem('isLoggedIn', 'false');
            window.location.href = 'login.html';
        });

        // زر حذف الحساب نهائياً من المنصة والسحابة
        document.getElementById('deleteAccountBtn').addEventListener('click', async function() {
            const confirmDelete = confirm('هل أنت متأكد أنك تريد حذف حسابك نهائياً من المنصة؟ لا يمكن التراجع عن هذا الاجراء!');
            if (!confirmDelete) return;

            const btn = document.getElementById('deleteAccountBtn');
            btn.textContent = 'جاري حذف الحساب...';
            btn.disabled = true;

            try {
                let response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                let result = await response.json();
                let cloudUsers = result.record.users || [];

                let updatedUsers = cloudUsers.filter(st => st.email !== currentUser.email);

                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ users: updatedUsers })
                });

                localStorage.removeItem('studentUser');
                localStorage.setItem('isLoggedIn', 'false');

                alert('تم حذف حسابك بنجاح من المنصة والسحابة. نتمى لك التوفيق دائماً!');
                window.location.href = 'index.html';

            } catch (error) {
                console.error('خطأ أثناء الحذف:', error);
                alert('حدث خطأ أثناء الاتصال بالسحابة للحذف، تأكد من الإنترنت وحاول مرة أخرى.');
                btn.textContent = 'حذف الحساب نهائياً 🗑️';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
