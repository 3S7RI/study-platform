<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - إنشاء امتحان الحصة</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.12);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            --th-bg: rgba(255, 255, 255, 0.04);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            --th-bg: rgba(0, 0, 0, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        .header-right-side { display: flex; align-items: center; }
        .btn-home-link {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .header-center-box { display: flex; align-items: center; justify-content: center; }
        .platform-title-box { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: 700; color: var(--text-main); white-space: nowrap; }
        
        .header-left-side { display: flex; align-items: center; gap: 10px; }
        .btn-theme-toggle {
            background-color: rgba(255, 255, 255, 0.04); color: var(--text-main); border: 1px solid var(--border-color);
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
        }
        .btn-theme-toggle:hover { background-color: var(--hover-bg); border-color: var(--primary); }

        .admin-nav-bar {
            display: flex; justify-content: center; align-items: center;
            background-color: var(--bg-card); padding: 12px 16px; border-radius: 16px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); gap: 10px; flex-wrap: wrap;
        }
        .admin-tabs-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .btn-tab {
            background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--border-color);
            padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; flex: 1; min-width: 120px; text-align: center; text-decoration: none; display: inline-block;
        }
        .btn-tab.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        .section-box {
            background-color: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow);
            padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
        }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .section-header h2 { color: var(--text-main); font-size: 1.05rem; font-weight: 700; }

        .form-group { margin-top: 14px; text-align: right; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: var(--text-muted); font-weight: 600; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-color);
            background: var(--bg-main); color: var(--text-main); font-size: 0.85rem; outline: none;
        }

        .form-row-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (max-width: 768px) { .form-row-grid-2 { grid-template-columns: 1fr; } }

        .question-card {
            background: var(--th-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; margin-bottom: 15px; position: relative;
        }
        
        .btn-add-q { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; width: 100%; margin-bottom: 15px; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        .btn-save { background: var(--success); color: white; border: none; padding: 12px 16px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.9rem; margin-top: 20px; width: 100%; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
        .btn-danger { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <header class="platform-header">
            <div class="header-right-side"><a href="admin.html" class="btn-home-link">🏠 الرئيسية</a></div>
            <div class="header-center-box"><div class="platform-title-box"><span>إنشاء امتحان حصة دراسية</span> 📝</div></div>
            <div class="header-left-side"><button class="btn-theme-toggle" id="themeToggleBtn" title="تغيير الوضع">☀️</button></div>
        </header>

        <nav class="admin-nav-bar">
            <div class="admin-tabs-group">
                <a href="files-lessons.html" class="btn-tab">الحصص 📚</a>
                <a href="files-exam-create.html" class="btn-tab active">إنشاء امتحان حصة 📝</a>
                <a href="files-settings.html" class="btn-tab">الإعدادات ⚙️</a>
                <a href="files-stats.html" class="btn-tab">الإحصائيات 📊</a>
            </div>
        </nav>

        <div class="section-box">
            <div class="section-header"><h2>تفاصيل امتحان الحصة العامة 📋</h2></div>
            
            <div class="form-row-grid-2">
                <div class="form-group" style="margin-top:0;"><label>عنوان امتحان الحصة:</label><input type="text" id="lessonExamTitle" placeholder="مثلاً: امتحان الباب الأول كيمياء"></div>
                <div class="form-group" style="margin-top:0;"><label>المادة الدراسية:</label><input type="text" id="lessonExamSubject" placeholder="كيمياء"></div>
            </div>

            <div class="form-row-grid-2">
                <div class="form-group"><label>مدة الامتحان (بالدقائق):</label><input type="number" id="lessonExamDuration" value="20"></div>
                <div class="form-group"><label>درجة النجاح (%):</label><input type="number" id="lessonExamPassing" value="50"></div>
            </div>
        </div>

        <div class="section-box">
            <div class="section-header"><h2>أسئلة امتحان الحصة ❓</h2></div>
            <div id="lessonQuestionsContainer"></div>
            <button class="btn-add-q" onclick="addLessonQuestionCard()">➕ إضافة سؤال جديد لامتحان الحصة</button>
            <button class="btn-save" onclick="saveLessonExamToCloud()">حفظ ونشر امتحان الحصة بالسحابة 🚀</button>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
            }
        });

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const bodyElement = document.body;
        const savedTheme = localStorage.getItem('platform_theme') || 'dark';
        bodyElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            let nextTheme = bodyElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            bodyElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('platform_theme', nextTheme);
            themeToggleBtn.textContent = nextTheme === 'dark' ? '☀️' : '🌙';
        });

        let questionsArray = [];

        window.addLessonQuestionCard = function() {
            let qIndex = questionsArray.length;
            questionsArray.push({ text: '', type: 'mcq', options: ['', '', '', ''], correct: 0, marks: 1 });
            renderLessonQuestions();
        };

        window.renderLessonQuestions = function() {
            const container = document.getElementById('lessonQuestionsContainer');
            if (questionsArray.length === 0) {
                container.innerHTML = `<p style="text-align:center; opacity:0.7; padding:15px; font-size:0.82rem;">لم تقم بإضافة أي أسئلة بعد.</p>`;
                return;
            }

            let html = "";
            questionsArray.forEach((q, index) => {
                html += `
                    <div class="question-card" id="qCard-${index}">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                            <span style="font-weight:bold; color:var(--primary);">السؤال رقم ${index + 1}</span>
                            <button class="btn-danger" onclick="removeLessonQuestion(${index})">حذف السؤال 🗑️</button>
                        </div>
                        <div class="form-group" style="margin-top:0;">
                            <label>نص السؤال:</label>
                            <textarea rows="2" oninput="updateQField(${index}, 'text', this.value)" placeholder="اكتب نص السؤال هنا...">${q.text}</textarea>
                        </div>
                        <div class="form-row-grid-2">
                            <div class="form-group">
                                <label>نوع السؤال:</label>
                                <select onchange="updateQField(${index}, 'type', this.value); renderLessonQuestions();">
                                    <option value="mcq" ${q.type==='mcq'?'selected':''}>اختياري (مفرد)</option>
                                    <option value="tf" ${q.type==='tf'?'selected':''}>صح وخطأ</option>
                                    <option value="short" ${q.type==='short'?'selected':''}>نص قصير</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>الدرجة:</label>
                                <input type="number" value="${q.marks}" min="1" oninput="updateQField(${index}, 'marks', parseInt(this.value)||1)">
                            </div>
                        </div>`;
                
                if (q.type === 'mcq') {
                    html += `<div style="margin-top:10px;"><label style="font-size:0.8rem; color:var(--text-muted); font-weight:600;">الاختيارات والإجابة الصحيحة:</label>`;
                    q.options.forEach((opt, oIdx) => {
                        html += `
                            <div style="display:flex; gap:8px; align-items:center; margin-top:6px;">
                                <input type="radio" name="correct-${index}" ${q.correct === oIdx ? 'checked' : ''} onchange="updateQField(${index}, 'correct', ${oIdx})" title="اختر كإجابة صحيحة">
                                <input type="text" value="${opt}" oninput="updateQOption(${index}, ${oIdx}, this.value)" placeholder="اختر رقم ${oIdx+1}">
                            </div>`;
                    });
                    html += `</div>`;
                }
                html += `</div>`;
            });
            container.innerHTML = html;
        };

        window.updateQField = function(index, field, val) {
            questionsArray[index][field] = val;
        };

        window.updateQOption = function(qIdx, oIdx, val) {
            questionsArray[qIdx].options[oIdx] = val;
        };

        window.removeLessonQuestion = function(index) {
            questionsArray.splice(index, 1);
            renderLessonQuestions();
        };

        window.saveLessonExamToCloud = async function() {
            let title = document.getElementById('lessonExamTitle').value.trim();
            let subject = document.getElementById('lessonExamSubject').value.trim();
            let duration = parseInt(document.getElementById('lessonExamDuration').value) || 20;
            let passingScore = parseInt(document.getElementById('lessonExamPassing').value) || 50;

            if (!title) { alert('يرجى كتابة عنوان امتحان الحصة!'); return; }
            if (questionsArray.length === 0) { alert('يرجى إضافة سؤال واحد على الأقل!'); return; }

            let examDoc = {
                title, subject, duration, passingScore,
                questions: questionsArray,
                createdAt: new Date().toISOString()
            };

            try {
                // الحفظ في الكولكشن المستقل لامتحانات الحصص
                await addDoc(collection(db, "lessonExams"), examDoc);
                alert('✔ تم حفظ ونشر امتحان الحصة بنجاح في الكولكشن المستقل! 🚀 يمكنك ربطه بالحصة الآن.');
                window.location.href = 'files-lessons.html';
            } catch (e) {
                console.error(e);
                alert("حدث خطأ أثناء حفظ امتحان الحصة.");
            }
        };

        addLessonQuestionCard();
    </script>
</body>
</html>
