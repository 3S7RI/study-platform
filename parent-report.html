<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>تقرير ولي الأمر - رحلة دراسية</title>
<style>
:root{--bg:#0f172a;--card:#ffffff;--ink:#0f172a;--muted:#475569;--green:#16a34a;--yellow:#d97706;--red:#dc2626;--gray:#64748b;--primary:#4f46e5}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
body{background:linear-gradient(160deg,#1e1b4b,#0f172a);min-height:100vh;padding:16px;color:var(--ink)}
.wrap{max-width:520px;margin:0 auto}
.brand{text-align:center;color:#c7d2fe;font-weight:800;font-size:1.05rem;margin:6px 0 14px}
.card{background:var(--card);border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.hello{font-size:1.15rem;color:var(--muted);margin-bottom:4px}
.name{font-size:1.9rem;font-weight:900;line-height:1.4}
.badge{display:flex;align-items:center;gap:12px;border-radius:18px;padding:16px;margin-top:14px;color:#fff;font-size:1.5rem;font-weight:900;line-height:1.5}
.badge .e{font-size:2.6rem}
.b-green{background:var(--green)}.b-yellow{background:var(--yellow)}.b-red{background:var(--red)}.b-none{background:var(--gray)}
.row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:2px solid #e2e8f0}
.row:last-child{border:0}
.row .ic{font-size:2.2rem;width:52px;text-align:center}
.row .lab{font-size:1.1rem;color:var(--muted)}
.row .val{font-size:1.55rem;font-weight:900}
h2{font-size:1.3rem;margin-bottom:8px}
.ex{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-radius:14px;margin-bottom:8px;background:#f1f5f9;font-size:1.1rem;font-weight:700}
.pc{min-width:74px;text-align:center;color:#fff;border-radius:12px;padding:6px 8px;font-size:1.25rem;font-weight:900}
.advice{font-size:1.3rem;line-height:1.9;font-weight:700}
.say{width:100%;border:0;border-radius:18px;background:var(--primary);color:#fff;font-size:1.5rem;font-weight:900;padding:18px;cursor:pointer;margin-bottom:14px}
.say:active{transform:scale(.98)}
.foot{text-align:center;color:#94a3b8;font-size:.9rem;margin:10px 0 24px}
.msg{background:var(--card);border-radius:18px;padding:30px 18px;text-align:center;font-size:1.3rem;font-weight:800}
.sec-list{list-style:none}
.sec-list li{font-size:1.15rem;line-height:1.8;font-weight:700;padding:10px 12px;border-radius:14px;margin-bottom:8px}
.sec-list.good li{background:#dcfce7;color:#14532d}
.sec-list.bad li{background:#fee2e2;color:#7f1d1d}
.sec-list.tip li{background:#e0e7ff;color:#1e1b4b}
.meter{margin-top:14px}
.meter .top{display:flex;justify-content:space-between;font-weight:800;font-size:1.05rem;margin-bottom:6px}
.bar{height:12px;background:#e2e8f0;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.note{color:var(--muted);font-size:.95rem;line-height:1.7;margin-top:6px}
.sub{padding:12px 4px;border-bottom:2px solid #e2e8f0}
.sub:last-child{border:0}
.sub .h{display:flex;justify-content:space-between;gap:8px;font-size:1.15rem;font-weight:800;margin-bottom:6px}
.sub small{color:var(--muted);font-weight:700;font-size:.95rem}
details.card summary{font-size:1.3rem;font-weight:900;cursor:pointer;list-style:none}
details.card summary::-webkit-details-marker{display:none}
.ls{padding:12px 4px;border-bottom:2px solid #e2e8f0}
.ls:last-child{border:0}
.ls .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:1.05rem;margin-bottom:6px}
.chip{display:inline-block;color:#fff;border-radius:10px;padding:3px 9px;font-weight:900;font-size:1rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">📚 منصة رحلة دراسية</div>
  <div id="app"><div class="msg">⏳ لحظة، بنجهّز التقرير...</div></div>
  <div class="foot">التقرير ده بيتعمل أوتوماتيك من نشاط الطالب على المنصة</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const app = initializeApp({
    apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
    authDomain: "study-trip-1.firebaseapp.com",
    projectId: "study-trip-1",
    storageBucket: "study-trip-1.firebasestorage.app",
    messagingSenderId: "632096690853",
    appId: "1:632096690853:web:f9622d14de73a761dcf34c"
});
const db = getFirestore(app);
const $app = document.getElementById('app');
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const EMO = { green: '🟢', yellow: '🟡', red: '🔴', none: '⚪' };

function dur(sec) {
    sec = Math.max(0, Math.round(Number(sec) || 0));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
    if (h && m) return h + ' ساعة و' + m + ' دقيقة';
    if (h) return h + ' ساعة';
    if (m) return m + ' دقيقة';
    return 'أقل من دقيقة';
}
const pcColor = p => p >= 85 ? 'var(--green)' : p >= 60 ? 'var(--yellow)' : 'var(--red)';

function spokenText(r) {
    const kid = r.gender === 'female' ? 'بنتكم' : 'ابنكم';
    let t = 'السلام عليكم. ده تقرير ' + kid + ' ' + r.name + ' على منصة رحلة دراسية. ' + r.statusText + '. ';
    t += (r.studySinceLastSec != null ? 'ذاكر المدة اللي فاتت ' + dur(r.studySinceLastSec) : 'مجموع وقت المذاكرة ' + dur(r.studyTotalSec)) + '. ';
    t += 'بيدخل المنصة ' + r.streak + ' يوم ورا بعض. ';
    if (r.avg != null) t += 'متوسط درجات الامتحانات ' + r.avg + ' في المية. ';
    if (r.lessonsTotal) t += 'خلّص ' + r.lessonsDone + ' حصة كاملة من ' + r.lessonsTotal + '. ';
    if ((r.strengths || []).length) t += 'نقاط القوة: ' + r.strengths.slice(0, 3).join('. ') + '. ';
    if ((r.weaknesses || []).length) t += 'محتاج يتحسّن في: ' + r.weaknesses.slice(0, 3).join('. ') + '. ';
    t += (r.tips && r.tips.length) ? 'نصيحتنا: ' + r.tips.slice(0, 3).join(' ') : r.advice;
    return t;
}

function say(text) {
    try {
        const synth = window.speechSynthesis;
        if (!synth) { alert('جهازك مش بيدعم القراءة بالصوت'); return; }
        synth.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const voices = synth.getVoices();
        const v = voices.find(x => /^ar[-_]EG/i.test(x.lang)) || voices.find(x => /^ar/i.test(x.lang));
        if (v) u.voice = v;
        u.lang = v ? v.lang : 'ar-EG';
        u.rate = 0.85;
        synth.speak(u);
    } catch (e) { alert('تعذر تشغيل الصوت على الجهاز ده'); }
}

const list = (arr, cls) => arr && arr.length ? `<ul class="sec-list ${cls}">${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
const bar = (p, color) => `<div class="bar"><i style="width:${Math.max(2, Math.min(100, p))}%;background:${color}"></i></div>`;
const TREND = { up: '📈 في تحسّن', down: '📉 في نزول', flat: '➖ ثابت' };

function render(r) {
    const kid = r.gender === 'female' ? 'بنتكم' : 'ابنكم';
    const exams = (r.recent || []).map(e => `<div class="ex"><span>${esc(e.t)}</span><span class="pc" style="background:${pcColor(e.p)}">${esc(e.p)}%</span></div>`).join('');
    const comp = r.comp || {};
    const compItems = (comp.items || []).map(e => `<div class="ex"><span>${esc(e.t)}</span>${e.p == null ? '<span class="pc" style="background:var(--gray)">بانتظار الاعتماد</span>' : `<span class="pc" style="background:${pcColor(e.p)}">${esc(e.p)}%</span>`}</div>`).join('');
    const subs = (r.subjects || []).map(s => `<div class="sub"><div class="h"><span>${esc(s.s)}</span><span style="color:${s.avg == null ? 'var(--gray)' : pcColor(s.avg)}">${s.avg == null ? 'لسه من غير امتحان' : esc(s.avg) + '%'}</span></div>${s.avg == null ? '' : bar(s.avg, pcColor(s.avg))}<small>خلّص ${esc(s.done)} من ${esc(s.total)} حصة${s.n ? ' • ' + esc(s.n) + ' امتحان' : ''}</small></div>`).join('');
    const lessons = (r.lessons || []).map(l => `<div class="ls"><div class="h"><span>الحصة ${esc(l.n)}${l.t ? ': ' + esc(l.t) : ''}${l.s && l.s !== 'عام' ? ' <small style="color:var(--muted)">(' + esc(l.s) + ')</small>' : ''}</span>${l.e == null ? '<span class="chip" style="background:var(--gray)">من غير امتحان</span>' : `<span class="chip" style="background:${pcColor(l.e)}">${esc(l.e)}%</span>`}</div>${bar(l.p, l.p === 100 ? 'var(--green)' : 'var(--primary)')}<div class="note">إنجاز الحصة ${esc(l.p)}%${l.at > 1 ? ' • حلّ الامتحان ' + esc(l.at) + ' مرات' : ''}${l.mk ? ' • غلط في ' + esc(l.mk) + ' سؤال' : ''}</div></div>`).join('');
    const tips = (r.tips && r.tips.length) ? r.tips : [r.advice];

    $app.innerHTML = `
      <div class="card">
        <div class="hello">تقرير عن ${kid}</div>
        <div class="name">${esc(r.name)}</div>
        <div class="badge b-${esc(r.status)}"><span class="e">${EMO[r.status] || '⚪'}</span><span>${esc(r.statusText)}</span></div>
        ${r.overall != null && r.status !== 'none' ? `<div class="meter"><div class="top"><span>التقييم العام</span><span style="color:${pcColor(r.overall)}">${esc(r.overall)}%</span></div>${bar(r.overall, pcColor(r.overall))}<div class="note">محسوب من درجات الامتحانات وإنجاز الحصص وانتظام الدخول على المنصة.</div></div>` : ''}
      </div>
      <button class="say" id="sayBtn">🔊 اسمع التقرير بصوت</button>
      ${(r.strengths || []).length ? `<div class="card"><h2>💪 شاطر في إيه؟</h2>${list(r.strengths, 'good')}</div>` : ''}
      ${(r.weaknesses || []).length ? `<div class="card"><h2>📌 محتاج يتحسّن في إيه؟</h2>${list(r.weaknesses, 'bad')}</div>` : ''}
      <div class="card">
        <h2>⏱ المذاكرة والانتظام</h2>
        <div class="row"><div class="ic">⏱</div><div><div class="lab">${r.studySinceLastSec != null ? 'ذاكر المدة اللي فاتت' : 'مجموع وقت المذاكرة'}</div><div class="val">${esc(dur(r.studySinceLastSec != null ? r.studySinceLastSec : r.studyTotalSec))}</div></div></div>
        ${r.studySinceLastSec != null ? `<div class="row"><div class="ic">🕒</div><div><div class="lab">إجمالي وقت المذاكرة</div><div class="val">${esc(dur(r.studyTotalSec))}</div></div></div>` : ''}
        ${r.studyAvgPerDaySec != null ? `<div class="row"><div class="ic">📅</div><div><div class="lab">متوسط المذاكرة في اليوم</div><div class="val">${esc(dur(r.studyAvgPerDaySec))}</div></div></div>` : ''}
        <div class="row"><div class="ic">🔥</div><div><div class="lab">أيام متواصلة على المنصة</div><div class="val">${esc(r.streak)} يوم${r.longestStreak > r.streak ? ' <small style="color:var(--muted);font-size:1rem">(أطول مرة ' + esc(r.longestStreak) + ')</small>' : ''}</div></div></div>
        ${r.inactiveDays != null && r.inactiveDays >= 1 ? `<div class="row"><div class="ic">🗓</div><div><div class="lab">آخر دخول</div><div class="val">من ${esc(r.inactiveDays)} ${r.inactiveDays === 1 ? 'يوم' : 'أيام'}</div></div></div>` : ''}
        <div class="row"><div class="ic">⭐</div><div><div class="lab">النقاط</div><div class="val">${esc(r.points)}</div></div></div>
      </div>
      ${r.lessonsTotal ? `<div class="card"><h2>🎬 الحصص</h2>
        <div class="row"><div class="ic">✅</div><div><div class="lab">حصص خلّصها كاملة</div><div class="val">${esc(r.lessonsDone)} من ${esc(r.lessonsTotal)}</div></div></div>
        ${bar(Math.round(r.lessonsDone / r.lessonsTotal * 100), 'var(--green)')}
        <div class="note">بدأ ${esc(r.lessonsStarted)} حصة${r.videos && r.videos.t ? ' • فيديوهات: ' + esc(r.videos.d) + '/' + esc(r.videos.t) : ''}${r.notes && r.notes.t ? ' • ملازم: ' + esc(r.notes.d) + '/' + esc(r.notes.t) : ''}${r.sums && r.sums.t ? ' • ملخصات: ' + esc(r.sums.d) + '/' + esc(r.sums.t) : ''}</div></div>` : ''}
      ${subs ? `<div class="card"><h2>📚 مستواه في كل مادة</h2>${subs}</div>` : ''}
      <div class="card"><h2>📝 الامتحانات</h2>
        ${r.avg != null ? `<div class="row"><div class="ic">📝</div><div><div class="lab">متوسط امتحانات الحصص${r.examsCount ? ' (' + esc(r.examsCount) + ' امتحان)' : ''}</div><div class="val" style="color:${pcColor(r.avg)}">${esc(r.avg)}%${r.trend ? ' <small style="font-size:1rem">' + TREND[r.trend] + '</small>' : ''}</div></div></div>` : '<div class="note">لسه ما حلّش امتحانات حصص.</div>'}
        ${comp.avg != null ? `<div class="row"><div class="ic">🏆</div><div><div class="lab">متوسط الامتحانات الشاملة</div><div class="val" style="color:${pcColor(comp.avg)}">${esc(comp.avg)}%</div></div></div>` : ''}
        ${r.mistakesTotal ? `<div class="note">إجمالي الأسئلة اللي غلط فيها: ${esc(r.mistakesTotal)} سؤال (متسجّلة عنده في صفحة «أخطائي» عشان يراجعها).</div>` : ''}
      </div>
      ${exams ? `<div class="card"><h2>📋 آخر امتحانات الحصص</h2>${exams}</div>` : ''}
      ${compItems ? `<div class="card"><h2>🏆 الامتحانات الشاملة</h2>${compItems}</div>` : ''}
      ${lessons ? `<details class="card"><summary>🔎 تفاصيل كل حصة ▾</summary>${lessons}</details>` : ''}
      <div class="card"><h2>💬 نصيحتنا ليكم</h2>${list(tips, 'tip')}</div>`;
    document.getElementById('sayBtn').onclick = () => say(spokenText(r));
}

(async () => {
    const t = new URLSearchParams(location.search).get('t') || '';
    if (!/^[a-f0-9]{32}$/.test(t)) { $app.innerHTML = '<div class="msg">😕 الرابط ده مش صحيح.<br>اطلب من ابنك/بنتك يبعتلك رابط جديد.</div>'; return; }
    try {
        const s = await getDoc(doc(db, 'parentReports', t));
        if (!s.exists()) { $app.innerHTML = '<div class="msg">😕 التقرير مش موجود أو اتمسح.</div>'; return; }
        render(s.data());
    } catch (e) {
        console.error(e);
        $app.innerHTML = '<div class="msg">⚠️ حصلت مشكلة في تحميل التقرير. اتأكد إن النت شغال وجرّب تاني.</div>';
    }
})();
</script>
</body>
</html>
