<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - عرض ومشاهدة الحصة</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.12);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            --th-bg: rgba(255, 255, 255, 0.04);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            --th-bg: rgba(0, 0, 0, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; user-select: none; -webkit-user-select: none; }
        .container { max-width: 900px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        .header-right-side { display: flex; align-items: center; }
        .btn-home-link {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .header-center-box { display: flex; align-items: center; justify-content: center; }
        .platform-title-box { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: 700; color: var(--text-main); white-space: nowrap; }
        
        .header-left-side { display: flex; align-items: center; gap: 10px; }
        .btn-theme-toggle {
            background-color: rgba(255, 255, 255, 0.04); color: var(--text-main); border: 1px solid var(--border-color);
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
        }
        .btn-theme-toggle:hover { background-color: var(--hover-bg); border-color: var(--primary); }

        .lesson-main-card {
            background-color: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow);
            padding: 24px; margin-bottom: 20px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
            position: relative; overflow: hidden;
        }

        .lesson-title-header { font-size: 1.2rem; font-weight: bold; color: var(--text-main); margin-bottom: 8px; }
        .lesson-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }

        /* نظام القوائم القابلة للطي (Accordion Lists) مع تصميم أقصى اليمين وأقصى اليسار لزر الفتح */
        .lesson-section-box {
            background: var(--th-bg); border: 1px solid var(--border-color); border-radius: 12px;
            margin-bottom: 14px; overflow: hidden; transition: all 0.3s ease;
        }
        
        .lesson-section-header {
            padding: 14px 18px; font-size: 0.92rem; font-weight: bold; color: var(--text-main);
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
            background: rgba(99, 102, 241, 0.04); user-select: none; gap: 10px;
        }
        .lesson-section-header:hover { background: var(--hover-bg); }
        
        .section-left-side { display: flex; align-items: center; gap: 10px; }
        .arrow-icon { font-size: 0.8rem; transition: transform 0.3s ease; }
        .lesson-section-box.active .arrow-icon { transform: rotate(180deg); }

        .lesson-section-content {
            max-height: 0; overflow: hidden; padding: 0 18px; transition: max-height 0.35s ease-out, padding 0.35s ease;
            border-top: 1px solid transparent;
        }
        .lesson-section-box.active .lesson-section-content {
            max-height: 2000px; padding: 16px 18px; border-top-color: var(--border-color);
        }

        /* زر فتح المربع الصغير في أقصى اليسار */
        .btn-open-small {
            background-color: var(--primary); color: white; border: none; padding: 4px 14px;
            border-radius: 6px; font-weight: bold; font-size: 0.78rem; cursor: pointer;
            box-shadow: 0 2px 6px rgba(99, 102, 241, 0.3); flex-shrink: 0;
        }
        .btn-open-small:hover { background-color: var(--primary-hover); }

        .view-btn {
            background-color: var(--primary); color: white; text-decoration: none; text-align: center;
            padding: 11px; border-radius: 10px; font-weight: bold; font-size: 0.88rem; display: block;
            border: none; cursor: pointer; width: 100%; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .view-btn:hover { background-color: var(--primary-hover); opacity: 0.9; transform: translateY(-1px); }

        /* مشغل الفيديو الداخلي المميز */
        .video-player-wrapper { position: relative; width: 100%; background: #000; border-radius: 8px; overflow: hidden; }
        video { width: 100%; max-height: 400px; display: block; outline: none; }

        /* إشعار المنصة البسيط (Toast Notification) */
        .platform-toast-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 2000; padding: 15px;
        }
        .platform-toast-card {
            background: var(--bg-card); border: 1px solid var(--border-color); border-top: 4px solid var(--danger);
            width: 100%; max-width: 350px; border-radius: 14px; padding: 18px; text-align: center; box-shadow: var(--shadow);
        }
        .platform-toast-card h3 { font-size: 0.95rem; color: var(--text-main); margin-bottom: 6px; font-weight: 700; }
        .platform-toast-card p { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 14px; line-height: 1.4; }
        .platform-toast-btn {
            background: var(--primary); color: white; border: none; padding: 7px 16px; border-radius: 8px;
            font-weight: bold; font-size: 0.8rem; cursor: pointer; width: 100%;
        }

        /* نافذة العرض الداخلي للملازم */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s; padding: 15px;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-card {
            background: var(--bg-card); width: 100%; max-width: 750px;
            border-radius: 16px; border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6); overflow: hidden;
            display: flex; flex-direction: column; max-height: 90vh; position: relative;
        }
        .modal-header {
            padding: 14px 18px; background: var(--bg-card); color: var(--text-main);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color); font-weight: bold; font-size: 1rem;
        }
        .close-modal { background: none; border: none; font-size: 1.2rem; color: var(--text-main); cursor: pointer; }
        .modal-body {
            padding: 20px; overflow-y: auto; flex: 1; text-align: right;
            font-size: 0.88rem; line-height: 1.7; color: var(--text-main); position: relative;
        }

        .watermark-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 1.4rem; color: rgba(255, 255, 255, 0.05); pointer-events: none; white-space: nowrap; font-weight: bold; z-index: 10;
        }
    </style>
</head>
<body id="pageBody" data-theme="dark">

    <div class="container">
        <header class="platform-header">
            <div class="header-right-side"><a href="files.html" class="btn-home-link">⬅ العودة للمكتبة</a></div>
            <div class="header-center-box"><div class="platform-title-box"><span>غرفة مشاهدة الحصة</span> 🎬</div></div>
            <div class="header-left-side"><button class="btn-theme-toggle" id="themeToggleBtn" title="تغيير الوضع">☀️</button></div>
        </header>

        <div class="lesson-main-card" id="lessonContainerBox">
            <div id="loadingText" style="text-align: center; padding: 40px; color: var(--text-muted);">جاري تحميل محتوى الحصة وتجهيز القوائم...</div>
        </div>

        <div style="text-align: center; margin-top: 25px; font-size: 0.78rem; color: var(--text-muted);">
            جميع الحقوق محفوظة للمهندس/مؤسس المنصة <strong>محمد عماد محمد (عشري)</strong> © 2026 - رحلة دراسية
        </div>
    </div>

    <!-- نافذة الإشعارات التنبيهية البسيطة -->
    <div class="platform-toast-overlay" id="platformToastModal" onclick="closePlatformToast()">
        <div class="platform-toast-card" onclick="event.stopPropagation()">
            <h3 id="toastTitle">تنبيه المنصة 🔔</h3>
            <p id="toastMessage">محتوى الحصة غير متاح...</p>
            <button class="platform-toast-btn" onclick="closePlatformToast()">حسناً فهمت 👍</button>
        </div>
    </div>

    <!-- نافذة منبثقة لعرض الملفات والملازم داخل المنصة -->
    <div class="modal-overlay" id="innerViewerModal" onclick="if(event.target===this) closeInnerViewer()">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="innerViewerTitle">عرض المستند</h3>
                <button class="close-modal" onclick="closeInnerViewer()">✕</button>
            </div>
            <div class="modal-body" id="innerViewerBody" style="text-align: center; padding: 10px;">
                <!-- محتوى الملزمة الداخلي -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserId = null;
        let currentUserEmail = "طالب زائر";

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUserId = user.uid;
                currentUserEmail = user.email || user.displayName || "طالب معتمد";
            }
            const urlParams = new URLSearchParams(window.location.search);
            const lessonId = urlParams.get('id');

            if (lessonId) {
                await fetchLessonDetails(lessonId);
            } else {
                document.getElementById('lessonContainerBox').innerHTML = `<p style="text-align:center; color:var(--danger);">عذراً، لم يتم تحديد الحصة المطلوبة.</p>`;
            }
        });

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const bodyElement = document.body;
        const savedTheme = localStorage.getItem('platform_theme') || 'dark';
        bodyElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            let nextTheme = bodyElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            bodyElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('platform_theme', nextTheme);
            themeToggleBtn.textContent = nextTheme === 'dark' ? '☀️' : '🌙';
        });

        window.showPlatformToast = function(title, message) {
            document.getElementById('toastTitle').textContent = title;
            document.getElementById('toastMessage').textContent = message;
            document.getElementById('platformToastModal').style.display = 'flex';
        };

        window.closePlatformToast = function() {
            document.getElementById('platformToastModal').style.display = 'none';
        };

        async function fetchLessonDetails(lessonId) {
            try {
                const docRef = doc(db, "lessons", lessonId);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    document.getElementById('lessonContainerBox').innerHTML = `<p style="text-align:center; color:var(--danger);">عذراً، هذه الحصة غير موجودة أو تم حذفها.</p>`;
                    return;
                }

                let lesson = docSnap.data();
                renderLessonPage(lessonId, lesson);

                if (currentUserId) {
                    let userRef = doc(db, "users", currentUserId);
                    let userSnap = await getDoc(userRef);
                    if (userSnap.exists()) {
                        let userData = userSnap.data();
                        let lessonsActivity = userData.lessonsActivity || {};
                        if (!lessonsActivity[lessonId] || !lessonsActivity[lessonId].watched) {
                            lessonsActivity[lessonId] = { watched: true, studyNotes: true, video: true, summary: true };
                            await updateDoc(userRef, {
                                points: increment(10),
                                lessonsActivity: lessonsActivity
                            });
                        }
                    }
                }
            } catch (e) {
                console.error("خطأ في جلب تفاصيل الحصة:", e);
                document.getElementById('lessonContainerBox').innerHTML = `<p style="text-align:center; color:var(--danger);">حدث خطأ أثناء تحميل الحصة من السحابة.</p>`;
            }
        }

        function getEmbedYouTubeUrl(url) {
            if (!url) return '';
            if (url.includes('embed/')) return url;
            let videoId = '';
            if (url.includes('youtu.be/')) {
                videoId = url.split('youtu.be/')[1].split('?')[0];
            } else if (url.includes('watch?v=')) {
                videoId = url.split('watch?v=')[1].split('&')[0];
            }
            return videoId ? `https://www.youtube.com/embed/${videoId}` : url;
        }

        function renderLessonPage(lessonId, item) {
            let s = item.settings || {};
            let html = `
                <div class="lesson-title-header">🎬 الحصة ${item.number || 1}: ${item.title || 'بدون عنوان'}</div>
                <div class="lesson-subtitle">المادة: ${item.subject || 'عام'} | الصف الدراسي: ${item.targetGroup || 'عام'}</div>
            `;

            // 1. ملزمة الشرح
            let hasStudyNotes = !!item.studyNotes;
            let notesLabelName = item.notesLabelName || 'أولاً: قائمة الملازم وملفات الشرح';

            html += `
                <div class="lesson-section-box" id="sectionStudyNotes">
                    <div class="lesson-section-header" onclick="toggleAccordion('sectionStudyNotes')">
                        <span>📄 ${notesLabelName}</span>
                        <div class="section-left-side">
                            <button class="btn-open-small" onclick="event.stopPropagation(); triggerOpenNotes('${item.studyNotes || ''}', ${hasStudyNotes})">فتح</button>
                            <span class="arrow-icon">▼</span>
                        </div>
                    </div>
                    <div class="lesson-section-content">
                        ${hasStudyNotes ? `<p style="font-size:0.82rem; color:var(--text-muted);">الملزمة متوفرة وجاهزة للاطلاع عليها داخل المنصة.</p>` : `<p style="font-size:0.82rem; color:var(--danger);">الملزمة غير مرفقة حالياً.</p>`}
                    </div>
                </div>
            `;

            // 2. فيديو الشرح
            let hasVideo = s.showVideo !== false && !!item.videoUrl;
            let videoSource = hasVideo ? item.videoUrl : '';
            let isYouTube = videoSource.includes('youtube.com') || videoSource.includes('youtu.be');
            let finalVideoUrl = isYouTube ? getEmbedYouTubeUrl(videoSource) : videoSource;
            let videoLabelName = item.videoLabelName || 'ثانياً: قائمة فيديو الشرح';

            html += `
                <div class="lesson-section-box" id="sectionVideo">
                    <div class="lesson-section-header" onclick="toggleAccordion('sectionVideo')">
                        <span>🎬 ${videoLabelName}</span>
                        <div class="section-left-side">
                            <button class="btn-open-small" onclick="event.stopPropagation(); triggerOpenVideo(${hasVideo})">فتح</button>
                            <span class="arrow-icon">▼</span>
                        </div>
                    </div>
                    <div class="lesson-section-content">
                        ${hasVideo ? `
                            <div class="video-player-wrapper">
                                ${isYouTube ? 
                                    `<iframe src="${finalVideoUrl}" style="width:100%; height:380px; border:none;" allowfullscreen></iframe>` :
                                    `<video controls controlsList="nodownload" id="lessonVideoPlayer">
                                        <source src="${finalVideoUrl}" type="video/mp4">
                                        متصفحك لا يدعم تشغيل الفيديو.
                                     </video>`
                                }
                            </div>
                        ` : `<p style="font-size:0.82rem; color:var(--danger);">فيديو الشرح غير مرفق حالياً.</p>`}
                    </div>
                </div>
            `;

            // 3. ملخص الدرس
            let hasSummary = s.showSummary !== false && !!item.summaryNotes;
            let summaryLabelName = item.summaryLabelName || 'ثالثاً: قائمة ملخص الدرس';

            html += `
                <div class="lesson-section-box" id="sectionSummary">
                    <div class="lesson-section-header" onclick="toggleAccordion('sectionSummary')">
                        <span>📑 ${summaryLabelName}</span>
                        <div class="section-left-side">
                            <button class="btn-open-small" onclick="event.stopPropagation(); triggerOpenSummary('${item.summaryNotes || ''}', ${hasSummary})">فتح</button>
                            <span class="arrow-icon">▼</span>
                        </div>
                    </div>
                    <div class="lesson-section-content">
                        ${hasSummary ? `<p style="font-size:0.82rem; color:var(--text-muted);">ملخص الدرس جاهز للاطلاع.</p>` : `<p style="font-size:0.82rem; color:var(--danger);">الملخص غير مرفق حالياً.</p>`}
                    </div>
                </div>
            `;

            // 4. امتحان الحصة
            let hasExam = !!item.examData && item.examData.questions && item.examData.questions.length > 0;
            let examLabelName = item.examLabelName || 'رابعاً: امتحان الحصة والتقييم';

            html += `
                <div class="lesson-section-box" id="sectionExam" style="border-color: var(--primary);">
                    <div class="lesson-section-header" onclick="toggleAccordion('sectionExam')">
                        <span>📝 ${examLabelName}</span>
                        <div class="section-left-side">
                            <button class="btn-open-small" onclick="event.stopPropagation(); triggerOpenExam(${hasExam})">فتح</button>
                            <span class="arrow-icon">▼</span>
                        </div>
                    </div>
                    <div class="lesson-section-content">
                        ${hasExam ? `
                            <p style="font-size: 0.85rem; color: var(--text-main); font-weight: bold; margin-bottom: 10px;">📌 ${item.examData.title}</p>
                            <div id="lessonExamContainer" style="display:flex; flex-direction:column; gap:12px;">
                                ${renderLessonExamQuestions(item.examData.questions)}
                            </div>
                        ` : `<p style="font-size: 0.8rem; color: var(--danger);">لا يوجد امتحان مخصص أو مرفق لهذه الحصة حالياً.</p>`}
                    </div>
                </div>
            `;

            html += `<div class="watermark-overlay">${currentUserEmail}</div>`;
            document.getElementById('lessonContainerBox').innerHTML = html;
        }

        function renderLessonExamQuestions(questions) {
            let qHtml = "";
            questions.forEach((q, qIdx) => {
                qHtml += `<div style="background:var(--th-bg); padding:12px; border-radius:8px; border:1px solid var(--border-color);">
                    <p style="font-weight:bold; margin-bottom:8px; font-size:0.85rem;">سؤال ${qIdx+1}: ${q.text} (${q.marks} درجات)</p>
                    ${q.imageUrl ? `<img src="${q.imageUrl}" style="max-width:100%; max-height:200px; border-radius:6px; margin-bottom:8px; display:block;">` : ''}
                `;
                
                if (q.type === 'mcq' || q.type === 'tf') {
                    q.options.forEach((opt, oIdx) => {
                        qHtml += `<label style="display:flex; align-items:center; gap:8px; margin-top:4px; font-size:0.8rem; cursor:pointer;">
                            <input type="radio" name="q_${qIdx}" value="${oIdx}"> ${opt}
                        </label>`;
                    });
                } else if (q.type === 'checkbox') {
                    q.options.forEach((opt, oIdx) => {
                        qHtml += `<label style="display:flex; align-items:center; gap:8px; margin-top:4px; font-size:0.8rem; cursor:pointer;">
                            <input type="checkbox" name="q_${qIdx}" value="${oIdx}"> ${opt}
                        </label>`;
                    });
                } else {
                    qHtml += `<textarea rows="3" placeholder="اكتب إجابتك هنا..." style="width:100%; padding:8px; border-radius:6px; border:1px solid var(--border-color); background:var(--bg-main); color:var(--text-main); margin-top:6px;"></textarea>`;
                }
                qHtml += `</div>`;
            });
            qHtml += `<button onclick="showPlatformToast('تم بنجاح 🚀', 'تم تسجيل إجابات امتحان الحصة بنجاح!')" class="view-btn" style="margin-top:10px;">إرسال وتسليم امتحان الحصة 🚀</button>`;
            return qHtml;
        }

        // الوظائف الخاصة بزر "فتح" الصغير لكل محتوى على حدة
        window.triggerOpenNotes = function(fileUrl, isAvailable) {
            if (!isAvailable || !fileUrl) {
                showPlatformToast("تنبيه المحتوى ⚠️", "ملزمة الشرح الأساسية غير مرفقة لهذه الحصة حالياً.");
                return;
            }
            openInnerViewer('ملزمة الشرح الأساسية', fileUrl);
        };

        window.triggerOpenVideo = function(isAvailable) {
            if (!isAvailable) {
                showPlatformToast("تنبيه المحتوى ⚠️", "لا يوجد فيديو شرح مرفق لهذه الحصة حالياً.");
                return;
            }
            // فتح قائمة فيديو الشرح تلقائياً عند الضغط على زر فتح
            const box = document.getElementById('sectionVideo');
            box.classList.add('active');
            box.scrollIntoView({ behavior: 'smooth', block: 'center' });
        };

        window.triggerOpenSummary = function(fileUrl, isAvailable) {
            if (!isAvailable || !fileUrl) {
                showPlatformToast("تنبيه المحتوى ⚠️", "لا يوجد ملخص درس مرفق لهذه الحصة حالياً.");
                return;
            }
            openInnerViewer('ملخص الدرس', fileUrl);
        };

        window.triggerOpenExam = function(isAvailable) {
            if (!isAvailable) {
                showPlatformToast("تنبيه المحتوى ⚠️", "لا يوجد امتحان مخصص أو مرفق لهذه الحصة حالياً.");
                return;
            }
            // فتح قائمة الامتحان تلقائياً عند الضغط على زر فتح
            const box = document.getElementById('sectionExam');
            box.classList.add('active');
            box.scrollIntoView({ behavior: 'smooth', block: 'center' });
        };

        // التحكم في طي وفتح القوائم عند الضغط على العنوان
        window.toggleAccordion = function(boxId) {
            const box = document.getElementById(boxId);
            box.classList.toggle('active');
        };

        window.openInnerViewer = function(title, fileUrl) {
            document.getElementById('innerViewerTitle').textContent = title;
            let viewerBody = document.getElementById('innerViewerBody');
            
            if (fileUrl.includes('data:application/pdf') || fileUrl.endsWith('.pdf') || fileUrl.includes('base64')) {
                viewerBody.innerHTML = `<iframe src="${fileUrl}" style="width:100%; height:550px; border:none; border-radius:8px;"></iframe>`;
            } else {
                viewerBody.innerHTML = `
                    <div style="padding: 25px; text-align: center;">
                        <p style="margin-bottom: 15px;">رابط الملف أو المستند جاهز للعرض:</p>
                        <a href="${fileUrl}" target="_blank" class="view-btn" style="display:inline-block; max-width:280px;">فتح المستند داخل المنصة 📄</a>
                    </div>
                `;
            }
            document.getElementById('innerViewerModal').classList.add('active');
        };

        window.closeInnerViewer = function() {
            document.getElementById('innerViewerModal').classList.remove('active');
        };
    </script>
</body>
</html>
