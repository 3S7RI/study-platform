<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منتدى الأسئلة والدردشة - منصة رحلة دراسية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s; }
        
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --navbar-bg: linear-gradient(135deg, #1e3c72, #2a5298);
            --card-bg: #ffffff;
            --card-text: #777;
            --welcome-h1: #1e3c72;
            --btn-bg: rgba(255, 255, 255, 0.15);
            --btn-border: rgba(255, 255, 255, 0.2);
            --input-bg: #fff;
            --input-border: #ccc;
            --shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --navbar-bg: linear-gradient(135deg, #1e293b, #0f172a);
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-text: #94a3b8;
            --welcome-h1: #ffffff;
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-border: rgba(255, 255, 255, 0.15);
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.1);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; }

        .navbar { 
            background: var(--navbar-bg); color: white; padding: 14px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); backdrop-filter: blur(10px);
        }
        
        .back-home-btn {
            background: var(--btn-bg); border: 1px solid var(--btn-border); color: white; border-radius: 50%;
            cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; text-decoration: none;
            transition: transform 0.2s;
        }
        .back-home-btn:hover { transform: scale(1.05); background: rgba(255, 255, 255, 0.25); }

        .navbar-title { font-size: 1.15rem; font-weight: bold; color: white; text-align: center; flex: 1; margin: 0 10px; }

        .theme-toggle-btn { 
            background: var(--btn-bg); border: 1px solid var(--btn-border); color: white; border-radius: 50%; 
            cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex-shrink: 0;
            transition: transform 0.2s;
        }
        .theme-toggle-btn:hover { transform: scale(1.05); }

        .container { max-width: 700px; width: 100%; margin: 25px auto; padding: 0 15px; }

        /* تبيوبات التبديل بين المنتدى ودردشة الطلاب المدمجة */
        .forum-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 12px; border-radius: 12px; border: 1px solid rgba(139, 92, 246, 0.3);
            background: var(--card-bg); color: var(--text-color); font-weight: bold; cursor: pointer;
            font-size: 0.95rem; text-align: center; box-shadow: var(--shadow); transition: all 0.3s;
        }
        .tab-btn.active { background: #8b5cf6; color: white; border-color: #8b5cf6; }

        .section-panel { display: none; }
        .section-panel.active { display: block; }

        .create-post-card {
            background: var(--card-bg); padding: 22px; border-radius: 16px;
            box-shadow: var(--shadow); margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05);
            border-top: 5px solid #8b5cf6; backdrop-filter: blur(12px);
        }
        .create-post-card textarea, .chat-input-box textarea {
            width: 100%; height: 90px; padding: 14px; border-radius: 10px;
            border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color);
            resize: none; font-size: 0.95rem; margin-bottom: 12px; outline: none;
            transition: border-color 0.2s;
        }
        .create-post-card textarea:focus, .chat-input-box textarea:focus { border-color: #8b5cf6; }
        
        .post-tools-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
        .media-upload-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        .media-btn {
            background: rgba(139, 92, 246, 0.1); border: 1px solid #8b5cf6; color: #8b5cf6;
            padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: bold;
            display: flex; align-items: center; gap: 6px; transition: background 0.2s;
        }
        .media-btn:hover { background: rgba(139, 92, 246, 0.2); }

        .post-submit-btn {
            background-color: #8b5cf6; color: white; border: none; padding: 12px 20px;
            border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1rem; width: 100%;
            transition: background-color 0.3s, transform 0.1s; margin-top: 10px; box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }
        .post-submit-btn:hover { background-color: #7c3aed; transform: translateY(-1px); }

        .posts-feed { display: flex; flex-direction: column; gap: 20px; }
        .post-card {
            background: var(--card-bg); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); position: relative;
            border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(12px);
        }
        
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .post-user-info-group { display: flex; align-items: center; gap: 12px; }
        .post-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #333; border: 2px solid #8b5cf6; }
        .post-author-info h4 { font-size: 1rem; color: var(--text-color); display: flex; align-items: center; gap: 8px; }
        .student-level-badge { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; font-size: 0.75rem; padding: 2px 8px; border-radius: 6px; font-weight: bold; border: 1px solid rgba(139, 92, 246, 0.3); }
        .post-author-info span { font-size: 0.75rem; color: var(--card-text); margin-top: 2px; display: block; }
        
        .delete-post-btn {
            background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold;
            display: flex; align-items: center; gap: 4px; transition: background 0.2s;
        }
        .delete-post-btn:hover { background: rgba(239, 68, 68, 0.2); }

        .post-content { font-size: 1rem; line-height: 1.7; margin-bottom: 14px; word-break: break-word; }
        .post-media-img { max-width: 100%; max-height: 320px; border-radius: 10px; margin-bottom: 14px; display: block; object-fit: contain; }
        .post-audio { width: 100%; margin-bottom: 14px; border-radius: 8px; }

        .comments-section { border-top: 1px solid rgba(255,255,255,0.08); padding-top: 14px; margin-top: 12px; }
        .comment-item {
            background: rgba(139, 92, 246, 0.03); padding: 12px 14px; border-radius: 10px; margin-bottom: 10px; font-size: 0.92rem;
            border-right: 4px solid #8b5cf6; border: 1px solid rgba(255,255,255,0.03);
        }
        .comment-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .comment-author { font-weight: bold; font-size: 0.9rem; color: #8b5cf6; }
        
        .admin-badge-master { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; font-size: 0.7rem; padding: 2px 8px; border-radius: 6px; font-weight: bold; }
        .admin-badge-full { background: linear-gradient(135deg, #10b981, #059669); color: #fff; font-size: 0.7rem; padding: 2px 8px; border-radius: 6px; font-weight: bold; }
        .admin-badge-sub { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; font-size: 0.7rem; padding: 2px 8px; border-radius: 6px; font-weight: bold; }

        .add-comment-box { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
        .add-comment-box input {
            flex: 1; min-width: 150px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--input-border);
            background: var(--input-bg); color: var(--text-color); font-size: 0.9rem; outline: none;
        }
        .add-comment-box input:focus { border-color: #8b5cf6; }
        .comment-tools { display: flex; gap: 6px; align-items: center; }
        .comment-mic-btn {
            background: rgba(139, 92, 246, 0.1); border: 1px solid #8b5cf6; color: #8b5cf6;
            padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: bold;
        }
        .add-comment-box button.send-btn {
            background: #2563eb; color: white; border: none; padding: 10px 18px;
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
        }

        /* تنسيقات قسم دردشة الطلاب المدمج (داخل لوحة المنتدى) */
        .chat-messages-container {
            background: var(--card-bg); border-radius: 16px; padding: 15px; height: 400px;
            overflow-y: auto; box-shadow: var(--shadow); margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05);
            display: flex; flex-direction: column; gap: 12px;
        }
        .chat-message-item {
            background: rgba(139, 92, 246, 0.05); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.03);
            max-width: 85%; align-self: flex-start;
        }
        .chat-message-item.admin-msg {
            background: rgba(16, 185, 129, 0.08); border-color: rgba(16, 185, 129, 0.2);
        }
        .chat-msg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 10px; }
        .chat-msg-author { font-weight: bold; font-size: 0.85rem; color: #8b5cf6; }
        .chat-msg-time { font-size: 0.7rem; color: var(--card-text); }
        .chat-input-card {
            background: var(--card-bg); padding: 15px; border-radius: 16px; box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.05);
        }
    </style>
</head>
<body id="pageBody" class="dark-mode">

    <header class="navbar">
        <a href="main.html" class="back-home-btn" title="العودة للرئيسية">🏠</a>
        <div class="navbar-title">منتدى الأسئلة ودردشة الطلاب 💬</div>
        <button id="themeToggleBtn" class="theme-toggle-btn" title="تغيير الوضع">☀️</button>
    </header>

    <div class="container">
        <!-- تبيوبات التبديل بين المنتدى ودردشة الطلاب -->
        <div class="forum-tabs">
            <button class="tab-btn active" id="tabForumBtn" onclick="switchTab('forum')">💬 منتدى الأسئلة والاستفسارات</button>
            <button class="tab-btn" id="tabChatBtn" onclick="switchTab('chat')">👥 دردشة الطلاب الجماعية</button>
        </div>

        <!-- قسم منتدى الأسئلة -->
        <div id="forumSection" class="section-panel active">
            <div class="create-post-card">
                <textarea id="postContentInput" placeholder="اكتب سؤالك بوضوح تام..."></textarea>
                
                <div class="post-tools-row">
                    <div class="media-upload-btns">
                        <label class="media-btn" style="cursor: pointer;">
                            📷 رفع صورة <input type="file" id="postImageInput" accept="image/*" style="display: none;" onchange="previewPostImage(event)">
                        </label>
                        <button type="button" class="media-btn" id="recordVoiceBtn" onclick="toggleVoiceRecording()">🎙️ تسجيل فويس</button>
                    </div>
                    <span id="mediaStatusIndicator" style="font-size: 0.85rem; color: #10b981; font-weight: bold;"></span>
                </div>
                
                <div id="imagePreviewContainer" style="margin-bottom: 12px; display: none; position: relative; width: fit-content;">
                    <img id="imgPreviewTag" style="max-height: 120px; border-radius: 8px; border: 1px solid #8b5cf6;">
                    <button type="button" onclick="removeSelectedImage()" style="background: #ef4444; color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 0.75rem; cursor: pointer; position: absolute; top: -6px; right: -6px; display: flex; align-items: center; justify-content: center;">✕</button>
                </div>

                <button class="post-submit-btn" id="postSubmitBtn" onclick="handlePostSubmitAction()">نشر السؤال بالوسائط المرفقة 🚀</button>
            </div>

            <div id="postsFeed" class="posts-feed">
                <div style="text-align: center; padding: 40px; background: var(--card-bg); border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); box-shadow: var(--shadow);">
                    <div style="font-size: 2.5rem; margin-bottom: 10px;">⏳</div>
                    <p style="color: var(--card-text); font-weight: bold;">جاري تحميل الأسئلة والمناقشات...</p>
                </div>
            </div>
        </div>

        <!-- قسم دردشة الطلاب الجماعية المدمج -->
        <div id="chatSection" class="section-panel">
            <div id="chatMessagesContainer" class="chat-messages-container">
                <div style="text-align: center; padding: 40px; color: var(--card-text);">
                    <div style="font-size: 2rem; margin-bottom: 8px;">⏳</div>
                    <p style="font-weight: bold;">جاري تحميل رسائل الدردشة...</p>
                </div>
            </div>

            <div class="chat-input-card">
                <textarea id="chatMessageInput" placeholder="اكتب رسالتك لزملائك في الدردشة..."></textarea>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <span id="chatMediaStatus" style="font-size: 0.85rem; color: #10b981; font-weight: bold;"></span>
                    <button class="post-submit-btn" style="width: auto; padding: 10px 25px; margin-top: 0;" onclick="sendStudentChatMessage()">إرسال الرسالة 🚀</button>
                </div>
            </div>
        </div>
        
        <div style="text-align: center; margin-top: 35px; font-size: 0.85rem; color: var(--card-text);">
            جميع الحقوق محفوظة للمهندس/مؤسس المنصة <strong>محمد عماد محمد (عشري)</strong> © 2026 - رحلة دراسية
        </div>
    </div>

    <script>
        const BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';

        const defaultMaleSvg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231e293b'/><circle cx='50' cy='38' r='18' fill='%2300a2ff'/><path d='M22 82c0-15.5 12.5-28 28-28s28 12.5 28 28' fill='%2300a2ff'/></svg>";

        const rawStudentData = JSON.parse(localStorage.getItem('studentUser')) || {};
        const fullStoredName = rawStudentData.fullName || rawStudentData.name || 'طالب المنصة';
        
        const nameParts = fullStoredName.trim().split(/\s+/);
        const twoNames = nameParts.length > 1 ? `${nameParts[0]} ${nameParts[1]}` : nameParts[0] || 'طالب المنصة';
        
        const studentLevel = rawStudentData.level || rawStudentData.educationalLevel || 'المستوى العام';

        const userData = {
            fullName: twoNames,
            level: studentLevel,
            profileImage: rawStudentData.profileImage || ''
        };

        const isAdminLoggedIn = sessionStorage.getItem('isAdminLoggedIn') === 'true';
        const adminRole = sessionStorage.getItem('adminRole') || 'sub';
        const isUserAdmin = isAdminLoggedIn;

        let selectedBase64Image = "";
        let recordedAudioBase64 = "";
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        let activeCommentRecorder = null;
        let activeCommentChunks = [];
        let activeCommentAudioBase64 = "";

        const pageBody = document.getElementById('pageBody');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const savedTheme = localStorage.getItem('forumTheme') || 'dark';
        
        if (savedTheme === 'light') {
            pageBody.classList.remove('dark-mode');
            themeToggleBtn.textContent = '🌙';
        } else {
            pageBody.classList.add('dark-mode');
            themeToggleBtn.textContent = '☀️';
        }

        themeToggleBtn.addEventListener('click', function() {
            pageBody.classList.toggle('dark-mode');
            const isDark = pageBody.classList.contains('dark-mode');
            localStorage.setItem('forumTheme', isDark ? 'dark' : 'light');
            themeToggleBtn.textContent = isDark ? '☀️' : '🌙';
        });

        function switchTab(tabName) {
            document.getElementById('tabForumBtn').classList.remove('active');
            document.getElementById('tabChatBtn').classList.remove('active');
            document.getElementById('forumSection').classList.remove('active');
            document.getElementById('chatSection').classList.remove('active');

            if (tabName === 'forum') {
                document.getElementById('tabForumBtn').classList.add('active');
                document.getElementById('forumSection').classList.add('active');
            } else {
                document.getElementById('tabChatBtn').classList.add('active');
                document.getElementById('chatSection').classList.add('active');
                loadStudentChatData();
            }
        }

        function previewPostImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                selectedBase64Image = event.target.result;
                document.getElementById('imgPreviewTag').src = selectedBase64Image;
                document.getElementById('imagePreviewContainer').style.display = 'block';
                updateStatusText();
            };
            reader.readAsDataURL(file);
        }

        function removeSelectedImage() {
            selectedBase64Image = "";
            document.getElementById('imagePreviewContainer').style.display = 'none';
            document.getElementById('postImageInput').value = "";
            updateStatusText();
        }

        async function toggleVoiceRecording() {
            const btn = document.getElementById('recordVoiceBtn');
            const status = document.getElementById('mediaStatusIndicator');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            recordedAudioBase64 = reader.result;
                            updateStatusText();
                        };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.style.background = "#ef4444";
                    btn.style.color = "white";
                    btn.textContent = "⏹️ إيقاف التسجيل";
                    status.textContent = "جاري تسجيل الصوت الآن... 🎙️";
                } catch (err) {
                    alert('يرجى السماح باستخدام الميكروفون لتسجيل الفويس!');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.style.background = "";
                btn.style.color = "";
                btn.textContent = "🎙️ تسجيل فويس";
                updateStatusText();
            }
        }

        function updateStatusText() {
            let parts = [];
            if (selectedBase64Image) parts.push("📷 صورة");
            if (recordedAudioBase64) parts.push("🎙️ صوت");
            const status = document.getElementById('mediaStatusIndicator');
            status.textContent = parts.length > 0 ? `المرفقات الحالية: ${parts.join(' + ')} جاهزة ✅` : "";
        }

        function handlePostSubmitAction() {
            if (isRecording && mediaRecorder) {
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = async () => {
                        recordedAudioBase64 = reader.result;
                        isRecording = false;
                        const btn = document.getElementById('recordVoiceBtn');
                        btn.style.background = "";
                        btn.style.color = "";
                        btn.textContent = "🎙️ تسجيل فويس";
                        await createNewQuestionPost();
                    };
                };
                mediaRecorder.stop();
            } else {
                createNewQuestionPost();
            }
        }

        loadForumData();

        async function loadForumData() {
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                let data = await res.json();
                let forumPosts = data.record.forumPosts || [];
                renderPosts(forumPosts);
            } catch (e) {
                console.error("خطأ في جلب الأسئلة:", e);
                document.getElementById('postsFeed').innerHTML = '<p style="text-align:center; color: red;">فشل تحميل الأسئلة.</p>';
            }
        }

        function renderPosts(posts) {
            const feed = document.getElementById('postsFeed');
            if (posts.length === 0) {
                feed.innerHTML = `
                    <div style="text-align: center; padding: 40px; background: var(--card-bg); border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); box-shadow: var(--shadow);">
                        <div style="font-size: 3rem; margin-bottom: 10px;">💬</div>
                        <h3 style="color: var(--text-color); margin-bottom: 5px;">لا توجد أسئلة مطروحة حالياً</h3>
                        <p style="color: var(--card-text); font-size: 0.9rem;">كن أول من يطرح سؤالاً دراسياً في المنتدى!</p>
                    </div>
                `;
                return;
            }

            feed.innerHTML = '';
            posts.slice().reverse().forEach((post, index) => {
                let realIndex = posts.length - 1 - index;
                let userImg = post.profileImage || defaultMaleSvg;
                let canDelete = isUserAdmin || (userData.fullName && post.authorName === userData.fullName);

                let commentsHtml = '';
                if (post.comments && post.comments.length > 0) {
                    post.comments.forEach(c => {
                        let badgeHtml = '';
                        if (c.isAdmin) {
                            if (c.role === 'master') {
                                badgeHtml = `<span class="admin-badge-master">⚡ مطور رئيسي موثق</span>`;
                            } else if (c.role === 'full') {
                                badgeHtml = `<span class="admin-badge-full">🛡️ مشرف عام متحكم</span>`;
                            } else {
                                badgeHtml = `<span class="admin-badge-sub">📌 مشرف موثق</span>`;
                            }
                        }

                        commentsHtml += `
                            <div class="comment-item">
                                <div class="comment-header-row">
                                    <span class="comment-author">${c.authorName}</span>
                                    ${badgeHtml}
                                </div>
                                <div style="margin-top: 4px; line-height: 1.5;">${c.text}</div>
                                ${c.audio ? `<audio controls class="post-audio" style="margin-top:8px;"><source src="${c.audio}" type="audio/webm"></audio>` : ''}
                            </div>
                        `;
                    });
                }

                let commentBoxHtml = `
                    <div class="add-comment-box">
                        <input type="text" id="commentInput_${realIndex}" placeholder="${isUserAdmin ? 'اكتب رد الأدمن المعتمد...' : 'الردود مقتصرة على الأدمن فقط'}">
                        ${isUserAdmin ? `
                            <div class="comment-tools">
                                <button type="button" class="comment-mic-btn" id="commentMicBtn_${realIndex}" onclick="toggleCommentVoiceRecording(${realIndex})" title="تسجيل صوت للرد">🎙️</button>
                                <button type="button" class="send-btn" onclick="submitAdminCommentAction(${realIndex})">إرسال</button>
                            </div>
                        ` : ''}
                    </div>
                `;

                let card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="post-header">
                        <div class="post-user-info-group">
                            <img src="${userImg}" class="post-avatar" alt="صورة">
                            <div class="post-author-info">
                                <h4>
                                    ${post.authorName} 
                                    <span class="student-level-badge">${post.studentLevel || 'طالب المنصة'}</span>
                                </h4>
                                <span>${post.date || 'منذ قليل'}</span>
                            </div>
                        </div>
                        ${canDelete ? `<button class="delete-post-btn" onclick="deleteQuestionPost(${realIndex})">🗑️ حذف</button>` : ''}
                    </div>
                    ${post.content ? `<div class="post-content">${post.content}</div>` : ''}
                    ${post.image ? `<img src="${post.image}" class="post-media-img">` : ''}
                    ${post.audio ? `<audio controls class="post-audio"><source src="${post.audio}" type="audio/webm"></audio>` : ''}
                    
                    <div class="comments-section">
                        <div id="commentsList_${realIndex}">${commentsHtml}</div>
                        ${commentBoxHtml}
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        async function toggleCommentVoiceRecording(postIndex) {
            const btn = document.getElementById(`commentMicBtn_${postIndex}`);

            if (!activeCommentRecorder || activeCommentRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    activeCommentRecorder = new MediaRecorder(stream);
                    activeCommentChunks = [];

                    activeCommentRecorder.ondataavailable = e => activeCommentChunks.push(e.data);
                    activeCommentRecorder.onstop = () => {
                        const audioBlob = new Blob(activeCommentChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            activeCommentAudioBase64 = reader.result;
                        };
                    };

                    activeCommentRecorder.start();
                    btn.style.background = "#ef4444";
                    btn.style.color = "white";
                    btn.textContent = "⏹️";
                } catch (err) {
                    alert('يرجى السماح باستخدام الميكروفون!');
                }
            } else {
                activeCommentRecorder.stop();
                btn.style.background = "";
                btn.style.color = "";
                btn.textContent = "🎙️";
            }
        }

        function submitAdminCommentAction(postIndex) {
            if (activeCommentRecorder && activeCommentRecorder.state === "recording") {
                activeCommentRecorder.onstop = async () => {
                    const audioBlob = new Blob(activeCommentChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = async () => {
                        activeCommentAudioBase64 = reader.result;
                        await addAdminComment(postIndex);
                    };
                };
                activeCommentRecorder.stop();
            } else {
                addAdminComment(postIndex);
            }
        }

        async function createNewQuestionPost() {
            let content = document.getElementById('postContentInput').value.trim();
            if (!content && !selectedBase64Image && !recordedAudioBase64) {
                alert('الرجاء كتابة محتوى السؤال أو إرفاق صورة أو تسجيل صوتي!');
                return;
            }

            let authorName = userData.fullName;
            let studentLevelBadge = userData.level;
            let profileImage = userData.profileImage || '';
            let dateStr = new Date().toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' });

            let newPost = {
                authorName: authorName,
                studentLevel: studentLevelBadge,
                profileImage: profileImage,
                content: content,
                image: selectedBase64Image,
                audio: recordedAudioBase64,
                date: dateStr,
                comments: []
            };

            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                let data = await res.json();
                let record = data.record;
                if (!record.forumPosts) record.forumPosts = [];
                
                record.forumPosts.push(newPost);

                let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(record)
                });

                if (updateRes.ok) {
                    document.getElementById('postContentInput').value = '';
                    removeSelectedImage();
                    recordedAudioBase64 = "";
                    document.getElementById('mediaStatusIndicator').textContent = "";
                    loadForumData();
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء الاتصال بالسحابة وحفظ السؤال.');
            }
        }

        async function deleteQuestionPost(index) {
            if (!confirm('هل أنت متأكد من حذف هذا السؤال؟')) return;

            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                let data = await res.json();
                let record = data.record;

                if (record.forumPosts && record.forumPosts[index]) {
                    record.forumPosts.splice(index, 1);

                    let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                        body: JSON.stringify(record)
                    });

                    if (updateRes.ok) {
                        loadForumData();
                    }
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء حذف السؤال.');
            }
        }

        async function addAdminComment(postIndex) {
            let input = document.getElementById(`commentInput_${postIndex}`);
            let text = input.value.trim();
            if (!text && !activeCommentAudioBase64) return;

            let authorName = adminRole === 'master' ? 'محمد عماد (مؤسس المنصة)' : 'مشرف المنصة';

            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                let data = await res.json();
                let record = data.record;

                if (record.forumPosts && record.forumPosts[postIndex]) {
                    if (!record.forumPosts[postIndex].comments) {
                        record.forumPosts[postIndex].comments = [];
                    }
                    record.forumPosts[postIndex].comments.push({
                        authorName: authorName,
                        text: text,
                        audio: activeCommentAudioBase64,
                        isAdmin: true,
                        role: adminRole
                    });

                    let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                        body: JSON.stringify(record)
                    });

                    if (updateRes.ok) {
                        input.value = '';
                        activeCommentAudioBase64 = "";
                        loadForumData();
                    }
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء إضافة رد الأدمن.');
            }
        }

        // دوال إدارة وجلب رسائل دردشة الطلاب الجماعية المدمجة
        async function loadStudentChatData() {
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                let data = await res.json();
                let chatMessages = data.record.studentChatMessages || [];
                renderStudentChat(chatMessages);
            } catch (e) {
                console.error("خطأ في تحميل دردشة الطلاب:", e);
                document.getElementById('chatMessagesContainer').innerHTML = '<p style="text-align:center; color: red;">فشل تحميل رسائل الدردشة.</p>';
            }
        }

        function renderStudentChat(messages) {
            const container = document.getElementById('chatMessagesContainer');
            if (messages.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--card-text);">
                        <div style="font-size: 2.5rem; margin-bottom: 8px;">👥</div>
                        <p style="font-weight: bold;">لا توجد رسائل في دردشة الطلاب بعد</p>
                        <p style="font-size: 0.85rem; margin-top: 5px;">كن أول من يشارك زملاءه الحديث!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            messages.forEach((msg) => {
                let isMsgAdmin = msg.isAdmin || false;
                let msgDiv = document.createElement('div');
                msgDiv.className = `chat-message-item ${isMsgAdmin ? 'admin-msg' : ''}`;
                msgDiv.innerHTML = `
                    <div class="chat-msg-header">
                        <span class="chat-msg-author">${msg.authorName}</span>
                        <span class="chat-msg-time">${msg.date || ''}</span>
                    </div>
                    <div style="line-height: 1.5; word-break: break-word;">${msg.text}</div>
                `;
                container.appendChild(msgDiv);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function sendStudentChatMessage() {
            let input = document.getElementById('chatMessageInput');
            let text = input.value.trim();
            if (!text) return;

            let authorName = isUserAdmin ? (adminRole === 'master' ? 'محمد عماد (مؤسس المنصة)' : 'مشرف المنصة') : userData.fullName;
            let dateStr = new Date().toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' });

            let newMsg = {
                authorName: authorName,
                text: text,
                isAdmin: isUserAdmin,
                date: dateStr
            };

            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                let data = await res.json();
                let record = data.record;
                if (!record.studentChatMessages) record.studentChatMessages = [];

                record.studentChatMessages.push(newMsg);

                let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(record)
                });

                if (updateRes.ok) {
                    input.value = '';
                    loadStudentChatData();
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء إرسال الرسالة.');
            }
        }
    </script>
