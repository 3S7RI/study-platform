<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منتدى الأسئلة - منصة رحلة دراسية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s; }
        
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --navbar-bg: linear-gradient(135deg, #1e3c72, #2a5298);
            --card-bg: #ffffff;
            --card-text: #777;
            --welcome-h1: #1e3c72;
            --btn-bg: rgba(255, 255, 255, 0.15);
            --btn-border: rgba(255, 255, 255, 0.2);
            --input-bg: #fff;
            --input-border: #ccc;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --navbar-bg: linear-gradient(135deg, #0d1b2a, #1b263b);
            --card-bg: #1e1e1e;
            --card-text: #aaa;
            --welcome-h1: #ffffff;
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-border: rgba(255, 255, 255, 0.15);
            --input-bg: #2a2a2a;
            --input-border: #444;
        }

        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; user-select: none; }
        
        /* طبقة الحماية السوداء لمنع التصوير */
        #securityScreenOverlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000000; z-index: 999999; display: none;
            justify-content: center; align-items: center; color: #ff4d4d;
            font-size: 1.5rem; font-weight: bold; text-align: center; padding: 20px;
        }

        .navbar { 
            background: var(--navbar-bg); color: white; padding: 10px 15px; 
            display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        
        .back-home-btn {
            background: var(--btn-bg); border: 1px solid var(--btn-border); color: white; border-radius: 50%;
            cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; text-decoration: none;
        }
        .back-home-btn:hover { background: rgba(255, 255, 255, 0.25); }

        .navbar-title { font-size: 1.1rem; font-weight: bold; color: white; white-space: nowrap; justify-self: center; text-align: center; }

        .theme-toggle-btn { 
            background: var(--btn-bg); border: 1px solid var(--btn-border); color: white; border-radius: 50%; 
            cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; justify-self: end;
        }

        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; }

        .create-post-card {
            background: var(--card-bg); padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; border-top: 4px solid #8b5cf6;
        }
        .create-post-card h3 { margin-bottom: 12px; color: var(--welcome-h1); font-size: 1.2rem; }
        .create-post-card textarea {
            width: 100%; height: 90px; padding: 12px; border-radius: 8px;
            border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color);
            resize: none; font-size: 0.95rem; margin-bottom: 10px; outline: none;
        }
        
        .post-tools-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .media-upload-btns { display: flex; gap: 8px; }
        .media-btn {
            background: rgba(139, 92, 246, 0.1); border: 1px solid #8b5cf6; color: #8b5cf6;
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold;
            display: flex; align-items: center; gap: 5px;
        }
        .media-btn:hover { background: rgba(139, 92, 246, 0.2); }

        .post-submit-btn {
            background-color: #8b5cf6; color: white; border: none; padding: 10px 20px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.95rem;
        }
        .post-submit-btn:hover { opacity: 0.9; }

        .posts-feed { display: flex; flex-direction: column; gap: 20px; }
        .post-card {
            background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .post-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #333; }
        .post-author-info h4 { font-size: 0.95rem; color: var(--text-color); display: flex; align-items: center; gap: 5px; }
        .post-author-info span { font-size: 0.75rem; color: var(--card-text); }
        
        .post-content { font-size: 1rem; line-height: 1.6; margin-bottom: 12px; word-break: break-word; }
        .post-media-img { max-width: 100%; max-height: 300px; border-radius: 8px; margin-bottom: 12px; display: block; object-fit: contain; }
        .post-audio { width: 100%; margin-bottom: 12px; }

        .comments-section { border-top: 1px solid rgba(0,0,0,0.08); padding-top: 12px; margin-top: 10px; }
        .comment-item {
            background: rgba(0,0,0,0.02); padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 0.9rem;
        }
        .dark-mode .comment-item { background: rgba(255,255,255,0.03); }
        .comment-author { font-weight: bold; font-size: 0.85rem; color: #8b5cf6; margin-bottom: 2px; }
        
        .add-comment-box { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
        .add-comment-box input {
            flex: 1; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--input-border);
            background: var(--input-bg); color: var(--text-color); font-size: 0.9rem; outline: none;
        }
        .add-comment-box button {
            background: #2563eb; color: white; border: none; padding: 8px 15px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem;
        }
        .admin-only-notice {
            background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; text-align: center; margin-top: 8px; font-weight: bold;
        }
    </style>
</head>
<body id="pageBody">

    <div id="securityScreenOverlay">
        ⚠️ تنبيه أمني!<br>منع تصوير الشاشة أو أخذ لقطة مفعل لحماية حقوق المنصة.
    </div>

    <header class="navbar">
        <a href="main.html" class="back-home-btn" title="العودة للرئيسية">🏠</a>
        <div></div>
        <div class="navbar-title">💬 منتدى الأسئلة (خاص بالأدمن والطلاب)</div>
        <button id="themeToggleBtn" class="theme-toggle-btn" title="تغيير الوضع">🌙</button>
    </header>

    <div class="container">
        <!-- كارد النشر (يظهر للأدمن فقط أو للجميع حسب الرغبة، هنا متاح للجميع بالأسئلة والأدمن للرد) -->
        <div class="create-post-card">
            <h3 id="createPostTitle">اطرح سؤالك أو استفسارك الدراسي 💡</h3>
            <textarea id="postContentInput" placeholder="اكتب سؤالك بوضوح..."></textarea>
            
            <!-- زر رفع صورة وتسجيل فويس زي الواتساب -->
            <div class="post-tools-row">
                <div class="media-upload-btns">
                    <label class="media-btn" style="cursor: pointer;">
                        📷 رفع صورة <input type="file" id="postImageInput" accept="image/*" style="display: none;" onchange="previewPostImage(event)">
                    </label>
                    <button type="button" class="media-btn" id="recordVoiceBtn" onclick="toggleVoiceRecording()">🎙️ تسجيل فويس</button>
                </div>
                <span id="mediaStatusIndicator" style="font-size: 0.8rem; color: #10b981; font-weight: bold;"></span>
            </div>
            <div id="imagePreviewContainer" style="margin-bottom: 10px; display: none; position: relative;">
                <img id="imgPreviewTag" style="max-height: 120px; border-radius: 6px;">
                <button type="button" onclick="removeSelectedImage()" style="background: red; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 0.7rem; cursor: pointer; position: absolute; top: -5px; right: -5px;">✕</button>
            </div>

            <button class="post-submit-btn" onclick="createNewQuestionPost()">نشر السؤال في المنتدى 🚀</button>
        </div>

        <div id="postsFeed" class="posts-feed">
            <p style="text-align: center; color: var(--card-text);">جاري تحميل الأسئلة والمناقشات...</p>
        </div>
    </div>

    <script>
        const BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';

        const defaultMaleSvg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231e293b'/><circle cx='50' cy='38' r='18' fill='%2300a2ff'/><path d='M22 82c0-15.5 12.5-28 28-28s28 12.5 28 28' fill='%2300a2ff'/></svg>";

        const isLoggedIn = localStorage.getItem('isLoggedIn');
        const isAdminLoggedIn = sessionStorage.getItem('isAdminLoggedIn');

        if (isLoggedIn !== 'true' && isAdminLoggedIn !== 'true') {
            alert('يجب تسجيل الدخول أولاً!');
            window.location.href = 'index.html';
        }

        const userData = JSON.parse(localStorage.getItem('studentUser')) || {};
        const isUserAdmin = (isAdminLoggedIn === 'true');

        let selectedBase64Image = "";
        let recordedAudioBase64 = "";
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // الحماية السوداء ضد التصوير
        document.addEventListener('keydown', (e) => {
            if (e.key === 'PrintScreen' || (e.ctrlKey && e.key === 'p')) {
                e.preventDefault();
                document.getElementById('securityScreenOverlay').style.display = 'flex';
                setTimeout(() => { document.getElementById('securityScreenOverlay').style.display = 'none'; }, 3000);
            }
        });

        // الثيم المحفوظ
        const pageBody = document.getElementById('pageBody');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            pageBody.classList.add('dark-mode');
            themeToggleBtn.textContent = '☀️';
        }
        themeToggleBtn.addEventListener('click', function() {
            pageBody.classList.toggle('dark-mode');
            const isDark = pageBody.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggleBtn.textContent = isDark ? '☀️' : '🌙';
        });

        // معاينة الصورة المرفوعة
        function previewPostImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                selectedBase64Image = event.target.result;
                document.getElementById('imgPreviewTag').src = selectedBase64Image;
                document.getElementById('imagePreviewContainer').style.display = 'block';
                document.getElementById('mediaStatusIndicator').textContent = "تم إرفاق الصورة بنجاح ✅";
            };
            reader.readAsDataURL(file);
        }

        function removeSelectedImage() {
            selectedBase64Image = "";
            document.getElementById('imagePreviewContainer').style.display = 'none';
            document.getElementById('mediaStatusIndicator').textContent = "";
            document.getElementById('postImageInput').value = "";
        }

        // تسجيل الفويس (صوت زي الواتساب)
        async function toggleVoiceRecording() {
            const btn = document.getElementById('recordVoiceBtn');
            const status = document.getElementById('mediaStatusIndicator');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            recordedAudioBase64 = reader.result;
                            status.textContent = "تم تسجيل الفويس بنجاح 🎙️⚡";
                        };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.style.background = "#ef4444";
                    btn.style.color = "white";
                    btn.textContent = "⏹️ إيقاف التسجيل";
                    status.textContent = "جاري التسجيل... 🎙️";
                } catch (err) {
                    alert('يرجى السماح باستخدام الميكروفون لتسجيل الفويس!');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.style.background = "";
                btn.style.color = "";
                btn.textContent = "🎙️ تسجيل فويس";
            }
        }

        loadForumData();

        async function loadForumData() {
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                let data = await res.json();
                let forumPosts = data.record.forumPosts || [];
                renderPosts(forumPosts);
            } catch (e) {
                console.error("خطأ في جلب الأسئلة:", e);
                document.getElementById('postsFeed').innerHTML = '<p style="text-align:center; color: red;">فشل تحميل الأسئلة.</p>';
            }
        }

        function renderPosts(posts) {
            const feed = document.getElementById('postsFeed');
            if (posts.length === 0) {
                feed.innerHTML = '<p style="text-align: center; color: var(--card-text);">لا توجد أسئلة مطروحة حالياً..</p>';
                return;
            }

            feed.innerHTML = '';
            posts.slice().reverse().forEach((post, index) => {
                let realIndex = posts.length - 1 - index;
                let userImg = post.profileImage || defaultMaleSvg;

                let commentsHtml = '';
                if (post.comments && post.comments.length > 0) {
                    post.comments.forEach(c => {
                        commentsHtml += `
                            <div class="comment-item">
                                <div class="comment-author">${c.authorName} ${c.isAdmin ? '🛡️ (الأدمن)' : ''}</div>
                                <div>${c.text}</div>
                                ${c.audio ? `<audio controls class="post-audio" style="margin-top:5px;"><source src="${c.audio}" type="audio/webm"></audio>` : ''}
                            </div>
                        `;
                    });
                }

                // شرط الرد: الأدمن فقط هو من يمكنه الرد، أو إذا كان الطالب هو صاحب السؤال (حسب رغبتك في أن الأدمن فقط يرد)
                let commentBoxHtml = `
                    <div class="add-comment-box">
                        <input type="text" id="commentInput_${realIndex}" placeholder="${isUserAdmin ? 'اكتب رد الأدمن المعتمد...' : 'الردود مقتصرة على الأدمن فقط'}">
                        ${isUserAdmin ? `<button onclick="addAdminComment(${realIndex})">إرسال رد</button>` : ''}
                    </div>
                    ${!isUserAdmin ? `<div class="admin-only-notice">⚠️ عذراً، الرد على الأسئلة مخصص للأدمن فقط لضمان الإجابة النموذجية.</div>` : ''}
                `;

                let card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="post-header">
                        <img src="${userImg}" class="post-avatar" alt="صورة">
                        <div class="post-author-info">
                            <h4>${post.authorName}</h4>
                            <span>${post.date || 'منذ قليل'}</span>
                        </div>
                    </div>
                    <div class="post-content">${post.content}</div>
                    ${post.image ? `<img src="${post.image}" class="post-media-img">` : ''}
                    ${post.audio ? `<audio controls class="post-audio"><source src="${post.audio}" type="audio/webm"></audio>` : ''}
                    
                    <div class="comments-section">
                        <div id="commentsList_${realIndex}">${commentsHtml}</div>
                        ${commentBoxHtml}
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        async function createNewQuestionPost() {
            let content = document.getElementById('postContentInput').value.trim();
            if (!content && !selectedBase64Image && !recordedAudioBase64) {
                alert('الرجاء كتابة محتوى السؤال أو إرفاق صورة/تسجيل صوتي!');
                return;
            }

            let authorName = userData.fullName || (isUserAdmin ? 'الأدمن الرئيسي' : 'طالب');
            let profileImage = userData.profileImage || '';
            let dateStr = new Date().toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' });

            let newPost = {
                authorName: authorName,
                profileImage: profileImage,
                content: content,
                image: selectedBase64Image,
                audio: recordedAudioBase64,
                date: dateStr,
                comments: []
            };

            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                let data = await res.json();
                let record = data.record;
                if (!record.forumPosts) record.forumPosts = [];
                
                record.forumPosts.push(newPost);

                let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(record)
                });

                if (updateRes.ok) {
                    document.getElementById('postContentInput').value = '';
                    removeSelectedImage();
                    recordedAudioBase64 = "";
                    document.getElementById('mediaStatusIndicator').textContent = "";
                    loadForumData();
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء الاتصال بالسحابة.');
            }
        }

        async function addAdminComment(postIndex) {
            let input = document.getElementById(`commentInput_${postIndex}`);
            let text = input.value.trim();
            if (!text && !recordedAudioBase64) return;

            let authorName = isUserAdmin ? 'الأدمن (محمد عشري)' : (userData.fullName || 'أدمن');

            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                let data = await res.json();
                let record = data.record;

                if (record.forumPosts && record.forumPosts[postIndex]) {
                    if (!record.forumPosts[postIndex].comments) {
                        record.forumPosts[postIndex].comments = [];
                    }
                    record.forumPosts[postIndex].comments.push({
                        authorName: authorName,
                        text: text,
                        audio: recordedAudioBase64,
                        isAdmin: true
                    });

                    let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                        body: JSON.stringify(record)
                    });

                    if (updateRes.ok) {
                        input.value = '';
                        recordedAudioBase64 = "";
                        loadForumData();
                    }
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء إضافة رد الأدمن.');
            }
        }
    </script>
</body>
</html>
