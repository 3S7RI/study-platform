<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منتدى الأسئلة - منصة رحلة دراسية</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s; }
        
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --navbar-bg: linear-gradient(135deg, #1e3c72, #2a5298);
            --card-bg: #ffffff;
            --card-text: #777;
            --welcome-h1: #1e3c72;
            --btn-bg: rgba(255, 255, 255, 0.15);
            --btn-border: rgba(255, 255, 255, 0.2);
            --input-bg: #fff;
            --input-border: #ccc;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #e0e0e0;
            --navbar-bg: linear-gradient(135deg, #0d1b2a, #1b263b);
            --card-bg: #1e1e1e;
            --card-text: #aaa;
            --welcome-h1: #ffffff;
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-border: rgba(255, 255, 255, 0.15);
            --input-bg: #2a2a2a;
            --input-border: #444;
        }

        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; }

        .navbar { 
            background: var(--navbar-bg); color: white; padding: 10px 15px; 
            display: flex; justify-content: space-between; align-items: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
        }
        
        .back-home-btn {
            background: var(--btn-bg); border: 1px solid var(--btn-border); color: white; border-radius: 50%;
            cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; text-decoration: none;
        }
        .back-home-btn:hover { background: rgba(255, 255, 255, 0.25); }

        .navbar-title { font-size: 1.05rem; font-weight: bold; color: white; white-space: nowrap; text-align: center; flex: 1; margin: 0 10px; }

        .theme-toggle-btn { 
            background: var(--btn-bg); border: 1px solid var(--btn-border); color: white; border-radius: 50%; 
            cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; flex-shrink: 0;
        }

        .container { max-width: 600px; width: 100%; margin: 20px auto; padding: 0 15px; }

        .create-post-card {
            background: var(--card-bg); padding: 15px; border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; border-top: 4px solid #8b5cf6;
        }
        .create-post-card h3 { margin-bottom: 12px; color: var(--welcome-h1); font-size: 1.1rem; }
        .create-post-card textarea {
            width: 100%; height: 90px; padding: 12px; border-radius: 8px;
            border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-color);
            resize: none; font-size: 0.95rem; margin-bottom: 10px; outline: none;
        }
        
        .post-tools-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .media-upload-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        .media-btn {
            background: rgba(139, 92, 246, 0.1); border: 1px solid #8b5cf6; color: #8b5cf6;
            padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold;
            display: flex; align-items: center; gap: 5px;
        }
        .media-btn:hover { background: rgba(139, 92, 246, 0.2); }

        .post-submit-btn {
            background-color: #8b5cf6; color: white; border: none; padding: 10px 20px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.95rem; width: 100%;
            transition: background-color 0.3s; margin-top: 10px;
        }
        .post-submit-btn:hover { opacity: 0.9; }

        .posts-feed { display: flex; flex-direction: column; gap: 15px; }
        .post-card {
            background: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative;
        }
        
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .post-user-info-group { display: flex; align-items: center; gap: 12px; }
        .post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; background: #333; }
        .post-author-info h4 { font-size: 0.95rem; color: var(--text-color); display: flex; align-items: center; gap: 5px; }
        .post-author-info span { font-size: 0.75rem; color: var(--card-text); }
        
        .delete-post-btn {
            background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold;
            display: flex; align-items: center; gap: 4px; transition: background 0.2s;
        }
        .delete-post-btn:hover { background: rgba(239, 68, 68, 0.2); }

        .post-content { font-size: 1rem; line-height: 1.6; margin-bottom: 12px; word-break: break-word; }
        .post-media-img { max-width: 100%; max-height: 300px; border-radius: 8px; margin-bottom: 12px; display: block; object-fit: contain; }
        .post-audio { width: 100%; margin-bottom: 12px; }

        .comments-section { border-top: 1px solid rgba(0,0,0,0.08); padding-top: 12px; margin-top: 10px; }
        .comment-item {
            background: rgba(0,0,0,0.02); padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 0.9rem;
            border-right: 3px solid #8b5cf6;
        }
        .dark-mode .comment-item { background: rgba(255,255,255,0.03); }
        .comment-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .comment-author { font-weight: bold; font-size: 0.88rem; color: #8b5cf6; }
        
        .admin-badge-master { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; font-size: 0.7rem; padding: 2px 8px; border-radius: 6px; font-weight: bold; }
        .admin-badge-full { background: linear-gradient(135deg, #10b981, #059669); color: #fff; font-size: 0.7rem; padding: 2px 8px; border-radius: 6px; font-weight: bold; }
        .admin-badge-sub { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; font-size: 0.7rem; padding: 2px 8px; border-radius: 6px; font-weight: bold; }

        .add-comment-box { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
        .add-comment-box input {
            flex: 1; min-width: 150px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--input-border);
            background: var(--input-bg); color: var(--text-color); font-size: 0.9rem; outline: none;
        }
        .comment-tools { display: flex; gap: 5px; align-items: center; }
        .comment-mic-btn {
            background: rgba(139, 92, 246, 0.1); border: 1px solid #8b5cf6; color: #8b5cf6;
            padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold;
        }
        .add-comment-box button.send-btn {
            background: #2563eb; color: white; border: none; padding: 8px 15px;
            border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.85rem;
        }
        .admin-only-notice {
            background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; text-align: center; margin-top: 8px; font-weight: bold;
        }
    </style>
</head>
<body id="pageBody">

    <header class="navbar">
        <a href="main.html" class="back-home-btn" title="العودة للرئيسية">🏠</a>
        <div class="navbar-title">منتدى الأسئلة 💬</div>
        <button id="themeToggleBtn" class="theme-toggle-btn" title="تغيير الوضع">🌙</button>
    </header>

    <div class="container">
        <div class="create-post-card">
            <h3 id="createPostTitle">اطرح سؤالك أو استفسارك الدراسي 💡</h3>
            <textarea id="postContentInput" placeholder="اكتب سؤالك بوضوح..."></textarea>
            
            <div class="post-tools-row">
                <div class="media-upload-btns">
                    <label class="media-btn" style="cursor: pointer;">
                        📷 رفع صورة <input type="file" id="postImageInput" accept="image/*" style="display: none;" onchange="previewPostImage(event)">
                    </label>
                    <button type="button" class="media-btn" id="recordVoiceBtn" onclick="toggleVoiceRecording()">🎙️ تسجيل فويس</button>
                </div>
                <span id="mediaStatusIndicator" style="font-size: 0.8rem; color: #10b981; font-weight: bold;"></span>
            </div>
            
            <div id="imagePreviewContainer" style="margin-bottom: 10px; display: none; position: relative;">
                <img id="imgPreviewTag" style="max-height: 120px; border-radius: 6px;">
                <button type="button" onclick="removeSelectedImage()" style="background: red; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 0.7rem; cursor: pointer; position: absolute; top: -5px; right: -5px;">✕</button>
            </div>

            <button class="post-submit-btn" id="postSubmitBtn" onclick="handlePostSubmitAction()">نشر السؤال بالوسائط المرفقة 🚀</button>
        </div>

        <div id="postsFeed" class="posts-feed">
            <p style="text-align: center; color: var(--card-text);">جاري تحميل الأسئلة والمناقشات...</p>
        </div>
        
        <div style="text-align: center; margin-top: 30px; font-size: 0.8rem; color: var(--card-text);">
            جميع الحقوق محفوظة للمهندس/مؤسس المنصة <strong>محمد عماد محمد (عشري)</strong> © 2026 - رحلة دراسية
        </div>
    </div>

    <script>
        const BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';

        const defaultMaleSvg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231e293b'/><circle cx='50' cy='38' r='18' fill='%2300a2ff'/><path d='M22 82c0-15.5 12.5-28 28-28s28 12.5 28 28' fill='%2300a2ff'/></svg>";

        // تم إلغاء كود الطرد (redirect) تماماً لراحة الطالب وأصبحت الصفحة تفتح بسلاسة تامة دون شروط مزعجة
        const userData = JSON.parse(localStorage.getItem('studentUser')) || { fullName: 'طالب المنصة' };
        const isAdminLoggedIn = sessionStorage.getItem('isAdminLoggedIn') === 'true';
        const adminRole = sessionStorage.getItem('adminRole') || 'sub';
        const isUserAdmin = isAdminLoggedIn;

        let selectedBase64Image = "";
        let recordedAudioBase64 = "";
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        let activeCommentRecorder = null;
        let activeCommentChunks = [];
        let activeCommentAudioBase64 = "";

        const pageBody = document.getElementById('pageBody');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            pageBody.classList.add('dark-mode');
            themeToggleBtn.textContent = '☀️';
        }
        themeToggleBtn.addEventListener('click', function() {
            pageBody.classList.toggle('dark-mode');
            const isDark = pageBody.classList.contains('dark-mode');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            themeToggleBtn.textContent = isDark ? '☀️' : '🌙';
        });

        function previewPostImage(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                selectedBase64Image = event.target.result;
                document.getElementById('imgPreviewTag').src = selectedBase64Image;
                document.getElementById('imagePreviewContainer').style.display = 'block';
                updateStatusText();
            };
            reader.readAsDataURL(file);
        }

        function removeSelectedImage() {
            selectedBase64Image = "";
            document.getElementById('imagePreviewContainer').style.display = 'none';
            document.getElementById('postImageInput').value = "";
            updateStatusText();
        }

        async function toggleVoiceRecording() {
            const btn = document.getElementById('recordVoiceBtn');
            const status = document.getElementById('mediaStatusIndicator');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            recordedAudioBase64 = reader.result;
                            updateStatusText();
                        };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.style.background = "#ef4444";
                    btn.style.color = "white";
                    btn.textContent = "⏹️ إيقاف التسجيل";
                    status.textContent = "جاري تسجيل الصوت الآن... 🎙️";
                } catch (err) {
                    alert('يرجى السماح باستخدام الميكروفون لتسجيل الفويس!');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.style.background = "";
                btn.style.color = "";
                btn.textContent = "🎙️ تسجيل فويس";
                updateStatusText();
            }
        }

        function updateStatusText() {
            let parts = [];
            if (selectedBase64Image) parts.push("📷 صورة");
            if (recordedAudioBase64) parts.push("🎙️ صوت");
            const status = document.getElementById('mediaStatusIndicator');
            status.textContent = parts.length > 0 ? `المرفقات الحالية: ${parts.join(' + ')} جاهزة ✅` : "";
        }

        function handlePostSubmitAction() {
            if (isRecording && mediaRecorder) {
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = async () => {
                        recordedAudioBase64 = reader.result;
                        isRecording = false;
                        const btn = document.getElementById('recordVoiceBtn');
                        btn.style.background = "";
                        btn.style.color = "";
                        btn.textContent = "🎙️ تسجيل فويس";
                        await createNewQuestionPost();
                    };
                };
                mediaRecorder.stop();
            } else {
                createNewQuestionPost();
            }
        }

        loadForumData();

        async function loadForumData() {
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                let data = await res.json();
                let forumPosts = data.record.forumPosts || [];
                renderPosts(forumPosts);
            } catch (e) {
                console.error("خطأ في جلب الأسئلة:", e);
                document.getElementById('postsFeed').innerHTML = '<p style="text-align:center; color: red;">فشل تحميل الأسئلة.</p>';
            }
        }

        function renderPosts(posts) {
            const feed = document.getElementById('postsFeed');
            if (posts.length === 0) {
                feed.innerHTML = '<p style="text-align: center; color: var(--card-text);">لا توجد أسئلة مطروحة حالياً..</p>';
                return;
            }

            feed.innerHTML = '';
            posts.slice().reverse().forEach((post, index) => {
                let realIndex = posts.length - 1 - index;
                let userImg = post.profileImage || defaultMaleSvg;
                let canDelete = isUserAdmin || (userData.fullName && post.authorName === userData.fullName);

                let commentsHtml = '';
                if (post.comments && post.comments.length > 0) {
                    post.comments.forEach(c => {
                        let badgeHtml = '';
                        if (c.isAdmin) {
                            if (c.role === 'master') {
                                badgeHtml = `<span class="admin-badge-master">⚡ مطور رئيسي موثق</span>`;
                            } else if (c.role === 'full') {
                                badgeHtml = `<span class="admin-badge-full">🛡️ مشرف عام متحكم</span>`;
                            } else {
                                badgeHtml = `<span class="admin-badge-sub">📌 مشرف موثق</span>`;
                            }
                        }

                        commentsHtml += `
                            <div class="comment-item">
                                <div class="comment-header-row">
                                    <span class="comment-author">${c.authorName}</span>
                                    ${badgeHtml}
                                </div>
                                <div style="margin-top: 4px;">${c.text}</div>
                                ${c.audio ? `<audio controls class="post-audio" style="margin-top:6px;"><source src="${c.audio}" type="audio/webm"></audio>` : ''}
                            </div>
                        `;
                    });
                }

                let commentBoxHtml = `
                    <div class="add-comment-box">
                        <input type="text" id="commentInput_${realIndex}" placeholder="${isUserAdmin ? 'اكتب رد الأدمن المعتمد...' : 'الردود مقتصرة على الأدمن فقط'}">
                        ${isUserAdmin ? `
                            <div class="comment-tools">
                                <button type="button" class="comment-mic-btn" id="commentMicBtn_${realIndex}" onclick="toggleCommentVoiceRecording(${realIndex})" title="تسجيل صوت للرد">🎙️</button>
                                <button type="button" class="send-btn" onclick="submitAdminCommentAction(${realIndex})">إرسال</button>
                            </div>
                        ` : ''}
                    </div>
                    ${!isUserAdmin ? `<div class="admin-only-notice">⚠️ عذراً، الرد على الأسئلة مخصص للأدمن فقط لضمان الإجابة النموذجية.</div>` : ''}
                `;

                let card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="post-header">
                        <div class="post-user-info-group">
                            <img src="${userImg}" class="post-avatar" alt="صورة">
                            <div class="post-author-info">
                                <h4>${post.authorName}</h4>
                                <span>${post.date || 'منذ قليل'}</span>
                            </div>
                        </div>
                        ${canDelete ? `<button class="delete-post-btn" onclick="deleteQuestionPost(${realIndex})">🗑️ حذف</button>` : ''}
                    </div>
                    ${post.content ? `<div class="post-content">${post.content}</div>` : ''}
                    ${post.image ? `<img src="${post.image}" class="post-media-img">` : ''}
                    ${post.audio ? `<audio controls class="post-audio"><source src="${post.audio}" type="audio/webm"></audio>` : ''}
                    
                    <div class="comments-section">
                        <div id="commentsList_${realIndex}">${commentsHtml}</div>
                        ${commentBoxHtml}
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        async function toggleCommentVoiceRecording(postIndex) {
            const btn = document.getElementById(`commentMicBtn_${postIndex}`);

            if (!activeCommentRecorder || activeCommentRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    activeCommentRecorder = new MediaRecorder(stream);
                    activeCommentChunks = [];

                    activeCommentRecorder.ondataavailable = e => activeCommentChunks.push(e.data);
                    activeCommentRecorder.onstop = () => {
                        const audioBlob = new Blob(activeCommentChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            activeCommentAudioBase64 = reader.result;
                        };
                    };

                    activeCommentRecorder.start();
                    btn.style.background = "#ef4444";
                    btn.style.color = "white";
                    btn.textContent = "⏹️";
                } catch (err) {
                    alert('يرجى السماح باستخدام الميكروفون!');
                }
            } else {
                activeCommentRecorder.stop();
                btn.style.background = "";
                btn.style.color = "";
                btn.textContent = "🎙️";
            }
        }

        function submitAdminCommentAction(postIndex) {
            if (activeCommentRecorder && activeCommentRecorder.state === "recording") {
                activeCommentRecorder.onstop = async () => {
                    const audioBlob = new Blob(activeCommentChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = async () => {
                        activeCommentAudioBase64 = reader.result;
                        await addAdminComment(postIndex);
                    };
                };
                activeCommentRecorder.stop();
            } else {
                addAdminComment(postIndex);
            }
        }

        async function createNewQuestionPost() {
            let content = document.getElementById('postContentInput').value.trim();
            if (!content && !selectedBase64Image && !recordedAudioBase64) {
                alert('الرجاء كتابة محتوى السؤال أو إرفاق صورة أو تسجيل صوتي!');
                return;
            }

            let authorName = userData.fullName || (isUserAdmin ? 'الأدمن الرئيسي' : 'طالب المنصة');
            let profileImage = userData.profileImage || '';
            let dateStr = new Date().toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' });

            let newPost = {
                authorName: authorName,
                profileImage: profileImage,
                content: content,
                image: selectedBase64Image,
                audio: recordedAudioBase64,
                date: dateStr,
                comments: []
            };

            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                let data = await res.json();
                let record = data.record;
                if (!record.forumPosts) record.forumPosts = [];
                
                record.forumPosts.push(newPost);

                let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(record)
                });

                if (updateRes.ok) {
                    document.getElementById('postContentInput').value = '';
                    removeSelectedImage();
                    recordedAudioBase64 = "";
                    document.getElementById('mediaStatusIndicator').textContent = "";
                    loadForumData();
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء الاتصال بالسحابة وحفظ السؤال.');
            }
        }

        async function deleteQuestionPost(index) {
            if (!confirm('هل أنت متأكد من حذف هذا السؤال؟')) return;

            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                let data = await res.json();
                let record = data.record;

                if (record.forumPosts && record.forumPosts[index]) {
                    record.forumPosts.splice(index, 1);

                    let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                        body: JSON.stringify(record)
                    });

                    if (updateRes.ok) {
                        loadForumData();
                    }
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء حذف السؤال.');
            }
        }

        async function addAdminComment(postIndex) {
            let input = document.getElementById(`commentInput_${postIndex}`);
            let text = input.value.trim();
            if (!text && !activeCommentAudioBase64) return;

            let authorName = adminRole === 'master' ? 'محمد عماد (مؤسس المنصة)' : 'مشرف المنصة';

            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                let data = await res.json();
                let record = data.record;

                if (record.forumPosts && record.forumPosts[postIndex]) {
                    if (!record.forumPosts[postIndex].comments) {
                        record.forumPosts[postIndex].comments = [];
                    }
                    record.forumPosts[postIndex].comments.push({
                        authorName: authorName,
                        text: text,
                        audio: activeCommentAudioBase64,
                        isAdmin: true,
                        role: adminRole
                    });

                    let updateRes = await prefixFetchJsonBin(record); // استبدال مباشر لضمان نجاح الحفظ
                    // حفظ سحابي عادي:
                    let updateResDirect = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                        body: JSON.stringify(record)
                    });

                    if (updateResDirect.ok) {
                        input.value = '';
                        activeCommentAudioBase64 = "";
                        loadForumData();
                    }
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء إضافة رد الأدمن.');
            }
        }
    </script>
