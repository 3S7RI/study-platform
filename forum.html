<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - منتدى الأسئلة والماستر 💬</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            --th-bg: rgba(255, 255, 255, 0.03);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.05);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
            --th-bg: rgba(0, 0, 0, 0.02);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding: 15px; }
        .container { max-width: 800px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        .header-right-side { display: flex; align-items: center; gap: 10px; }
        .btn-home-link {
            display: inline-flex; align-items: center; gap: 5px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .platform-title-box { font-size: 0.95rem; font-weight: 700; color: var(--text-main); }

        .btn-theme-toggle {
            background-color: var(--th-bg); color: var(--text-main); border: 1px solid var(--border-color);
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
        }
        .btn-theme-toggle:hover { background-color: var(--hover-bg); border-color: var(--primary); }

        .create-post-card {
            background: var(--bg-card); padding: 20px; border-radius: 16px;
            box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid var(--border-color);
            border-top: 4px solid var(--primary);
        }
        .create-post-card textarea {
            width: 100%; height: 95px; padding: 12px; border-radius: 10px;
            border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main);
            resize: none; font-size: 0.9rem; margin-bottom: 12px; outline: none;
        }
        .create-post-card textarea:focus { border-color: var(--primary); }
        
        .post-tools-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .media-upload-btns { display: flex; gap: 8px; flex-wrap: wrap; }
        
        /* أزرار الرفع والتسجيل البسيطة والشيك */
        .media-btn {
            background: var(--th-bg); border: 1px solid var(--border-color); color: var(--text-main);
            padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .media-btn:hover { background: var(--hover-bg); border-color: var(--primary); color: var(--primary); }

        .post-submit-btn {
            background-color: var(--primary); color: white; border: none; padding: 10px 18px;
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; width: 100%;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .post-submit-btn:hover { background-color: var(--primary-hover); }

        .posts-feed { display: flex; flex-direction: column; gap: 15px; }
        .post-card {
            background: var(--bg-card); padding: 18px; border-radius: 16px; box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }
        
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .post-user-info-group { display: flex; align-items: center; gap: 10px; }
        .post-avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #1e293b; border: 2px solid var(--primary); }
        
        .post-author-info h4 { font-size: 0.92rem; color: var(--text-main); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        
        /* شارة المستوى والنقاط الصغيرة بجانب اسم الطالب */
        .student-meta-badge { 
            background: rgba(99, 102, 241, 0.12); color: var(--primary); font-size: 0.72rem; 
            padding: 2px 7px; border-radius: 6px; font-weight: bold; border: 1px solid var(--border-color); 
            display: inline-flex; align-items: center; gap: 4px;
        }
        .post-author-info span { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; display: block; }
        
        .delete-post-btn {
            background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; font-weight: bold;
        }
        .delete-post-btn:hover { background: var(--danger); color: white; }

        .post-content { font-size: 0.9rem; line-height: 1.6; margin-bottom: 12px; word-break: break-word; color: var(--text-main); }
        .post-media-img { max-width: 100%; max-height: 280px; border-radius: 8px; margin-bottom: 10px; display: block; object-fit: contain; }
        .post-audio { width: 100%; margin-bottom: 10px; border-radius: 6px; height: 36px; }

        .comments-section { border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 10px; }
        .comment-item {
            background: var(--th-bg); padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; font-size: 0.85rem;
            border-right: 3px solid var(--primary); border: 1px solid var(--border-color);
        }
        .comment-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .comment-author { font-weight: bold; font-size: 0.85rem; color: var(--primary); }
        
        .admin-badge-master { background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; font-size: 0.68rem; padding: 2px 6px; border-radius: 5px; font-weight: bold; }
        .admin-badge-full { background: linear-gradient(135deg, #10b981, #059669); color: #fff; font-size: 0.68rem; padding: 2px 6px; border-radius: 5px; font-weight: bold; }
        .admin-badge-sub { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff; font-size: 0.68rem; padding: 2px 6px; border-radius: 5px; font-weight: bold; }

        .add-comment-box { display: flex; gap: 6px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
        .add-comment-box input {
            flex: 1; min-width: 140px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-main); color: var(--text-main); font-size: 0.85rem; outline: none;
        }
        .add-comment-box input:focus { border-color: var(--primary); }
        .comment-tools { display: flex; gap: 4px; align-items: center; }
        .comment-mic-btn {
            background: var(--th-bg); border: 1px solid var(--border-color); color: var(--primary);
            padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: bold;
        }
        .add-comment-box button.send-btn {
            background: var(--primary); color: white; border: none; padding: 8px 14px;
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.85rem;
        }
        footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 0.78rem; border-top: 1px solid var(--border-color); margin-top: 30px; }
    </style>
</head>
<body id="pageBody" data-theme="dark">

    <div class="container">
        <header class="platform-header">
            <div class="header-right-side">
                <a href="main.html" class="btn-home-link" title="العودة للرئيسية">🏠 الرئيسية</a>
            </div>
            <div class="platform-title-box">منتدى الأسئلة والماستر 💬</div>
            <button id="themeToggleBtn" class="btn-theme-toggle" title="تغيير الوضع">☀️</button>
        </header>

        <div class="create-post-card">
            <textarea id="postContentInput" placeholder="اكتب سؤالك أو استفسارك الدراسي بوضوح تام..."></textarea>
            
            <div class="post-tools-row">
                <div class="media-upload-btns">
                    <label class="media-btn">
                        📷 صورة <input type="file" id="postImageInput" accept="image/*" style="display: none;" onchange="previewPostImage(event)">
                    </label>
                    <button type="button" class="media-btn" id="recordVoiceBtn" onclick="toggleVoiceRecording()">🎙️ فويس</button>
                </div>
                <span id="mediaStatusIndicator" style="font-size: 0.8rem; color: var(--success); font-weight: bold;"></span>
            </div>
            
            <div id="imagePreviewContainer" style="margin-bottom: 12px; display: none; position: relative; width: fit-content;">
                <img id="imgPreviewTag" style="max-height: 110px; border-radius: 8px; border: 1px solid var(--primary);">
                <button type="button" onclick="removeSelectedImage()" style="background: var(--danger); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 0.7rem; cursor: pointer; position: absolute; top: -6px; right: -6px; display: flex; align-items: center; justify-content: center;">✕</button>
            </div>

            <button class="post-submit-btn" id="postSubmitBtn" onclick="handlePostSubmitAction()">نشر السؤال في المنتدى 🚀</button>
        </div>

        <div id="postsFeed" class="posts-feed">
            <div style="text-align: center; padding: 40px; background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--shadow);">
                <div style="font-size: 2.2rem; margin-bottom: 10px;">⏳</div>
                <p style="color: var(--text-muted); font-weight: bold; font-size: 0.85rem;">جاري تحميل الأسئلة والمناقشات...</p>
            </div>
        </div>
        
        <footer>
            منصة رحلة دراسية التعليمية © 2026 - جميع الحقوق محفوظة للمؤسس <strong>محمد عماد (عشري)</strong>
        </footer>
    </div>

    <!-- Firebase SDK (Modular v10) & JSONBin Integration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';
        const defaultMaleSvg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231e293b'/><circle cx='50' cy='38' r='18' fill='%2300a2ff'/><path d='M22 82c0-15.5 12.5-28 28-28s28 12.5 28 28' fill='%2300a2ff'/></svg>";

        let currentStudentName = "طالب المنصة";
        let currentStudentLevel = "الثانوية العامة";
        let currentStudentPoints = 0;
        let currentStudentImage = defaultMaleSvg;

        const isAdminLoggedIn = sessionStorage.getItem('isAdminLoggedIn') === 'true';
        const adminRole = sessionStorage.getItem('adminRole') || 'sub';
        const isUserAdmin = isAdminLoggedIn;

        let selectedBase64Image = "";
        let recordedAudioBase64 = "";
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        let activeCommentRecorder = null;
        let activeCommentChunks = [];
        let activeCommentAudioBase64 = "";

        // جلب بيانات الطالب الحقيقية من فايربيز أو التخزين المحلي لضمان ظهور مستواه ونقاطه بدقة
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    let docSnap = await getDoc(doc(db, "students", user.uid));
                    if (docSnap.exists()) {
                        let data = docSnap.data();
                        currentStudentName = data.name || data.fullName || user.displayName || 'طالب المنصة';
                        currentStudentLevel = data.level || data.educationalLevel || 'الثانوية العامة';
                        currentStudentPoints = data.points || 0;
                        currentStudentImage = data.profileImage || defaultMaleSvg;
                    }
                } catch(e) {
                    const cached = JSON.parse(localStorage.getItem('studentUser')) || {};
                    currentStudentName = cached.fullName || cached.name || 'طالب المنصة';
                    currentStudentLevel = cached.level || 'الثانوية العامة';
                    currentStudentPoints = cached.points || 0;
                    currentStudentImage = cached.profileImage || defaultMaleSvg;
                }
            }
            loadForumData();
        });

        // ثيم المنصة
        const bodyElement = document.body;
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const savedTheme = localStorage.getItem('platform_theme') || 'dark';
        bodyElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            let nextTheme = bodyElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            bodyElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('platform_theme', nextTheme);
            themeToggleBtn.textContent = nextTheme === 'dark' ? '☀️' : '🌙';
        });

        window.previewPostImage = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                selectedBase64Image = event.target.result;
                document.getElementById('imgPreviewTag').src = selectedBase64Image;
                document.getElementById('imagePreviewContainer').style.display = 'block';
                updateStatusText();
            };
            reader.readAsDataURL(file);
        };

        window.removeSelectedImage = function() {
            selectedBase64Image = "";
            document.getElementById('imagePreviewContainer').style.display = 'none';
            document.getElementById('postImageInput').value = "";
            updateStatusText();
        };

        window.toggleVoiceRecording = async function() {
            const btn = document.getElementById('recordVoiceBtn');
            const status = document.getElementById('mediaStatusIndicator');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            recordedAudioBase64 = reader.result;
                            updateStatusText();
                        };
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    btn.style.background = "var(--danger)";
                    btn.style.color = "white";
                    btn.textContent = "⏹️ إيقاف";
                    status.textContent = "جاري تسجيل الصوت... 🎙️";
                } catch (err) {
                    alert('يرجى السماح باستخدام الميكروفون لتسجيل الفويس!');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.style.background = "";
                btn.style.color = "";
                btn.textContent = "🎙️ فويس";
                updateStatusText();
            }
        };

        function updateStatusText() {
            let parts = [];
            if (selectedBase64Image) parts.push("📷 صورة");
            if (recordedAudioBase64) parts.push("🎙️ صوت");
            const status = document.getElementById('mediaStatusIndicator');
            status.textContent = parts.length > 0 ? `المرفقات: ${parts.join(' + ')} ✅` : "";
        }

        window.handlePostSubmitAction = function() {
            if (isRecording && mediaRecorder) {
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = async () => {
                        recordedAudioBase64 = reader.result;
                        isRecording = false;
                        await createNewQuestionPost();
                    };
                };
                mediaRecorder.stop();
            } else {
                createNewQuestionPost();
            }
        };

        async function loadForumData() {
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                let data = await res.json();
                let forumPosts = data.record.forumPosts || [];
                renderPosts(forumPosts);
            } catch (e) {
                console.error("خطأ في جلب الأسئلة:", e);
                document.getElementById('postsFeed').innerHTML = '<p style="text-align:center; color: var(--danger);">فشل تحميل الأسئلة من السحابة.</p>';
            }
        }

        function renderPosts(posts) {
            const feed = document.getElementById('postsFeed');
            if (posts.length === 0) {
                feed.innerHTML = `
                    <div style="text-align: center; padding: 35px; background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--shadow);">
                        <div style="font-size: 2.5rem; margin-bottom: 8px;">💬</div>
                        <h3 style="color: var(--text-main); margin-bottom: 4px; font-size: 1rem;">لا توجد أسئلة مطروحة حالياً</h3>
                        <p style="color: var(--text-muted); font-size: 0.82rem;">كن أول من يطرح سؤالاً دراسياً في المنتدى!</p>
                    </div>
                `;
                return;
            }

            feed.innerHTML = '';
            posts.slice().reverse().forEach((post, index) => {
                let realIndex = posts.length - 1 - index;
                let userImg = post.profileImage || defaultMaleSvg;
                let canDelete = isUserAdmin || (currentStudentName && post.authorName === currentStudentName);

                let commentsHtml = '';
                if (post.comments && post.comments.length > 0) {
                    post.comments.forEach(c => {
                        let badgeHtml = '';
                        if (c.isAdmin) {
                            if (c.role === 'master') {
                                badgeHtml = `<span class="admin-badge-master">⚡ مطور رئيسي موثق</span>`;
                            } else if (c.role === 'full') {
                                badgeHtml = `<span class="admin-badge-full">🛡️ مشرف عام متحكم</span>`;
                            } else {
                                badgeHtml = `<span class="admin-badge-sub">📌 مشرف موثق</span>`;
                            }
                        }

                        commentsHtml += `
                            <div class="comment-item">
                                <div class="comment-header-row">
                                    <span class="comment-author">${c.authorName}</span>
                                    ${badgeHtml}
                                </div>
                                <div style="margin-top: 4px; line-height: 1.5; color: var(--text-main);">${c.text}</div>
                                ${c.audio ? `<audio controls class="post-audio" style="margin-top:6px;"><source src="${c.audio}" type="audio/webm"></audio>` : ''}
                            </div>
                        `;
                    });
                }

                let commentBoxHtml = `
                    <div class="add-comment-box">
                        <input type="text" id="commentInput_${realIndex}" placeholder="${isUserAdmin ? 'اكتب رد الأدمن المعتمد...' : 'الردود مقتصرة على الأدمن فقط'}">
                        ${isUserAdmin ? `
                            <div class="comment-tools">
                                <button type="button" class="comment-mic-btn" id="commentMicBtn_${realIndex}" onclick="toggleCommentVoiceRecording(${realIndex})" title="تسجيل صوت للرد">🎙️</button>
                                <button type="button" class="send-btn" onclick="submitAdminCommentAction(${realIndex})">إرسال</button>
                            </div>
                        ` : ''}
                    </div>
                `;

                let card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="post-header">
                        <div class="post-user-info-group">
                            <img src="${userImg}" class="post-avatar" alt="صورة">
                            <div class="post-author-info">
                                <h4>
                                    ${post.authorName} 
                                    <span class="student-meta-badge">🎓 ${post.studentLevel || 'عام'} | ⭐ ${post.studentPoints || 0} نقطة</span>
                                </h4>
                                <span>${post.date || 'منذ قليل'}</span>
                            </div>
                        </div>
                        ${canDelete ? `<button class="delete-post-btn" onclick="deleteQuestionPost(${realIndex})">🗑️ حذف</button>` : ''}
                    </div>
                    ${post.content ? `<div class="post-content">${post.content}</div>` : ''}
                    ${post.image ? `<img src="${post.image}" class="post-media-img">` : ''}
                    ${post.audio ? `<audio controls class="post-audio"><source src="${post.audio}" type="audio/webm"></audio>` : ''}
                    
                    <div class="comments-section">
                        <div id="commentsList_${realIndex}">${commentsHtml}</div>
                        ${commentBoxHtml}
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        window.toggleCommentVoiceRecording = async function(postIndex) {
            const btn = document.getElementById(`commentMicBtn_${postIndex}`);

            if (!activeCommentRecorder || activeCommentRecorder.state === "inactive") {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    activeCommentRecorder = new MediaRecorder(stream);
                    activeCommentChunks = [];

                    activeCommentRecorder.ondataavailable = e => activeCommentChunks.push(e.data);
                    activeCommentRecorder.onstop = () => {
                        const audioBlob = new Blob(activeCommentChunks, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = () => {
                            activeCommentAudioBase64 = reader.result;
                        };
                    };

                    activeCommentRecorder.start();
                    btn.style.background = "var(--danger)";
                    btn.style.color = "white";
                    btn.textContent = "⏹️";
                } catch (err) {
                    alert('يرجى السماح باستخدام الميكروفون!');
                }
            } else {
                activeCommentRecorder.stop();
                btn.style.background = "";
                btn.style.color = "";
                btn.textContent = "🎙️";
            }
        };

        window.submitAdminCommentAction = function(postIndex) {
            if (activeCommentRecorder && activeCommentRecorder.state === "recording") {
                activeCommentRecorder.onstop = async () => {
                    const audioBlob = new Blob(activeCommentChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = async () => {
                        activeCommentAudioBase64 = reader.result;
                        await addAdminComment(postIndex);
                    };
                };
                activeCommentRecorder.stop();
            } else {
                addAdminComment(postIndex);
            }
        };

        async function createNewQuestionPost() {
            let content = document.getElementById('postContentInput').value.trim();
            if (!content && !selectedBase64Image && !recordedAudioBase64) {
                alert('الرجاء كتابة محتوى السؤال أو إرفاق صورة أو تسجيل صوتي!');
                return;
            }

            let dateStr = new Date().toLocaleString('ar-EG', { dateStyle: 'short', timeStyle: 'short' });

            let newPost = {
                authorName: currentStudentName,
                studentLevel: currentStudentLevel,
                studentPoints: currentStudentPoints,
                profileImage: currentStudentImage,
                content: content,
                image: selectedBase64Image,
                audio: recordedAudioBase64,
                date: dateStr,
                comments: []
            };

            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                let data = await res.json();
                let record = data.record;
                if (!record.forumPosts) record.forumPosts = [];
                
                record.forumPosts.push(newPost);

                let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                    body: JSON.stringify(record)
                });

                if (updateRes.ok) {
                    document.getElementById('postContentInput').value = '';
                    removeSelectedImage();
                    recordedAudioBase64 = "";
                    document.getElementById('mediaStatusIndicator').textContent = "";
                    loadForumData();
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء الاتصال بالسحابة وحفظ السؤال.');
            }
        }

        window.deleteQuestionPost = async function(index) {
            if (!confirm('هل أنت متأكد من حذف هذا السؤال؟')) return;

            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                let data = await res.json();
                let record = data.record;

                if (record.forumPosts && record.forumPosts[index]) {
                    record.forumPosts.splice(index, 1);

                    let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                        body: JSON.stringify(record)
                    });

                    if (updateRes.ok) {
                        loadForumData();
                    }
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء حذف السؤال.');
            }
        };

        async function addAdminComment(postIndex) {
            let input = document.getElementById(`commentInput_${postIndex}`);
            let text = input.value.trim();
            if (!text && !activeCommentAudioBase64) return;

            let authorName = adminRole === 'master' ? 'محمد عماد (مؤسس المنصة ⚡)' : 'مشرف المنصة المعتمد 🛡️';

            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': API_KEY, 'X-Access-Key': API_KEY }
                });
                let data = await res.json();
                let record = data.record;

                if (record.forumPosts && record.forumPosts[postIndex]) {
                    if (!record.forumPosts[postIndex].comments) {
                        record.forumPosts[postIndex].comments = [];
                    }
                    record.forumPosts.push; // safe-guard
                    record.forumPosts[postIndex].comments.push({
                        authorName: authorName,
                        text: text,
                        audio: activeCommentAudioBase64,
                        isAdmin: true,
                        role: adminRole
                    });

                    let updateRes = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'X-Master-Key': API_KEY },
                        body: JSON.stringify(record)
                    });

                    if (updateRes.ok) {
                        input.value = '';
                        activeCommentAudioBase64 = "";
                        loadForumData();
                    }
                }
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء إضافة رد الأدمن.');
            }
        }
    </script>
</body>
</html>
