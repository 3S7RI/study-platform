<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - قناة الدردشة</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --navbar-bg: rgba(15, 23, 42, 0.9);
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --bubble-me: #4f46e5;
            --bubble-other: rgba(51, 65, 85, 0.7);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-border: rgba(255, 255, 255, 0.15);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #e0e7ff, #f3e8ff, #f1f5f9);
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --navbar-bg: rgba(255, 255, 255, 0.9);
            --input-bg: #f8fafc;
            --input-border: #cbd5e1;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --bubble-me: #6366f1;
            --bubble-other: #e2e8f0;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            --btn-bg: rgba(0, 0, 0, 0.05);
            --btn-border: rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s, border-color 0.3s; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
        }

        /* الهيدر العلوي */
        .chat-header-nav {
            background: var(--navbar-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 12px 20px;
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            width: 100%;
            max-width: 900px;
            border-radius: 18px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .header-right-group {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-self: start;
        }

        .home-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            white-space: nowrap;
        }
        .home-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .chat-main-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-main);
            justify-self: center;
            text-align: center;
            white-space: nowrap;
        }

        .header-actions-left {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-self: end;
        }

        .header-icon-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-main);
            border-radius: 50%;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            padding: 0;
        }
        .header-icon-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .header-settings-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-main);
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 10px;
        }
        .header-settings-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* حاوية الشات الرئيسية */
        .chat-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            width: 100%;
            max-width: 900px;
            height: calc(85vh - 20px);
            border-radius: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* شريط نواة الطاقة (الاستريك) ويحتوي على زر الإعدادات بالجهة المعاكسة */
        .chat-sub-bar {
            padding: 8px 15px;
            background: rgba(15, 23, 42, 0.4);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .streak-right-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .streak-info-text {
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .core-reactor-wrapper {
            position: relative;
            width: 40px;
            height: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .core-reactor-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #38bdf8, #6366f1, #a855f7, #ec4899, #38bdf8);
            animation: coreSpin 4s linear infinite;
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #fff calc(100% - 4px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #fff calc(100% - 4px));
        }

        @keyframes coreSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .core-reactor-core {
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, #6366f1 0%, #1e1b4b 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.7);
            font-size: 0.65rem;
            font-weight: 900;
            color: #fff;
        }

        /* رسائل الشات */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message-item {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            max-width: 75%;
        }

        .message-item.me {
            margin-right: auto;
            flex-direction: row-reverse;
        }

        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            flex-shrink: 0;
            cursor: pointer;
        }
        .msg-avatar:hover { opacity: 0.85; }

        .msg-content-box {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .msg-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-sub);
        }

        .msg-name { 
            font-weight: 700; 
            color: var(--text-main); 
            cursor: pointer; 
        }
        .msg-name:hover { text-decoration: underline; color: var(--primary); }
        
        .rank-tag {
            font-size: 0.65rem;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .rank-weak { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .rank-medium { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .rank-strong { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .rank-very-strong { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
        .rank-legendary { background: rgba(236, 72, 153, 0.15); color: #ec4899; }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.9rem;
            color: var(--text-main);
            word-break: break-word;
            line-height: 1.4;
        }

        .message-item.me .msg-bubble { background: var(--bubble-me); color: white; border-top-left-radius: 2px; }
        .message-item:not(.me) .msg-bubble { background: var(--bubble-other); border-top-right-radius: 2px; }

        .msg-time { font-size: 0.62rem; color: var(--text-sub); margin-top: 2px; align-self: flex-end; }

        /* منطقة الإدخال (المشبك ومكان الكتابة والارسال) */
        .chat-input-area {
            padding: 12px 18px;
            background: rgba(15, 23, 42, 0.4);
            border-top: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
        }

        .attachment-wrapper {
            position: relative;
            display: inline-block;
        }

        .clip-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .clip-btn:hover { color: var(--primary); }

        .attachment-menu {
            position: absolute;
            bottom: 50px;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            display: none;
            flex-direction: column;
            gap: 5px;
            padding: 8px;
            z-index: 100;
            min-width: 150px;
            backdrop-filter: blur(12px);
        }
        .attachment-menu.active { display: flex; }

        .att-option {
            background: none;
            border: none;
            color: var(--text-main);
            padding: 8px 12px;
            text-align: right;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .att-option:hover { background: var(--btn-bg); color: var(--primary); }

        .chat-input {
            flex: 1;
            padding: 11px 16px;
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: 25px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            min-width: 0;
        }
        .chat-input:focus { border-color: var(--primary); }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: transform 0.2s, background 0.2s;
        }
        .send-btn:hover { background: var(--primary-hover); transform: scale(1.05); }
        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transform: scaleX(-1);
        }

        /* نافذة الإعدادات المنبثقة */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 25px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-card h3 { font-size: 1.1rem; color: var(--text-main); margin-bottom: 5px; }
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.88rem;
            color: var(--text-main);
            padding: 8px 0;
            border-bottom: 1px solid var(--card-border);
        }
        .modal-close-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .modal-close-btn:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

    <!-- الهيدر العلوي -->
    <header class="chat-header-nav">
        <div class="header-right-group">
            <a href="student-main.html" class="home-btn">🏠 الرئيسية</a>
        </div>
        <div class="chat-main-title">💬 قناة الدردشة</div>
        <div class="header-actions-left">
            <button id="themeToggleBtn" class="header-icon-btn" title="تغيير الثيم">🌙</button>
        </div>
    </header>

    <!-- صندوق الدردشة -->
    <div class="chat-container">
        <!-- شريط نواة الطاقة (الاستريك) مع زر الإعدادات في الناحية المعاكسة -->
        <div class="chat-sub-bar">
            <button class="header-settings-btn" onclick="openSettingsModal()" title="الإعدادات">⚙️ الإعدادات</button>
            <div class="streak-right-group">
                <span class="streak-info-text">🔥 أيام الاستريك المتتالية:</span>
                <div class="core-reactor-wrapper" onclick="openSettingsModal()" title="طاقة الاستريك الخاصة بك">
                    <div class="core-reactor-ring"></div>
                    <div class="core-reactor-core" id="coreDayNumber">1</div>
                </div>
            </div>
        </div>

        <!-- رسائل الشات -->
        <div class="chat-messages" id="chatMessages">
            <div class="message-item">
                <img src="https://via.placeholder.com/40" class="msg-avatar" alt="صورة" onclick="openProfile('محمد عماد')">
                <div class="msg-content-box">
                    <div class="msg-info">
                        <span class="msg-name" onclick="openProfile('محمد عماد')">محمد عماد</span>
                        <span class="rank-tag rank-strong">قوي</span>
                    </div>
                    <div class="msg-bubble">أهلاً بكل الزملاء في قناة الدردشة الخاصة بالمنصة! شاركوا استفساراتكم هنا بكل حرية 📚</div>
                    <span class="msg-time">09:30 م</span>
                </div>
            </div>
        </div>

        <!-- منطقة الإدخال (المشبك، مكان الكتابة، وزر الإرسال) -->
        <div class="chat-input-area">
            <div class="attachment-wrapper">
                <button class="clip-btn" onclick="toggleAttachmentMenu(event)" title="إرفاق ملفات">📎</button>
                <div class="attachment-menu" id="attachmentMenu">
                    <button class="att-option" onclick="document.getElementById('mediaInput').click()">📷 صورة أو فيديو</button>
                    <button class="att-option" onclick="document.getElementById('fileInput').click()">📁 مستند / ملف PDF</button>
                    <button class="att-option" onclick="startVoiceRecord()">🎤 تسجيل صوتي</button>
                    <button class="att-option" onclick="triggerPollModal()">📊 إنشاء تصويت</button>
                    <button class="att-option" onclick="triggerAskModal()">❓ طرح سؤال (Ask)</button>
                </div>
            </div>

            <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="handleMediaUpload(this)">
            <input type="file" id="fileInput" style="display: none;" onchange="handleFileUpload(this)">

            <input type="text" id="chatInput" class="chat-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">

            <button class="send-btn" onclick="sendMessage()" title="إرسال">
                <svg viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- نافذة الإعدادات المنبثقة -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <h3>إعدادات طاقة النواة والحساب</h3>
            <div class="setting-item">
                <span>جعل المستوى مرئياً للآخرين</span>
                <input type="checkbox" id="settingRankVisible" checked onchange="saveStudentSettings()">
            </div>
            <div class="setting-item">
                <span>جعل صورتي مرئية للآخرين</span>
                <input type="checkbox" id="settingAvatarVisible" checked onchange="saveStudentSettings()">
            </div>
            <div class="setting-item">
                <span>السماح للآخرين بدخول البروفايل الخاص بي</span>
                <input type="checkbox" id="settingProfileAccess" checked onchange="saveStudentSettings()">
            </div>
            <button class="modal-close-btn" onclick="closeSettingsModal()">تم الحفظ والغلق</button>
        </div>
    </div>

    <script>
        const currentUserData = JSON.parse(sessionStorage.getItem('currentUser') || sessionStorage.getItem('studentUser') || '{}');
        const studentName = currentUserData.fullName || currentUserData.name || 'طالب جديد';
        const nameParts = studentName.split(' ');
        const shortName = nameParts.length > 1 ? `${nameParts[0]} ${nameParts[1]}` : studentName;
        const studentAvatar = currentUserData.profileImage || currentUserData.avatar || 'https://via.placeholder.com/40';
        const studentRank = currentUserData.rank || 'ضعيف';

        function getRankClass(rank) {
            switch(rank) {
                case 'ضعيف': return 'rank-weak';
                case 'متوسط': return 'rank-medium';
                case 'قوي': return 'rank-strong';
                case 'قوي جداً': return 'rank-very-strong';
                case 'اسطوري': return 'rank-legendary';
                default: return 'rank-weak';
            }
        }

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const htmlTag = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'dark';
        htmlTag.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            if (htmlTag.getAttribute('data-theme') === 'dark') {
                htmlTag.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                themeToggleBtn.textContent = '🌙';
            } else {
                htmlTag.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeToggleBtn.textContent = '☀️';
            }
        });

        const settingsModal = document.getElementById('settingsModal');

        function openSettingsModal() {
            settingsModal.classList.add('active');
        }

        function closeSettingsModal() {
            settingsModal.classList.remove('active');
        }

        function saveStudentSettings() {
            const settings = {
                rankVisible: document.getElementById('settingRankVisible').checked,
                avatarVisible: document.getElementById('settingAvatarVisible').checked,
                profileAccess: document.getElementById('settingProfileAccess').checked
            };
            localStorage.setItem('student_privacy_settings', JSON.stringify(settings));
        }

        const savedSettings = JSON.parse(localStorage.getItem('student_privacy_settings') || '{"rankVisible":true,"avatarVisible":true,"profileAccess":true}');
        document.getElementById('settingRankVisible').checked = savedSettings.rankVisible;
        document.getElementById('settingAvatarVisible').checked = savedSettings.avatarVisible;
        document.getElementById('settingProfileAccess').checked = savedSettings.profileAccess;

        function openProfile(name) {
            if (!savedSettings.profileAccess) {
                alert('عذراً، هذا الطالب قام بإيقاف ميزة السماح بالدخول لبروفايله الشخصي.');
                return;
            }
            window.location.href = `profile.html?student=${encodeURIComponent(name)}`;
        }

        let streakDays = parseInt(localStorage.getItem('student_streak') || '1');
        if (streakDays > 365) streakDays = 365;
        document.getElementById('coreDayNumber').textContent = streakDays;

        function toggleAttachmentMenu(e) {
            e.stopPropagation();
            document.getElementById('attachmentMenu').classList.toggle('active');
        }

        window.addEventListener('click', () => {
            const menu = document.getElementById('attachmentMenu');
            if (menu.classList.contains('active')) menu.classList.remove('active');
        });

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            appendMessageToChat(shortName, studentAvatar, studentRank, text, true);
            input.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function appendMessageToChat(name, avatar, rank, text, isMe) {
            const container = document.getElementById('chatMessages');
            const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const msgDiv = document.createElement('div');
            msgDiv.className = `message-item ${isMe ? 'me' : ''}`;
            const rankClass = getRankClass(rank);

            const displayRank = savedSettings.rankVisible ? `<span class="rank-tag ${rankClass}">${rank}</span>` : '';
            const displayAvatar = savedSettings.avatarVisible ? avatar : 'https://via.placeholder.com/40';

            msgDiv.innerHTML = `
                <img src="${displayAvatar}" class="msg-avatar" alt="صورة" onclick="openProfile('${name}')">
                <div class="msg-content-box">
                    <div class="msg-info">
                        <span class="msg-name" onclick="openProfile('${name}')">${name}</span>
                        ${displayRank}
                    </div>
                    <div class="msg-bubble">${escapeHtml(text)}</div>
                    <span class="msg-time">${timeNow}</span>
                </div>
            `;

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function handleMediaUpload(input) {
            if (input.files && input.files[0]) {
                appendMessageToChat(shortName, studentAvatar, studentRank, `[ملف مرئي مرفق: ${input.files[0].name}]`, true);
            }
        }

        function handleFileUpload(input) {
            if (input.files && input.files[0]) {
                appendMessageToChat(shortName, studentAvatar, studentRank, `[مستند مرفق: ${input.files[0].name}]`, true);
            }
        }

        function startVoiceRecord() {
            appendMessageToChat(shortName, studentAvatar, studentRank, `[تسجيل صوتي قصير]`, true);
        }

        function triggerPollModal() {
            const pollQ = prompt('اكتب سؤال التصويت:');
            if (pollQ) {
