<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - قناة الدردشة</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --navbar-bg: rgba(15, 23, 42, 0.9);
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --bubble-me: #4f46e5;
            --bubble-other: rgba(51, 65, 85, 0.7);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-border: rgba(255, 255, 255, 0.15);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #e0e7ff, #f3e8ff, #f1f5f9);
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --navbar-bg: rgba(255, 255, 255, 0.9);
            --input-bg: #f8fafc;
            --input-border: #cbd5e1;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --bubble-me: #6366f1;
            --bubble-other: #e2e8f0;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            --btn-bg: rgba(0, 0, 0, 0.05);
            --btn-border: rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s, border-color 0.3s; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
            width: 100vw;
        }

        .chat-header-nav {
            background: var(--navbar-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 900px;
            border-radius: 18px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            gap: 10px;
        }

        .header-right-group { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

        .home-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            white-space: nowrap;
        }
        .home-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .chat-main-title { font-size: 1.05rem; font-weight: 800; color: var(--text-main); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

        .header-actions-left { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        .header-icon-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-main);
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            padding: 0;
        }
        .header-icon-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .header-settings-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-main);
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 10px;
            white-space: nowrap;
        }
        .header-settings-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .chat-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            width: 100%;
            max-width: 900px;
            height: calc(83vh - 10px);
            border-radius: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-sub-bar {
            padding: 8px 15px;
            background: rgba(15, 23, 42, 0.4);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .streak-right-group { display: flex; align-items: center; gap: 8px; }
        .streak-info-text { font-size: 0.8rem; color: var(--text-sub); font-weight: 600; }

        .core-reactor-wrapper {
            position: relative;
            width: 36px;
            height: 36px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .core-reactor-ring {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #38bdf8, #6366f1, #a855f7, #ec4899, #38bdf8);
            animation: coreSpin 4s linear infinite;
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #fff calc(100% - 4px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #fff calc(100% - 4px));
        }

        @keyframes coreSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .core-reactor-core {
            width: 28px; height: 28px;
            background: radial-gradient(circle, #6366f1 0%, #1e1b4b 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.7);
            font-size: 0.62rem; font-weight: 900; color: #fff;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .message-item { display: flex; gap: 8px; align-items: flex-start; max-width: 85%; }
        .message-item.me { margin-right: auto; flex-direction: row-reverse; }

        .msg-avatar {
            width: 34px; height: 34px;
            border-radius: 50%; object-fit: cover;
            border: 2px solid var(--primary);
            flex-shrink: 0; cursor: pointer;
        }
        .msg-avatar:hover { opacity: 0.85; }

        .msg-content-box { display: flex; flex-direction: column; gap: 4px; width: 100%; min-width: 0; }
        .msg-info { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-sub); flex-wrap: wrap; }
        .msg-name { font-weight: 700; color: var(--text-main); cursor: pointer; }
        .msg-name:hover { text-decoration: underline; color: var(--primary); }
        
        .rank-tag { font-size: 0.62rem; padding: 1px 5px; border-radius: 4px; font-weight: bold; }
        .rank-weak { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .rank-medium { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .rank-strong { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .rank-very-strong { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
        .rank-legendary { background: rgba(236, 72, 153, 0.15); color: #ec4899; }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.88rem;
            color: var(--text-main);
            word-break: break-word;
            overflow-wrap: break-word;
            line-height: 1.4;
        }

        .message-item.me .msg-bubble { background: var(--bubble-me); color: white; border-top-left-radius: 2px; }
        .message-item:not(.me) .msg-bubble { background: var(--bubble-other); border-top-right-radius: 2px; }

        .msg-time { font-size: 0.6rem; color: var(--text-sub); margin-top: 2px; align-self: flex-end; }

        .msg-image { max-width: 100%; width: 200px; border-radius: 10px; margin-bottom: 5px; cursor: pointer; display: block; object-fit: cover; }
        .poll-box, .ask-box { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; margin-top: 5px; border: 1px solid var(--card-border); width: 100%; }
        .poll-option { background: var(--btn-bg); padding: 6px 10px; border-radius: 6px; margin-top: 5px; cursor: pointer; font-size: 0.82rem; }
        .poll-option:hover { background: var(--primary); color: white; }
        .reply-trigger-btn { background: none; border: none; color: var(--primary); font-size: 0.72rem; cursor: pointer; margin-top: 4px; font-weight: bold; text-align: right; }
        
        .voice-note-player { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.15); padding: 8px 10px; border-radius: 20px; max-width: 100%; }
        .voice-play-btn { background: var(--primary); color: white; border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; flex-shrink: 0; }
        .voice-waves { flex: 1; height: 14px; background: repeating-linear-gradient(90deg, var(--text-sub), var(--text-sub) 2px, transparent 2px, transparent 6px); opacity: 0.6; min-width: 80px; }

        .attachment-preview-bar {
            padding: 8px 15px;
            background: rgba(15, 23, 42, 0.7);
            border-top: 1px solid var(--card-border);
            display: none;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            color: var(--text-main);
            gap: 10px;
        }
        .attachment-preview-bar.active { display: flex; }
        .cancel-attachment { background: none; border: none; color: #ef4444; cursor: pointer; font-weight: bold; flex-shrink: 0; }

        .chat-input-area {
            padding: 10px 15px;
            background: rgba(15, 23, 42, 0.4);
            border-top: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .attachment-wrapper { position: relative; display: inline-block; flex-shrink: 0; }
        .clip-btn { background: none; border: none; color: var(--text-sub); font-size: 1.2rem; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }
        .clip-btn:hover { color: var(--primary); }

        .attachment-menu {
            position: absolute; bottom: 45px; right: 0;
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 14px; box-shadow: var(--shadow);
            display: none; flex-direction: column; gap: 4px; padding: 6px; z-index: 100; min-width: 150px;
            backdrop-filter: blur(12px);
        }
        .attachment-menu.active { display: flex; }

        .att-option {
            background: none; border: none; color: var(--text-main);
            padding: 8px 10px; text-align: right; border-radius: 8px;
            font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; gap: 8px;
            white-space: nowrap;
        }
        .att-option:hover { background: var(--btn-bg); color: var(--primary); }

        .chat-input {
            flex: 1; padding: 10px 14px;
            background: var(--input-bg); border: 1.5px solid var(--input-border);
            border-radius: 25px; color: var(--text-main); font-size: 0.88rem; outline: none; min-width: 0;
        }
        .chat-input:focus { border-color: var(--primary); }

        .send-btn {
            background: var(--primary); color: white; border: none;
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .send-btn:hover { background: var(--primary-hover); transform: scale(1.05); }
        .send-btn svg { width: 16px; height: 16px; fill: currentColor; transform: scaleX(-1); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px;
        }
        .modal-overlay.active { display: flex; }

        .modal-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            padding: 20px; border-radius: 20px; width: 100%; max-width: 400px;
            box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; max-height: 85vh; overflow-y: auto;
        }
        .modal-card h3 { font-size: 1.05rem; color: var(--text-main); margin-bottom: 2px; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-main); padding: 6px 0; border-bottom: 1px solid var(--card-border); gap: 10px; }
        .modal-input { width: 100%; padding: 9px; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 8px; color: var(--text-main); font-size: 0.88rem; outline: none; margin-top: 4px; }
        .modal-btn { background: var(--primary); color: white; border: none; padding: 9px; border-radius: 10px; cursor: pointer; font-weight: bold; text-align: center; }
        .modal-btn:hover { background: var(--primary-hover); }
        .options-list { display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto; }
    </style>
</head>
<body>

    <header class="chat-header-nav">
        <div class="header-right-group">
            <!-- تم تعديل الرابط هنا ليتوافق مع اسم صفحة الطالب الأساسية الخاصة بك -->
            <a href="main.html" class="home-btn">🏠 الرئيسية</a>
        </div>
        <div class="chat-main-title">💬 قناة الدردشة</div>
        <div class="header-actions-left">
            <button id="themeToggleBtn" class="header-icon-btn" title="تغيير الثيم">🌙</button>
        </div>
    </header>

    <div class="chat-container">
        <div class="chat-sub-bar">
            <button class="header-settings-btn" onclick="openSettingsModal()" title="الإعدادات">⚙️ الإعدادات</button>
            <div class="streak-right-group">
                <span class="streak-info-text">🔥 الاستريك:</span>
                <div class="core-reactor-wrapper" onclick="openSettingsModal()" title="طاقة الاستريك الخاصة بك">
                    <div class="core-reactor-ring"></div>
                    <div class="core-reactor-core" id="coreDayNumber">1</div>
                </div>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="attachment-preview-bar" id="attachmentPreviewBar">
            <span id="previewTextName" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">تم إرفاق ملف: </span>
            <button class="cancel-attachment" onclick="clearPendingAttachment()">إلغاء ✕</button>
        </div>

        <div class="chat-input-area">
            <div class="attachment-wrapper">
                <button class="clip-btn" onclick="toggleAttachmentMenu(event)" title="إرفاق ملفات">📎</button>
                <div class="attachment-menu" id="attachmentMenu">
                    <button class="att-option" onclick="document.getElementById('mediaInput').click()">📷 صورة أو فيديو</button>
                    <button class="att-option" onclick="document.getElementById('fileInput').click()">📁 مستند / ملف PDF</button>
                    <button class="att-option" onclick="recordVoiceNote()">🎤 تسجيل صوتي</button>
                    <button class="att-option" onclick="openPollModal()">📊 إنشاء تصويت</button>
                    <button class="att-option" onclick="openAskModal()">❓ طرح سؤال (Ask)</button>
                </div>
            </div>

            <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="stageFile(this, 'media')">
            <input type="file" id="fileInput" style="display: none;" onchange="stageFile(this, 'file')">

            <input type="text" id="chatInput" class="chat-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">

            <button class="send-btn" onclick="sendMessage()" title="إرسال">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>

    <!-- نافذة الإعدادات -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <h3>إعدادات طاقة النواة والحساب</h3>
            <div class="setting-item"><span>جعل المستوى مرئياً للآخرين</span><input type="checkbox" id="settingRankVisible" checked onchange="saveStudentSettings()"></div>
            <div class="setting-item"><span>جعل صورتي مرئية للآخرين</span><input type="checkbox" id="settingAvatarVisible" checked onchange="saveStudentSettings()"></div>
            <div class="setting-item"><span>السماح للآخرين بدخول البروفايل الخاص بي</span><input type="checkbox" id="settingProfileAccess" checked onchange="saveStudentSettings()"></div>
            <button class="modal-btn" onclick="closeSettingsModal()">تم الحفظ والغلق</button>
        </div>
    </div>

    <!-- نافذة عائمة للتصويت -->
    <div class="modal-overlay" id="pollModal">
        <div class="modal-card">
            <h3>📊 إنشاء تصويت جديد</h3>
            <input type="text" id="pollQuestionInput" class="modal-input" placeholder="اكتب سؤال التصويت هنا...">
            <label style="font-size:0.8rem; color:var(--text-sub); margin-top:4px;">خيارات التصويت:</label>
            <div class="options-list" id="pollOptionsContainer">
                <input type="text" class="modal-input poll-option-input" placeholder="الخيار الأول">
                <input type="text" class="modal-input poll-option-input" placeholder="الخيار الثاني">
            </div>
            <button class="modal-btn" style="background:var(--btn-bg); color:var(--text-main); border:1px solid var(--card-border);" onclick="addPollOptionField()">➕ إضافة خيار جديد</button>
            <button class="modal-btn" onclick="submitPoll()">نشر التصويت</button>
            <button class="cancel-attachment" onclick="closePollModal()" style="text-align:center;">إلغاء</button>
        </div>
    </div>

    <!-- نافذة عائمة للسؤال (Ask) -->
    <div class="modal-overlay" id="askModal">
        <div class="modal-card">
            <h3>❓ طرح سؤال دراسي (Ask)</h3>
            <textarea id="askQuestionInput" class="modal-input" rows="4" placeholder="اكتب سؤالك التفصيلي هنا ليتمكن الزملاء من الرد عليه..."></textarea>
            <button class="modal-btn" onclick="submitAsk()">نشر السؤال</button>
            <button class="cancel-attachment" onclick="closeAskModal()" style="text-align:center;">إلغاء</button>
        </div>
    </div>

    <!-- نافذة الردود الداخلية (Threads) العائمة -->
    <div class="modal-overlay" id="threadModal">
        <div class="modal-card" style="max-height:80vh;">
            <h3>💬 الردود الداخلية على السؤال</h3>
            <div id="threadOriginalMsg" style="background:rgba(0,0,0,0.2); padding:10px; border-radius:8px; font-size:0.82rem;"></div>
            <div class="chat-messages" id="threadMessagesList" style="max-height:220px; overflow-y:auto; padding:5px 0;"></div>
            <div style="display:flex; gap:8px; margin-top:5px;">
                <input type="text" id="threadReplyInput" class="modal-input" placeholder="اكتب ردك هنا..." style="margin-top:0;">
                <button class="modal-btn" onclick="sendThreadReply()" style="flex-shrink:0;">إرسال</button>
            </div>
            <button class="modal-btn" style="background:var(--btn-bg); color:var(--text-main); margin-top:5px;" onclick="closeThreadModal()">إغلاق</button>
        </div>
    </div>

    <script>
        const currentUserData = JSON.parse(sessionStorage.getItem('currentUser') || sessionStorage.getItem('studentUser') || '{}');
        const studentName = currentUserData.fullName || currentUserData.name || 'طالب جديد';
        const nameParts = studentName.split(' ');
        const shortName = nameParts.length > 1 ? `${nameParts[0]} ${nameParts[1]}` : studentName;
        const studentAvatar = currentUserData.profileImage || currentUserData.avatar || 'https://via.placeholder.com/40';
        const studentRank = currentUserData.rank || 'ضعيف';

        function getRankClass(rank) {
            switch(rank) {
                case 'ضعيف': return 'rank-weak';
                case 'متوسط': return 'rank-medium';
                case 'قوي': return 'rank-strong';
                case 'قوي جداً': return 'rank-very-strong';
                case 'اسطوري': return 'rank-legendary';
                default: return 'rank-weak';
            }
        }

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const htmlTag = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'dark';
        htmlTag.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
        themeToggleBtn.addEventListener('click', () => {
            const current = htmlTag.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            htmlTag.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
            themeToggleBtn.textContent = target === 'dark' ? '☀️' : '🌙';
        });

        const settingsModal = document.getElementById('settingsModal');
        function openSettingsModal() { settingsModal.classList.add('active'); }
        function closeSettingsModal() { settingsModal.classList.remove('active'); }
        function saveStudentSettings() {
            const settings = {
                rankVisible: document.getElementById('settingRankVisible').checked,
                avatarVisible: document.getElementById('settingAvatarVisible').checked,
                profileAccess: document.getElementById('settingProfileAccess').checked
            };
            localStorage.setItem('student_privacy_settings', JSON.stringify(settings));
        }
        const savedSettings = JSON.parse(localStorage.getItem('student_privacy_settings') || '{"rankVisible":true,"avatarVisible":true,"profileAccess":true}');
        document.getElementById('settingRankVisible').checked = savedSettings.rankVisible;
        document.getElementById('settingAvatarVisible').checked = savedSettings.avatarVisible;
        document.getElementById('settingProfileAccess').checked = savedSettings.profileAccess;

        let streakDays = parseInt(localStorage.getItem('student_streak') || '1');
        if (streakDays > 365) streakDays = 365;
        document.getElementById('coreDayNumber').textContent = streakDays;

        const CLOUD_STORAGE_KEY = 'cloud_student_chat_messages_v2';
        
        function getCloudMessages() {
            let messages = JSON.parse(localStorage.getItem(CLOUD_STORAGE_KEY) || '[]');
            const now = Date.now();
            const twentyFourHours = 24 * 60 * 60 * 1000;
            messages = messages.filter(msg => (now - msg.timestamp) < twentyFourHours);
            localStorage.setItem(CLOUD_STORAGE_KEY, JSON.stringify(messages));
            return messages;
        }

        function saveMessageToCloud(msgObj) {
            let messages = getCloudMessages();
            messages.push(msgObj);
            localStorage.setItem(CLOUD_STORAGE_KEY, JSON.stringify(messages));
        }

        let pendingAttachment = null;

        function stageFile(input, type) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    pendingAttachment = {
                        type: type,
                        name: file.name,
                        dataUrl: e.target.result
                    };
                    document.getElementById('previewTextName').textContent = `تم إرفاق: ${file.name}`;
                    document.getElementById('attachmentPreviewBar').classList.add('active');
                };
                reader.readAsDataURL(file);
            }
            document.getElementById('attachmentMenu').classList.remove('active');
        }

        function clearPendingAttachment() {
            pendingAttachment = null;
            document.getElementById('attachmentPreviewBar').classList.remove('active');
            document.getElementById('mediaInput').value = '';
            document.getElementById('fileInput').value = '';
        }

        function recordVoiceNote() {
            document.getElementById('attachmentMenu').classList.remove('active');
            const voiceObj = {
                type: 'voice',
                name: 'تسجيل صوتي قصير (0:14)',
                dataUrl: '#'
            };
            pendingAttachment = voiceObj;
            document.getElementById('previewTextName').textContent = `تم تسجيل ريكورد صوتي`;
            document.getElementById('attachmentPreviewBar').classList.add('active');
        }

        function toggleAttachmentMenu(e) {
            e.stopPropagation();
            document.getElementById('attachmentMenu').classList.toggle('active');
        }
        window.addEventListener('click', () => {
            const menu = document.getElementById('attachmentMenu');
            if (menu.classList.contains('active')) menu.classList.remove('active');
        });

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();

            if (!text && !pendingAttachment) return;

            const msgData = {
                id: 'msg_' + Date.now(),
                name: shortName,
                avatar: studentAvatar,
                rank: studentRank,
                text: text,
                attachment: pendingAttachment,
                isMe: true,
                timestamp: Date.now(),
                replies: []
            };

            saveMessageToCloud(msgData);
            renderChatMessages();

            input.value = '';
            clearPendingAttachment();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        const pollModal = document.getElementById('pollModal');
        function openPollModal() { pollModal.classList.add('active'); document.getElementById('attachmentMenu').classList.remove('active'); }
        function closePollModal() { pollModal.classList.remove('active'); }
        function addPollOptionField() {
            const container = document.getElementById('pollOptionsContainer');
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'modal-input poll-option-input';
            input.placeholder = 'خيار إضافي';
            container.appendChild(input);
        }
        function submitPoll() {
            const q = document.getElementById('pollQuestionInput').value.trim();
            const optionInputs = document.querySelectorAll('.poll-option-input');
            let options = [];
            optionInputs.forEach(inp => { if(inp.value.trim()) options.push(inp.value.trim()); });

            if(!q || options.length < 2) {
                alert('الرجاء كتابة سؤال التصويت وخيارين على الأقل.');
                return;
            }

            const pollData = {
                question: q,
                options: options.map(opt => ({ text: opt, votes: 0 }))
            };

            const msgData = {
                id: 'msg_' + Date.now(),
                name: shortName,
                avatar: studentAvatar,
                rank: studentRank,
                text: '',
                poll: pollData,
                isMe: true,
                timestamp: Date.now(),
                replies: []
            };

            saveMessageToCloud(msgData);
            renderChatMessages();
            closePollModal();
            document.getElementById('pollQuestionInput').value = '';
        }

        const askModal = document.getElementById('askModal');
        function openAskModal() { askModal.classList.add('active'); document.getElementById('attachmentMenu').classList.remove('active'); }
        function closeAskModal() { askModal.classList.remove('active'); }
        function submitAsk() {
            const askText = document.getElementById('askQuestionInput').value.trim();
            if(!askText) return;

            const msgData = {
                id: 'msg_' + Date.now(),
                name: shortName,
                avatar: studentAvatar,
                rank: studentRank,
                text: askText,
                isAsk: true,
                isMe: true,
                timestamp: Date.now(),
                replies: []
            };

            saveMessageToCloud(msgData);
            renderChatMessages();
            closeAskModal();
            document.getElementById('askQuestionInput').value = '';
        }

        let activeThreadMsgId = null;
        const threadModal = document.getElementById('threadModal');

        function openThreadModal(msgId) {
            activeThreadMsgId = msgId;
            const messages = getCloudMessages();
            const msg = messages.find(m => m.id === msgId);
            if(!msg) return;

            document.getElementById('threadOriginalMsg').innerHTML = `<b>${msg.name}:</b> ${msg.text || (msg.poll ? 'تصويت: ' + msg.poll.question : 'مرفق')}`;
            renderThreadReplies(msg.replies || []);
            threadModal.classList.add('active');
        }

        function closeThreadModal() {
            threadModal.classList.remove('active');
            activeThreadMsgId = null;
        }

        function renderThreadReplies(replies) {
            const list = document.getElementById('threadMessagesList');
            list.innerHTML = '';
            if(replies.length === 0) {
                list.innerHTML = '<div style="color:var(--text-sub); font-size:0.8rem; text-align:center; padding:10px;">لا توجد ردود بعد، كن أول الردين!</div>';
                return;
            }
            replies.forEach(r => {
                const div = document.createElement('div');
                div.style.cssText = "background:rgba(255,255,255,0.05); padding:6px 10px; border-radius:8px; margin-bottom:5px; font-size:0.82rem; word-break:break-word;";
                div.innerHTML = `<b>${r.name}:</b> ${r.text}`;
                list.appendChild(div);
            });
        }

        function sendThreadReply() {
            const replyInput = document.getElementById('threadReplyInput');
            const text = replyInput.value.trim();
            if(!text || !activeThreadMsgId) return;

            let messages = getCloudMessages();
            const msgIndex = messages.findIndex(m => m.id === activeThreadMsgId);
            if(msgIndex !== -1) {
                if(!messages[msgIndex].replies) messages[msgIndex].replies = [];
                messages[msgIndex].replies.push({
                    name: shortName,
                    text: text,
                    timestamp: Date.now()
                });
                localStorage.setItem(CLOUD_STORAGE_KEY, JSON.stringify(messages));
                renderThreadReplies(messages[msgIndex].replies);
                renderChatMessages();
                replyInput.value = '';
            }
        }

        function renderChatMessages() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            const messages = getCloudMessages();

            if(messages.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-sub); margin:auto; padding:20px; font-size:0.9rem;">لا توجد رسائل نشطة حالياً.</div>';
                return;
            }

            messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message-item ${msg.isMe ? 'me' : ''}`;
                const rankClass = getRankClass(msg.rank);
                const displayRank = savedSettings.rankVisible ? `<span class="rank-tag ${rankClass}">${msg.rank}</span>` : '';
                const displayAvatar = savedSettings.avatarVisible ? msg.avatar : 'https://via.placeholder.com/40';
                const timeNow = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                let contentHtml = '';

                if (msg.text) {
                    contentHtml += `<div class="msg-bubble">${escapeHtml(msg.text)}</div>`;
                }

                if (msg.attachment) {
                    if (msg.attachment.type === 'media') {
                        contentHtml += `<img src="${msg.attachment.dataUrl}" class="msg-image" alt="صورة مرفقة">`;
                    } else if (msg.attachment.type === 'file') {
                        contentHtml += `<div class="msg-bubble" style="background:rgba(0,0,0,0.2);">📁 مستند مرفق: ${msg.attachment.name}</div>`;
                    } else if (msg.attachment.type === 'voice') {
                        contentHtml += `
                            <div class="voice-note-player">
                                <button class="voice-play-btn" onclick="alert('تشغيل اليكورد الصوتي...')">▶</button>
                                <div class="voice-waves"></div>
                                <span style="font-size:0.72rem; color:var(--text-sub);">0:14</span>
                            </div>
                        `;
                    }
                }

                if (msg.poll) {
                    let optionsHtml = '';
                    msg.poll.options.forEach((opt, idx) => {
                        optionsHtml += `<div class="poll-option" onclick="alert('تم التصويت بنجاح على: ${opt.text}')">🔹 ${opt.text} (${opt.votes} صوت)</div>`;
                    });
                    contentHtml += `
                        <div class="poll-box">
                            <div style="font-weight:bold; margin-bottom:5px; font-size:0.85rem;">📊 ${escapeHtml(msg.poll.question)}</div>
                            ${optionsHtml}
                        </div>
                    `;
                }

                if (msg.isAsk || msg.poll) {
                    const repliesCount = msg.replies ? msg.replies.length : 0;
                    contentHtml += `<button class="reply-trigger-btn" onclick="openThreadModal('${msg.id}')">💬 الردود الداخلية (${repliesCount})</button>`;
                }

                msgDiv.innerHTML = `
                    <img src="${displayAvatar}" class="msg-avatar" alt="صورة" onclick="openProfile('${msg.name}')">
                    <div class="msg-content-box">
                        <div class="msg-info">
                            <span class="msg-name" onclick="openProfile('${msg.name}')">${msg.name}</span>
                            ${displayRank}
                        </div>
                        ${contentHtml}
                        <span class="msg-time">${timeNow}</span>
                    </div>
                `;
                container.appendChild(msgDiv);
            });
            container.scrollTop = container.scrollHeight;
        }

        function openProfile(name) {
            if (!savedSettings.profileAccess) {
                alert('عذراً، هذا الطالب قام بإيقاف ميزة السماح بالدخول لبروفايله الشخصي.');
                return;
            }
            window.location.href = `profile.html?student=${encodeURIComponent(name)}`;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        renderChatMessages();
    </script>
</body>
</html>
