<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - قناة الدردشة</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --navbar-bg: rgba(15, 23, 42, 0.9);
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --bubble-me: #4f46e5;
            --bubble-other: rgba(51, 65, 85, 0.7);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-border: rgba(255, 255, 255, 0.15);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #e0e7ff, #f3e8ff, #f1f5f9);
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --navbar-bg: rgba(255, 255, 255, 0.9);
            --input-bg: #f8fafc;
            --input-border: #cbd5e1;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --bubble-me: #6366f1;
            --bubble-other: #e2e8f0;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            --btn-bg: rgba(0, 0, 0, 0.05);
            --btn-border: rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s, border-color 0.3s; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
            width: 100vw;
        }

        .chat-header-nav {
            background: var(--navbar-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 900px;
            border-radius: 18px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            gap: 10px;
        }

        .header-right-group { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

        .home-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            white-space: nowrap;
        }
        .home-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .home-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .chat-main-title { font-size: 1.05rem; font-weight: 800; color: var(--text-main); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .chat-main-title svg { width: 18px; height: 18px; fill: var(--primary); }

        .header-actions-left { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        .header-icon-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-main);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            padding: 0;
        }
        .header-icon-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .header-icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .header-settings-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-main);
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            white-space: nowrap;
        }
        .header-settings-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .header-settings-btn svg { width: 15px; height: 15px; fill: currentColor; }

        .chat-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            width: 100%;
            max-width: 900px;
            height: calc(83vh - 10px);
            border-radius: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-sub-bar {
            padding: 8px 15px;
            background: rgba(15, 23, 42, 0.4);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .streak-right-group { display: flex; align-items: center; gap: 6px; }
        .streak-info-text { font-size: 0.8rem; color: var(--text-sub); font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .streak-info-text svg { width: 14px; height: 14px; fill: #f59e0b; }

        .core-reactor-wrapper {
            position: relative;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .core-reactor-ring {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #38bdf8, #6366f1, #a855f7, #ec4899, #38bdf8);
            animation: coreSpin 4s linear infinite;
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #fff calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #fff calc(100% - 3px));
        }

        @keyframes coreSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .core-reactor-core {
            width: 24px; height: 24px;
            background: radial-gradient(circle, #6366f1 0%, #1e1b4b 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.7);
            font-size: 0.6rem; font-weight: 900; color: #fff;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .message-item { display: flex; gap: 8px; align-items: flex-start; max-width: 85%; }
        .message-item.me { margin-right: auto; flex-direction: row-reverse; }

        .msg-avatar {
            width: 34px; height: 34px;
            border-radius: 50%; object-fit: cover;
            border: 2px solid var(--primary);
            flex-shrink: 0; cursor: pointer;
        }
        .msg-avatar:hover { opacity: 0.85; }

        .msg-content-box { display: flex; flex-direction: column; gap: 4px; width: 100%; min-width: 0; }
        .msg-info { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-sub); flex-wrap: wrap; }
        .msg-name { font-weight: 700; color: var(--text-main); cursor: pointer; }
        .msg-name:hover { text-decoration: underline; color: var(--primary); }
        
        .rank-tag { font-size: 0.62rem; padding: 1px 5px; border-radius: 4px; font-weight: bold; }
        .rank-weak { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .rank-medium { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .rank-strong { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .rank-very-strong { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
        .rank-legendary { background: rgba(236, 72, 153, 0.15); color: #ec4899; }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.88rem;
            color: var(--text-main);
            word-break: break-word;
            overflow-wrap: break-word;
            line-height: 1.4;
        }

        .message-item.me .msg-bubble { background: var(--bubble-me); color: white; border-top-left-radius: 2px; }
        .message-item:not(.me) .msg-bubble { background: var(--bubble-other); border-top-right-radius: 2px; }

        .msg-time { font-size: 0.6rem; color: var(--text-sub); margin-top: 2px; align-self: flex-end; }

        .msg-image { 
            width: 140px; 
            height: 105px; 
            border-radius: 8px; 
            margin-bottom: 4px; 
            cursor: pointer; 
            display: block; 
            object-fit: cover; 
            border: 1px solid var(--card-border);
            transition: transform 0.2s;
        }
        .msg-image:hover { opacity: 0.9; }

        .poll-box, .ask-box { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; margin-top: 5px; border: 1px solid var(--card-border); width: 100%; }
        .poll-option { background: var(--btn-bg); padding: 6px 10px; border-radius: 6px; margin-top: 5px; cursor: pointer; font-size: 0.82rem; }
        .poll-option:hover { background: var(--primary); color: white; }
        .reply-trigger-btn { background: none; border: none; color: var(--primary); font-size: 0.72rem; cursor: pointer; margin-top: 4px; font-weight: bold; text-align: right; }
        
        .voice-note-player { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            background: rgba(0, 0, 0, 0.2); 
            padding: 6px 10px; 
            border-radius: 16px; 
            max-width: 220px; 
            width: 100%; 
            border: 1px solid var(--card-border); 
        }
        .voice-play-btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            width: 28px; 
            height: 28px; 
            border-radius: 50%; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 0.75rem; 
            flex-shrink: 0; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.3); 
        }
        .voice-play-btn:hover { background: var(--primary-hover); }
        
        .voice-body-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .voice-progress-track {
            position: relative;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
        }

        .voice-progress-fill {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        .voice-meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.62rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .recording-status-bar {
            padding: 8px 15px;
            background: rgba(239, 68, 68, 0.2);
            border-top: 1px solid #ef4444;
            display: none;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            color: #ef4444;
            font-weight: bold;
            animation: pulseRecord 1.5s infinite;
        }
        .recording-status-bar.active { display: flex; }
        @keyframes pulseRecord {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .attachment-preview-bar {
            padding: 8px 15px;
            background: rgba(15, 23, 42, 0.7);
            border-top: 1px solid var(--card-border);
            display: none;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            color: var(--text-main);
            gap: 10px;
        }
        .attachment-preview-bar.active { display: flex; }
        .cancel-attachment { background: none; border: none; color: #ef4444; cursor: pointer; font-weight: bold; flex-shrink: 0; }

        .chat-input-area {
            padding: 10px 15px;
            background: rgba(15, 23, 42, 0.4);
            border-top: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .attachment-wrapper { position: relative; display: inline-block; flex-shrink: 0; }
        .clip-btn { background: none; border: none; color: var(--text-sub); cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: var(--btn-bg); border: 1px solid var(--btn-border); }
        .clip-btn:hover { color: white; background: var(--primary); border-color: var(--primary); }
        .clip-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .attachment-menu {
            position: absolute; bottom: 45px; right: 0;
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 14px; box-shadow: var(--shadow);
            display: none; flex-direction: column; gap: 4px; padding: 6px; z-index: 100; min-width: 180px;
            backdrop-filter: blur(12px);
        }
        .attachment-menu.active { display: flex; }

        .att-option {
            background: none; border: none; color: var(--text-main);
            padding: 8px 10px; text-align: right; border-radius: 8px;
            font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; gap: 8px;
            white-space: nowrap;
        }
        .att-option:hover { background: var(--primary); color: white; }
        .att-option svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

        .chat-input {
            flex: 1; padding: 10px 14px;
            background: var(--input-bg); border: 1.5px solid var(--input-border);
            border-radius: 25px; color: var(--text-main); font-size: 0.88rem; outline: none; min-width: 0;
        }
        .chat-input:focus { border-color: var(--primary); }

        .send-btn {
            background: var(--primary); color: white; border: none;
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
        }
        .send-btn:hover { background: var(--primary-hover); transform: scale(1.05); }
        .send-btn svg { width: 16px; height: 16px; fill: currentColor; transform: scaleX(-1); }

        .send-btn.recording-mode {
            background: #ef4444 !important;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.6);
            animation: pulseStopBtn 1s infinite;
        }
        @keyframes pulseStopBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px;
        }
        .modal-overlay.active { display: flex; }

        .modal-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            padding: 20px; border-radius: 20px; width: 100%; max-width: 400px;
            box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; max-height: 85vh; overflow-y: auto;
        }
        .modal-card h3 { font-size: 1.05rem; color: var(--text-main); margin-bottom: 2px; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-main); padding: 6px 0; border-bottom: 1px solid var(--card-border); gap: 10px; }
        .modal-input { width: 100%; padding: 9px; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 8px; color: var(--text-main); font-size: 0.88rem; outline: none; margin-top: 4px; }
        .modal-btn { background: var(--primary); color: white; border: none; padding: 9px; border-radius: 10px; cursor: pointer; font-weight: bold; text-align: center; }
        .modal-btn:hover { background: var(--primary-hover); }
        .options-list { display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto; }

        #imageModalViewer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2000; display: none;
            justify-content: center; align-items: center; cursor: pointer; padding: 20px;
        }
        #imageModalViewer.active { display: flex; }
        #imageModalViewer img { max-width: 90%; max-height: 90%; border-radius: 12px; object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <header class="chat-header-nav">
        <div class="header-right-group">
            <a href="main.html" class="home-btn">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            الرئيسية
            </a>
        </div>
        <div class="chat-main-title">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
            قناة الدردشة
        </div>
        <div class="header-actions-left">
            <button id="themeToggleBtn" class="header-icon-btn" title="تغيير الثيم">
                <svg id="themeIconSvg" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.38 5.38 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
            </button>
        </div>
    </header>

    <div class="chat-container">
        <div class="chat-sub-bar">
            <button class="header-settings-btn" onclick="openSettingsModal()" title="الإعدادات">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                الإعدادات
            </button>
            <div class="streak-right-group">
                <span class="streak-info-text">
                    <svg viewBox="0 0 24 24"><path d="M17.66 11.2C17.43 10.9 17.15 10.63 16.89 10.38C16.22 9.78 15.62 9.07 15.13 8.3C14.35 7.07 13.9 5.6 13.59 4.12C13.5 3.66 13.13 3.32 12.67 3.32C12.21 3.32 11.84 3.66 11.75 4.12C11.44 5.6 10.99 7.07 10.21 8.3C9.72 9.07 9.12 9.78 8.45 10.38C8.19 10.63 7.91 10.9 7.68 11.2C6.31 13.06 5.5 15.35 5.5 17.8C5.5 21.22 8.28 24 11.7 24C15.12 24 17.9 21.22 17.9 17.8C17.9 15.35 17.09 13.06 17.66 11.2Z"/></svg>
                    الاستريك:
                </span>
                <div class="core-reactor-wrapper" onclick="openSettingsModal()" title="طاقة الاستريك الخاصة بك">
                    <div class="core-reactor-ring"></div>
                    <div class="core-reactor-core" id="coreDayNumber">1</div>
                </div>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="recording-status-bar" id="recordingStatusBar">
            <span id="recordingTimerText">🔴 جاري تسجيل الريكورد الصوتي... (0 ثانية)</span>
        </div>

        <div class="attachment-preview-bar" id="attachmentPreviewBar">
            <span id="previewTextName" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">تم إرفاق ملف: </span>
            <button class="cancel-attachment" onclick="clearPendingAttachment()">إلغاء ✕</button>
        </div>

        <div class="chat-input-area">
            <div class="attachment-wrapper">
                <button class="clip-btn" onclick="toggleAttachmentMenu(event)" title="إرفاق ملفات">
                    <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.76-2.24-5-5-5S5 2.24 5 5v12.5c0 3.03 2.47 5.5 5.5 5.5s5.5-2.47 5.5-5.5V6h-1.5z"/></svg>
                </button>
                <div class="attachment-menu" id="attachmentMenu">
                    <button class="att-option" onclick="document.getElementById('mediaInput').click()">
                        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                        صورة أو فيديو
                    </button>

    <script>
        const JSONBIN_BIN_ID = '6ab78eaeffd5d1605330ce1e';
        const JSONBIN_API_KEY = '$2a$10$RDl2QtmGx8UEbAlg2zX03e3Xz77B8N6z4TRmCypXNwWqdIoLy6mYe';
        const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

        const currentUserData = JSON.parse(sessionStorage.getItem('currentUser') || sessionStorage.getItem('studentUser') || '{}');
        const studentName = currentUserData.fullName || currentUserData.name || 'طالب جديد';
        const nameParts = studentName.split(' ');
        const shortName = nameParts.length > 1 ? `${nameParts[0]} ${nameParts[1]}` : studentName;
        const studentAvatar = currentUserData.profileImage || currentUserData.avatar || 'https://via.placeholder.com/40';
        
        let rawRank = currentUserData.rank || 'ضعيف';
        let studentRank = 'ضعيف';
        if (rawRank.includes('متوسط')) studentRank = 'متوسط';
        else if (rawRank.includes('جداً') || rawRank.includes('very')) studentRank = 'قوي جداً';
        else if (rawRank.includes('قوي')) studentRank = 'قوي';
        else if (rawRank.includes('اسطوري') || rawRank.includes('legendary')) studentRank = 'اسطوري';

        function getRankClass(rank) {
            switch(rank) {
                case 'ضعيف': return 'rank-weak';
                case 'متوسط': return 'rank-medium';
                case 'قوي': return 'rank-strong';
                case 'قوي جداً': return 'rank-very-strong';
                case 'اسطوري': return 'rank-legendary';
                default: return 'rank-weak';
            }
        }

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIconSvg = document.getElementById('themeIconSvg');
        const htmlTag = document.documentElement;
        const savedTheme = localStorage.getItem('theme') || 'dark';
        htmlTag.setAttribute('data-theme', savedTheme);
        
        function updateThemeIcon(theme) {
            if (theme === 'dark') {
                themeIconSvg.innerHTML = '<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.38 5.38 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>';
            } else {
                themeIconSvg.innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06z"/>';
            }
        }
        updateThemeIcon(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const current = htmlTag.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            htmlTag.setAttribute('data-theme', target);
            localStorage.setItem('theme', target);
            updateThemeIcon(target);
        });

        const settingsModal = document.getElementById('settingsModal');
        function openSettingsModal() { settingsModal.classList.add('active'); }
        function closeSettingsModal() { settingsModal.classList.remove('active'); }
        function saveStudentSettings() {
            const settings = {
                rankVisible: document.getElementById('settingRankVisible').checked,
                avatarVisible: document.getElementById('settingAvatarVisible').checked,
                profileAccess: document.getElementById('settingProfileAccess').checked
            };
            localStorage.setItem('student_privacy_settings', JSON.stringify(settings));
        }
        const savedSettings = JSON.parse(localStorage.getItem('student_privacy_settings') || '{"rankVisible":true,"avatarVisible":true,"profileAccess":true}');
        document.getElementById('settingRankVisible').checked = savedSettings.rankVisible;
        document.getElementById('settingAvatarVisible').checked = savedSettings.avatarVisible;
        document.getElementById('settingProfileAccess').checked = savedSettings.profileAccess;

        let streakDays = parseInt(localStorage.getItem('student_streak') || '1');
        if (streakDays > 365) streakDays = 365;
        document.getElementById('coreDayNumber').textContent = streakDays;

        async function fetchMessagesFromCloud() {
            try {
                const response = await fetch(JSONBIN_URL + '/latest', {
                    headers: { 'X-Master-Key': JSONBIN_API_KEY }
                });
                if (response.ok) {
                    const data = await response.json();
                    let messages = data.record?.messages || [];
                    const now = Date.now();
                    const twentyFourHours = 24 * 60 * 60 * 1000;
                    messages = messages.filter(msg => (now - msg.timestamp) < twentyFourHours);
                    return messages;
                }
            } catch (error) {
                console.error("خطأ في جلب الرسائل:", error);
            }
            return [];
        }

        async function saveMessagesToCloud(messages) {
            try {
                await fetch(JSONBIN_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY
                    },
                    body: JSON.stringify({ messages: messages })
                });
            } catch (error) {
                console.error("خطأ في حفظ الرسائل:", error);
            }
        }

        let pendingAttachment = null;

        function stageFile(input, type) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    pendingAttachment = {
                        type: type,
                        name: file.name,
                        dataUrl: e.target.result
                    };
                    document.getElementById('previewTextName').textContent = `تم إرفاق: ${file.name}`;
                    document.getElementById('attachmentPreviewBar').classList.add('active');
                };
                reader.readAsDataURL(file);
            }
            document.getElementById('attachmentMenu').classList.remove('active');
        }

        function clearPendingAttachment() {
            pendingAttachment = null;
            document.getElementById('attachmentPreviewBar').classList.remove('active');
            document.getElementById('mediaInput').value = '';
            document.getElementById('fileInput').value = '';
        }

        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recordInterval = null;
        let recordSeconds = 0;

        async function startVoiceRecording() {
            document.getElementById('attachmentMenu').classList.remove('active');
            if (isRecording) return;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                recordSeconds = 0;

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    clearInterval(recordInterval);
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        pendingAttachment = {
                            type: 'voice',
                            name: 'تسجيل صوتي',
                            dataUrl: e.target.result,
                            duration: recordSeconds > 0 ? recordSeconds : 1
                        };
                        document.getElementById('previewTextName').textContent = `تم حفظ الريكورد الصوتي بنجاح (${recordSeconds} ثانية)`;
                        document.getElementById('attachmentPreviewBar').classList.add('active');
                    };
                    reader.readAsDataURL(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                    
                    isRecording = false;
                    document.getElementById('recordingStatusBar').classList.remove('active');
                    
                    const mainBtn = document.getElementById('mainActionButton');
                    mainBtn.classList.remove('recording-mode');
                    mainBtn.title = "إرسال";
                    document.getElementById('sendIconSvg').innerHTML = '<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>';
                };

                mediaRecorder.start();
                isRecording = true;
                document.getElementById('recordingStatusBar').classList.add('active');

                document.getElementById('recordingTimerText').textContent = `🔴 جاري تسجيل الريكورد الصوتي... (0 ثانية)`;
                recordInterval = setInterval(() => {
                    recordSeconds++;
                    document.getElementById('recordingTimerText').textContent = `🔴 جاري تسجيل الريكورد الصوتي... (${recordSeconds} ثانية)`;
                }, 1000);

                const mainBtn = document.getElementById('mainActionButton');
                mainBtn.classList.add('recording-mode');
                mainBtn.title = "إيقاف التسجيل وإنهاء الريكورد";
                document.getElementById('sendIconSvg').innerHTML = '<rect x="6" y="6" width="12" height="12" rx="2"></rect>';

            } catch (err) {
                alert('تعذر الوصول إلى الميكروفون. تأكد من منح الأذن للمتصفح.');
                isRecording = false;
            }
        }

        function stopVoiceRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
        }

        function handleMainAction() {
            if (isRecording) {
                stopVoiceRecording();
            } else {
                sendMessage();
            }
        }

        function toggleAttachmentMenu(e) {
            e.stopPropagation();
            document.getElementById('attachmentMenu').classList.toggle('active');
        }
        window.addEventListener('click', () => {
            const menu = document.getElementById('attachmentMenu');
            if (menu.classList.contains('active')) menu.classList.remove('active');
        });

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();

            if (!text && !pendingAttachment) return;

            const msgData = {
                id: 'msg_' + Date.now(),
                name: shortName,
                avatar: studentAvatar,
                rank: studentRank,
                text: text,
                attachment: pendingAttachment,
                isMe: true,
                timestamp: Date.now(),
                replies: []
            };

            let messages = await fetchMessagesFromCloud();
            messages.push(msgData);
            await saveMessagesToCloud(messages);
            await renderChatMessages();

            input.value = '';
            clearPendingAttachment();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        const pollModal = document.getElementById('pollModal');
        function openPollModal() { pollModal.classList.add('active'); document.getElementById('attachmentMenu').classList.remove('active'); }
        function closePollModal() { pollModal.classList.remove('active'); }
        function addPollOptionField() {
            const container = document.getElementById('pollOptionsContainer');
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'modal-input poll-option-input';
            input.placeholder = 'خيار إضافي';
            container.appendChild(input);
        }
        async function submitPoll() {
            const q = document.getElementById('pollQuestionInput').value.trim();
            const optionInputs = document.querySelectorAll('.poll-option-input');
            let options = [];
            optionInputs.forEach(inp => { if(inp.value.trim()) options.push(inp.value.trim()); });

            if(!q || options.length < 2) {
                alert('الرجاء كتابة سؤال التصويت وخيارين على الأقل.');
                return;
            }

            const pollData = {
                question: q,
                options: options.map(opt => ({ text: opt, votes: 0 }))
            };

            const msgData = {
                id: 'msg_' + Date.now(),
                name: shortName,
                avatar: studentAvatar,
                rank: studentRank,
                text: '',
                poll: pollData,
                isMe: true,
                timestamp: Date.now(),
                replies: []
            };

            let messages = await fetchMessagesFromCloud();
            messages.push(msgData);
            await saveMessagesToCloud(messages);
            await renderChatMessages();
            closePollModal();
            document.getElementById('pollQuestionInput').value = '';
        }

        const askModal = document.getElementById('askModal');
        function openAskModal() { askModal.classList.add('active'); document.getElementById('attachmentMenu').classList.remove('active'); }
        function closeAskModal() { askModal.classList.remove('active'); }
        async function submitAsk() {
            const askText = document.getElementById('askQuestionInput').value.trim();
            if(!askText) return;

            const msgData = {
                id: 'msg_' + Date.now(),
                name: shortName,
                avatar: studentAvatar,
                rank: studentRank,
                text: askText,
                isAsk: true,
                isMe: true,
                timestamp: Date.now(),
                replies: []
            };

            let messages = await fetchMessagesFromCloud();
            messages.push(msgData);
            await saveMessagesToCloud(messages);
            await renderChatMessages();
            closeAskModal();
            document.getElementById('askQuestionInput').value = '';
        }

        let activeThreadMsgId = null;
        const threadModal = document.getElementById('threadModal');

        async function openThreadModal(msgId) {
            activeThreadMsgId = msgId;
            const messages = await fetchMessagesFromCloud();
            const msg = messages.find(m => m.id === msgId);
            if(!msg) return;

            document.getElementById('threadOriginalMsg').innerHTML = `<b>${msg.name}:</b> ${msg.text || (msg.poll ? 'تصويت: ' + msg.poll.question : 'مرفق')}`;
            renderThreadReplies(msg.replies || []);
            threadModal.classList.add('active');
        }

        function closeThreadModal() {
            threadModal.classList.remove('active');
            activeThreadMsgId = null;
        }

        function renderThreadReplies(replies) {
            const list = document.getElementById('threadMessagesList');
            list.innerHTML = '';
            if(replies.length === 0) {
                list.innerHTML = '<div style="color:var(--text-sub); font-size:0.8rem; text-align:center; padding:10px;">لا توجد ردود بعد، كن أول الردين!</div>';
                return;
            }
            replies.forEach(r => {
                const div = document.createElement('div');
                div.style.cssText = "background:rgba(255,255,255,0.05); padding:6px 10px; border-radius:8px; margin-bottom:5px; font-size:0.82rem; word-break:break-word;";
                div.innerHTML = `<b>${r.name}:</b> ${r.text}`;
                list.appendChild(div);
            });
        }

        async function sendThreadReply() {
            const replyInput = document.getElementById('threadReplyInput');
            const text = replyInput.value.trim();
            if(!text || !activeThreadMsgId) return;

            let messages = await fetchMessagesFromCloud();
            const msgIndex = messages.findIndex(m => m.id === activeThreadMsgId);
            if(msgIndex !== -1) {
                if(!messages[msgIndex].replies) messages[msgIndex].replies = [];
                messages[msgIndex].replies.push({
                    name: shortName,
                    text: text,
                    timestamp: Date.now()
                });
                await saveMessagesToCloud(messages);
                renderThreadReplies(messages[msgIndex].replies);
                await renderChatMessages();
                replyInput.value = '';
            }
        }

        function expandImage(src) {
            document.getElementById('expandedImg').src = src;
            document.getElementById('imageModalViewer').classList.add('active');
        }
        function closeImageModal() {
            document.getElementById('imageModalViewer').classList.remove('active');
        }

        function playVoiceNote(audioUrl, duration, btnElement, fillElement, timeDisplayElement) {
            const audio = new Audio(audioUrl);
            
            if (audio.paused) {
                audio.play();
                btnElement.innerHTML = '❚❚';
                
                const updateTimer = setInterval(() => {
                    if (audio.ended || audio.paused) {
                        clearInterval(updateTimer);
                        btnElement.innerHTML = '▶';
                        fillElement.style.width = '0%';
                        timeDisplayElement.textContent = formatSeconds(duration || 0);
                        return;
                    }
                    
                    const currentSec = Math.floor(audio.currentTime);
                    const totalSec = duration || Math.ceil(audio.duration) || 1;
                    const progressPercent = (audio.currentTime / (audio.duration || totalSec)) * 100;
                    
                    fillElement.style.width = progressPercent + '%';
                    timeDisplayElement.textContent = `${formatSeconds(currentSec)} / ${formatSeconds(totalSec)}`;
                }, 100);

                audio.onended = () => {
                    clearInterval(updateTimer);
                    btnElement.innerHTML = '▶';
                    fillElement.style.width = '0%';
                    timeDisplayElement.textContent = formatSeconds(duration || 0);
                };
            } else {
                audio.pause();
                btnElement.innerHTML = '▶';
            }
        }

        function formatSeconds(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60);
            const secs = Math.floor(totalSeconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        let isFirstRender = true;
        async function renderChatMessages() {
            const container = document.getElementById('chatMessages');
            if (isFirstRender) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-sub); margin:auto; padding:20px; font-size:0.9rem;">جاري مزامنة الرسائل...</div>';
            }
            
            const messages = await fetchMessagesFromCloud();
            container.innerHTML = '';
            isFirstRender = false;

            if(messages.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-sub); margin:auto; padding:20px; font-size:0.9rem;">لا توجد رسائل نشطة حالياً.</div>';
                return;
            }

            messages.forEach((msg, index) => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message-item ${msg.name === shortName ? 'me' : ''}`;
                const rankClass = getRankClass(msg.rank);
                const displayRank = savedSettings.rankVisible ? `<span class="rank-tag ${rankClass}">${msg.rank}</span>` : '';
                const displayAvatar = savedSettings.avatarVisible ? msg.avatar : 'https://via.placeholder.com/40';
                const timeNow = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                let contentHtml = '';

                if (msg.text) {
                    contentHtml += `<div class="msg-bubble">${escapeHtml(msg.text)}</div>`;
                }

                if (msg.attachment) {
                    if (msg.attachment.type === 'media') {
                        contentHtml += `<img src="${msg.attachment.dataUrl}" class="msg-image" alt="صورة مرفقة" onclick="expandImage('${msg.attachment.dataUrl}')" title="انقر لتكبير الصورة">`;
                    } else if (msg.attachment.type === 'file') {
                        contentHtml += `<div class="msg-bubble" style="background:rgba(0,0,0,0.2); font-size:0.8rem;">📁 ملف: ${msg.attachment.name}</div>`;
                    } else if (msg.attachment.type === 'voice') {
                        const voiceId = `voice_${index}_${msg.timestamp}`;
                        const formattedDur = formatSeconds(msg.attachment.duration || 5);
                        contentHtml += `
                            <div class="voice-note-player">
                                <button class="voice-play-btn" id="btn_${voiceId}" onclick="playVoiceNote('${msg.attachment.dataUrl}', ${msg.attachment.duration || 5}, this, document.getElementById('fill_${voiceId}'), document.getElementById('time_${voiceId}'))" title="استماع">▶</button>
                                <div class="voice-body-container">
                                    <div class="voice-progress-track">
                                        <div class="voice-progress-fill" id="fill_${voiceId}"></div>
                                    </div>
                                    <div class="voice-meta-info">
                                        <span id="time_${voiceId}">${formattedDur}</span>
                                        <span>🎤 صوتي</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                }

                if (msg.poll) {
                    let optionsHtml = '';
                    msg.poll.options.forEach((opt, idx) => {
                        optionsHtml += `<div class="poll-option" onclick="alert('تم التصويت بنجاح على: ${opt.text}')">🔹 ${opt.text} (${opt.votes} صوت)</div>`;
                    });
                    contentHtml += `
                        <div class="poll-box">
                            <div style="font-weight:bold; margin-bottom:5px; font-size:0.85rem;">📊 ${escapeHtml(msg.poll.question)}</div>
                            ${optionsHtml}
                        </div>
                    `;
                }

                if (msg.isAsk || msg.poll) {
                    const repliesCount = msg.replies ? msg.replies.length : 0;
                    contentHtml += `<button class="reply-trigger-btn" onclick="openThreadModal('${msg.id}')">💬 الردود الداخلية (${repliesCount})</button>`;
                }

                msgDiv.innerHTML = `
                    <img src="${displayAvatar}" class="msg-avatar" alt="صورة" onclick="openProfile('${msg.name}')">
                    <div class="msg-content-box">
                        <div class="msg-info">
                            <span class="msg-name" onclick="openProfile('${msg.name}')">${msg.name}</span>
                            ${displayRank}
                        </div>
                        ${contentHtml}
                        <span class="msg-time">${timeNow}</span>
                    </div>
                `;
                container.appendChild(msgDiv);
            });
            container.scrollTop = container.scrollHeight;
        }

        function openProfile(name) {
            if (!savedSettings.profileAccess) {
                alert('عذراً، هذا الطالب قام بإيقاف ميزة السماح بالدخول لبروفايله الشخصي.');
                return;
            }
            window.location.href = `profile.html?student=${encodeURIComponent(name)}`;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        setInterval(renderChatMessages, 5000);
        renderChatMessages();
    </script>
</body>
</html>
