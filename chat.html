<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - قناة الدردشة</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b, #311042);
            --card-bg: rgba(30, 41, 59, 0.85);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --navbar-bg: rgba(15, 23, 42, 0.9);
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --bubble-me: #4f46e5;
            --bubble-other: rgba(51, 65, 85, 0.7);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-border: rgba(255, 255, 255, 0.15);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #e0e7ff, #f3e8ff, #f1f5f9);
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --navbar-bg: rgba(255, 255, 255, 0.9);
            --input-bg: #f8fafc;
            --input-border: #cbd5e1;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --bubble-me: #6366f1;
            --bubble-other: #e2e8f0;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            --btn-bg: rgba(0, 0, 0, 0.05);
            --btn-border: rgba(0, 0, 0, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s, border-color 0.3s; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            overflow-x: hidden;
            width: 100vw;
        }

        .chat-header-nav {
            background: var(--navbar-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 900px;
            border-radius: 18px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            gap: 10px;
        }

        .header-right-group { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

        .home-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            white-space: nowrap;
        }
        .home-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .home-btn svg { width: 16px; height: 16px; fill: currentColor; }

        .chat-main-title { font-size: 1.05rem; font-weight: 800; color: var(--text-main); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .chat-main-title svg { width: 18px; height: 18px; fill: var(--primary); }

        .header-actions-left { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        .header-icon-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-main);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            padding: 0;
        }
        .header-icon-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .header-icon-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .header-settings-btn {
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-main);
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            white-space: nowrap;
        }
        .header-settings-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .header-settings-btn svg { width: 15px; height: 15px; fill: currentColor; }

        .chat-container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(16px);
            width: 100%;
            max-width: 900px;
            height: calc(83vh - 10px);
            border-radius: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-sub-bar {
            padding: 8px 15px;
            background: rgba(15, 23, 42, 0.4);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .streak-right-group { display: flex; align-items: center; gap: 6px; }
        .streak-info-text { font-size: 0.8rem; color: var(--text-sub); font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .streak-info-text svg { width: 14px; height: 14px; fill: #f59e0b; }

        .core-reactor-wrapper {
            position: relative;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .core-reactor-ring {
            position: absolute;
            width: 100%; height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #38bdf8, #6366f1, #a855f7, #ec4899, #38bdf8);
            animation: coreSpin 4s linear infinite;
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #fff calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #fff calc(100% - 3px));
        }

        @keyframes coreSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .core-reactor-core {
            width: 24px; height: 24px;
            background: radial-gradient(circle, #6366f1 0%, #1e1b4b 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.7);
            font-size: 0.6rem; font-weight: 900; color: #fff;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .message-item { 
            display: flex; 
            gap: 8px; 
            align-items: flex-start; 
            max-width: 85%; 
            position: relative;
            cursor: grab;
            transition: transform 0.2s ease;
        }
        .message-item:active { cursor: grabbing; }
        .message-item.me { margin-right: auto; flex-direction: row-reverse; }

        .msg-avatar {
            width: 34px; height: 34px;
            border-radius: 50%; object-fit: cover;
            border: 2px solid var(--primary);
            flex-shrink: 0; cursor: pointer;
        }
        .msg-avatar:hover { opacity: 0.85; }

        .msg-content-box { display: flex; flex-direction: column; gap: 4px; width: 100%; min-width: 0; }
        .msg-info { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--text-sub); flex-wrap: wrap; }
        .msg-name { font-weight: 700; color: var(--text-main); cursor: pointer; }
        .msg-name:hover { text-decoration: underline; color: var(--primary); }
        
        .rank-tag { font-size: 0.62rem; padding: 1px 5px; border-radius: 4px; font-weight: bold; }
        .rank-weak { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .rank-medium { background: rgba(245, 158, 11, 0.15); color: #f59e0b; }
        .rank-strong { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .rank-very-strong { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
        .rank-legendary { background: rgba(236, 72, 153, 0.15); color: #ec4899; }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.88rem;
            color: var(--text-main);
            word-break: break-word;
            overflow-wrap: break-word;
            line-height: 1.4;
        }

        .message-item.me .msg-bubble { background: var(--bubble-me); color: white; border-top-left-radius: 2px; }
        .message-item:not(.me) .msg-bubble { background: var(--bubble-other); border-top-right-radius: 2px; }

        .msg-time { font-size: 0.6rem; color: var(--text-sub); margin-top: 2px; align-self: flex-end; }

        .reply-preview-box {
            background: rgba(0,0,0,0.25);
            border-right: 3px solid var(--primary);
            padding: 4px 8px;
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 0.78rem;
            color: var(--text-sub);
        }
        .reply-preview-box b { color: var(--text-main); }

        .msg-image { 
            width: 140px; 
            height: 105px; 
            border-radius: 8px; 
            margin-bottom: 4px; 
            cursor: pointer; 
            display: block; 
            object-fit: cover; 
            border: 1px solid var(--card-border);
            transition: transform 0.2s;
        }
        .msg-image:hover { opacity: 0.9; }

        .poll-box, .ask-box { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; margin-top: 5px; border: 1px solid var(--card-border); width: 100%; }
        .poll-option { background: var(--btn-bg); padding: 6px 10px; border-radius: 6px; margin-top: 5px; cursor: pointer; font-size: 0.82rem; }
        .poll-option:hover { background: var(--primary); color: white; }
        .reply-trigger-btn { background: none; border: none; color: var(--primary); font-size: 0.72rem; cursor: pointer; margin-top: 4px; font-weight: bold; text-align: right; }
        
        .voice-note-player { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            background: rgba(0, 0, 0, 0.2); 
            padding: 6px 10px; 
            border-radius: 16px; 
            max-width: 220px; 
            width: 100%; 
            border: 1px solid var(--card-border); 
        }
        .voice-play-btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            width: 28px; 
            height: 28px; 
            border-radius: 50%; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 0.75rem; 
            flex-shrink: 0; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.3); 
        }
        .voice-play-btn:hover { background: var(--primary-hover); }
        
        .voice-body-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .voice-progress-track {
            position: relative;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
        }

        .voice-progress-fill {
            position: absolute;
            top: 0;
            right: 0;
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 4px;
            transition: width 0.1s linear;
        }

        .voice-meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.62rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .recording-status-bar {
            padding: 8px 15px;
            background: rgba(239, 68, 68, 0.2);
            border-top: 1px solid #ef4444;
            display: none;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            color: #ef4444;
            font-weight: bold;
            animation: pulseRecord 1.5s infinite;
        }
        .recording-status-bar.active { display: flex; }
        @keyframes pulseRecord {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .active-reply-bar {
            padding: 6px 15px;
            background: rgba(99, 102, 241, 0.15);
            border-top: 1px solid var(--primary);
            display: none;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
        }
        .active-reply-bar.active { display: flex; }

        .attachment-preview-bar {
            padding: 8px 15px;
            background: rgba(15, 23, 42, 0.7);
            border-top: 1px solid var(--card-border);
            display: none;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
            color: var(--text-main);
            gap: 10px;
        }
        .attachment-preview-bar.active { display: flex; }
        .cancel-attachment { background: none; border: none; color: #ef4444; cursor: pointer; font-weight: bold; flex-shrink: 0; }

        .chat-input-area {
            padding: 10px 15px;
            background: rgba(15, 23, 42, 0.4);
            border-top: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .attachment-wrapper { position: relative; display: inline-block; flex-shrink: 0; }
        .clip-btn { background: none; border: none; color: var(--text-sub); cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: var(--btn-bg); border: 1px solid var(--btn-border); }
        .clip-btn:hover { color: white; background: var(--primary); border-color: var(--primary); }
        .clip-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .attachment-menu {
            position: absolute; bottom: 45px; right: 0;
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 14px; box-shadow: var(--shadow);
            display: none; flex-direction: column; gap: 4px; padding: 6px; z-index: 100; min-width: 180px;
            backdrop-filter: blur(12px);
        }
        .attachment-menu.active { display: flex; }

        .att-option {
            background: none; border: none; color: var(--text-main);
            padding: 8px 10px; text-align: right; border-radius: 8px;
            font-size: 0.82rem; cursor: pointer; display: flex; align-items: center; gap: 8px;
            white-space: nowrap;
        }
        .att-option:hover { background: var(--primary); color: white; }
        .att-option svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }

        .chat-input {
            flex: 1; padding: 10px 14px;
            background: var(--input-bg); border: 1.5px solid var(--input-border);
            border-radius: 25px; color: var(--text-main); font-size: 0.88rem; outline: none; min-width: 0;
        }
        .chat-input:focus { border-color: var(--primary); }

        .send-btn {
            background: var(--primary); color: white; border: none;
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
        }
        .send-btn:hover { background: var(--primary-hover); transform: scale(1.05); }
        .send-btn svg { width: 16px; height: 16px; fill: currentColor; transform: scaleX(-1); }

        .send-btn.recording-mode {
            background: #ef4444 !important;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.6);
            animation: pulseStopBtn 1s infinite;
        }
        @keyframes pulseStopBtn {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px;
        }
        .modal-overlay.active { display: flex; }

        .modal-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            padding: 20px; border-radius: 20px; width: 100%; max-width: 400px;
            box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; max-height: 85vh; overflow-y: auto;
        }
        .modal-card h3 { font-size: 1.05rem; color: var(--text-main); margin-bottom: 2px; }
        .setting-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: var(--text-main); padding: 6px 0; border-bottom: 1px solid var(--card-border); gap: 10px; }
        .modal-input { width: 100%; padding: 9px; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 8px; color: var(--text-main); font-size: 0.88rem; outline: none; margin-top: 4px; }
        .modal-btn { background: var(--primary); color: white; border: none; padding: 9px; border-radius: 10px; cursor: pointer; font-weight: bold; text-align: center; }
        .modal-btn:hover { background: var(--primary-hover); }
        .options-list { display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto; }

        #imageModalViewer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2000; display: none;
            justify-content: center; align-items: center; cursor: pointer; padding: 20px;
        }
        #imageModalViewer.active { display: flex; }
        #imageModalViewer img { max-width: 90%; max-height: 90%; border-radius: 12px; object-fit: contain; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <header class="chat-header-nav">
        <div class="header-right-group">
            <a href="main.html" class="home-btn">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            الرئيسية
            </a>
        </div>
        <div class="chat-main-title">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
            قناة الدردشة
        </div>
        <div class="header-actions-left">
            <button id="themeToggleBtn" class="header-icon-btn" title="تغيير الثيم">
                <svg id="themeIconSvg" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.38 5.38 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
            </button>
        </div>
    </header>

    <div class="chat-container">
        <div class="chat-sub-bar">
            <button class="header-settings-btn" onclick="openSettingsModal()" title="الإعدادات">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                الإعدادات
            </button>
            <div class="streak-right-group">
                <span class="streak-info-text">
                    <svg viewBox="0 0 24 24"><path d="M17.66 11.2C17.43 10.9 17.15 10.63 16.89 10.38C16.22 9.78 15.62 9.07 15.13 8.3C14.35 7.07 13.9 5.6 13.59 4.12C13.5 3.66 13.13 3.32 12.67 3.32C12.21 3.32 11.84 3.66 11.75 4.12C11.44 5.6 10.99 7.07 10.21 8.3C9.72 9.07 9.12 9.78 8.45 10.38C8.19 10.63 7.91 10.9 7.68 11.2C6.31 13.06 5.5 15.35 5.5 17.8C5.5 21.22 8.28 24 11.7 24C15.12 24 17.9 21.22 17.9 17.8C17.9 15.35 17.09 13.06 17.66 11.2Z"/></svg>
                    الاستريك:
                </span>
                <div class="core-reactor-wrapper" onclick="openSettingsModal()" title="طاقة الاستريك الخاصة بك">
                    <div class="core-reactor-ring"></div>
                    <div class="core-reactor-core" id="coreDayNumber">1</div>
                </div>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="recording-status-bar" id="recordingStatusBar">
            <span id="recordingTimerText">🔴 جاري تسجيل الريكورد الصوتي... (0 ثانية)</span>
        </div>

        <div class="active-reply-bar" id="activeReplyBar">
            <span id="replyBarText">الرد على: </span>
            <button class="cancel-attachment" onclick="cancelReply()">إلغاء ✕</button>
        </div>

        <div class="attachment-preview-bar" id="attachmentPreviewBar">
            <span id="previewTextName" style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">تم إرفاق ملف: </span>
            <button class="cancel-attachment" onclick="clearPendingAttachment()">إلغاء ✕</button>
        </div>

        <div class="chat-input-area">
            <div class="attachment-wrapper">
                <button class="clip-btn" onclick="toggleAttachmentMenu(event)" title="إرفاق ملفات">
                    <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.76-2.24-5-5-5S5 2.24 5 5v12.5c0 3.03 2.47 5.5 5.5 5.5s5.5-2.47 5.5-5.5V6h-1.5z"/></svg>
                </button>
                <div class="attachment-menu" id="attachmentMenu">
                    <button class="att-option" onclick="document.getElementById('mediaInput').click()">
                        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
                        صورة أو فيديو
                    </button>
                    <button class="att-option" onclick="document.getElementById('fileInput').click()">
                        <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                        مستند / ملف PDF
                    </button>
                    <button class="att-option" onclick="startVoiceRecording()">
                        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
                        تسجيل صوتي (بدء وإيقاف)
                    </button>
                    <button class="att-option" onclick="triggerGroupMention()">
                        <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                        منشن جماعي (@Everyone)
                    </button>
                    <button class="att-option" onclick="openPollModal()">
                        <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                        إنشاء تصويت
                    </button>
                    <button class="att-option" onclick="openAskModal()">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-2h2v2zm1.07-7.75l-.9.92C12.45 11.9 12 12.5 12 14h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.03-.42 1.98-1.07 2.75z"/></svg>
                        طرح سؤال (Ask)
                    </button>
                </div>
            </div>

            <input type="file" id="mediaInput" accept="image/*,video/*" style="display: none;" onchange="stageFile(this, 'media')">
            <input type="file" id="fileInput" style="display: none;" onchange="stageFile(this, 'file')">

            <input type="text" id="chatInput" class="chat-input" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">

            <button class="send-btn" id="mainActionButton" onclick="handleMainAction()" title="إرسال">
                <svg id="sendIconSvg" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            </button>
        </div>
    </div>
    <!-- نافذة الإعدادات -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-card">
            <h3>إعدادات القناة والبروفايل</h3>
            <div class="setting-item">
                <span>اسمك في الدردشة:</span>
                <input type="text" id="settingUserName" class="modal-input" placeholder="اسمك المستعار">
            </div>
            <div class="setting-item">
                <span>رابط صورتك الشخصية (Avatar URL):</span>
                <input type="text" id="settingAvatarUrl" class="modal-input" placeholder="https://...">
            </div>
            <div class="setting-item">
                <span>رتبتك الحالية:</span>
                <select id="settingRankSelect" class="modal-input">
                    <option value="weak">مبتدئ (ضعيف)</option>
                    <option value="medium">متوسط</option>
                    <option value="strong">قوي</option>
                    <option value="very-strong">محترف (قوي جداً)</option>
                    <option value="legendary">أسطوري</option>
                </select>
            </div>
            <div class="setting-item">
                <span>أيام الاستريك (Streak):</span>
                <input type="number" id="settingStreakDays" class="modal-input" min="1" max="999">

            <button class="modal-btn" onclick="saveSettings()">حفظ التعديلات</button>
            <button class="modal-btn" style="background:var(--btn-bg); color:var(--text-main); border:1px solid var(--card-border);" onclick="closeSettingsModal()">إغلاق</button>
        </div>
    </div>

    <!-- نافذة التصويت -->
    <div class="modal-overlay" id="pollModal">
        <div class="modal-card">
            <h3>إنشاء تصويت جديد</h3>
            <input type="text" id="pollQuestionInput" class="modal-input" placeholder="سؤال التصويت؟">
            <div style="font-size: 0.8rem; color: var(--text-sub); margin-top: 4px;">خيارات التصويت:</div>
            <div class="options-list" id="pollOptionsListContainer">
                <input type="text" class="modal-input poll-opt-field" placeholder="الخيار الأول">
                <input type="text" class="modal-input poll-opt-field" placeholder="الخيار الثاني">
            </div>
            <button class="modal-btn" style="background: var(--btn-bg); color: var(--text-main); border:1px solid var(--card-border); font-size:0.8rem; padding:5px;" onclick="addPollOptionField()">+ إضافة خيار آخر</button>
            <button class="modal-btn" onclick="submitPollCreation()">إرسال التصويت للقناة</button>
            <button class="modal-btn" style="background:var(--btn-bg); color:var(--text-main); border:1px solid var(--card-border);" onclick="closePollModal()">إلغاء</button>
        </div>

    <!-- نافذة طرح سؤال (Ask) -->
    <div class="modal-overlay" id="askModal">
        <div class="modal-card">
            <h3>طرح سؤال دراسي (Ask)</h3>
            <textarea id="askQuestionText" class="modal-input" rows="4" placeholder="اكتب سؤالك ليجيب عليه أعضاء القناة..."></textarea>
            <button class="modal-btn" onclick="submitAskCreation()">نشر السؤال</button>
            <button class="modal-btn" style="background:var(--btn-bg); color:var(--text-main); border:1px solid var(--card-border);" onclick="closeAskModal()">إلغاء</button>
        </div>
    </div>

    <!-- عارض الصور المكبرة -->
    <div id="imageModalViewer" onclick="closeImageModal()">
        <img id="expandedModalImage" src="" alt="صورة مكبرة">
    </div>

    <script>
        // إعدادات البروفايل الافتراضية
        let userProfile = {
            name: "طالب نشيط",
            avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&auto=format&fit=crop&q=80",
            rank: "strong",
            streak: 5
        };

        // تحميل البيانات المحفوظة إن وجدت
        if (localStorage.getItem('studyChannelProfile')) {
            try {
                userProfile = JSON.parse(localStorage.getItem('studyChannelProfile'));
            } catch(e) {}
        }

        document.getElementById('coreDayNumber').innerText = userProfile.streak;

        // رسائل تجريبية مبدئية في القناة
        let chatMessages = [
            {
                id: 1,
                sender: "سارة أحمد",
                avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100&auto=format&fit=crop&q=80",
                rank: "very-strong",
                text: "أهلاً بالجميع في قناة الدردشة الخاصة برحلتنا الدراسية! مين بدا بحل الواجب؟ 🔥",
                time: "09:30 ص",
                isMe: false,
                replyTo: null,
                mediaType: null,
                mediaUrl: null,
                pollData: null,
                askData: null
            },
            {
                id: 2,
                sender: "محمد خالد",
                avatar: "https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100&auto=format&fit=crop&q=80",
                rank: "legendary",
                text: "أنا خلصت الفيزياء وبصدد مراجعة الرياضيات الآن، @Everyone شدوا حيلكم!",
                time: "09:32 ص",
                isMe: false,
                replyTo: null,
                mediaType: null,
                mediaUrl: null,
                pollData: null,
                askData: null
            }
        ];

        if (localStorage.getItem('studyChannelMessages')) {
            try {
                chatMessages = JSON.parse(localStorage.getItem('studyChannelMessages'));
            } catch(e) {}
        }

        let activeReplyMessageId = null;
        let pendingAttachment = null; // { type: 'image'|'file'|'voice', url: '', name: '' }
        let isRecordingActive = false;
        let recordingInterval = null;
        let recordingSeconds = 0;

        // ثيم الألوان
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIconSvg = document.getElementById('themeIconSvg');
        let currentTheme = localStorage.getItem('studyChannelTheme') || 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);

        themeToggleBtn.addEventListener('click', () => {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            localStorage.setItem('studyChannelTheme', currentTheme);
        });

        // إغلاق قوائم الإرفاق عند النقر خارجها
        window.addEventListener('click', (e) => {
            const menu = document.getElementById('attachmentMenu');
            const clipBtn = document.querySelector('.clip-btn');
            if (menu.classList.contains('active') && !menu.contains(e.target) && !clipBtn.contains(e.target)) {
                menu.classList.remove('active');
            }
        });

        function toggleAttachmentMenu(e) {
            e.stopPropagation();
            const menu = document.getElementById('attachmentMenu');
            menu.classList.toggle('active');
        }

        function renderMessages() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';

            chatMessages.forEach(msg => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `message-item ${msg.isMe ? 'me' : ''}`;
                itemDiv.dataset.id = msg.id;

                let rankClass = `rank-${msg.rank || 'medium'}`;
                let rankName = {
                    'weak': 'مبتدئ',
                    'medium': 'متوسط',
                    'strong': 'قوي',
                    'very-strong': 'محترف',
                    'legendary': 'أسطوري'
                }[msg.rank || 'medium'];

                let replyHtml = '';
                if (msg.replyTo) {
                    const originalMsg = chatMessages.find(m => m.id === msg.replyTo);
                    if (originalMsg) {
                        replyHtml = `
                            <div class="reply-preview-box">
                                <b>${originalMsg.sender}:</b> ${originalMsg.text ? originalMsg.text.substring(0, 40) + '...' : 'ملف مرفق'}
                            </div>
                        `;
                    }
                }

                let mediaHtml = '';
                if (msg.mediaType === 'image') {
                    mediaHtml = `<img src="${msg.mediaUrl}" class="msg-image" onclick="expandImage('${msg.mediaUrl}')" alt="صورة مرفقة">`;
                } else if (msg.mediaType === 'file') {
                    mediaHtml = `
                        <a href="${msg.mediaUrl}" download="${msg.mediaName || 'file'}" style="display:flex; align-items:center; gap:6px; background:rgba(0,0,0,0.2); padding:8px 10px; border-radius:8px; color:var(--text-main); text-decoration:none; font-size:0.82rem; margin-bottom:4px; border:1px solid var(--card-border);">
                            <svg style="width:18px;height:18px;fill:var(--primary);" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px;">${msg.mediaName || 'مستند مرفق'}</span>
                        </a>
                    `;
                } else if (msg.mediaType === 'voice') {
                    mediaHtml = `
                        <div class="voice-note-player">
                            <button class="voice-play-btn" onclick="playVoiceNote(this, '${msg.mediaUrl}')">▶</button>
                            <div class="voice-body-container">
                                <div class="voice-progress-track" onclick="seekVoiceNote(event, this)">
                                    <div class="voice-progress-fill"></div>
                                </div>
                                <div class="voice-meta-info">
                                    <span>ريكورد صوتي</span>
                                    <span>${msg.mediaName || '0:15'}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                let pollHtml = '';
                if (msg.pollData) {
                    let optionsItems = msg.pollData.options.map((opt, idx) => `
                        <div class="poll-option" onclick="votePoll(${msg.id}, ${idx})">
                            ${opt.text} <span style="float:left; font-weight:bold; color:var(--primary);">${opt.votes} أصوات</span>
                        </div>
                    `).join('');
                    pollHtml = `
                        <div class="poll-box">
                            <div style="font-weight:bold; font-size:0.88rem; margin-bottom:6px; color:var(--text-main);">📊 ${msg.pollData.question}</div>
                            ${optionsItems}
                        </div>
                    `;
                }

                let askHtml = '';
                if (msg.askData) {
                    askHtml = `
                        <div class="ask-box">
                            <div style="font-weight:bold; font-size:0.88rem; margin-bottom:6px; color:var(--primary);">❓ سؤال استفساري:</div>
                            <div style="font-size:0.85rem; margin-bottom:8px;">${msg.askData.question}</div>
                            <button class="modal-btn" style="padding:4px 8px; font-size:0.75rem;" onclick="triggerReplyToMessage(${msg.id})">الإجابة على السؤال</button>
                        </div>
                    `;
                }

                itemDiv.innerHTML = `
                    <img src="${msg.avatar}" class="msg-avatar" alt="صورة">
                    <div class="msg-content-box">
                        <div class="msg-info">
                            <span class="msg-name">${msg.sender}</span>
                            <span class="rank-tag ${rankClass}">${rankName}</span>
                        </div>
                        <div class="msg-bubble">
                            ${replyHtml}
                            ${mediaHtml}
                            ${pollHtml}
                            ${askHtml}
                            ${msg.text ? formatTextWithMentions(msg.text) : ''}
                            <div class="msg-time">${msg.time}</div>
                        </div>
                        <button class="reply-trigger-btn" onclick="triggerReplyToMessage(${msg.id})">↩ الرد</button>
                    </div>
                `;
                container.appendChild(itemDiv);
            });
            container.scrollTop = container.scrollHeight;
        }

        function formatTextWithMentions(text) {
            return text.replace(/@Everyone/g, '<span style="background:rgba(99,102,241,0.2); color:var(--primary); padding:1px 6px; border-radius:4px; font-weight:bold;">@Everyone</span>');
        }

        // إرسال الرسائل العادية أو المرفقة
        function handleMainAction() {
            if (isRecordingActive) {
                stopVoiceRecordingAndStage();
                return;
            }

            const input = document.getElementById('chatInput');
            const text = input.value.trim();

            if (!text && !pendingAttachment) return;

            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const newMsg = {
                id: Date.now(),
                sender: userProfile.name,
                avatar: userProfile.avatar,
                rank: userProfile.rank,
                text: text,
                time: timeString,
                isMe: true,
                replyTo: activeReplyMessageId,
                mediaType: pendingAttachment ? pendingAttachment.type : null,
                mediaUrl: pendingAttachment ? pendingAttachment.url : null,
                mediaName: pendingAttachment ? pendingAttachment.name : null,
                pollData: null,
                askData: null
            };

            chatMessages.push(newMsg);
            saveAndRerender();

            input.value = '';
            cancelReply();
            clearPendingAttachment();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                handleMainAction();
            }
        }

        function saveAndRerender() {
            localStorage.setItem('studyChannelMessages', JSON.stringify(chatMessages));
            renderMessages();
        }

        // إرفاق الملفات والصور
        function stageFile(inputElement, type) {
            const file = inputElement.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                pendingAttachment = {
                    type: type === 'media' ? (file.type.startsWith('video') ? 'video' : 'image') : 'file',
                    url: e.target.result,
                    name: file.name
                };

                const bar = document.getElementById('attachmentPreviewBar');
                const nameSpan = document.getElementById('previewTextName');
                nameSpan.innerText = `تم إرفاق ملف: ${file.name}`;
                bar.classList.add('active');
            };
            reader.readAsDataURL(file);
            document.getElementById('attachmentMenu').classList.remove('active');
        }

        function clearPendingAttachment() {
            pendingAttachment = null;
            document.getElementById('attachmentPreviewBar').classList.remove('active');
            document.getElementById('mediaInput').value = '';
            document.getElementById('fileInput').value = '';
        }

        // نظام تسجيل الريكورد الصوتي الوهمي الواقعي
        function startVoiceRecording() {
            document.getElementById('attachmentMenu').classList.remove('active');
            isRecordingActive = true;
            recordingSeconds = 0;

            const statusBar = document.getElementById('recordingStatusBar');
            const timerText = document.getElementById('recordingTimerText');
            statusBar.classList.add('active');

            const mainBtn = document.getElementById('mainActionButton');
            mainBtn.classList.add('recording-mode');
            document.getElementById('sendIconSvg').innerHTML = '<path d="M6 6h12v12H6z"/>'; // أيقونة إيقاف

            recordingInterval = setInterval(() => {
                recordingSeconds++;
                timerText.innerText = `🔴 جاري تسجيل الريكورد الصوتي... (${recordingSeconds} ثانية)`;
            }, 1000);
        }

        function stopVoiceRecordingAndStage() {
            clearInterval(recordingInterval);
            isRecordingActive = false;

            document.getElementById('recordingStatusBar').classList.remove('active');
            const mainBtn = document.getElementById('mainActionButton');
            mainBtn.classList.remove('recording-mode');
            document.getElementById('sendIconSvg').innerHTML = '<path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>';

            let mins = Math.floor(recordingSeconds / 60);
            let secs = recordingSeconds % 60;
            let timeStr = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            if (recordingSeconds === 0) timeStr = "0:05";

            pendingAttachment = {
                type: 'voice',
                url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', // عينة صوتية للاختبار
                name: timeStr
            };

            const bar = document.getElementById('attachmentPreviewBar');
            document.getElementById('previewTextName').innerText = `تم تسجيل ريكورد صوتي بمدة (${timeStr})`;
            bar.classList.add('active');
        }

        // مشغل الصوت للريكوردات
        function playVoiceNote(btnEl, audioUrl) {
            let audio = btnEl._audioObj;
            if (!audio) {
                audio = new Audio(audioUrl);
                btnEl._audioObj = audio;
                audio.ontimeupdate = () => {
                    let progressContainer = btnEl.parentElement.querySelector('.voice-progress-fill');
                    if (progressContainer && audio.duration) {
                        let percent = (audio.currentTime / audio.duration) * 100;
                        progressContainer.style.width = percent + '%';
                    }
                };
                audio.onended = () => {
                    btnEl.innerText = "▶";
                };
            }

            if (audio.paused) {
                audio.play().catch(() => {});
                btnEl.innerText = "❚❚";
            } else {
                audio.pause();
                btnEl.innerText = "▶";
            }
        }

        function seekVoiceNote(event, trackElement) {
            const rect = trackElement.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const width = rect.width;
            const percent = clickX / width;
            
            const playerBox = trackElement.closest('.voice-note-player');
            const playBtn = playerBox.querySelector('.voice-play-btn');
            if (playBtn && playBtn._audioObj) {
                playBtn._audioObj.currentTime = playBtn._audioObj.duration * percent;
            }
        }

        // نظام المنشن الجماعي
        function triggerGroupMention() {
            document.getElementById('attachmentMenu').classList.remove('active');
            const input = document.getElementById('chatInput');
            input.value += " @Everyone ";
            input.focus();
        }

        // نظام الرد على رسالة
        function triggerReplyToMessage(msgId) {
            activeReplyMessageId = msgId;
            const original = chatMessages.find(m => m.id === msgId);
            const replyBar = document.getElementById('activeReplyBar');
            const replyText = document.getElementById('replyBarText');
            if (original) {
                replyText.innerHTML = `الرد على <b>${original.sender}</b>: ${original.text ? original.text.substring(0, 30) : 'ملف'}`;
                replyBar.classList.add('active');
            }
            document.getElementById('chatInput').focus();
        }

        function cancelReply() {
            activeReplyMessageId = null;
            document.getElementById('activeReplyBar').classList.remove('active');
        }

        // نافذة التصويت
        function openPollModal() {
            document.getElementById('attachmentMenu').classList.remove('active');
            document.getElementById('pollModal').classList.add('active');
        }
        function closePollModal() {
            document.getElementById('pollModal').classList.remove('active');
        }
        function addPollOptionField() {
            const container = document.getElementById('pollOptionsListContainer');
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'modal-input poll-opt-field';
            input.placeholder = 'خيار إضافي';
            container.appendChild(input);
        }
        function submitPollCreation() {
            const q = document.getElementById('pollQuestionInput').value.trim();
            const optFields = document.querySelectorAll('.poll-opt-field');
            let options = [];
            optFields.forEach(f => {
                if (f.value.trim()) {
                    options.push({ text: f.value.trim(), votes: 0 });
                }
            });

            if (!q || options.length < 2) {
                alert('الرجاء كتابة السؤال مع خيارين على الأقل.');
                return;
            }

            const now = new Date();
            const newMsg = {
                id: Date.now(),
                sender: userProfile.name,
                avatar: userProfile.avatar,
                rank: userProfile.rank,
                text: "",
                time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                isMe: true,
                replyTo: null,
                mediaType: null,
                mediaUrl: null,
                pollData: { question: q, options: options },
                askData: null
            };

            chatMessages.push(newMsg);
            saveAndRerender();
            closePollModal();
            document.getElementById('pollQuestionInput').value = '';
        }

        function votePoll(msgId, optIndex) {
            const msg = chatMessages.find(m => m.id === msgId);
            if (msg && msg.pollData && msg.pollData.options[optIndex]) {
                msg.pollData.options[optIndex].votes++;
                saveAndRerender();
            }
        }

        // نافذة طرح سؤال Ask
        function openAskModal() {
            document.getElementById('attachmentMenu').classList.remove('active');
            document.getElementById('askModal').classList.add('active');
        }
        function closeAskModal() {
            document.getElementById('askModal').classList.remove('active');
        }
        function submitAskCreation() {
            const qText = document.getElementById('askQuestionText').value.trim();
            if (!qText) return;

            const now = new Date();
            const newMsg = {
                id: Date.now(),
                sender: userProfile.name,
                avatar: userProfile.avatar,
                rank: userProfile.rank,
                text: "",
                time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                isMe: true,
                replyTo: null,
                mediaType: null,
                mediaUrl: null,
                pollData: null,
                askData: { question: qText }
            };

            chatMessages.push(newMsg);
            saveAndRerender();
            closeAskModal();
            document.getElementById('askQuestionText').value = '';
        }

        // نافذة الإعدادات
        function openSettingsModal() {
            document.getElementById('settingUserName').value = userProfile.name;
            document.getElementById('settingAvatarUrl').value = userProfile.avatar;
            document.getElementById('settingRankSelect').value = userProfile.rank;
            document.getElementById('settingStreakDays').value = userProfile.streak;
            document.getElementById('settingsModal').classList.add('active');
        }
        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.remove('active');
        }
        function saveSettings() {
            userProfile.name = document.getElementById('settingUserName').value.trim() || "طالب نشيط";
            userProfile.avatar = document.getElementById('settingAvatarUrl').value.trim() || userProfile.avatar;
            userProfile.rank = document.getElementById('settingRankSelect').value;
            userProfile.streak = parseInt(document.getElementById('settingStreakDays').value) || 1;

            localStorage.setItem('studyChannelProfile', JSON.stringify(userProfile));
            document.getElementById('coreDayNumber').innerText = userProfile.streak;
            closeSettingsModal();
            renderMessages();
        }

        // عارض الصور المكبرة
        function expandImage(url) {
            document.getElementById('expandedModalImage').src = url;
            document.getElementById('imageModalViewer').classList.add('active');
        }
        function closeImageModal() {
            document.getElementById('imageModalViewer').classList.remove('active');
        }

        // التشغيل الأولي لعرض الرسائل
        renderMessages();
    </script>
</body>
</html>
