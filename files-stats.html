<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - إحصائيات ونتائج الحصص</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.12);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            --th-bg: rgba(255, 255, 255, 0.04);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            --th-bg: rgba(0, 0, 0, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.85rem; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 12px; min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 10px 16px; border-radius: 20px;
            margin-bottom: 15px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        .header-right-side { display: flex; align-items: center; }
        .btn-home-link {
            display: inline-flex; align-items: center; gap: 5px; background: rgba(255, 255, 255, 0.05);
            padding: 5px 12px; border-radius: 15px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.75rem;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .header-center-box { display: flex; align-items: center; justify-content: center; }
        .platform-title-box { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; font-weight: 700; color: var(--text-main); white-space: nowrap; }
        
        .header-left-side { display: flex; align-items: center; gap: 8px; }
        .btn-theme-toggle {
            background-color: rgba(255, 255, 255, 0.04); color: var(--text-main); border: 1px solid var(--border-color);
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 0.85rem; display: flex; align-items: center; justify-content: center;
        }
        .btn-theme-toggle:hover { background-color: var(--hover-bg); border-color: var(--primary); }

        .admin-nav-bar {
            background-color: var(--bg-card); padding: 12px; border-radius: 14px;
            margin-bottom: 15px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }
        .admin-tabs-group { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 8px; 
            width: 100%; 
        }
        @media (min-width: 768px) {
            .admin-tabs-group { grid-template-columns: repeat(4, 1fr); }
        }
        .btn-tab {
            background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--border-color);
            padding: 8px 10px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.78rem; text-align: center; text-decoration: none; display: block; width: 100%;
        }
        .btn-tab.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 3px 10px rgba(99, 102, 241, 0.3); }

        .section-box {
            background-color: var(--bg-card); border-radius: 14px; box-shadow: var(--shadow);
            padding: 16px; margin-bottom: 15px; border: 1px solid var(--border-color); border-top: 3px solid var(--primary);
        }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
        .section-header h2 { color: var(--text-main); font-size: 0.95rem; font-weight: 700; }

        .lessons-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
        .lesson-card-item {
            background: var(--th-bg); border: 1px solid var(--border-color); padding: 12px; border-radius: 10px;
            display: flex; flex-direction: column; justify-content: space-between; gap: 8px; position: relative;
        }
        .btn-delete-lesson {
            position: absolute; top: 10px; left: 10px; background: var(--danger); color: white; border: none;
            padding: 3px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; cursor: pointer;
        }
        .btn-stats-view {
            background: var(--primary); color: white; border: none; padding: 7px 10px; border-radius: 8px;
            font-weight: bold; cursor: pointer; font-size: 0.8rem; width: 100%; text-align: center; box-shadow: 0 3px 8px rgba(99, 102, 241, 0.3);
        }
        .btn-stats-view:hover { background: var(--primary-hover); }

        table { width: 100%; border-collapse: collapse; text-align: right; margin-top: 10px; font-size: 0.8rem; white-space: nowrap; }
        th, td { padding: 9px 12px; border-bottom: 1px solid var(--border-color); color: var(--text-main); }
        th { background: var(--th-bg); color: var(--text-main); font-weight: 700; }
        
        .student-profile-link { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--primary); font-weight: bold; }
        .student-profile-link:hover { text-decoration: underline; }
        .student-avatar { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); }

        /* نافذة بروفايل الطالب المنبثقة */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s; padding: 15px;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-card {
            background: var(--bg-card); width: 100%; max-width: 500px;
            border-radius: 14px; border: 1px solid var(--border-color);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); overflow: hidden;
            display: flex; flex-direction: column; max-height: 85vh;
        }
        .modal-header {
            padding: 12px 16px; background: var(--bg-card); color: var(--text-main);
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color); font-weight: bold; font-size: 0.9rem;
        }
        .close-modal { background: none; border: none; font-size: 1.1rem; color: var(--text-main); cursor: pointer; }
        .modal-body { padding: 16px; overflow-y: auto; flex: 1; text-align: right; font-size: 0.82rem; line-height: 1.6; }

        .hidden { display: none !important; }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <!-- الهيدر الموحد: الرئيسية بترجع لـ admin.html -->
        <header class="platform-header">
            <div class="header-right-side"><a href="admin.html" class="btn-home-link">🏠 الرئيسية</a></div>
            <div class="header-center-box"><div class="platform-title-box"><span>إحصائيات ومتابعة الحصص 📊</span></div></div>
            <div class="header-left-side"><button class="btn-theme-toggle" id="themeToggleBtn" title="تغيير الوضع">☀️</button></div>
        </header>

        <!-- شريط التنقل الموحد والمتصل بجميع الصفحات -->
        <nav class="admin-nav-bar">
            <div class="admin-tabs-group">
                <a href="files-exam-create.html" class="btn-tab">إنشاء امتحان 📝</a>
                <a href="files-lessons.html" class="btn-tab">الحصص 📚</a>
                <a href="files-settings.html" class="btn-tab">الإعدادات ⚙️</a>
                <a href="files-stats.html" class="btn-tab active">الإحصائيات 📊</a>
            </div>
        </nav>

        <!-- قائمة الحصص المنشورة مع زر الحذف في أقصى اليسار فوق كل بطاقة -->
        <div class="section-box">
            <div class="section-header"><h2>قائمة الحصص المتاحة لمتابعة تفاعل الطلاب 📈</h2></div>
            <div id="lessonsCardsContainer" class="lessons-grid">
                <p style="text-align: center; opacity: 0.7; padding: 15px; font-size: 0.82rem; grid-column: 1 / -1;">جاري جلب الحصص...</p>
            </div>
        </div>

        <!-- جدول تفاعل الطلاب للحصة المحددة -->
        <div class="section-box hidden" id="statsTableContainerBox">
            <div class="section-header">
                <h2 id="statsTableTitle">تقرير تفاعل الطلاب للحصة</h2>
                <button onclick="document.getElementById('statsTableContainerBox').classList.add('hidden')" style="background:var(--danger); color:white; border:none; padding:5px 12px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:0.75rem;">إغلاق التقرير ✕</button>
            </div>
            <div style="overflow-x: auto;">
                <table id="lessonStatsTable">
                    <thead>
                        <tr>
                            <th>الطالب</th>
                            <th>ملازم الشرح 📄</th>
                            <th>فيديو الشرح 🎬</th>
                            <th>ملازم التلخيص 📑</th>
                            <th>امتحان الحصة 📝</th>
                        </tr>
                    </thead>
                    <tbody id="lessonStatsTableBody">
                        <!-- يتم ملؤها برمجياً -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- نافذة استعراض بروفايل ومعلومات الطالب -->
    <div class="modal-overlay" id="studentProfileModal" onclick="if(event.target===this) closeStudentModal()">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalStudentNameTitle">ملف الطالب الشخصي</h3>
                <button class="close-modal" onclick="closeStudentModal()">✕</button>
            </div>
            <div class="modal-body" id="modalStudentBodyContent">
                <!-- تفاصيل إحصائيات الطالب -->
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let globalLessonsList = [];
        let globalStudentsList = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await fetchLessonsAndStudents();
            } else {
                window.location.href = 'login.html';
            }
        });

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const bodyElement = document.body;
        const savedTheme = localStorage.getItem('platform_theme') || 'dark';
        bodyElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            let nextTheme = bodyElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            bodyElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('platform_theme', nextTheme);
            themeToggleBtn.textContent = nextTheme === 'dark' ? '☀️' : '🌙';
        });

        async function fetchLessonsAndStudents() {
            try {
                const lessonsSnap = await getDocs(collection(db, "lessons"));
                globalLessonsList = [];
                const container = document.getElementById('lessonsCardsContainer');
                
                lessonsSnap.forEach((docSnap) => {
                    globalLessonsList.push({ id: docSnap.id, ...docSnap.data() });
                });

                if (globalLessonsList.length === 0) {
                    container.innerHTML = `<p style="text-align: center; opacity: 0.7; padding: 15px; font-size: 0.82rem; grid-column: 1 / -1;">لا توجد حصص منشورة حتى الآن.</p>`;
                    return;
                }

                let html = "";
                globalLessonsList.forEach((les) => {
                    html += `
                        <div class="lesson-card-item">
                            <button class="btn-delete-lesson" onclick="deleteLesson('${les.id}')" title="حذف الحصة">حذف 🗑️</button>
                            <div>
                                <h3 style="font-size: 0.88rem; color: var(--text-main); margin-bottom: 4px; padding-left: 45px;">🎬 الحصة ${les.number || 1}: ${les.title || 'بدون عنوان'}</h3>
                                <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 10px;">المادة: ${les.subject || 'عام'} | الصف: ${les.targetGroup || 'عام'}</p>
                            </div>
                            <button class="btn-stats-view" onclick="loadLessonStatsData('${les.id}')">عرض تقرير الطلاب 📊</button>
                        </div>`;
                });
                container.innerHTML = html;

                const studentsSnap = await getDocs(collection(db, "users"));
                globalStudentsList = [];
                studentsSnap.forEach((docSnap) => {
                    globalStudentsList.push({ id: docSnap.id, ...docSnap.data() });
                });
            } catch (e) {
                console.error("خطأ في جلب بيانات الإحصائيات:", e);
            }
        }

        window.deleteLesson = async function(lessonId) {
            if (confirm("هل أنت متأكد من رغبتك في حذف هذه الحصة نهائياً؟")) {
                try {
                    await deleteDoc(doc(db, "lessons", lessonId));
                    alert("✔ تم حذف الحصة بنجاح.");
                    await fetchLessonsAndStudents();
                    document.getElementById('statsTableContainerBox').classList.add('hidden');
                } catch (e) {
                    console.error(e);
                    alert("حدث خطأ أثناء حذف الحصة.");
                }
            }
        };

        window.loadLessonStatsData = function(lessonId) {
            let boxContainer = document.getElementById('statsTableContainerBox');
            let lesson = globalLessonsList.find(l => l.id === lessonId);
            if (!lesson) return;

            document.getElementById('statsTableTitle').textContent = `تقرير تفاعل الطلاب لحصة: ${lesson.title}`;
            const tbody = document.getElementById('lessonStatsTableBody');
            
            if (globalStudentsList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:15px;">لا توجد بيانات طلاب مسجلين حالياً.</td></tr>`;
                boxContainer.classList.remove('hidden');
                boxContainer.scrollIntoView({ behavior: 'smooth' });
                return;
            }

            let html = "";
            globalStudentsList.forEach((student) => {
                let name = student.name || 'طالب المنصة';
                let avatar = student.avatar || 'https://www.w3schools.com/howto/img_avatar.png';
                let studentIdJson = JSON.stringify(student.id);

                let activity = (student.lessonsActivity || {})[lessonId] || { studyNotes: false, video: false, summary: false, examScore: null };

                let studyBadge = activity.studyNotes ? '<span style="color:var(--success); font-weight:bold;">✔ قرأ</span>' : '<span style="color:var(--danger);">❌ لم يفتح</span>';
                let videoBadge = activity.video ? '<span style="color:var(--success); font-weight:bold;">✔ شاهد</span>' : '<span style="color:var(--danger);">❌ لم يشاهد</span>';
                let summaryBadge = activity.summary ? '<span style="color:var(--success); font-weight:bold;">✔ قرأ</span>' : '<span style="color:var(--danger);">❌ لم يفتح</span>';
                let examBadge = activity.examScore !== null && activity.examScore !== undefined ? `<span style="color:var(--success); font-weight:bold;">✔ ${activity.examScore} درجات</span>` : '<span style="color:#f59e0b; font-weight:bold;">⏳ لم يختبر</span>';

                html += `
                    <tr>
                        <td>
                            <div class="student-profile-link" onclick='openStudentProfile(${JSON.stringify(student)})'>
                                <img src="${avatar}" class="student-avatar" alt="صورة">
                                <b>${name}</b>
                            </div>
                        </td>
                        <td>${studyBadge}</td>
                        <td>${videoBadge}</td>
                        <td>${summaryBadge}</td>
                        <td>${examBadge}</td>
                    </tr>`;
            });

            tbody.innerHTML = html;
            boxContainer.classList.remove('hidden');
            boxContainer.scrollIntoView({ behavior: 'smooth' });
        };

        window.openStudentProfile = function(student) {
            document.getElementById('modalStudentNameTitle').textContent = `ملف الطالب: ${student.name || 'طالب المنصة'}`;
            
            let email = student.email || 'غير متوفر';
            let phone = student.phone || 'غير متوفر';
            let totalPoints = student.points || 0;
            let examsCount = Object.keys(student.examResults || {}).length;

            let bodyHtml = `
                <div style="display:flex; align-items:center; gap:12px; margin-bottom:15px; background:var(--th-bg); padding:10px; border-radius:10px; border:1px solid var(--border-color);">
                    <img src="${student.avatar || 'https://www.w3schools.com/howto/img_avatar.png'}" style="width:50px; height:50px; border-radius:50%; object-fit:cover; border:2px solid var(--primary);">
                    <div>
                        <h4 style="font-size:0.95rem; color:var(--text-main);">${student.name || 'طالب'}</h4>
                        <p style="font-size:0.75rem; color:var(--text-muted);">البريد: ${email}</p>
                        <p style="font-size:0.75rem; color:var(--text-muted);">الهاتف: ${phone}</p>
                    </div>
                </div>
                <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; margin-bottom:15px;">
                    <div style="background:var(--th-bg); padding:10px; border-radius:8px; border:1px solid var(--border-color); text-align:center;">
                        <span style="font-size:0.75rem; color:var(--text-muted); display:block;">إجمالي النقاط ⭐</span>
                        <strong style="font-size:1.1rem; color:var(--primary);">${totalPoints}</strong>
                    </div>
                    <div style="background:var(--th-bg); padding:10px; border-radius:8px; border:1px solid var(--border-color); text-align:center;">
                        <span style="font-size:0.75rem; color:var(--text-muted); display:block;">الامتحانات المجتازة 📝</span>
                        <strong style="font-size:1.1rem; color:var(--success);">${examsCount}</strong>
                    </div>
                </div>
                <div style="font-weight:bold; margin-bottom:6px; color:var(--text-main);">📌 تفاصيل تفاعل الإحصائيات:</div>
                <p style="font-size:0.78rem; color:var(--text-muted);">هذا الطالب مسجل بانتظام في المنصة، وتتم متابعة تفاعله مع جميع الحصص والملازم والامتحانات لحظياً من خلال لوحة التحكم الخاصة بك.</p>
            `;

            document.getElementById('modalStudentBodyContent').innerHTML = bodyHtml;
            document.getElementById('studentProfileModal').classList.add('active');
        };

        window.closeStudentModal = function() {
            document.getElementById('studentProfileModal').classList.add('active');
            document.getElementById('studentProfileModal').classList.remove('active');
        };
    </script>
</body>
</html>
