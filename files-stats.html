<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رحلة دراسية - إحصائيات ونتائج الحصص</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --hover-bg: rgba(99, 102, 241, 0.12);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            --th-bg: rgba(255, 255, 255, 0.04);
        }

        [data-theme="light"] {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #059669;
            --danger: #dc2626;
            --hover-bg: rgba(79, 70, 229, 0.08);
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
            --th-bg: rgba(0, 0, 0, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 0.9rem; transition: background 0.3s ease, color 0.3s ease, border-color 0.3s ease; }
        
        body { background-color: var(--bg-main); color: var(--text-main); padding: 15px; min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        .platform-header {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--bg-card); padding: 12px 18px; border-radius: 30px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        .header-right-side { display: flex; align-items: center; }
        .btn-home-link {
            display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color);
            text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.8rem;
        }
        .btn-home-link:hover { background: var(--hover-bg); border-color: var(--primary); }

        .header-center-box { display: flex; align-items: center; justify-content: center; }
        .platform-title-box { display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: 700; color: var(--text-main); white-space: nowrap; }
        
        .header-left-side { display: flex; align-items: center; gap: 10px; }
        .btn-theme-toggle {
            background-color: rgba(255, 255, 255, 0.04); color: var(--text-main); border: 1px solid var(--border-color);
            width: 38px; height: 38px; border-radius: 50%; cursor: pointer; font-size: 0.9rem; display: flex; align-items: center; justify-content: center;
        }
        .btn-theme-toggle:hover { background-color: var(--hover-bg); border-color: var(--primary); }

        .admin-nav-bar {
            display: flex; justify-content: center; align-items: center;
            background-color: var(--bg-card); padding: 12px 16px; border-radius: 16px;
            margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); gap: 10px; flex-wrap: wrap;
        }
        .admin-tabs-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
        .btn-tab {
            background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--border-color);
            padding: 8px 16px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem; flex: 1; min-width: 140px; text-align: center; text-decoration: none; display: inline-block;
        }
        .btn-tab.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        .section-box {
            background-color: var(--bg-card); border-radius: 16px; box-shadow: var(--shadow);
            padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); border-top: 4px solid var(--primary);
        }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .section-header h2 { color: var(--text-main); font-size: 1.05rem; font-weight: 700; }

        .form-group { margin-top: 14px; text-align: right; }
        .form-group label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: var(--text-muted); font-weight: 600; }
        .form-group select {
            width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-color);
            background: var(--bg-main); color: var(--text-main); font-size: 0.85rem; outline: none;
        }

        table { width: 100%; border-collapse: collapse; text-align: right; margin-top: 10px; font-size: 0.8rem; white-space: nowrap; }
        th, td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); color: var(--text-main); }
        th { background: var(--th-bg); color: var(--text-main); font-weight: 700; }
        
        .student-avatar { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); vertical-align: middle; margin-left: 4px; }
        .hidden { display: none !important; }
    </style>
</head>
<body data-theme="dark">
    <div class="container">
        <header class="platform-header">
            <div class="header-right-side"><a href="admin.html" class="btn-home-link">🏠 الرئيسية</a></div>
            <div class="header-center-box"><div class="platform-title-box"><span>إحصائيات ومتابعة الحصص</span> 📊</div></div>
            <div class="header-left-side"><button class="btn-theme-toggle" id="themeToggleBtn" title="تغيير الوضع">☀️</button></div>
        </header>

        <nav class="admin-nav-bar">
            <div class="admin-tabs-group">
                <a href="files-lessons.html" class="btn-tab">إنشاء الحصص 📝</a>
                <a href="files-settings.html" class="btn-tab">إعدادات الحصص ⚙️</a>
                <a href="files-stats.html" class="btn-tab active">إحصائيات الحصص 📊</a>
            </div>
        </nav>

        <div class="section-box">
            <div class="section-header"><h2>اختر الحصة لمتابعة تفاعل الطلاب وإنجازهم 📈</h2></div>
            <div class="form-group" style="margin-top:0;">
                <label>اختر الحصة الدراسية:</label>
                <select id="selectLessonStatsDropdown" onchange="loadLessonStatsData()">
                    <option value="">-- اختر الحصة لعرض إحصائيات الطلاب --</option>
                </select>
            </div>
        </div>

        <div class="section-box hidden" id="statsTableContainerBox">
            <div class="section-header"><h2 id="statsTableTitle">تقرير تفاعل الطلاب للحصة</h2></div>
            <div style="overflow-x: auto;">
                <table id="lessonStatsTable">
                    <thead>
                        <tr>
                            <th>الطالب</th>
                            <th>ملازم الشرح 📄</th>
                            <th>فيديو الشرح 🎬</th>
                            <th>ملازم التلخيص 📑</th>
                            <th>امتحان الحصة 📝</th>
                        </tr>
                    </thead>
                    <tbody id="lessonStatsTableBody">
                        <!-- يتم ملؤها برمجياً -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c",
            measurementId: "G-0382HVXWMT"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let globalLessonsList = [];
        let globalStudentsList = [];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await fetchDropdownAndStudents();
            } else {
                window.location.href = 'login.html';
            }
        });

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const bodyElement = document.body;
        const savedTheme = localStorage.getItem('platform_theme') || 'dark';
        bodyElement.setAttribute('data-theme', savedTheme);
        themeToggleBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggleBtn.addEventListener('click', () => {
            let nextTheme = bodyElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            bodyElement.setAttribute('data-theme', nextTheme);
            localStorage.setItem('platform_theme', nextTheme);
            themeToggleBtn.textContent = nextTheme === 'dark' ? '☀️' : '🌙';
        });

        async function fetchDropdownAndStudents() {
            try {
                // جلب الحصص
                const lessonsSnap = await getDocs(collection(db, "lessons"));
                globalLessonsList = [];
                const select = document.getElementById('selectLessonStatsDropdown');
                let html = '<option value="">-- اختر الحصة لعرض إحصائيات الطلاب --</option>';
                
                lessonsSnap.forEach((docSnap) => {
                    let les = docSnap.data();
                    globalLessonsList.push({ id: docSnap.id, ...les });
                    html += `<option value="${docSnap.id}">🎬 الحصة ${les.number || 1}: ${les.title || 'بدون عنوان'}</option>`;
                });
                select.innerHTML = html;

                // جلب الطلاب المسجلين
                const studentsSnap = await getDocs(collection(db, "users"));
                globalStudentsList = [];
                studentsSnap.forEach((docSnap) => {
                    globalStudentsList.push({ id: docSnap.id, ...docSnap.data() });
                });
            } catch (e) {
                console.error("خطأ في جلب بيانات الإحصائيات:", e);
            }
        }

        window.loadLessonStatsData = function() {
            let lessonId = document.getElementById('selectLessonStatsDropdown').value;
            let boxContainer = document.getElementById('statsTableContainerBox');
            
            if (!lessonId) {
                boxContainer.classList.add('hidden');
                return;
            }

            let lesson = globalLessonsList.find(l => l.id === lessonId);
            if (!lesson) return;

            document.getElementById('statsTableTitle').textContent = `تقرير تفاعل الطلاب لحصة: ${lesson.title}`;
            
            const tbody = document.getElementById('lessonStatsTableBody');
            
            if (globalStudentsList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:15px;">لا توجد بيانات طلاب مسجلين حالياً.</td></tr>`;
                boxContainer.classList.remove('hidden');
                return;
            }

            let html = "";
            globalStudentsList.forEach((student) => {
                let name = student.name || 'طالب المنصة';
                let avatar = student.avatar || 'https://www.w3schools.com/howto/img_avatar.png';
                
                // محاكاة أو قراءة سجل تفاعل الطالب مع الحصة من قاعدة البيانات
                let activity = (student.lessonsActivity || {})[lessonId] || { studyNotes: false, video: false, summary: false, examScore: null };

                let studyBadge = activity.studyNotes ? '<span style="color:var(--success); font-weight:bold;">✔ قرأ الشرح</span>' : '<span style="color:var(--danger);">❌ لم يفتح</span>';
                let videoBadge = activity.video ? '<span style="color:var(--success); font-weight:bold;">✔ شاهد الفيديو</span>' : '<span style="color:var(--danger);">❌ لم يشاهد</span>';
                let summaryBadge = activity.summary ? '<span style="color:var(--success); font-weight:bold;">✔ قرأ التلخيص</span>' : '<span style="color:var(--danger);">❌ لم يفتح</span>';
                let examBadge = activity.examScore !== null && activity.examScore !== undefined ? `<span style="color:var(--success); font-weight:bold;">✔ درجته: ${activity.examScore}</span>` : '<span style="color:#f59e0b; font-weight:bold;">⏳ لم يختبر</span>';

                html += `
                    <tr>
                        <td><img src="${avatar}" class="student-avatar" alt="صورة"> <b>${name}</b></td>
                        <td>${studyBadge}</td>
                        <td>${videoBadge}</td>
                        <td>${summaryBadge}</td>
                        <td>${examBadge}</td>
                    </tr>`;
            });

            tbody.innerHTML = html;
            boxContainer.classList.remove('hidden');
        };
    </script>
</body>
</html>
