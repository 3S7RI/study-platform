<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المستخدمين (الطلاب والمشرفين) - لوحة التحكم</title>
    <!-- تضمين مكتبات Firebase SDK المطلوبة للمزامنة السحابية -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0a14, #181124, #281331);
            --card-bg: rgba(24, 20, 38, 0.94);
            --card-border: rgba(244, 114, 182, 0.28);
            --text-main: #fdf2f8;
            --text-sub: #f472b6;
            --navbar-bg: rgba(18, 14, 28, 0.96);
            --input-bg: rgba(14, 10, 24, 0.95);
            --input-border: #f472b6;
            --primary: #f472b6;
            --primary-hover: #ec4899;
            --success: #10b981;
            --danger: #ef4444;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --btn-bg: rgba(244, 114, 182, 0.12);
            --btn-border: rgba(244, 114, 182, 0.3);
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #fdf2f8, #fce7f3, #fff1f2);
            --card-bg: rgba(255, 255, 255, 0.96);
            --card-border: rgba(244, 114, 182, 0.25);
            --text-main: #4a044e;
            --text-sub: #db2777;
            --navbar-bg: rgba(255, 255, 255, 0.96);
            --input-bg: #fff1f2;
            --input-border: #fbcfe8;
            --primary: #db2777;
            --primary-hover: #be185d;
            --success: #059669;
            --danger: #dc2626;
            --shadow: 0 15px 35px rgba(219, 39, 119, 0.1);
            --btn-bg: rgba(219, 39, 119, 0.08);
            --btn-border: rgba(219, 39, 119, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; transition: background 0.3s, color 0.3s, border-color 0.3s; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 1050px; margin: 0 auto; width: 100%; }

        header { 
            display: flex; justify-content: space-between; align-items: center; 
            background: var(--navbar-bg); backdrop-filter: blur(16px); color: var(--text-main); padding: 12px 16px; 
            border-radius: 16px; margin-bottom: 20px; box-shadow: var(--shadow); 
            border: 1px solid var(--card-border); gap: 10px; flex-wrap: wrap; width: 100%;
        }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 10px; }
        .header-bottom { display: flex; align-items: center; gap: 10px; width: 100%; }
        
        .btn-action, .btn-back { background: var(--btn-bg); color: var(--text-main); border: 1px solid var(--btn-border); padding: 10px 14px; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 0.82rem; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; transition: 0.2s; }
        .btn-action { flex: 1; }
        .btn-action:hover, .btn-back:hover { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-action.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 2px 8px rgba(244, 114, 182, 0.3); }
        
        .btn-theme { background: var(--btn-bg); color: var(--text-main); border: 1px solid var(--btn-border); width: 40px; height: 40px; font-size: 0.95rem; padding: 0; border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; transition: 0.2s; }
        .btn-theme:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .section-box { background: var(--card-bg); backdrop-filter: blur(16px); border-radius: 18px; box-shadow: var(--shadow); padding: 22px; margin-bottom: 20px; border: 1px solid var(--card-border); border-top: 4px solid var(--primary); word-break: break-word; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
        .section-header h2 { color: var(--text-main); font-size: 1.1rem; }

        .form-group { margin-top: 12px; }
        .form-group label { display: block; font-size: 0.82rem; margin-bottom: 5px; color: var(--text-sub); }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--input-border); background: var(--input-bg); color: var(--text-main); font-size: 0.85rem; outline: none; transition: 0.2s; }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary); }
        
        .btn-save { background: var(--primary); color: white; border: none; padding: 10px 22px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.85rem; margin-top: 15px; transition: 0.2s; box-shadow: 0 2px 8px rgba(244, 114, 182, 0.3); }
        .btn-save:hover { background: var(--primary-hover); }

        table { width: 100%; border-collapse: collapse; text-align: right; margin-top: 10px; overflow: hidden; border-radius: 12px; }
        th, td { padding: 12px; border-bottom: 1px solid var(--card-border); font-size: 0.85rem; color: var(--text-main); }
        th { background: rgba(0, 0, 0, 0.1); color: var(--text-sub); font-weight: bold; }
        .btn-ctrl { background: var(--btn-bg); color: var(--text-main); border: 1px solid var(--btn-border); padding: 7px 12px; border-radius: 10px; font-size: 0.78rem; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-ctrl:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .modal-overlay { position: fixed; top: 0; right: 0; bottom: 0; left: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 15px; }
        .modal-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; width: 100%; max-width: 420px; padding: 22px; box-shadow: var(--shadow); }

        .hidden { display: none !important; }
    </style>
</head>
<body id="pageBody" data-theme="dark">
    <div class="container">
        <header>
            <div class="header-top">
                <a href="dashboard.html" class="btn-back">اللوحة الرئيسية ↩️</a>
                <button class="btn-theme" id="themeToggleBtn" title="تغيير الثيم">☀️</button>
            </div>
            
            <div class="header-bottom">
                <button class="btn-action active" id="btnTabStudents" onclick="switchTab('students')">إدارة الطلاب 👨‍🎓</button>
                <button class="btn-action" id="btnTabAdmins" onclick="switchTab('admins')">إدارة المشرفين 🛡</button>
            </div>
        </header>

        <div id="tabStudentsContent" class="section-box">
            <div class="section-header">
                <h2>قائمة ومتابعة الطلاب المسجلين سحابياً 👨‍🎓</h2>
            </div>
            <div id="studentsTableContainer">
                <p style="text-align: center; opacity: 0.7; padding: 20px;">جاري مزامنة بيانات الطلاب من كولكشن students...</p>
            </div>
        </div>

        <div id="tabAdminsContent" class="section-box hidden">
            <div class="section-header">
                <h2>إدارة المشرفين وصلاحيات لوحة التحكم 🛡️</h2>
            </div>

            <div style="background: rgba(0,0,0,0.1); padding: 16px; border-radius: 14px; border: 1px solid var(--card-border); margin-bottom: 20px;">
                <h3 style="font-size: 0.95rem; color: var(--text-sub); margin-bottom: 10px;">إضافة مشرف جديد:</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="form-group" style="margin-top:0;"><label>الاسم:</label><input type="text" id="newAdminName" placeholder="اسم المشرف"></div>
                    <div class="form-group" style="margin-top:0;"><label>البريد الإلكتروني / الـ ID:</label><input type="text" id="newAdminUsername" placeholder="البريد أو المعرف"></div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
                    <div class="form-group" style="margin-top:0;"><label>كلمة المرور:</label><input type="password" id="newAdminPassword" placeholder="كلمة السر"></div>
                    <div class="form-group" style="margin-top:0;"><label>الصلاحية:</label>
                        <select id="newAdminRole">
                            <option value="full">مشرف عام</option>
                            <option value="moderator">مساعد / مراقب</option>
                        </select>
                    </div>
                </div>
                <button class="btn-save" onclick="addNewAdmin()">إضافة المشرف للسحابة 🚀</button>
            </div>

            <h3 style="font-size: 0.95rem; color: var(--text-sub); margin-bottom: 10px;">قائمة المشرفين الحاليين:</h3>
            <div id="adminsTableContainer">
                <p style="text-align: center; opacity: 0.7; padding: 20px;">جاري تحميل قائمة المشرفين...</p>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="adminModal">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="modalAdminName" style="font-size: 1rem; color: var(--text-main);">إدارة المشرف</h3>
                <button onclick="closeModal('adminModal')" style="background:none; border:none; color:var(--text-main); cursor:pointer; font-size:1.1rem;">✕</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn-ctrl" onclick="adminAction('upgrade')">⭐ ترقية المشرف العام</button>
                <button class="btn-ctrl" onclick="adminAction('delete')">🗑️ حذف المشرف</button>
                <button class="btn-ctrl" onclick="openEditAdminSubModal()">✏️ تعديل معلومات المشرف</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="editAdminSubModal">
        <div class="modal-card">
            <h3 style="font-size: 1rem; margin-bottom: 12px; color: var(--text-main);">تعديل معلومات المشرف</h3>
            <div class="form-group"><label>الاسم الجديد:</label><input type="text" id="editAdminNameInput"></div>
            <div class="form-group"><label>البريد الجديد:</label><input type="text" id="editAdminUsernameInput"></div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-save" style="flex:1; margin-top:0;" onclick="saveAdminEdits()">حفظ التعديلات</button>
                <button class="btn-ctrl" style="flex:1; background:rgba(255,255,255,0.1);" onclick="closeModal('editAdminSubModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="studentModal">
        <div class="modal-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="modalStudentName" style="font-size: 1rem; color: var(--text-main);">إدارة الطالبة</h3>
                <button onclick="closeModal('studentModal')" style="background:none; border:none; color:var(--text-main); cursor:pointer; font-size:1.1rem;">✕</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button class="btn-ctrl" onclick="studentAction('delete')">🗑️ حذف الطالبة من السحابة</button>
                <div class="form-group" style="margin-top:0;">
                    <label style="font-size:0.8rem;">ترقية الرتبة / المستوى:</label>
                    <select id="studentLevelSelect" onchange="updateStudentLevel(this.value)">
                        <option value="weak">مبتدئ (ضعيف)</option>
                        <option value="medium">طالبة مجتهدة</option>
                        <option value="strong">طالبة متفوقة</option>
                        <option value="very-strong">طالبة متميزة</option>
                        <option value="legendary">طالبة أسطورية</option>
                    </select>
                </div>
                <button class="btn-ctrl" onclick="openEditStudentSubModal()">✏️ تعديل معلومات الطالبة</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="editStudentSubModal">
        <div class="modal-card">
            <h3 style="font-size: 1rem; margin-bottom: 12px; color: var(--text-main);">تعديل معلومات الطالبة</h3>
            <div class="form-group"><label>الاسم الجديد:</label><input type="text" id="editStudentNameInput"></div>
            <div class="form-group"><label>البريد الإلكتروني الجديد:</label><input type="text" id="editStudentContactInput"></div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-save" style="flex:1; margin-top:0;" onclick="saveStudentEdits()">حفظ التعديلات</button>
                <button class="btn-ctrl" style="flex:1; background:rgba(255,255,255,0.1);" onclick="closeModal('editStudentSubModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBORRXM-bw9Svp4QS8_1OWUGGbhJToQM6U",
            authDomain: "study-trip-1.firebaseapp.com",
            projectId: "study-trip-1",
            storageBucket: "study-trip-1.firebasestorage.app",
            messagingSenderId: "632096690853",
            appId: "1:632096690853:web:f9622d14de73a761dcf34c"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        let studentsList = [];
        let adminsList = [];
        let activeDocId = null;

        const bodyElement = document.getElementById('pageBody');
        const themeBtn = document.getElementById('themeToggleBtn');
        
        let savedTheme = localStorage.getItem('app_theme') || 'dark';
        bodyElement.setAttribute('data-theme', savedTheme);
        themeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeBtn.addEventListener('click', () => {
            let currentTheme = bodyElement.getAttribute('data-theme');
            let newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            bodyElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('app_theme', newTheme);
            themeBtn.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        function switchTab(tab) {
            const btnStudents = document.getElementById('btnTabStudents');
            const btnAdmins = document.getElementById('btnTabAdmins');
            const contentStudents = document.getElementById('tabStudentsContent');
            const contentAdmins = document.getElementById('tabAdminsContent');

            btnStudents.classList.remove('active');
            btnAdmins.classList.remove('active');
            contentStudents.classList.add('hidden');
            contentAdmins.classList.add('hidden');

            if (tab === 'students') {
                btnStudents.classList.add('active');
                contentStudents.classList.remove('hidden');
            } else {
                btnAdmins.classList.add('active');
                contentAdmins.classList.remove('hidden');
            }
        }

        initCloudManagement();

        async function initCloudManagement() {
            await fetchStudentsFromCloud();
            await fetchAdminsFromCloud();
        }

        async function fetchStudentsFromCloud() {
            try {
                const snapshot = await db.collection('students').get();
                studentsList = [];
                snapshot.forEach(doc => {
                    studentsList.push({ id: doc.id, ...doc.data() });
                });
                renderStudentsTable();
            } catch (err) {
                console.error("خطأ في جلب الطلاب من كولكشن students:", err);
                document.getElementById('studentsTableContainer').innerHTML = '<p style="text-align:center; color:var(--danger); padding:20px;">تعذر الاتصال بقاعدة بيانات الطلاب.</p>';
            }
        }

        async function fetchAdminsFromCloud() {
            try {
                const snapshot = await db.collection('admins').get();
                adminsList = [];
                snapshot.forEach(doc => {
                    adminsList.push({ id: doc.id, ...doc.data() });
                });
                renderAdminsTable();
            } catch (err) {
                console.error("خطأ في جلب المشرفين:", err);
                document.getElementById('adminsTableContainer').innerHTML = '<p style="text-align:center; color:var(--danger); padding:20px;">تعذر الاتصال بقاعدة بيانات المشرفين.</p>';
            }
        }

        function renderStudentsTable() {
            const container = document.getElementById('studentsTableContainer');
            if (studentsList.length === 0) {
                container.innerHTML = '<p style="text-align: center; opacity: 0.7; padding: 20px;">لا توجد سجلات لطلاب مسجلين حالياً في كولكشن students.</p>';
                return;
            }

            let html = `<table><thead><tr><th>اسم الطالبة</th><th>المعرف (ID)</th><th>الرتبة</th><th>الإجراءات</th></tr></thead><tbody>`;
            studentsList.forEach((stu) => {
                let name = stu.fullName || stu.name || 'طالبة';
                let sId = stu.studentId || stu.id || '---';
                let rank = getRankArabicName(stu.rank || stu.level);
                html += `
                    <tr>
                        <td><b>👤 ${name}</b></td>
                        <td style="font-family:monospace; direction:ltr;">${sId}</td>
                        <td>${rank}</td>
                        <td>
                            <button class="btn-ctrl" onclick="openStudentModal('${stu.id}')">إدارة ⚙️</button>
                        </td>
                    </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function openStudentModal(docId) {
            activeDocId = docId;
            let stu = studentsList.find(s => s.id === docId);
            if (!stu) return;
            document.getElementById('modalStudentName').textContent = stu.fullName || stu.name || 'طالبة';
            document.getElementById('studentLevelSelect').value = stu.rank || stu.level || 'weak';
            document.getElementById('studentModal').style.display = 'flex';
        }

        async function studentAction(action) {
            if (!activeDocId) return;
            if (action === 'delete') {
                if (!confirm('هل تريد حذف هذه الطالبة نهائياً من سحابة فايربيز؟')) return;
                try {
                    await db.collection('students').doc(activeDocId).delete();
                    closeModal('studentModal');
                    await fetchStudentsFromCloud();
                    alert('تم حذف الطالبة بنجاح!');
                } catch(e) {
                    alert('حدث خطأ أثناء الحذف.');
                }
            }
        }

        async function updateStudentLevel(newRank) {
            if (!activeDocId) return;
            try {
                await db.collection('students').doc(activeDocId).update({ rank: newRank, level: newRank });
                await fetchStudentsFromCloud();
            } catch(e) {
                alert('فشل تحديث الرتبة في السحابة.');
            }
        }

        function openEditStudentSubModal() {
            let stu = studentsList.find(s => s.id === activeDocId);
            if (!stu) return;
            document.getElementById('editStudentNameInput').value = stu.fullName || stu.name || '';
            document.getElementById('editStudentContactInput').value = stu.email || '';
            document.getElementById('editStudentSubModal').style.display = 'flex';
        }

        async function saveStudentEdits() {
            if (!activeDocId) return;
            let name = document.getElementById('editStudentNameInput').value.trim();
            let email = document.getElementById('editStudentContactInput').value.trim();
            if(!name) return alert('يرجى كتابة اسم الطالبة');

            try {
                await db.collection('students').doc(activeDocId).update({ fullName: name, name: name, email: email });
                await fetchStudentsFromCloud();
                closeModal('editStudentSubModal');
                closeModal('studentModal');
                alert('تم تحديث معلومات الطالبة بنجاح!');
            } catch(e) {
                alert('فشل حفظ التعديلات.');
            }
        }

        function renderAdminsTable() {
            const container = document.getElementById('adminsTableContainer');
            if (adminsList.length === 0) {
                container.innerHTML = '<p style="text-align: center; opacity: 0.7; padding: 20px;">لا يوجد مشرفين مضافين حالياً في قاعدة البيانات.</p>';
                return;
            }

            let html = `<table><thead><tr><th>اسم المشرف</th><th>المعرف / الإيميل</th><th>الصلاحية</th><th>الإجراءات</th></tr></thead><tbody>`;
            adminsList.forEach((adm) => {
                let roleName = adm.role === 'full' ? 'مشرف عام 👑' : 'مساعد / مراقب 🛡️';
                html += `
                    <tr>
                        <td><b>🛡️ ${adm.name || 'مشرف'}</b></td>
                        <td style="font-family:monospace; direction:ltr;">${adm.username || adm.email || '---'}</td>
                        <td>${roleName}</td>
                        <td>
                            <button class="btn-ctrl" onclick="openAdminModal('${adm.id}')">إدارة ⚙️</button>
                        </td>
                    </tr>`;
            });
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function openAdminModal(docId) {
            activeDocId = docId;
            let adm = adminsList.find(a => a.id === docId);
            if (!adm) return;
            document.getElementById('modalAdminName').textContent = adm.name || 'مشرف';
            document.getElementById('adminModal').style.display = 'flex';
        }

        async function adminAction(action) {
            if (!activeDocId) return;
            let adm = adminsList.find(a => a.id === activeDocId);
            if (action === 'upgrade') {
                try {
                    await db.collection('admins').doc(activeDocId).update({ role: 'full' });
                    await fetchAdminsFromCloud();
                    alert('تمت ترقية المشرف لصلاحية مشرف عام! ⭐');
                } catch(e) { alert('فشل الترقية.'); }
            } else if (action === 'delete') {
                if (!confirm('هل تريد حقاً سحب صلاحيات هذا المشرف وحذفه؟')) return;
                try {
                    await db.collection('admins').doc(activeDocId).delete();
                    closeModal('adminModal');
                    await fetchAdminsFromCloud();
                    alert('تم حذف المشرف بنجاح!');
                } catch(e) { alert('فشل الحذف.'); }
            }
        }

        function openEditAdminSubModal() {
            let adm = adminsList.find(a => a.id === activeDocId);
            if (!adm) return;
            document.getElementById('editAdminNameInput').value = adm.name || '';
            document.getElementById('editAdminUsernameInput').value = adm.username || adm.email || '';
            document.getElementById('editAdminSubModal').style.display = 'flex';
        }

        async function saveAdminEdits() {
            if (!activeDocId) return;
            let name = document.getElementById('editAdminNameInput').value.trim();
            let username = document.getElementById('editAdminUsernameInput').value.trim();
            if(!name) return alert('يرجى كتابة الاسم');

            try {
                await db.collection('admins').doc(activeDocId).update({ name: name, username: username, email: username });
                await fetchAdminsFromCloud();
                closeModal('editAdminSubModal');
                closeModal('adminModal');
                alert('تم تحديث معلومات المشرف بنجاح!');
            } catch(e) { alert('فشل التعديل.'); }
        }

        async function addNewAdmin() {
            let name = document.getElementById('newAdminName').value.trim();
            let username = document.getElementById('newAdminUsername').value.trim();
            let password = document.getElementById('newAdminPassword').value.trim();
            let role = document.getElementById('newAdminRole').value;

            if (!name || !username || !password) {
                alert('يرجى ملء كافة بيانات المشرف!');
                return;
            }

            try {
                await db.collection('admins').doc(username.toLowerCase().trim()).set({
                    name: name,
                    username: username,
                    email: username,
                    password: password,
                    role: role
                });
                
                document.getElementById('newAdminName').value = '';
                document.getElementById('newAdminUsername').value = '';
                document.getElementById('newAdminPassword').value = '';

                await fetchAdminsFromCloud();
                alert('تم إضافة المشرف الجديد بنجاح بالسحابة! 🚀');
            } catch(e) {
                alert('حدث خطأ أثناء إضافة المشرف.');
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function getRankArabicName(rankCode) {
            const ranks = {
                'weak': 'مبتدئ (ضعيف)',
                'medium': 'طالبة مجتهدة',
                'strong': 'طالبة متفوقة',
                'very-strong': 'طالبة متميزة',
                'legendary': 'طالبة أسطورية'
            };
            return ranks[rankCode] || 'مبتدئ (ضعيف)';
        }
    </script>
